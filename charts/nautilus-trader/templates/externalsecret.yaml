{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.items | default list }}
{{- $name := include "nautilus-trader.externalSecretName" (dict "root" $ "item" .) }}
{{- $spec := deepCopy (.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}{{- $_ := set $target "name" $name }}{{- $_ := set $spec "target" $target }}{{- end }}
{{- $hasDefaultStore := ne (dig "secretStoreRef" "name" "" $spec) "" }}
{{- $hasSource := $hasDefaultStore }}
{{- $invalidSource := false }}
{{- range ($spec.data | default list) }}
  {{- if dig "sourceRef" "storeRef" "name" "" . }}{{- $hasSource = true }}
  {{- else if not $hasDefaultStore }}{{- $invalidSource = true }}{{- end }}
{{- end }}
{{- range ($spec.dataFrom | default list) }}
  {{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasSource = true }}
  {{- else if not $hasDefaultStore }}{{- $invalidSource = true }}{{- end }}
{{- end }}
{{- if or (not $hasSource) $invalidSource }}{{- fail "each ExternalSecret data entry requires spec.secretStoreRef.name or sourceRef.storeRef.name; dataFrom may also use sourceRef.generatorRef.name" }}{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nautilus-trader.labels" $ | nindent 4 }}
    {{- with .labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}

