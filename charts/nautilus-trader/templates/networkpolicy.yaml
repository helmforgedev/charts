{{- if and .Values.live.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nautilus-trader.fullname" . }}
  labels:
    {{- include "nautilus-trader.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nautilus-trader.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressEnabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - protocol: TCP
          port: runner
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.egressEnabled }}
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if ne .Values.database.mode "none" }}
    - ports:
        - protocol: TCP
          port: {{ ternary (get (.Values.postgresql.service | default dict) "port" | default 5432) .Values.database.external.port .Values.postgresql.enabled }}
    {{- end }}
    {{- if ne .Values.messageBus.mode "none" }}
    - ports:
        - protocol: TCP
          port: {{ ternary (get (get (.Values.redis.service | default dict) "ports" | default dict) "redis" | default 6379) .Values.messageBus.external.port .Values.redis.enabled }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

