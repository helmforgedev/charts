apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nautilus-trader.fullname" . }}-runtime
  labels:
    {{- include "nautilus-trader.labels" . | nindent 4 }}
data:
  runner.py: |
    {{- .Files.Get "files/runner.py" | nindent 4 }}
  node-config.json: |
    {{- .Values.live.nodeConfig | toJson | nindent 4 }}
  backtest-config.json: |
    {{- .Values.backtest.config | toJson | nindent 4 }}

