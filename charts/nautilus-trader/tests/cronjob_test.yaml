# SPDX-License-Identifier: Apache-2.0
suite: NautilusTrader scheduled batch
templates:
  - templates/cronjob.yaml
tests:
  - it: renders no schedule by default
    asserts:
      - hasDocuments: {count: 0}
  - it: renders a scheduled backtest
    set: {scheduledBacktest.enabled: true}
    asserts:
      - isKind: {of: CronJob}
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
      - equal: {path: spec.schedule, value: "0 2 * * *"}
