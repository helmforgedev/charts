# SPDX-License-Identifier: Apache-2.0
suite: NautilusTrader storage
templates:
  - templates/pvc.yaml
tests:
  - it: creates no claims by default
    asserts:
      - hasDocuments: {count: 0}
  - it: creates three storage claims
    set:
      persistence.catalog.enabled: true
      persistence.eventStore.enabled: true
      persistence.results.enabled: true
    asserts:
      - hasDocuments: {count: 3}
