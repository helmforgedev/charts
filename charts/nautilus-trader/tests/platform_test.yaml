# SPDX-License-Identifier: Apache-2.0
suite: NautilusTrader platform integrations
templates:
  - templates/service.yaml
tests:
  - it: renders the private runner service
    asserts:
      - isKind: {of: Service, documentIndex: 0}
      - equal: {path: "spec.ports[0].name", value: runner, documentIndex: 0}
  - it: configures dual stack
    set: {service.ipFamilyPolicy: PreferDualStack, service.ipFamilies: [IPv6, IPv4]}
    asserts:
      - equal: {path: spec.ipFamilyPolicy, value: PreferDualStack, documentIndex: 0}
