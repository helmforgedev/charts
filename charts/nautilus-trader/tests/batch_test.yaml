# SPDX-License-Identifier: Apache-2.0
suite: NautilusTrader batch
templates:
  - templates/job.yaml
tests:
  - it: renders no batch workloads by default
    asserts:
      - hasDocuments: {count: 0}
  - it: renders a backtest job
    set: {backtest.enabled: true}
    asserts:
      - isKind: {of: Job, documentIndex: 0}
      - equal: {path: spec.template.spec.restartPolicy, value: Never, documentIndex: 0}
