suite: NautilusTrader ExternalSecret
templates:
  - templates/externalsecret.yaml
tests:
  - it: does not render ExternalSecret resources by default
    asserts:
      - hasDocuments: {count: 0}
  - it: renders a configured ExternalSecret
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: venue
          spec:
            secretStoreRef: {name: platform, kind: ClusterSecretStore}
            target: {name: nautilus-venue}
            data:
              - secretKey: api-key
                remoteRef: {key: nautilus, property: api-key}
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: metadata.name, value: RELEASE-NAME-nautilus-trader-venue}
