# SPDX-License-Identifier: Apache-2.0
suite: NautilusTrader ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders a dedicated ServiceAccount with token automount disabled
    asserts:
      - isKind: {of: ServiceAccount}
      - equal: {path: automountServiceAccountToken, value: false}
  - it: uses an existing ServiceAccount when creation is disabled
    set: {serviceAccount.create: false}
    asserts:
      - hasDocuments: {count: 0}
