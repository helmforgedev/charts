# SPDX-License-Identifier: Apache-2.0
externalSecrets:
  enabled: true
  items:
    - name: venue
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: nautilus-venue
        data:
          - secretKey: api-key
            remoteRef:
              key: test/token
live:
  extraEnv:
    - name: HELMFORGE_ESO_TOKEN
      valueFrom:
        secretKeyRef:
          name: nautilus-venue
          key: api-key
