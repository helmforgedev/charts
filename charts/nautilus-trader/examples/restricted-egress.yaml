# Replace these example CIDRs with the exact venue, market-data, and telemetry
# destinations required by the strategy. DNS remains explicitly allowed.
podDisruptionBudget:
  enabled: true

runtimeStorage:
  tmpSizeLimit: 256Mi

networkPolicy:
  enabled: true
  egressEnabled: true
  allowDNS: true
  extraEgress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 443
