# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment with defaults
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-karakeep
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should use correct image
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987"

  - it: should configure the application listener port end to end
    template: templates/deployment.yaml
    set:
      containerPorts.http: 13000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 13000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "13000"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: should set DATA_DIR env
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATA_DIR
            value: "/data"

  - it: should have 3 containers when both sidecars enabled
    template: templates/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3

  - it: should have only main container when sidecars disabled
    template: templates/deployment.yaml
    set:
      meilisearch.enabled: false
      chromium.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: should set MEILI_ADDR when meilisearch enabled
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_ADDR
            value: "http://localhost:7700"

  - it: should configure the Meilisearch listener port end to end
    template: templates/deployment.yaml
    set:
      meilisearch.port: 17700
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_ADDR
            value: "http://localhost:17700"
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 17700
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MEILI_HTTP_ADDR
            value: "0.0.0.0:17700"

  - it: should not set MEILI_ADDR when meilisearch disabled
    template: templates/deployment.yaml
    set:
      meilisearch.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_ADDR
            value: "http://localhost:7700"

  - it: should set BROWSER_WEB_URL when chromium enabled
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROWSER_WEB_URL
            value: "http://localhost:9222"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROWSER_CONNECT_ONDEMAND
            value: "true"
      - equal:
          path: spec.template.spec.containers[2].image
          value: "ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa"
      - equal:
          path: spec.template.spec.containers[2].ports[0].containerPort
          value: 9222

  - it: should not set BROWSER_WEB_URL when chromium disabled
    template: templates/deployment.yaml
    set:
      chromium.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROWSER_WEB_URL
            value: "http://localhost:9222"

  - it: should mount data volume
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data

  - it: should have meilisearch sidecar mount with subPath
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: data
            mountPath: /meili_data
            subPath: meilisearch

  - it: should use PVC for data by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: test-karakeep-data

  - it: should use emptyDir when persistence disabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: should have startup, liveness, and readiness probes
    template: templates/deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.path
          value: /health

  - it: should use hardened defaults and disable API token mounting
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[2].securityContext.readOnlyRootFilesystem
          value: true

  - it: should set NEXTAUTH_URL when configured
    template: templates/deployment.yaml
    set:
      karakeep.nextAuthUrl: "https://karakeep.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_URL
            value: "https://karakeep.example.com"

  - it: should use existing secret keys when configured
    template: templates/deployment.yaml
    set:
      karakeep:
        existingSecret: karakeep-app-secret
        existingSecretNextAuthKey: nextauth
        existingSecretMeiliMasterKey: meili
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: karakeep-app-secret
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: nextauth
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.name
          value: karakeep-app-secret
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.key
          value: meili
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.name
          value: karakeep-app-secret
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.key
          value: meili
