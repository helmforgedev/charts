{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authelia.fullname" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authelia.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "authelia.httpContainerPort" . }}
        {{- if .Values.config.telemetry.metrics.enabled }}
        - protocol: TCP
          port: {{ include "authelia.metricsContainerPort" . }}
        {{- end }}
{{- end }}
