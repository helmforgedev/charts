# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: should isolate ingress to the HTTP listener by default
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes[0]
          value: Ingress
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9091
      - isNull:
          path: spec.ingress[0].from

  - it: should align custom application and metrics listeners
    set:
      containerPorts.http: 9191
      containerPorts.metrics: 9960
      config.telemetry.metrics.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9191
      - equal:
          path: spec.ingress[0].ports[1].port
          value: 9960

  - it: should align legacy application and metrics listener addresses
    set:
      config.server.address: tcp://:9192/
      config.telemetry.metrics.enabled: true
      config.telemetry.metrics.address: tcp://:9961/metrics
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9192
      - equal:
          path: spec.ingress[0].ports[1].port
          value: 9961

  - it: should render explicit ingress peers
    set:
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-system

  - it: should be optional
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
