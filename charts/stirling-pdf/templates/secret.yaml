{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "stirling-pdf.validate" . }}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "stirling-pdf.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $password := .Values.auth.password | default (get $data .Values.auth.passwordKey | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "stirling-pdf.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
