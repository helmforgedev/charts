# SPDX-License-Identifier: Apache-2.0
# -- Name Override.
nameOverride: ''
# -- Fullname Override.
fullnameOverride: ''
# -- Common Labels.
commonLabels: {}
# -- Replica Count.
replicaCount: 1
# -- Image.
image:
  # -- Repository.
  repository: docker.stirlingpdf.com/stirlingtools/stirling-pdf
  # -- Tag.
  tag: 2.14.3
  # -- Pull Policy.
  pullPolicy: IfNotPresent
# -- Image Pull Secrets.
imagePullSecrets: []
# -- Auth.
auth:
  # -- Username.
  username: admin
  # -- Password.
  password: ''
  # -- Existing Secret.
  existingSecret: ''
  # -- Password Key.
  passwordKey: password
# -- Server.
server:
  # -- Port.
  port: 8080
  # -- Base Path.
  basePath: ''
  # -- Max Upload Size.
  maxUploadSize: 100MB
  # -- Max Request Size.
  maxRequestSize: 200MB
  # -- Connection Timeout Milliseconds.
  connectionTimeoutMilliseconds: 300000
# -- Extra Env.
extraEnv: []
# -- Env From.
envFrom: []
# -- Service Account.
serviceAccount:
  # -- Create.
  create: true
  # -- Name.
  name: ''
  # -- Annotations.
  annotations: {}
  # -- Automount Service Account Token.
  automountServiceAccountToken: false
# -- Service.
service:
  # -- Type.
  type: ClusterIP
  # -- Port.
  port: 8080
  # -- Annotations.
  annotations: {}
  # -- Ip Family Policy.
  ipFamilyPolicy: ''
  # -- Ip Families.
  ipFamilies: []
# -- Ingress.
ingress:
  # -- Enabled.
  enabled: false
  # -- Ingress Class Name.
  ingressClassName: ''
  # -- Annotations.
  annotations: {}
  # -- Hosts.
  hosts: []
  # -- Tls.
  tls: []
# -- Gateway.
gateway:
  # -- Enabled.
  enabled: false
  # -- Annotations.
  annotations: {}
  # -- Parent Refs.
  parentRefs: []
  # -- Hostnames.
  hostnames: []
  # -- Path.
  path: /
  # -- Path Type.
  pathType: PathPrefix
# -- External Secrets.
externalSecrets:
  # -- Enabled.
  enabled: false
  # -- Refresh Interval.
  refreshInterval: 1h
  # -- Items.
  items: []
# -- Network Policy.
networkPolicy:
  # -- Enabled.
  enabled: true
  # -- Ingress From.
  ingressFrom: []
  # -- Egress Isolation.
  egressIsolation: true
  # -- Dns Egress.
  dnsEgress:
    - namespaceSelector: {}
  # -- Web Egress.
  webEgress: []
  # -- Web Ports.
  webPorts:
    - 443
  # -- Extra Egress.
  extraEgress: []
# -- Probes.
probes:
  # -- Startup.
  startup:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/v1/info/status
    # -- Period Seconds.
    periodSeconds: 5
    # -- Timeout Seconds.
    timeoutSeconds: 5
    # -- Failure Threshold.
    failureThreshold: 60
  # -- Liveness.
  liveness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/v1/info/status
    # -- Period Seconds.
    periodSeconds: 20
    # -- Timeout Seconds.
    timeoutSeconds: 5
    # -- Failure Threshold.
    failureThreshold: 3
  # -- Readiness.
  readiness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/v1/info/status
    # -- Period Seconds.
    periodSeconds: 20
    # -- Timeout Seconds.
    timeoutSeconds: 5
    # -- Failure Threshold.
    failureThreshold: 3
# -- Resources.
resources:
  # -- Requests.
  requests:
    # -- Cpu.
    cpu: 500m
    # -- Memory.
    memory: 1Gi
  # -- Limits.
  limits:
    # -- Cpu.
    cpu: '2'
    # -- Memory.
    memory: 4Gi
# -- Pod Security Context.
podSecurityContext:
  # -- Run As Non Root.
  runAsNonRoot: true
  # -- Run As User.
  runAsUser: 1000
  # -- Run As Group.
  runAsGroup: 1000
  # -- Fs Group.
  fsGroup: 1000
  # -- Fs Group Change Policy.
  fsGroupChangePolicy: OnRootMismatch
  # -- Seccomp Profile.
  seccompProfile:
    # -- Type.
    type: RuntimeDefault
# -- Security Context.
securityContext:
  # -- Allow Privilege Escalation.
  allowPrivilegeEscalation: false
  # -- Read Only Root Filesystem.
  readOnlyRootFilesystem: true
  # -- Capabilities.
  capabilities:
    # -- Drop.
    drop:
      - ALL
# -- Pod Labels.
podLabels: {}
# -- Pod Annotations.
podAnnotations: {}
# -- Node Selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- Topology Spread Constraints.
topologySpreadConstraints: []
# -- Priority Class Name.
priorityClassName: ''
# -- Termination Grace Period Seconds.
terminationGracePeriodSeconds: 60
# -- Persistence.
persistence:
  # -- Enabled.
  enabled: true
  # -- Existing Claim.
  existingClaim: ''
  # -- Storage Class.
  storageClass: ''
  # -- Size.
  size: 10Gi
  # -- Access Modes.
  accessModes:
    - ReadWriteOnce
  # -- Retain.
  retain: true
  # -- Annotations.
  annotations: {}
# -- Native authenticated Prometheus endpoint, isolated from the application Service.
metrics:
  # -- Enable only health and prometheus actuator endpoints on a separate internal port.
  enabled: false
  # -- Internal management port, distinct from server.port.
  port: 9090
  # -- NetworkPolicy peers permitted to access management. Empty denies remote scrapes when isolation is enabled.
  ingressFrom: []
  # -- Optional native Prometheus job; Operator ServiceMonitor cannot represent X-API-KEY authentication.
  scrapeConfig:
    # -- Generate a Secret for Prometheus.spec.additionalScrapeConfigs in this namespace.
    enabled: false
    # -- Existing Secret with a dedicated user's API key. Add it to Prometheus.spec.secrets.
    apiKeySecret: ''
    # -- Secret key mounted by Prometheus under /etc/prometheus/secrets.
    apiKeyKey: api-key
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout, no greater than interval.
    timeout: 10s
    # -- Maximum samples accepted from one scrape; session labels can increase cardinality.
    sampleLimit: 10000
# -- Runtime.
runtime:
  # -- Java Custom Options.
  javaCustomOptions: '-XX:MaxRAMPercentage=60.0'
  # -- Temporary Size.
  temporarySize: 4Gi
  # -- Home Size.
  homeSize: 1Gi
  # -- Logs Size.
  logsSize: 512Mi
  # -- Tools Size.
  toolsSize: 1Gi
