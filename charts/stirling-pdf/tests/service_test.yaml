# SPDX-License-Identifier: Apache-2.0
suite: Application Service contract
templates:
  - templates/service.yaml
tests:
  - it: targets the named application listener
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: preserves independent service and listener ports
    set:
      service.port: 80
      server.port: 9091
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
