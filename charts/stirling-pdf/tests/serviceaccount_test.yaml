# SPDX-License-Identifier: Apache-2.0
suite: Service account contract
templates:
  - templates/serviceaccount.yaml
tests:
  - it: disables API token mounting
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: omits the service account when creation is disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
