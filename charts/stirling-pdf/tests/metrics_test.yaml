# SPDX-License-Identifier: Apache-2.0
suite: Metrics resource contract
templates:
  - templates/metrics.yaml
tests:
  - it: omits metrics resources by default
    asserts:
      - hasDocuments:
          count: 0
  - it: exposes only the named management port
    set:
      metrics.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].targetPort
          value: metrics
