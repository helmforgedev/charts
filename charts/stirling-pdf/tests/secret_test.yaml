# SPDX-License-Identifier: Apache-2.0
suite: Credential Secret contract
templates:
  - templates/secret.yaml
tests:
  - it: creates an opaque bootstrap Secret by default
    set:
      auth.password: fixture-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.password
          value: Zml4dHVyZS1wYXNzd29yZA==
  - it: omits the generated Secret when an existing one is selected
    set:
      auth.existingSecret: managed-credentials
    asserts:
      - hasDocuments:
          count: 0
