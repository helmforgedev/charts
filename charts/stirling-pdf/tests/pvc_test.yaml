suite: Workspace persistence contract
templates:
  - templates/pvc.yaml
tests:
  - it: requests the default durable workspace
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
  - it: omits a generated claim when persistence is ephemeral
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
