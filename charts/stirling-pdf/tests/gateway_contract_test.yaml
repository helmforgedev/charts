# SPDX-License-Identifier: Apache-2.0
suite: Canonical Gateway API routes
templates:
  - gateway-httproute.yaml
tests:
  - it: omits routes by default
    asserts:
      - hasDocuments:
          count: 0
  - it: defaults custom rules to the application backend
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - parentRefs:
            - name: shared
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /files
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-stirling-pdf
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /files
  - it: gives unnamed routes unique names
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - parentRefs:
            - name: one
        - parentRefs:
            - name: two
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stirling-pdf-1
        documentIndex: 1
  - it: rejects duplicate names
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - name: same
          parentRefs:
            - name: one
        - name: same
          parentRefs:
            - name: two
    asserts:
      - failedTemplate:
          errorMessage: HTTPRoute names must be unique
