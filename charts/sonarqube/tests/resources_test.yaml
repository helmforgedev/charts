# SPDX-License-Identifier: Apache-2.0
suite: Supporting resources
templates:
  - templates/pvc.yaml
  - templates/secret.yaml
  - templates/serviceaccount.yaml
  - templates/configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render dedicated data and extensions claims by default
    template: templates/pvc.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-sonarqube-data
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-sonarqube-extensions
        documentIndex: 1

  - it: should render all three claims with configured storage classes
    template: templates/pvc.yaml
    set:
      persistence.data.storageClass: fast
      persistence.extensions.storageClass: fast
      persistence.logs.enabled: true
      persistence.logs.storageClass: archive
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 0
      - equal:
          path: spec.storageClassName
          value: archive
        documentIndex: 2

  - it: should render inline database and monitoring credentials in one Secret
    template: templates/secret.yaml
    set:
      sonarqube.databaseMode: external
      database.external.jdbcUrl: jdbc:postgresql://postgres:5432/sonarqube
      database.external.password: database-secret
      sonarqube.monitoringPasscode: monitoring-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.jdbc-password
          value: database-secret
      - equal:
          path: stringData.monitoring-passcode
          value: monitoring-secret

  - it: should render a dedicated ServiceAccount without token automount
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should render context and additional SonarQube properties
    template: templates/configmap.yaml
    set:
      sonarqube.context: /sonar
      sonarqube.sonarProperties:
        sonar.log.level: INFO
    asserts:
      - matchRegex:
          path: data["sonar.properties"]
          pattern: sonar\.web\.context=/sonar
      - matchRegex:
          path: data["sonar.properties"]
          pattern: sonar\.log\.level=INFO
