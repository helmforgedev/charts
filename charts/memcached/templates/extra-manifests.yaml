{{- range .Values.extraManifests }}
{{- $manifest := deepCopy . }}
{{- $metadata := deepCopy ($manifest.metadata | default dict) }}
{{- $annotations := mergeOverwrite (deepCopy ($.Values.commonAnnotations | default dict)) (deepCopy ($metadata.annotations | default dict)) }}
{{- if $annotations }}
{{- $_ := set $metadata "annotations" $annotations }}
{{- end }}
{{- $_ := set $manifest "metadata" $metadata }}
---
{{ tpl (toYaml $manifest) $ }}
{{- end }}
