{{- range .Values.extraManifests }}
{{- $manifest := deepCopy . }}
{{- $metadata := get $manifest "metadata" | default dict }}
{{- $annotations := mergeOverwrite (deepCopy ($.Values.commonAnnotations | default dict)) (get $metadata "annotations" | default dict) }}
{{- if $annotations }}
{{- $_ := set $metadata "annotations" $annotations }}
{{- $_ := set $manifest "metadata" $metadata }}
{{- end }}
---
{{ toYaml $manifest }}
{{- end }}
