# SPDX-License-Identifier: Apache-2.0
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: should render encryption secret by default
    asserts:
      - documentSelector:
          path: metadata.name
          value: RELEASE-NAME-homarr-encryption
        isKind:
          of: Secret

  - it: should leave PostgreSQL credentials to the dependency secret
    set:
      postgresql:
        enabled: true
        auth:
          database: homarr
          username: homarr
          password: pgpass
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a database secret for inline external PostgreSQL credentials
    set:
      database:
        external:
          host: postgres.example.com
          password: pgpass
    asserts:
      - documentSelector:
          path: metadata.name
          value: RELEASE-NAME-homarr-database
        isKind:
          of: Secret

  - it: should render backup S3 secret when enabled
    set:
      backup:
        enabled: true
        s3:
          endpoint: https://s3.example.com
          bucket: test
          accessKey: key
          secretKey: secret
    asserts:
      - documentSelector:
          path: metadata.name
          value: RELEASE-NAME-homarr-backup-s3
        isKind:
          of: Secret
