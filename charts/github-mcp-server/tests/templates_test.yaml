# SPDX-License-Identifier: Apache-2.0
suite: github-mcp-server
templates:
  - templates/deployment.yaml
  - templates/httproute.yaml
  - templates/ingress.yaml
  - templates/service.yaml
tests:
  - it: renders workload
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/github/github-mcp-server:v1.9.0
  - it: renders service
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
  - it: renders common labels on a separate line
    template: templates/service.yaml
    values:
      - common-labels-values.yaml
    asserts:
      - equal:
          path: metadata.labels.review
          value: enabled
  - it: renders ingress TLS
    template: templates/ingress.yaml
    values:
      - ingress-tls-values.yaml
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: github-mcp-server-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: github-mcp-server.example.com
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt
  - it: omits ingressClassName when empty
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.ingressClassName: ""
      ingress.hosts:
        - host: github-mcp-server.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - notExists:
          path: spec.ingressClassName
  - it: renders HTTPRoute hostnames
    template: templates/httproute.yaml
    set:
      gateway.enabled: true
      gateway.parentRefs[0].name: test-gateway
      gateway.hostnames[0]: github-mcp-server.example.com
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: github-mcp-server.example.com
  - it: renders app.env valueFrom entries
    template: templates/deployment.yaml
    values:
      - env-valuefrom-values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: github-secret
      - notExists:
          path: spec.template.spec.containers[0].env[0].value
  - it: honors probe disable flags and timing values
    template: templates/deployment.yaml
    set:
      probes.startup.enabled: false
      probes.liveness.timeoutSeconds: 9
      probes.readiness.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 9
  - it: uses Recreate for a chart-managed ReadWriteOncePod claim
    template: templates/deployment.yaml
    set:
      persistence.enabled: true
      persistence.accessModes[0]: ReadWriteOncePod
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: leaves strategy unchanged when ReadWriteOncePod belongs to an existing claim
    template: templates/deployment.yaml
    set:
      persistence.enabled: true
      persistence.existingClaim: existing-rwop
      persistence.accessModes[0]: ReadWriteOncePod
    asserts:
      - notExists:
          path: spec.strategy
  - it: preserves the previous security contract by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext
  - it: tolerates an absent security profile during reuse-values upgrades
    template: templates/deployment.yaml
    set:
      securityProfile: null
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.containers[0].securityContext
  - it: merges profile defaults and explicit overrides
    template: templates/deployment.yaml
    set:
      securityProfile.enabled: true
      securityProfile.podSecurityContext.fsGroup: 1000
      securityProfile.containerSecurityContext.runAsUser: 1000
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
