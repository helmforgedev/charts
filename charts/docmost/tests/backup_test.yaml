# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-configmap.yaml
  - templates/backup-cronjob.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render backup configmap by default
    template: templates/backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render backup cronjob by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render backup configmap when backup is enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-docmost-backup-scripts

  - it: should render backup cronjob when backup is enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: test-docmost-backup

  - it: should use postgresql subchart database host in backup cronjob
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: test-postgresql

  - it: should use external database host in backup cronjob
    set:
      database.external.host: pg.example.com
      database.external.name: docmost
      database.external.username: docmost
      database.external.password: secret
      postgresql.enabled: false
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: pg.example.com

  - it: should set correct schedule
    set:
      backup.enabled: true
      backup.schedule: "0 6 * * *"
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "0 6 * * *"

  - it: should pass pgDumpArgs to the initContainer
    set:
      backup.enabled: true
      backup.database.pgDumpArgs: "--no-owner --clean"
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: PG_DUMP_EXTRA_ARGS
            value: "--no-owner --clean"

  - it: should use correct S3 endpoint in upload container
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.custom.com
      backup.s3.bucket: my-bucket
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: https://s3.custom.com

  - it: should fail when backup.s3.endpoint is missing
    set:
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail when backup.s3.bucket is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.bucket is required when backup.enabled is true"

  - it: should fail when s3 credentials are missing
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup requires either backup.s3.existingSecret or both backup.s3.accessKey and backup.s3.secretKey"

  - it: should not fail when existingSecret is set without inline keys
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.existingSecret: my-backup-secret
    template: templates/backup-cronjob.yaml
    asserts:
      - isKind:
          of: CronJob

  - it: should use workload identity without static credentials
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    template: templates/backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-docmost-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
          any: true

  - it: should render a dedicated annotated service account for workload identity
    set:
      commonAnnotations:
        example.com/owner: platform
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/docmost-backup
    template: templates/backup-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-docmost-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/docmost-backup

  - it: should not render a static credential secret for workload identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: should require a region for workload identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.credentialsFromPodIdentity: true
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "docmost: backup.s3.region is required when backup.s3.credentialsFromPodIdentity is true"

  - it: should require an existing dedicated service account name when creation is disabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "docmost: backup.serviceAccount.name is required when workload identity is enabled and backup.serviceAccount.create is false"
