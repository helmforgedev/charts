{{- $networkPolicy := .Values.networkPolicy | default dict -}}
{{- if ($networkPolicy.enabled | default false) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "liwan.fullname" . }}
  labels:
    {{- include "liwan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "liwan.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if $networkPolicy.ingressFrom }}
        {{- toYaml $networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
