# SPDX-License-Identifier: Apache-2.0
suite: elasticsearch - common annotations
templates:
  - templates/statefulset-master.yaml
  - templates/service.yaml
  - templates/configmap.yaml

tests:
  - it: applies common annotations to the master StatefulSet
    template: templates/statefulset-master.yaml
    set:
      commonAnnotations:
        owner: shared
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: shared

  - it: applies common annotations to the main Service
    template: templates/service.yaml
    set:
      commonAnnotations:
        owner: shared
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: shared
        documentIndex: 0

  - it: applies common annotations to the main ConfigMap
    template: templates/configmap.yaml
    set:
      commonAnnotations:
        owner: shared
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: shared

