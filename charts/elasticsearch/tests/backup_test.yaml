# SPDX-License-Identifier: Apache-2.0
suite: elasticsearch - backup
templates:
  - templates/cronjob-backup.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret-s3.yaml
  - templates/statefulset-master.yaml
  - templates/statefulset-data.yaml
  - templates/statefulset-coordinating.yaml

tests:
  - it: workload identity uses a dedicated annotated ServiceAccount
    template: templates/backup-serviceaccount.yaml
    set:
      backup:
        enabled: true
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/elasticsearch-backup
        s3:
          bucket: test-bucket
          credentialsFromPodIdentity: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/elasticsearch-backup

  - it: workload identity suppresses static credentials and bucket initialization
    set:
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          credentialsFromPodIdentity: true
    template: templates/secret-s3.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: workload identity configures repository-s3 token symlinks
    template: templates/statefulset-master.yaml
    set:
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          credentialsFromPodIdentity: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: configure-s3-workload-identity
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: repository-s3/aws-web-identity-token-file
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: repository-s3/eks-pod-identity-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
            value: /usr/share/elasticsearch/config/repository-s3/eks-pod-identity-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_CONTAINER_CREDENTIALS_FULL_URI
            value: http://169.254.170.23/v1/credentials

  - it: backup CronJob uses its dedicated ServiceAccount
    template: templates/cronjob-backup.yaml
    set:
      backup:
        enabled: true
        serviceAccount:
          name: snapshot-runner
        s3:
          bucket: test-bucket
          credentialsFromPodIdentity: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: snapshot-runner
        documentIndex: 1
      - notExists:
          path: spec.jobTemplate.spec.template.spec.initContainers
        documentIndex: 1

  - it: backup disabled should have no CronJob
    set:
      backup:
        enabled: false
    template: templates/cronjob-backup.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: backup enabled renders CronJob and ConfigMap
    set:
      backup:
        enabled: true
        s3:
          bucket: my-backup-bucket
          accessKey: AKIATEST
          secretKey: supersecret
    template: templates/cronjob-backup.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: CronJob
        documentIndex: 1

  - it: configures mc in writable temporary storage
    set:
      backup:
        enabled: true
        s3:
          bucket: es-backups
          accessKey: minio
          secretKey: minio123
    template: templates/cronjob-backup.yaml
    asserts:
      - matchRegex:
          path: data["mc-init.sh"]
          pattern: "MC_CONFIG_DIR"
        documentIndex: 0
      - matchRegex:
          path: data["mc-init.sh"]
          pattern: "/tmp/.mc"
        documentIndex: 0
      - matchRegex:
          path: data["mc-init.sh"]
          pattern: 'S3_ENDPOINT:-https://s3.amazonaws.com'
        documentIndex: 0
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
        documentIndex: 1

  - it: backup CronJob uses configured schedule
    set:
      backup:
        enabled: true
        schedule: "0 3 * * 0"
        s3:
          bucket: test-bucket
          accessKey: key
          secretKey: secret
    template: templates/cronjob-backup.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "0 3 * * 0"
        documentIndex: 1

  - it: backup enabled creates S3 secret when no existingSecret
    set:
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          accessKey: MYTESTKEY
          secretKey: MYSECRETKEY
    template: templates/secret-s3.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.access-key
          value: MYTESTKEY

  - it: generated S3 secret uses configured key names
    template: templates/secret-s3.yaml
    set:
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          accessKey: MYTESTKEY
          secretKey: MYSECRETKEY
          existingSecretAccessKeyKey: custom-access-key
          existingSecretSecretKeyKey: custom-secret-key
    asserts:
      - equal:
          path: stringData.custom-access-key
          value: MYTESTKEY
      - equal:
          path: stringData.custom-secret-key
          value: MYSECRETKEY

  - it: Elasticsearch keystore init uses configured key names
    template: templates/statefulset-master.yaml
    set:
      clusterProfile: production-ha
      security.existingTlsSecret: test-tls
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          accessKey: MYTESTKEY
          secretKey: MYSECRETKEY
          existingSecretAccessKeyKey: custom-access-key
          existingSecretSecretKeyKey: custom-secret-key
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env[0].valueFrom.secretKeyRef.key
          value: custom-access-key
      - equal:
          path: spec.template.spec.initContainers[0].env[1].valueFrom.secretKeyRef.key
          value: custom-secret-key

  - it: backup with existingSecret skips Secret creation
    set:
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          existingSecret: my-s3-secret
    template: templates/secret-s3.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: backup CronJob can be suspended
    set:
      backup:
        enabled: true
        suspend: true
        s3:
          bucket: test-bucket
          accessKey: key
          secretKey: secret
    template: templates/cronjob-backup.yaml
    asserts:
      - equal:
          path: spec.suspend
          value: true
        documentIndex: 1

  - it: installs S3 secure settings on every Elasticsearch node role
    set:
      clusterProfile: production-ha
      security.existingTlsSecret: test-tls
      backup:
        enabled: true
        s3:
          bucket: test-bucket
          accessKey: key
          secretKey: secret
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: keystore-s3
            image: docker.io/library/elasticsearch:9.5.5
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -e
                cp -r /usr/share/elasticsearch/config/. /keystore-config/
                ES_PATH_CONF=/keystore-config elasticsearch-keystore create -s -v 2>/dev/null || true
                echo "$S3_ACCESS_KEY" | ES_PATH_CONF=/keystore-config elasticsearch-keystore add -f -x s3.client.default.access_key
                echo "$S3_SECRET_KEY" | ES_PATH_CONF=/keystore-config elasticsearch-keystore add -f -x s3.client.default.secret_key
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: RELEASE-NAME-elasticsearch-backup
                    key: access-key
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: RELEASE-NAME-elasticsearch-backup
                    key: secret-key
            volumeMounts:
              - name: keystore-config
                mountPath: /keystore-config
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        template: templates/statefulset-master.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: keystore-config
            emptyDir: {}
        template: templates/statefulset-data.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: keystore-config
            mountPath: /usr/share/elasticsearch/config
        template: templates/statefulset-coordinating.yaml
