# SPDX-License-Identifier: Apache-2.0
suite: elasticsearch - integration contracts
templates:
  - templates/externalsecret.yaml
  - templates/httproute.yaml
  - templates/secret-credentials.yaml

tests:
  - it: does not render ExternalSecret resources by default
    template: templates/externalsecret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders canonical ExternalSecret items and wires credentials target
    template: templates/externalsecret.yaml
    set:
      externalSecrets:
        enabled: true
        refreshInterval: 1h
        items:
          - name: credentials
            spec:
              secretStoreRef:
                name: helmforge-fake-store
                kind: ClusterSecretStore
              data:
                - secretKey: elastic-password
                  remoteRef:
                    key: elasticsearch
                    property: elastic-password
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-elasticsearch-credentials
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: supports literal names and item-level refresh intervals
    template: templates/externalsecret.yaml
    set:
      externalSecrets:
        enabled: true
        refreshInterval: 1h
        items:
          - fullnameOverride: literal-secret-sync
            labels:
              owner: platform
            spec:
              refreshInterval: 5m
              secretStoreRef:
                name: helmforge-fake-store
              data:
                - secretKey: token
                  remoteRef:
                    key: token
    asserts:
      - equal:
          path: metadata.name
          value: literal-secret-sync
      - equal:
          path: metadata.labels.owner
          value: platform
      - equal:
          path: spec.target.name
          value: literal-secret-sync
      - equal:
          path: spec.refreshInterval
          value: 5m

  - it: fails fast when an item has no store reference
    template: templates/externalsecret.yaml
    set:
      externalSecrets:
        enabled: true
        items:
          - name: credentials
            spec:
              data:
                - secretKey: elastic-password
                  remoteRef:
                    key: elasticsearch
    asserts:
      - failedTemplate:
          errorMessage: every externalSecrets.items[].spec.data entry must define sourceRef when spec.secretStoreRef.name is absent

  - it: requires every data entry to resolve a store without a top-level reference
    template: templates/externalsecret.yaml
    set:
      externalSecrets:
        enabled: true
        items:
          - name: credentials
            spec:
              data:
                - secretKey: first
                  remoteRef:
                    key: first
                  sourceRef:
                    storeRef:
                      name: first-store
                - secretKey: second
                  remoteRef:
                    key: second
    asserts:
      - failedTemplate:
          errorMessage: every externalSecrets.items[].spec.data entry must define sourceRef when spec.secretStoreRef.name is absent

  - it: rejects duplicate effective ExternalSecret names
    template: templates/externalsecret.yaml
    set:
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: duplicate-secret
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              dataFrom:
                - extract:
                    key: first
          - fullnameOverride: duplicate-secret
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              dataFrom:
                - extract:
                    key: second
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items produce duplicate ExternalSecret metadata.name "duplicate-secret"

  - it: external secrets disables the chart-generated credentials secret
    template: templates/secret-credentials.yaml
    set:
      security.enabled: true
      externalSecrets:
        enabled: true
        items:
          - name: credentials
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              data:
                - secretKey: elastic-password
                  remoteRef:
                    key: elasticsearch
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores credential keys written to unrelated target Secrets
    template: templates/externalsecret.yaml
    set:
      security.enabled: true
      externalSecrets:
        enabled: true
        items:
          - name: unrelated
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              data:
                - secretKey: elastic-password
                  remoteRef:
                    key: unrelated
          - name: credentials
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              data:
                - secretKey: another-key
                  remoteRef:
                    key: elasticsearch
    asserts:
      - failedTemplate:
          errorMessage: the ExternalSecret credentials item must provide elastic-password through data or dataFrom

  - it: requires the Kibana system password in the credentials target
    template: templates/externalsecret.yaml
    set:
      security.enabled: true
      kibana.enabled: true
      externalSecrets:
        enabled: true
        items:
          - name: credentials
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              data:
                - secretKey: elastic-password
                  remoteRef:
                    key: elasticsearch
    asserts:
      - failedTemplate:
          errorMessage: the ExternalSecret credentials item must provide kibana-system-password through data or dataFrom when Kibana is enabled

  - it: accepts dataFrom for all credentials consumed by secured Kibana
    template: templates/externalsecret.yaml
    set:
      security.enabled: true
      kibana.enabled: true
      externalSecrets:
        enabled: true
        items:
          - name: credentials
            spec:
              secretStoreRef:
                name: helmforge-fake-store
              dataFrom:
                - extract:
                    key: elasticsearch
    asserts:
      - hasDocuments:
          count: 1

  - it: renders multiple canonical HTTPRoutes with the configured service port
    template: templates/httproute.yaml
    set:
      service.port: 19200
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: public
            parentRefs:
              - name: shared
            hostnames:
              - elasticsearch.example.com
          - name: internal
            parentRefs:
              - name: internal
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 19200
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-elasticsearch-internal
        documentIndex: 1

  - it: does not render HTTPRoute resources by default
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects duplicate effective HTTPRoute names
    template: templates/httproute.yaml
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: duplicate-route
            parentRefs:
              - name: shared
          - name: duplicate-route
            parentRefs:
              - name: shared
    asserts:
      - failedTemplate:
          errorMessage: gatewayAPI.httpRoutes contains duplicate effective name "RELEASE-NAME-elasticsearch-duplicate-route"

  - it: preserves route labels filters and explicit backend references
    template: templates/httproute.yaml
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - labels:
              owner: platform
            parentRefs: []
            rules:
              - filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - name: x-helmforge
                          value: elasticsearch
                backendRefs:
                  - name: external-search
                    port: 8080
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-elasticsearch
      - equal:
          path: metadata.labels.owner
          value: platform
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: external-search
