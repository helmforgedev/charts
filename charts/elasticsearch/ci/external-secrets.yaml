# CI scenario: ExternalSecrets with drift guard (GR-061)
master:
  persistence:
    enabled: false

data:
  persistence:
    enabled: false

security:
  enabled: true
  generatePasswords: false
  tls:
    selfSignedInit:
      enabled: true

externalSecrets:
  enabled: true
  items:
    - name: credentials
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: elastic-password
            remoteRef:
              key: test/password
          - secretKey: kibana-system-password
            remoteRef:
              key: test/password
