# CI scenario: application listeners differ from Service ports (GR-082)
master:
  persistence:
    enabled: false

data:
  persistence:
    enabled: false

containerPorts:
  http: 19200
  transport: 19300

service:
  port: 19201

monitoring:
  enabled: true
  containerPort: 19114
  service:
    port: 19115

kibana:
  enabled: true
  containerPort: 15601
  service:
    type: ClusterIP
    port: 15602

extraConfig:
  cluster.routing.allocation.disk.watermark.low: "82%"
