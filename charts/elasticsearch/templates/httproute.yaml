{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gatewayAPI.enabled }}
{{- $routeNames := dict }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes | default list }}
{{- $routeName := include "elasticsearch.httpRouteName" (dict "root" $ "route" $route "index" $index) }}
{{- if hasKey $routeNames $routeName }}
{{- fail (printf "gatewayAPI.httpRoutes contains duplicate effective name %q" $routeName) }}
{{- end }}
{{- $_ := set $routeNames $routeName true }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ include "elasticsearch.namespace" $ }}
  labels:
    {{- include "elasticsearch.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- if $route.rules }}
    {{- range $rule := $route.rules }}
    - {{- with $rule.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $rule.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $rule.backendRefs }}
      backendRefs:
        {{- toYaml $rule.backendRefs | nindent 8 }}
      {{- else if not $rule.omitDefaultBackend }}
      backendRefs:
        - name: {{ include "elasticsearch.fullname" $ }}
          port: {{ $.Values.service.port }}
      {{- end }}
    {{- end }}
  {{- else }}
    - backendRefs:
        - name: {{ include "elasticsearch.fullname" $ }}
          port: {{ $.Values.service.port }}
  {{- end }}
{{- end }}
{{- end }}
