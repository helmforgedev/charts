{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.items }}
{{- fail "externalSecrets.items must contain at least one item when externalSecrets.enabled=true" }}
{{- end }}
{{- $credentialsTargetFound := false }}
{{- $elasticPasswordFound := false }}
{{- $kibanaPasswordFound := false }}
{{- range .Values.externalSecrets.items | default list }}
{{- $externalSecretName := include "elasticsearch.externalSecretName" (dict "root" $ "item" .) }}
{{- $spec := deepCopy (.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}
{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}
{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}
{{- $_ := set $target "name" $externalSecretName }}
{{- $_ := set $spec "target" $target }}
{{- end }}
{{- $isCredentialsTarget := eq (get $target "name") (include "elasticsearch.credentialsSecretName" $) }}
{{- if $isCredentialsTarget }}
{{- $credentialsTargetFound = true }}
{{- end }}
{{- $hasStoreRef := false }}
{{- if dig "secretStoreRef" "name" "" $spec }}
{{- $hasStoreRef = true }}
{{- end }}
{{- range ($spec.data | default list) }}
{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}
{{- $hasStoreRef = true }}
{{- end }}
{{- if and $isCredentialsTarget (eq .secretKey "elastic-password") }}{{- $elasticPasswordFound = true }}{{- end }}
{{- if and $isCredentialsTarget (eq .secretKey "kibana-system-password") }}{{- $kibanaPasswordFound = true }}{{- end }}
{{- end }}
{{- range ($spec.dataFrom | default list) }}
{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}
{{- $hasStoreRef = true }}
{{- end }}
{{- if $isCredentialsTarget }}
{{- $elasticPasswordFound = true }}
{{- $kibanaPasswordFound = true }}
{{- end }}
{{- end }}
{{- if not $hasStoreRef }}
{{- fail "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $externalSecretName }}
  namespace: {{ include "elasticsearch.namespace" $ }}
  labels:
    {{- include "elasticsearch.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- if eq (include "elasticsearch.security.enabled" .) "true" }}
{{- if not $credentialsTargetFound }}
{{- fail "externalSecrets must target the credentials Secret consumed by Elasticsearch when security is enabled" }}
{{- end }}
{{- if not $elasticPasswordFound }}
{{- fail "the ExternalSecret credentials item must provide elastic-password through data or dataFrom" }}
{{- end }}
{{- if and .Values.kibana.enabled (not $kibanaPasswordFound) }}
{{- fail "the ExternalSecret credentials item must provide kibana-system-password through data or dataFrom when Kibana is enabled" }}
{{- end }}
{{- end }}
{{- end }}
