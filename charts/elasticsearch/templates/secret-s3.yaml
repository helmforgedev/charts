{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if eq (include "elasticsearch.backupEnabled" .) "true" -}}
{{- if not .Values.backup.s3.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elasticsearch.backupSecretName" . }}
  namespace: {{ (include "elasticsearch.namespace" .) }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.existingSecretAccessKeyKey | quote }}: {{ .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.existingSecretSecretKeyKey | quote }}: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
{{- end }}
