{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "elasticsearch.validateMasterCount" . -}}
{{- include "elasticsearch.validatePorts" . -}}
{{- $secEnabled := include "elasticsearch.security.enabled" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "elasticsearch.fullname" . }}-master
  namespace: {{ (include "elasticsearch.namespace" .) }}
  labels:
    {{- include "elasticsearch.componentLabels" (dict "root" . "component" "master") | nindent 4 }}
spec:
  serviceName: {{ include "elasticsearch.fullname" . }}-master-headless
  replicas: {{ include "elasticsearch.master.replicaCount" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "elasticsearch.componentSelectorLabels" (dict "root" . "component" "master") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elasticsearch.componentLabels" (dict "root" . "component" "master") | nindent 8 }}
        {{- include "elasticsearch.nodeGroupLabel" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
        {{- with .Values.master.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elasticsearch.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or .Values.sysctlInit.enabled (eq (include "elasticsearch.backupEnabled" .) "true") }}
      initContainers:
        {{- if .Values.sysctlInit.enabled }}
        - name: sysctl
          image: {{ printf "%s:%s" .Values.sysctlInit.image.repository .Values.sysctlInit.image.tag }}
          imagePullPolicy: {{ .Values.sysctlInit.image.pullPolicy }}
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
        {{- end }}
        {{- include "elasticsearch.backupKeystoreInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: elasticsearch
          image: {{ include "elasticsearch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            - name: transport
              containerPort: {{ .Values.containerPorts.transport }}
              protocol: TCP
          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.roles
              value: {{ if eq (include "elasticsearch.hasDedicatedDataNodes" .) "true" }}"master"{{ else }}"master,data,ingest"{{ end }}
            - name: ES_JAVA_OPTS
              value: {{ printf "-Xms%s -Xmx%s" (include "elasticsearch.master.heapSize" .) (include "elasticsearch.master.heapSize" .) | quote }}
            {{- $singleNode := and (eq (int (include "elasticsearch.master.replicaCount" .)) 1) (eq (int (include "elasticsearch.coordinating.replicaCount" .)) 0) (ne (include "elasticsearch.hasDedicatedDataNodes" .) "true") }}
            {{- if not $singleNode }}
            - name: cluster.initial_master_nodes
              value: {{ include "elasticsearch.initialMasterNodes" . | quote }}
            {{- end }}
            {{- include "elasticsearch.commonEnv" . | nindent 12 }}
          {{- include "elasticsearch.livenessProbe" . | nindent 10 }}
          {{- include "elasticsearch.readinessProbe" . | nindent 10 }}
          {{- include "elasticsearch.startupProbe" . | nindent 10 }}
          resources:
            {{- include "elasticsearch.master.resources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            {{- include "elasticsearch.configVolumeMount" . | nindent 12 }}
            {{- if eq $secEnabled "true" }}
            - name: tls-certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
            {{- end }}
            {{- include "elasticsearch.backupKeystoreVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- include "elasticsearch.exporterContainer" . | nindent 8 }}
      volumes:
        {{- include "elasticsearch.configVolume" . | nindent 8 }}
        {{- if not .Values.master.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if eq $secEnabled "true" }}
        - name: tls-certs
          secret:
            secretName: {{ include "elasticsearch.tlsSecretName" . }}
        {{- end }}
        {{- include "elasticsearch.backupKeystoreVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (.Values.master.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.master.affinity .Values.affinity }}
      affinity:
        {{- toYaml (.Values.master.affinity | default .Values.affinity) | nindent 8 }}
      {{- else }}
      {{- include "elasticsearch.antiAffinity" (dict "root" . "component" "master") | nindent 6 }}
      {{- end }}
      {{- with (.Values.master.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
  {{- if .Values.master.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "elasticsearch.componentSelectorLabels" (dict "root" . "component" "master") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.master.persistence.storageClass }}
        storageClassName: {{ .Values.master.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "elasticsearch.master.persistence.size" . }}
  {{- end }}
