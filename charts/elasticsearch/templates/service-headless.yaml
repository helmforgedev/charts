{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{/* Master headless service for discovery */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch.fullname" . }}-master-headless
  namespace: {{ (include "elasticsearch.namespace" .) }}
  labels:
    {{- include "elasticsearch.componentLabels" (dict "root" . "component" "master") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: {{ .Values.containerPorts.transport }}
      targetPort: transport
    - name: http
      port: {{ .Values.containerPorts.http }}
      targetPort: http
  selector:
    {{- include "elasticsearch.componentSelectorLabels" (dict "root" . "component" "master") | nindent 4 }}
---
{{/* Data headless service */}}
{{- if gt (int (include "elasticsearch.data.replicaCount" .)) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch.fullname" . }}-data-headless
  namespace: {{ (include "elasticsearch.namespace" .) }}
  labels:
    {{- include "elasticsearch.componentLabels" (dict "root" . "component" "data") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: {{ .Values.containerPorts.transport }}
      targetPort: transport
  selector:
    {{- include "elasticsearch.componentSelectorLabels" (dict "root" . "component" "data") | nindent 4 }}
{{- end }}
---
{{/* Dedicated data-tier headless services provide stable StatefulSet DNS. */}}
{{- range $tier := list "hot" "warm" }}
{{- $tierValues := index $.Values.dataTiers $tier }}
{{- if and $tierValues.enabled (ne (include "elasticsearch.profile" $) "dev") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch.fullname" $ }}-{{ $tier }}-headless
  namespace: {{ include "elasticsearch.namespace" $ }}
  labels:
    {{- include "elasticsearch.componentLabels" (dict "root" $ "component" $tier) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  {{- with $.Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $.Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: {{ $.Values.containerPorts.transport }}
      targetPort: transport
  selector:
    {{- include "elasticsearch.componentSelectorLabels" (dict "root" $ "component" $tier) | nindent 4 }}
---
{{- end }}
{{- end }}
---
{{/* Coordinating headless service */}}
{{- if gt (int (include "elasticsearch.coordinating.replicaCount" .)) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch.fullname" . }}-coordinating-headless
  namespace: {{ (include "elasticsearch.namespace" .) }}
  labels:
    {{- include "elasticsearch.componentLabels" (dict "root" . "component" "coordinating") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: {{ .Values.containerPorts.transport }}
      targetPort: transport
  selector:
    {{- include "elasticsearch.componentSelectorLabels" (dict "root" . "component" "coordinating") | nindent 4 }}
{{- end }}
