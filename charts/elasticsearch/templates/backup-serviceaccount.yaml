{{- if and (eq (include "elasticsearch.backupEnabled" .) "true") .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elasticsearch.backupServiceAccountName" . }}
  namespace: {{ include "elasticsearch.namespace" . }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  {{- with (include "elasticsearch.annotations" (dict "root" . "annotations" .Values.backup.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
