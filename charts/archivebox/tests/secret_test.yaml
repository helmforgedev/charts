# SPDX-License-Identifier: Apache-2.0
suite: Admin Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-archivebox-admin
        namespace: default
      data:
        admin-password: cmV0YWluZWQtcGFzc3dvcmQ=
tests:
  - it: should render the managed admin secret by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-archivebox-admin

  - it: should render explicit admin credentials unchanged
    set:
      archivebox.adminUsername: operator
      archivebox.adminPassword: stable-password
    asserts:
      - equal:
          path: stringData.admin-username
          value: operator
      - equal:
          path: stringData.admin-password
          value: stable-password

  - it: should reuse the password from an existing managed secret
    asserts:
      - equal:
          path: stringData.admin-password
          value: retained-password

  - it: should not render the managed secret when an existing secret is configured
    set:
      archivebox.existingSecret: externally-managed
    asserts:
      - hasDocuments:
          count: 0
