# SPDX-License-Identifier: Apache-2.0
suite: Validation
templates:
  - templates/validate.yaml
tests:
  - it: should render no validation manifest by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when backup endpoint is missing
    set:
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail when backup is enabled without persistent storage
    set:
      persistence.enabled: false
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "persistence.enabled must be true when backup.enabled is true"

  - it: should fail when backup credentials are missing
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
    asserts:
      - failedTemplate:
          errorMessage: "backup requires either backup.s3.existingSecret or both backup.s3.accessKey and backup.s3.secretKey"

  - it: should fail when ingress is enabled without hosts
    set:
      ingress.enabled: true
      ingress.hosts: []
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled requires ingress.hosts to contain at least one host"

  - it: should fail when an ingress host entry has no hostname
    set:
      ingress.enabled: true
      ingress.hosts:
        - paths:
            - path: /
              pathType: Prefix
    asserts:
      - failedTemplate:
          errorMessage: "ingress.hosts[0].host is required when ingress.enabled is true"

  - it: should fail when podLabels override selector labels
    set:
      podLabels:
        app.kubernetes.io/name: archivebox-custom
    asserts:
      - failedTemplate:
          errorMessage: 'podLabels must not override selector label "app.kubernetes.io/name"'


  - it: should reject the removed publicSnapshots setting instead of silently changing privacy
    set:
      archivebox.publicSnapshots: "False"
    asserts:
      - failedTemplate:
          errorMessage: "archivebox.publicSnapshots has been removed; manage snapshot permissions in the ArchiveBox UI"

  - it: should reject the renamed publicAddLinks setting
    set:
      archivebox.publicAddLinks: "True"
    asserts:
      - failedTemplate:
          errorMessage: "archivebox.publicAddLinks has been renamed to archivebox.publicAddPage; remove the old key"

  - it: should require PostgreSQL host when enabled
    set:
      externalDatabase.enabled: true
      externalDatabase.host: ""
      externalDatabase.existingSecret: archivebox-postgres
    asserts:
      - failedTemplate:
          errorMessage: "externalDatabase.host is required when externalDatabase.enabled is true"

  - it: should require PostgreSQL name when enabled
    set:
      externalDatabase.enabled: true
      externalDatabase.host: postgres.database.svc
      externalDatabase.existingSecret: archivebox-postgres
      externalDatabase.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalDatabase.name is required when externalDatabase.enabled is true"

  - it: should require PostgreSQL user when enabled
    set:
      externalDatabase.enabled: true
      externalDatabase.host: postgres.database.svc
      externalDatabase.existingSecret: archivebox-postgres
      externalDatabase.user: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalDatabase.user is required when externalDatabase.enabled is true"

  - it: should require PostgreSQL existingSecret when enabled
    set:
      externalDatabase.enabled: true
      externalDatabase.host: postgres.database.svc
      externalDatabase.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalDatabase.existingSecret is required when externalDatabase.enabled is true"

  - it: should require PostgreSQL existingSecretPasswordKey when enabled
    set:
      externalDatabase.enabled: true
      externalDatabase.host: postgres.database.svc
      externalDatabase.existingSecret: archivebox-postgres
      externalDatabase.existingSecretPasswordKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalDatabase.existingSecretPasswordKey is required when externalDatabase.enabled is true"
