# SPDX-License-Identifier: Apache-2.0
suite: Backup Secret
templates:
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should create backup secret when enabled with inline credentials
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    documentSelector:
      path: metadata.name
      value: test-archivebox-backup
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.access-key
          value: admin

  - it: should not create a static credential Secret for workload identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    documentSelector:
      path: metadata.name
      value: test-archivebox-backup
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
