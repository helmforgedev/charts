# CI: external PostgreSQL on port 5433 and ArchiveBox on a non-default listener.
archivebox:
  port: 5897
  adminPassword: archivebox-ci-password

externalDatabase:
  enabled: true
  host: archivebox-ci-postgresql
  port: 5433
  name: archivebox_ext
  user: archivebox_ext
  existingSecret: archivebox-ci-db
  existingSecretPasswordKey: password
