# =============================================================================
# ArchiveBox Helm Chart - Default Values
# =============================================================================
# Focus: self-hosted web archiving with Chromium headless and multi-format capture

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# Image
# =============================================================================

image:
  # -- ArchiveBox container image
  repository: docker.io/archivebox/archivebox
  # -- Image tag
  tag: "0.9.77"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================================================
# ArchiveBox Configuration
# =============================================================================

archivebox:
  # -- Application port
  port: 5797
  # -- Admin username (created on first run)
  adminUsername: admin
  # -- Admin password (required for initial setup)
  adminPassword: ""
  # -- Existing secret containing admin credentials
  existingSecret: ""
  # -- Key in existing secret for admin username
  existingSecretUsernameKey: admin-username
  # -- Key in existing secret for admin password
  existingSecretPasswordKey: admin-password
  # -- Set BASE_URL in the container environment; leave empty for first-use admin setup
  baseUrl: ""
  # -- ArchiveBox server security mode (SERVER_SECURITY_MODE)
  serverSecurityMode: auto
  # -- Application UID override for the image entrypoint; empty detects the existing collection owner
  puid: ""
  # -- Application GID override for the image entrypoint; empty detects the existing collection owner
  pgid: ""
  # -- Allowed hostnames (comma-separated or *)
  allowedHosts: "*"
  # -- Allow public access to the index page
  publicIndex: "True"
  # -- Allow public access to the add URL view (PUBLIC_ADD_VIEW)
  publicAddLinks: "False"
  # -- Maximum media file size to download (bytes notation)
  mediaMaxSize: "750m"
  # -- Timeout for archiving a single URL (seconds)
  timeout: "60"
  # -- Timezone
  timezone: UTC
  # -- Extra environment variables for the container
  # -- @default -- `[]`
  extraEnv: []

# =============================================================================
# External PostgreSQL
# =============================================================================

externalDatabase:
  # -- Use an existing PostgreSQL server instead of the SQLite database in /data
  enabled: false
  # -- PostgreSQL hostname or service name (required when enabled)
  host: ""
  # -- PostgreSQL port
  port: 5432
  # -- PostgreSQL database name (create this database before installing)
  name: archivebox
  # -- PostgreSQL username
  user: archivebox
  # -- Existing Secret containing the PostgreSQL password (required when enabled)
  existingSecret: ""
  # -- Password key in externalDatabase.existingSecret
  existingSecretPasswordKey: database-password

# =============================================================================
# Persistence
# =============================================================================

persistence:
  # -- Enable persistence for /data (archives, config, search indexes, and SQLite when used)
  enabled: true
  # -- Storage size (plan for large archives, 50-100GB+)
  size: 50Gi
  # -- Storage class
  storageClass: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Use an existing PVC
  existingClaim: ""

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- ServiceAccount name
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

# =============================================================================
# Service
# =============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP service port
  port: 80
  # -- Annotations for the Service
  annotations: {}

# =============================================================================
# Ingress
# =============================================================================

ingress:
  # -- Enable ingress for ArchiveBox
  enabled: false
  # -- Ingress class name (for example: traefik, nginx)
  ingressClassName: traefik
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Ingress hosts
  hosts: []
    # - host: archive.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - hosts:
    #     - archive.example.com
    #   secretName: archivebox-tls

# =============================================================================
# Probes
# =============================================================================

probes:
  startup:
    enabled: true
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 120
  liveness:
    enabled: true
    path: /health/
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health/
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# Resources and Security
# =============================================================================

# -- Container resource requests/limits (Chromium requires ~2Gi RAM minimum)
resources: {}
  # requests:
  #   cpu: 500m
  #   memory: 2Gi
  # limits:
  #   cpu: 2000m
  #   memory: 4Gi

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  # The upstream entrypoint prepares writable paths, then drops to PUID/PGID.
  # Do not fix fsGroup or force UID 911: existing collections can have another owner.
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
  seccompProfile:
    type: RuntimeDefault

# =============================================================================
# S3 Backup
# =============================================================================

backup:
  # -- Enable scheduled data backups to S3-compatible storage
  enabled: false
  # -- Cron schedule for backups (default: daily at 03:00 UTC)
  schedule: "0 3 * * *"
  # -- Suspend the CronJob without deleting it
  suspend: false
  # -- Concurrency policy: Forbid, Replace, Allow
  concurrencyPolicy: Forbid
  # -- Number of successful job records to keep
  successfulJobsHistoryLimit: 3
  # -- Number of failed job records to keep
  failedJobsHistoryLimit: 3
  # -- Maximum retries per backup job
  backoffLimit: 1
  # -- Prefix for backup archive filenames
  archivePrefix: archivebox
  images:
    # -- Image used for data volume backup (must have tar)
    tar: docker.io/library/alpine:3.22
    # -- Image used for S3 upload (MinIO client)
    uploader: docker.io/helmforge/mc:1.0.0
  # -- Resources for backup containers
  resources: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  archiverSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - DAC_READ_SEARCH
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccount:
    # -- Create a dedicated ServiceAccount for identity-based S3 backups
    create: true
    # -- Name of an existing dedicated backup ServiceAccount when create is false
    name: ""
    # -- Annotations for workload identity integrations such as IRSA
    annotations: {}
    # -- Mount the Kubernetes API token into backup pods
    automountServiceAccountToken: false
  s3:
    # -- S3-compatible endpoint URL
    endpoint: ""
    # -- Target bucket name
    bucket: ""
    # -- Key prefix within the bucket
    prefix: archivebox
    # -- Auto-create the bucket if it does not exist
    createBucketIfNotExists: true
    # -- Use an existing secret for S3 credentials
    existingSecret: ""
    # -- Key in the existing secret for the access key
    existingSecretAccessKeyKey: access-key
    # -- Key in the existing secret for the secret key
    existingSecretSecretKeyKey: secret-key
    # -- Inline S3 access key (ignored when existingSecret is set)
    accessKey: ""
    # -- Inline S3 secret key (ignored when existingSecret is set)
    secretKey: ""
    # -- AWS region used by Pod Identity or IRSA credential discovery
    region: ""
    # -- Use the pod's workload identity instead of static S3 credentials
    credentialsFromPodIdentity: false

# =============================================================================
# Scheduling
# =============================================================================

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

podLabels: {}
podAnnotations: {}

# =============================================================================
# Extra
# =============================================================================

extraVolumes: []
extraVolumeMounts: []

# -- Extra manifests to deploy alongside the chart
extraManifests: []

