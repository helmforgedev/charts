# SPDX-License-Identifier: Apache-2.0
# ArchiveBox behind single-domain TLS ingress with private capture defaults.

archivebox:
  adminUsername: admin
  existingSecret: archivebox-admin
  baseUrl: https://archive.example.com
  serverSecurityMode: auto
  publicIndex: "False"
  publicAddPage: "False"
  # Snapshot visibility is configured through the UI. Set the initial default
  # explicitly here to preserve private captures rather than merely unlisted ones.
  extraEnv:
    - name: PERMISSIONS
      value: private

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: archive.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - archive.example.com
      secretName: archivebox-tls

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "3"
    memory: 6Gi

