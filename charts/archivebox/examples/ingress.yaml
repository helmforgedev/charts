# SPDX-License-Identifier: Apache-2.0
# Public ArchiveBox endpoint with TLS and a canonical URL.

archivebox:
  adminUsername: admin
  existingSecret: archivebox-admin
  baseUrl: https://archive.example.com
  publicIndex: "False"
  publicAddPage: "False"
  # Preserve private captures when migrating from publicSnapshots: "False".
  extraEnv:
    - name: PERMISSIONS
      value: private

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: archive.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - archive.example.com
      secretName: archivebox-tls

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "3"
    memory: 6Gi
