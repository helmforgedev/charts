# Existing PostgreSQL server for the main index. This does not migrate SQLite.
# Keep /data persistent for captures, configuration, Personas, and local indexes.

archivebox:
  existingSecret: archivebox-admin

externalDatabase:
  enabled: true
  host: postgres.database.svc.cluster.local
  port: 5432
  name: archivebox
  user: archivebox
  existingSecret: archivebox-postgresql
  existingSecretPasswordKey: database-password

persistence:
  enabled: true
  size: 100Gi

# Provide the database and role before deployment. The existing Secret in the
# release namespace must contain database-password. Back up PostgreSQL separately
# and coordinate it with /data backups; the chart's tar CronJob omits the database.
