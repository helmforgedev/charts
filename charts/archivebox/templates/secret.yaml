{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.archivebox.existingSecret }}
{{- $adminPassword := .Values.archivebox.adminPassword -}}
{{- if not $adminPassword -}}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-admin" (include "archivebox.fullname" .)) -}}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "admin-password") -}}
    {{- $adminPassword = (index $existingSecret.data "admin-password" | b64dec) -}}
  {{- else -}}
    {{- $adminPassword = randAlphaNum 32 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin" (include "archivebox.fullname" .) }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-username: {{ .Values.archivebox.adminUsername | quote }}
  admin-password: {{ $adminPassword | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "archivebox.fullname" .) }}
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
