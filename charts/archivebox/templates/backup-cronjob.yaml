{{- if include "archivebox.backupEnabled" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "archivebox.fullname" . }}-backup
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
  {{- include "archivebox.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "archivebox.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "archivebox.backupServiceAccountName" . }}
          automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
          securityContext:
            {{- toYaml .Values.backup.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: data-backup
              image: {{ .Values.backup.images.tar | quote }}
              command: ["/bin/sh", "/scripts/data-backup.sh"]
              securityContext:
                {{- toYaml .Values.backup.archiverSecurityContext | nindent 16 }}
              env:
                - name: BACKUP_ARCHIVE_PREFIX
                  value: {{ .Values.backup.archivePrefix | quote }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup-workdir
                  mountPath: /backup/out
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: uploader-tmp
                  mountPath: /uploader-tmp
          containers:
            - name: upload
              image: {{ .Values.backup.images.uploader | quote }}
              command: ["/bin/sh", "/scripts/upload-backup.sh"]
              securityContext:
                {{- toYaml .Values.backup.securityContext | nindent 16 }}
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | quote }}
                - name: S3_CREATE_BUCKET_IF_NOT_EXISTS
                  value: {{ ternary "true" "false" .Values.backup.s3.createBucketIfNotExists | quote }}
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
                {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                - name: AWS_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- else }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "archivebox.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretAccessKeyKey | quote }}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "archivebox.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretSecretKeyKey | quote }}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup-workdir
                  mountPath: /backup/out
                - name: uploader-tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: {{ include "archivebox.fullname" . }}-backup-scripts
                defaultMode: 0755
            - name: backup-workdir
              emptyDir: {}
            - name: uploader-tmp
              emptyDir: {}
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "archivebox.dataClaimName" . }}
{{- end }}
