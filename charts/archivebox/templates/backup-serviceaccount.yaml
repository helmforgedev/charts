{{- if and .Values.backup.enabled .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archivebox.backupServiceAccountName" . }}
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
  {{- include "archivebox.renderAnnotations" (dict "root" . "specific" .Values.backup.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
