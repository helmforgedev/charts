apiVersion: v1
kind: Service
metadata:
  name: {{ include "archivebox.fullname" . }}
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
  {{- include "archivebox.renderAnnotations" (dict "root" . "specific" .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "archivebox.selectorLabels" . | nindent 4 }}
