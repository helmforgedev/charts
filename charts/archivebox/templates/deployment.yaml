{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "archivebox.fullname" . }}
  labels:
    {{- include "archivebox.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "archivebox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "archivebox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "archivebox.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: archivebox
          image: {{ include "archivebox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["archivebox", "server", "--init", {{ printf "0.0.0.0:%v" .Values.archivebox.port | quote }}]
          ports:
            - name: http
              containerPort: {{ .Values.archivebox.port }}
              protocol: TCP
          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "archivebox.secretName" . }}
                  key: {{ include "archivebox.usernameKey" . }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "archivebox.secretName" . }}
                  key: {{ include "archivebox.passwordKey" . }}
            - name: BASE_URL
              value: {{ include "archivebox.baseUrl" . | quote }}
            - name: SERVER_SECURITY_MODE
              value: {{ .Values.archivebox.serverSecurityMode | quote }}
            {{- with .Values.archivebox.puid }}
            - name: PUID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.archivebox.pgid }}
            - name: PGID
              value: {{ . | quote }}
            {{- end }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.archivebox.allowedHosts | quote }}
            - name: PUBLIC_INDEX
              value: {{ .Values.archivebox.publicIndex | quote }}
            - name: PUBLIC_ADD_VIEW
              value: {{ .Values.archivebox.publicAddPage | quote }}
            - name: MEDIA_MAX_SIZE
              value: {{ .Values.archivebox.mediaMaxSize | quote }}
            - name: TIMEOUT
              value: {{ .Values.archivebox.timeout | quote }}
            - name: TZ
              value: {{ .Values.archivebox.timezone | quote }}
            {{- if .Values.externalDatabase.enabled }}
            - name: ARCHIVEBOX_DATABASE_ENGINE
              value: postgres
            - name: ARCHIVEBOX_DATABASE_HOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: ARCHIVEBOX_DATABASE_PORT
              value: {{ .Values.externalDatabase.port | quote }}
            - name: ARCHIVEBOX_DATABASE_NAME
              value: {{ .Values.externalDatabase.name | quote }}
            - name: ARCHIVEBOX_DATABASE_USER
              value: {{ .Values.externalDatabase.user | quote }}
            - name: ARCHIVEBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretPasswordKey }}
            {{- end }}
            {{- with .Values.archivebox.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "archivebox.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

