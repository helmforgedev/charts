# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# Wallabag Helm Chart - Default Values
# =============================================================================
# Focus: self-hosted read-it-later with PostgreSQL and optional Redis

# -- Global values shared with parent charts and subcharts
global: {}

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the full resource name prefix
fullnameOverride: ""
# -- Labels added to every rendered resource
commonLabels: {}

# =============================================================================
# Image
# =============================================================================

image:
  # -- Wallabag container image
  repository: docker.io/wallabag/wallabag
  # -- Image tag
  tag: "2.6.14"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# =============================================================================
# Wallabag Configuration
# =============================================================================

wallabag:
  # -- Port the bundled nginx listener binds inside the container
  port: 80
  # -- Public URL users reach Wallabag through (scheme and host, no trailing slash)
  domainName: "https://wallabag.example.com"
  # -- Instance name shown in the Wallabag UI and API
  serverName: "Wallabag"
  # -- Symfony secret (generated once and preserved across upgrades when empty)
  secret: ""
  # -- Existing Secret containing the Symfony secret
  existingSecret: ""
  # -- Key in the existing Secret holding the Symfony secret
  existingSecretKey: symfony-secret
  # -- Allow public user registration
  registration: false
  admin:
    # -- Username of the initial super-admin created on first install
    username: wallabag
    # -- Email of the initial super-admin created on first install
    email: wallabag@example.com
    # -- Initial super-admin password (generated once and preserved when empty)
    password: ""
    # -- Existing Secret containing the initial super-admin password
    existingSecret: ""
    # -- Key in the existing Secret holding the super-admin password
    existingSecretPasswordKey: admin-password
  # -- Extra environment variables for the Wallabag container
  # @default -- `[]`
  extraEnv: []

# =============================================================================
# Database setup
# =============================================================================

setup:
  # -- Run the database setup init container (schema install on first start, migrations on upgrade)
  enabled: true
  # -- Seconds to wait for PostgreSQL before the setup init container fails
  databaseWaitTimeoutSeconds: 300
  # -- Resources for the setup init container
  resources: {}

# =============================================================================
# Database
# =============================================================================

database:
  external:
    # -- External PostgreSQL host (required when postgresql.enabled=false)
    host: ""
    # -- External PostgreSQL port
    port: "5432"
    # -- External PostgreSQL database name
    name: wallabag
    # -- External PostgreSQL username
    username: wallabag
    # -- External PostgreSQL password (ignored when existingSecret is set)
    password: ""
    # -- Existing Secret containing the database password
    existingSecret: ""
    # -- Key in the existing Secret containing the password
    existingSecretPasswordKey: password

# =============================================================================
# External Redis
# =============================================================================

externalRedis:
  # -- External Redis host for asynchronous imports (used when redis.enabled=false)
  host: ""
  # -- External Redis port
  port: "6379"
  # -- External Redis password (ignored when existingSecret is set)
  password: ""
  # -- Existing Secret containing the external Redis password
  existingSecret: ""
  # -- Key in the existing Secret containing the Redis password
  existingSecretPasswordKey: redis-password

# =============================================================================
# Persistence
# =============================================================================

persistence:
  # -- Enable persistence for /var/www/wallabag/data
  enabled: true
  # -- Storage size
  size: 2Gi
  # -- Storage class
  storageClass: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Use an existing PVC
  existingClaim: ""

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- ServiceAccount name
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

# -- Mount the ServiceAccount token into the pod (Wallabag does not call the Kubernetes API)
automountServiceAccountToken: false

# =============================================================================
# Service
# =============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP service port
  port: 80
  # -- Annotations for the Service
  annotations: {}

# =============================================================================
# Ingress
# =============================================================================

ingress:
  # -- Enable ingress for Wallabag
  enabled: false
  # -- Ingress class name (for example: traefik, nginx)
  ingressClassName: traefik
  # -- Annotations for the Ingress
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Ingress hosts
  hosts: []
    # - host: wallabag.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - hosts:
    #     - wallabag.example.com
    #   secretName: wallabag-tls

# =============================================================================
# Gateway API
# =============================================================================

gatewayAPI:
  # -- Render Gateway API HTTPRoute resources
  enabled: false
  # -- HTTPRoute definitions routed to the Wallabag Service by default
  # @default -- `[]`
  httpRoutes: []
    # - name: public
    #   parentRefs:
    #     - name: shared-gateway
    #       namespace: gateway-system
    #       sectionName: https
    #   hostnames:
    #     - wallabag.example.com

# =============================================================================
# Probes
# =============================================================================

probes:
  # -- HTTP path used by every probe (served by Wallabag through nginx and PHP-FPM)
  path: /api/info
  startup:
    # -- Enable the startup probe
    enabled: true
    # -- Initial delay before the first startup probe
    initialDelaySeconds: 15
    # -- Startup probe period
    periodSeconds: 10
    # -- Startup probe timeout
    timeoutSeconds: 5
    # -- Startup probe failure threshold
    failureThreshold: 30
  liveness:
    # -- Enable the liveness probe
    enabled: true
    # -- Initial delay before the first liveness probe
    initialDelaySeconds: 0
    # -- Liveness probe period
    periodSeconds: 15
    # -- Liveness probe timeout
    timeoutSeconds: 5
    # -- Liveness probe failure threshold
    failureThreshold: 3
  readiness:
    # -- Enable the readiness probe
    enabled: true
    # -- Initial delay before the first readiness probe
    initialDelaySeconds: 0
    # -- Readiness probe period
    periodSeconds: 10
    # -- Readiness probe timeout
    timeoutSeconds: 5
    # -- Readiness probe failure threshold
    failureThreshold: 3

# =============================================================================
# Resources and Security
# =============================================================================

# -- Resources for the Wallabag container
resources: {}

# -- Pod security context. The upstream image starts as root and drops to nobody for PHP.
podSecurityContext:
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context for the Wallabag and setup containers
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

# =============================================================================
# S3 Backup
# =============================================================================

backup:
  # -- Enable scheduled PostgreSQL backups to S3-compatible storage
  enabled: false
  # -- Cron schedule for backups (default: daily at 03:00 UTC)
  schedule: "0 3 * * *"
  # -- Suspend the CronJob without deleting it
  suspend: false
  # -- Concurrency policy: Forbid, Replace, Allow
  concurrencyPolicy: Forbid
  # -- Number of successful job records to keep
  successfulJobsHistoryLimit: 3
  # -- Number of failed job records to keep
  failedJobsHistoryLimit: 3
  # -- Maximum retries per backup job
  backoffLimit: 1
  # -- Prefix for backup archive filenames
  archivePrefix: wallabag
  images:
    # -- Image used for PostgreSQL backup (must have pg_dump)
    postgresql: docker.io/library/postgres:18-alpine
    # -- Image used for S3 upload (MinIO client)
    uploader: docker.io/helmforge/mc:1.0.0
  # -- Resources for backup containers
  resources: {}
  s3:
    # -- S3-compatible endpoint URL
    endpoint: ""
    # -- Target bucket name
    bucket: ""
    # -- Key prefix within the bucket
    prefix: wallabag
    # -- Auto-create the bucket if it does not exist
    createBucketIfNotExists: true
    # -- Use an existing secret for S3 credentials
    existingSecret: ""
    # -- Key in the existing secret for the access key
    existingSecretAccessKeyKey: access-key
    # -- Key in the existing secret for the secret key
    existingSecretSecretKeyKey: secret-key
    # -- Inline S3 access key (ignored when existingSecret is set)
    accessKey: ""
    # -- Inline S3 secret key (ignored when existingSecret is set)
    secretKey: ""
  # -- Override database credentials for backup (uses app credentials if empty)
  database:
    # -- Backup database host override
    host: ""
    # -- Backup database port override
    port: ""
    # -- Backup database name override
    name: ""
    # -- Backup database username override
    username: ""
    # -- Backup database password override
    password: ""
    # -- Existing Secret with the backup database password
    existingSecret: ""
    # -- Key in the backup database Secret
    existingSecretPasswordKey: password
    # -- Extra arguments appended to pg_dump
    postgresDumpArgs: ""

# =============================================================================
# Scheduling
# =============================================================================

# -- Node selector for the Wallabag pod
nodeSelector: {}
# -- Tolerations for the Wallabag pod
tolerations: []
# -- Affinity rules for the Wallabag pod
affinity: {}
# -- Topology spread constraints for the Wallabag pod
topologySpreadConstraints: []
# -- Priority class name for the Wallabag pod
priorityClassName: ""
# -- Grace period for PHP-FPM and nginx to drain
terminationGracePeriodSeconds: 30

# -- Extra labels for the Wallabag pod
podLabels: {}
# -- Extra annotations for the Wallabag pod
podAnnotations: {}

# =============================================================================
# Extra
# =============================================================================

# -- Extra volumes for the Wallabag pod
extraVolumes: []
# -- Extra volume mounts for the Wallabag container
extraVolumeMounts: []

# -- Extra manifests to deploy alongside the chart
extraManifests: []

# =============================================================================
# Subcharts
# =============================================================================

postgresql:
  # -- Deploy PostgreSQL as a subchart
  enabled: true
  # -- PostgreSQL subchart architecture
  architecture: standalone
  auth:
    # -- Database created for Wallabag
    database: wallabag
    # -- Database user created for Wallabag
    username: wallabag
    # -- PostgreSQL password (auto-generated if empty)
    password: ""

redis:
  # -- Deploy Redis as a subchart (asynchronous import queue; requires import workers, see DESIGN.md)
  enabled: false
  # -- Redis subchart architecture
  architecture: standalone
  auth:
    # -- Redis password (auto-generated by the subchart if empty)
    password: ""
