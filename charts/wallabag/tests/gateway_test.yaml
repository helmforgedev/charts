# SPDX-License-Identifier: Apache-2.0
suite: Gateway API
templates:
  - templates/gateway-httproute.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render HTTPRoutes by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should route to the Wallabag Service by default
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - name: public
          parentRefs:
            - name: shared-gateway
              namespace: gateway-system
          hostnames:
            - wallabag.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: test-wallabag-public
      - equal:
          path: spec.hostnames
          value:
            - wallabag.example.com
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: test-wallabag
            port: 80

  - it: should follow a custom Service port and explicit rules
    set:
      service.port: 8088
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - parentRefs:
            - name: shared-gateway
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
    asserts:
      - equal:
          path: metadata.name
          value: test-wallabag
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8088
