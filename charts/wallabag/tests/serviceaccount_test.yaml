# SPDX-License-Identifier: Apache-2.0
suite: ServiceAccount and extra manifests
templates:
  - templates/serviceaccount.yaml
  - templates/extra-manifests.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render a ServiceAccount by default
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a named ServiceAccount with annotations
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: wallabag-reader
      serviceAccount.annotations:
        example.com/role: reader
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: wallabag-reader
      - equal:
          path: metadata.annotations
          value:
            example.com/role: reader

  - it: should render extra manifests verbatim
    template: templates/extra-manifests.yaml
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: wallabag-extra
          data:
            note: kept
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.note
          value: kept
