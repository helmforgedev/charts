# SPDX-License-Identifier: Apache-2.0
suite: Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render the app and admin Secrets by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-wallabag-app
        documentIndex: 0
      - exists:
          path: stringData.symfony-secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-wallabag-admin
        documentIndex: 1
      - exists:
          path: stringData.admin-password
        documentIndex: 1

  - it: should keep explicit secret values
    set:
      wallabag.secret: fixed-symfony-secret
      wallabag.admin.password: fixed-admin-password
    asserts:
      - equal:
          path: stringData.symfony-secret
          value: fixed-symfony-secret
        documentIndex: 0
      - equal:
          path: stringData.admin-password
          value: fixed-admin-password
        documentIndex: 1

  - it: should not render chart-owned Secrets when existing Secrets are used
    set:
      wallabag.existingSecret: wallabag-app
      wallabag.admin.existingSecret: wallabag-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render the admin Secret when setup is disabled
    set:
      setup.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-wallabag-app

  - it: should render the external database and Redis password Secrets
    set:
      postgresql.enabled: false
      database.external.host: pg.example.internal
      database.external.password: db-secret
      externalRedis.host: redis.example.internal
      externalRedis.password: redis-secret
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: test-wallabag-db
        documentIndex: 2
      - equal:
          path: stringData.password
          value: db-secret
        documentIndex: 2
      - equal:
          path: metadata.name
          value: test-wallabag-redis
        documentIndex: 3
      - equal:
          path: stringData.redis-password
          value: redis-secret
        documentIndex: 3
