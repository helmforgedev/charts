{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.wallabag.existingSecret }}
{{- $appSecretName := printf "%s-app" (include "wallabag.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
stringData:
  symfony-secret: {{ include "wallabag.persistedSecretValue" (dict "root" . "name" $appSecretName "key" "symfony-secret" "value" .Values.wallabag.secret) | quote }}
{{- end }}
---
{{- if and .Values.setup.enabled (not .Values.wallabag.admin.existingSecret) }}
{{- $adminSecretName := printf "%s-admin" (include "wallabag.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecretName }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ include "wallabag.persistedSecretValue" (dict "root" . "name" $adminSecretName "key" "admin-password" "value" .Values.wallabag.admin.password) | quote }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "wallabag.fullname" .) }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
---
{{- if and (not .Values.redis.enabled) .Values.externalRedis.host (not .Values.externalRedis.existingSecret) .Values.externalRedis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redis" (include "wallabag.fullname" .) }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.externalRedis.password | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "wallabag.fullname" .) }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
