{{- if and (include "wallabag.backupEnabled" .) .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wallabag.backupServiceAccountName" . }}
  labels:
    {{- include "wallabag.labels" . | nindent 4 }}
  {{- include "wallabag.renderAnnotations" (dict "root" . "annotations" .Values.backup.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
