# SPDX-License-Identifier: Apache-2.0
fullnameOverride: opencloud-ingress
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    nginx.ingress.kubernetes.io/proxy-ssl-secret: hf-validate-opencloud/opencloud-ingress-tls
    nginx.ingress.kubernetes.io/proxy-ssl-name: opencloud-ingress.hf-validate-opencloud.svc
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: 'on'
  hosts:
    - host: files.example.test
      paths:
        - path: /
          pathType: Prefix
persistence:
  size: 1Gi
