# SPDX-License-Identifier: Apache-2.0
fullnameOverride: opencloud-eso
bootstrap:
  existingSecret: opencloud-eso-admin
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: opencloud-eso-admin
      spec:
        target:
          template:
            engineVersion: v2
            data:
              admin-password: '{{ .password | sha256sum }}'
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
persistence:
  size: 1Gi
