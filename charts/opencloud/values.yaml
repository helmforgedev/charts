# SPDX-License-Identifier: Apache-2.0
# -- nameOverride.
nameOverride: ''
# -- fullnameOverride.
fullnameOverride: ''
# -- commonLabels.
commonLabels: {}
# -- One monolithic replica; distributed HA is not supported.
replicaCount: 1
# -- image.
image:
  # -- repository.
  repository: docker.io/opencloudeu/opencloud
  # -- tag.
  tag: 7.2.4
  # -- pullPolicy.
  pullPolicy: IfNotPresent
# -- imagePullSecrets.
imagePullSecrets: []
# -- server.
server:
  # -- port.
  port: 9200
  # -- Canonical HTTPS origin shared by browser redirects and native OIDC clients.
  publicUrl: ''
  # -- tls.
  tls:
    # -- enabled.
    enabled: true
    # -- existingSecret.
    existingSecret: ''
  # -- Optional Secret containing additional trusted issuer CA certificates.
  trustedCaSecret: ''
  # -- trustedCaKey.
  trustedCaKey: ca.crt
  # -- backendTLS.
  backendTLS:
    # -- enabled.
    enabled: true
    # -- Backend certificate DNS identity; empty uses the canonical OpenCloud hostname.
    hostname: ''
    # -- BackendTLSPolicy ConfigMap CA references for an operator-owned TLS certificate.
    caCertificateRefs: []
    # -- Use controller system roots for backend TLS; mutually exclusive with custom CA references.
    useSystemCAs: false
# -- extraEnv.
extraEnv: []
# -- serviceAccount.
serviceAccount:
  # -- create.
  create: true
  # -- name.
  name: ''
  # -- annotations.
  annotations: {}
  # -- automountServiceAccountToken.
  automountServiceAccountToken: false
# -- service.
service:
  # -- type.
  type: ClusterIP
  # -- port.
  port: 9200
  # -- annotations.
  annotations: {}
  # -- ipFamilyPolicy.
  ipFamilyPolicy: ''
  # -- ipFamilies.
  ipFamilies: []
# -- ingress.
ingress:
  # -- enabled.
  enabled: false
  # -- ingressClassName.
  ingressClassName: ''
  # -- annotations.
  annotations: {}
  # -- hosts.
  hosts: []
  # -- tls.
  tls: []
# -- externalSecrets.
externalSecrets:
  # -- enabled.
  enabled: false
  # -- refreshInterval.
  refreshInterval: 1h
  # -- items.
  items: []
# -- networkPolicy.
networkPolicy:
  # -- enabled.
  enabled: true
  # -- Allowed scraper peers; empty selects Pods in this namespace.
  ingressFrom: []
  # -- egressIsolation.
  egressIsolation: true
  # -- dnsEgress.
  dnsEgress:
    - namespaceSelector:
        # -- matchLabels.
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      # -- podSelector.
      podSelector:
        # -- matchLabels.
        matchLabels:
          # -- k8s-app.
          k8s-app: kube-dns
  # -- webEgress.
  webEgress: []
  # -- webPorts.
  webPorts:
    - 443
  # -- extraEgress.
  extraEgress: []
# -- probes.
probes:
  # -- startup.
  startup:
    # -- enabled.
    enabled: true
    # -- failureThreshold.
    failureThreshold: 60
    # -- periodSeconds.
    periodSeconds: 5
    # -- timeoutSeconds.
    timeoutSeconds: 5
  # -- readiness.
  readiness:
    # -- enabled.
    enabled: true
    # -- failureThreshold.
    failureThreshold: 3
    # -- periodSeconds.
    periodSeconds: 10
    # -- timeoutSeconds.
    timeoutSeconds: 5
  # -- liveness.
  liveness:
    # -- enabled.
    enabled: true
    # -- failureThreshold.
    failureThreshold: 3
    # -- periodSeconds.
    periodSeconds: 20
    # -- timeoutSeconds.
    timeoutSeconds: 5
# -- resources.
resources:
  # -- requests.
  requests:
    # -- cpu.
    cpu: 250m
    # -- memory.
    memory: 512Mi
  # -- limits.
  limits:
    # -- cpu.
    cpu: '2'
    # -- memory.
    memory: 2Gi
# -- podSecurityContext.
podSecurityContext:
  # -- runAsNonRoot.
  runAsNonRoot: true
  # -- runAsUser.
  runAsUser: 1000
  # -- runAsGroup.
  runAsGroup: 1000
  # -- fsGroup.
  fsGroup: 1000
  # -- fsGroupChangePolicy.
  fsGroupChangePolicy: OnRootMismatch
  # -- seccompProfile.
  seccompProfile:
    # -- type.
    type: RuntimeDefault
# -- securityContext.
securityContext:
  # -- allowPrivilegeEscalation.
  allowPrivilegeEscalation: false
  # -- readOnlyRootFilesystem.
  readOnlyRootFilesystem: true
  # -- capabilities.
  capabilities:
    # -- drop.
    drop:
      - ALL
# -- podLabels.
podLabels: {}
# -- podAnnotations.
podAnnotations: {}
# -- nodeSelector.
nodeSelector: {}
# -- tolerations.
tolerations: []
# -- affinity.
affinity: {}
# -- topologySpreadConstraints.
topologySpreadConstraints: []
# -- priorityClassName.
priorityClassName: ''
# -- terminationGracePeriodSeconds.
terminationGracePeriodSeconds: 30
# -- persistence.
persistence:
  # -- enabled.
  enabled: true
  # -- Existing volume containing matching config and data, including extended attributes.
  existingClaim: ''
  # -- storageClass.
  storageClass: ''
  # -- size.
  size: 20Gi
  # -- accessModes.
  accessModes:
    - ReadWriteOnce
  # -- retain.
  retain: true
  # -- annotations.
  annotations: {}
# -- bootstrap.
bootstrap:
  # -- Initial administrator password; prefer an existing Secret in production.
  password: ''
  # -- existingSecret.
  existingSecret: ''
  # -- Key containing the initial administrator password (at least 16 bytes).
  passwordKey: admin-password
# -- runtime.
runtime:
  # -- Bounded emptyDir space for native temporary files.
  temporarySize: 1Gi
# -- metrics.
metrics:
  # -- enabled.
  enabled: false
  # -- port.
  port: 9464
  # -- existingSecret.
  existingSecret: ''
  # -- Secret key containing a metrics Bearer token of at least 16 bytes.
  tokenKey: token
  # -- image.
  image:
    # -- repository.
    repository: docker.io/library/node
    # -- tag.
    tag: 24.21.0-alpine3.23
    # -- pullPolicy.
    pullPolicy: IfNotPresent
  # -- resources.
  resources:
    # -- requests.
    requests:
      # -- cpu.
      cpu: 10m
      # -- memory.
      memory: 32Mi
    # -- limits.
    limits:
      # -- cpu.
      cpu: 100m
      # -- memory.
      memory: 128Mi
  # -- Allowed scraper peers; empty selects Pods in this namespace.
  ingressFrom: []
  # -- serviceMonitor.
  serviceMonitor:
    # -- enabled.
    enabled: false
    # -- labels.
    labels: {}
    # -- interval.
    interval: 30s
    # -- scrapeTimeout.
    scrapeTimeout: 10s
  # -- prometheusRule.
  prometheusRule:
    # -- enabled.
    enabled: false
    # -- labels.
    labels: {}
    # -- additionalRules.
    additionalRules: []
# -- gatewayAPI.
gatewayAPI:
  # -- enabled.
  enabled: false
  # -- Canonical HTTPRoute definitions; omitted backends target this application Service.
  httpRoutes: []
