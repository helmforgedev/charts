{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.gatewayAPI.enabled .Values.server.tls.enabled .Values.server.backendTLS.enabled }}
{{- $generated := not .Values.server.tls.existingSecret }}
{{- $caName := printf "%s-backend-ca" (include "opencloud.fullname" . | trunc 52 | trimSuffix "-") }}
{{- if $generated }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $caName }}
  labels: {{ include "opencloud.labels" . | nindent 4 }}
data:
  ca.crt: {{ index (include "opencloud.generatedTLSData" . | fromYaml) "ca.crt" | b64dec | toYaml | nindent 4 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "opencloud.fullname" . }}
  labels: {{ include "opencloud.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: "", kind: Service, name: {{ include "opencloud.fullname" . }}, sectionName: http}
  validation:
    hostname: {{ default ((urlParse (include "opencloud.publicUrl" .)).hostname) .Values.server.backendTLS.hostname | quote }}
    {{- if $generated }}
    caCertificateRefs:
      - {group: "", kind: ConfigMap, name: {{ $caName }}}
    {{- else if .Values.server.backendTLS.useSystemCAs }}
    wellKnownCACertificates: System
    {{- else }}
    caCertificateRefs: {{ toYaml .Values.server.backendTLS.caCertificateRefs | nindent 6 }}
    {{- end }}
{{- end }}
