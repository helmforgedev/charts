{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.server.tls.enabled (not .Values.server.tls.existingSecret) }}
{{- $data := include "opencloud.generatedTLSData" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencloud.tlsSecretName" . }}
  labels: {{ include "opencloud.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: kubernetes.io/tls
data: {{ toYaml $data | nindent 2 }}
{{- end }}
