# SPDX-License-Identifier: Apache-2.0
suite: OpenCloud native runtime boundaries
templates:
  - deployment.yaml
tests:
  - it: keeps generated configuration and data on the same claim with distinct subpaths
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: workspace, mountPath: /etc/opencloud, subPath: config}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: workspace, mountPath: /var/lib/opencloud, subPath: data}
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: uses the official image for native init and xattr admission
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/opencloudeu/opencloud:7.2.4
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [/bin/sh, /bootstrap-script/bootstrap.sh]
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OC_INSECURE, value: 'false'}
  - it: supports HTTPS edge termination with explicit public origin
    set:
      server.publicUrl: https://files.example.test
      server.tls.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.hostAliases
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROXY_TLS, value: 'false'}
