# SPDX-License-Identifier: Apache-2.0
suite: External Secrets contract
templates:
  - externalsecret.yaml
tests:
  - it: omits resources by default
    asserts:
      - hasDocuments:
          count: 0
  - it: defaults target and refresh interval
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: private-admin
          spec:
            secretStoreRef:
              name: store
              kind: ClusterSecretStore
            data:
              - secretKey: admin-password
                remoteRef:
                  key: password
    asserts:
      - equal:
          path: spec.target.name
          value: private-admin
      - equal:
          path: spec.refreshInterval
          value: 1h
  - it: rejects a source without a store
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: missing
          spec:
            data:
              - secretKey: password
                remoteRef:
                  key: password
    asserts:
      - failedTemplate:
          errorMessage: >-
            externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name
            is required when externalSecrets.enabled=true
