# SPDX-License-Identifier: Apache-2.0
suite: OpenCloud Service contract
templates:
  - service.yaml
tests:
  - it: maps the configurable Service port to the named application port
    set:
      service.port: 9443
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9443
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: renders dual-stack settings and annotations
    set:
      service.annotations:
        example.com/owner: platform
      service.ipFamilyPolicy: PreferDualStack
      service.ipFamilies: [IPv6, IPv4]
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - equal:
          path: spec.ipFamilies
          value: [IPv6, IPv4]
