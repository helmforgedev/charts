{{- if not .Values.identity.existingSecret }}
{{- $name := include "twenty.identitySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "twenty.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ENCRYPTION_KEY: {{ get $data "ENCRYPTION_KEY" | default (randBytes 32 | b64enc) | quote }}
  SERVER_ID: {{ get $data "SERVER_ID" | default (uuidv4 | b64enc) | quote }}
{{- end }}
