apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twenty.fullname" . }}
  labels: {{ include "twenty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "twenty.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports: [{protocol: TCP, port: 3000}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty-admission
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 3011}]
    {{- if .Values.metrics.enabled }}
    - from: {{ toYaml .Values.metrics.ingressFrom | nindent 8 }}
      ports: [{protocol: TCP, port: 9464}]
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty-admission
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 8088}]
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: {{ get (.Values.postgresql.service | default dict) "port" | default 5432 }}}]
    {{- end }}
    - to: {{ toYaml .Values.networkPolicy.dnsEgress | nindent 8 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if .Values.networkPolicy.allowPublicHttps }}
    # Optional outbound integrations may require public HTTPS.
    # Standard NetworkPolicy cannot constrain these public endpoints by DNS name.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: 2000::/3
            except:
              - 2001::/32
              - 2001:2::/48
              - 2001:db8::/32
              - 2002::/16
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis}
      ports: [{protocol: TCP, port: {{ get (get (.Values.redis.service | default dict) "ports" | default dict) "redis" | default 6379 }}}]
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}{{ toYaml . | nindent 4 }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twenty.fullname" . }}-admission
  labels: {{ include "twenty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twenty-admission
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "twenty.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 8088}]
  egress:
    - to:
        - podSelector:
            matchLabels: {{ include "twenty.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 3010}, {protocol: TCP, port: 3011}]

{{- if and .Values.networkPolicy.enabled .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twenty.fullname" . }}-redis
  labels: {{ include "twenty.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "twenty.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ get (get (.Values.redis.service | default dict) "ports" | default dict) "redis" | default 6379 }}
  egress: []
{{- end }}
