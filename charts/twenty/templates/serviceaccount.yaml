{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "twenty.serviceAccountName" . }}
  labels:
    {{- include "twenty.labels" . | nindent 4 }}
{{- include "twenty.renderAnnotations" (list . .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
