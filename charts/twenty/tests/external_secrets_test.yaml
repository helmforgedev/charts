# SPDX-License-Identifier: Apache-2.0
suite: External Secrets ownership contract
templates:
  - externalsecret.yaml
tests:
  - it: rejects secret synchronization without an explicit source
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: initial-user
          spec: {}
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true
  - it: preserves an explicitly named target for native credentials
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: initial-user
          spec:
            secretStoreRef: {name: organization, kind: ClusterSecretStore}
            target: {name: twenty-initial-user}
            data:
              - secretKey: user-password
                remoteRef: {key: twenty/initial-user}
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: spec.target.name
          value: twenty-initial-user
      - equal:
          path: spec.data[0].secretKey
          value: user-password
  - it: defaults resource and target names together for independent secret items
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: twenty-identity
          spec:
            secretStoreRef: {name: organization, kind: ClusterSecretStore}
            dataFrom:
              - extract: {key: twenty/identity}
    asserts:
      - equal:
          path: metadata.name
          value: twenty-identity
      - equal:
          path: spec.target.name
          value: twenty-identity
