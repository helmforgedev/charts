# SPDX-License-Identifier: Apache-2.0
fullnameOverride: twenty-s3
storage:
  driver: s3
  s3:
    bucket: twenty.fixtures
    endpoint: https://fixture-integrations:9443
    existingSecret: fixture-s3
    caSecret: fixture-integrations-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-integrations
      ports:
        - protocol: TCP
          port: 9443
