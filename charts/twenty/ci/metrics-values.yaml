# SPDX-License-Identifier: Apache-2.0
fullnameOverride: twenty-metrics
metrics:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app: twenty-monitor
  serviceMonitor:
    enabled: true
    interval: 5s
    scrapeTimeout: 3s
  prometheusRule:
    enabled: true
persistence:
  size: 1Gi
postgresql:
  standalone:
    persistence:
      size: 2Gi
redis:
  standalone:
    persistence:
      size: 1Gi
