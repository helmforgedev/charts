# SPDX-License-Identifier: Apache-2.0
fullnameOverride: twenty-ingress
server:
  publicUrl: https://crm.example.test
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: crm.example.test
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: twenty-tls
      hosts:
        - crm.example.test
