# SPDX-License-Identifier: Apache-2.0
suite: OpenSign External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: maps remote credentials through the canonical items contract
    set:
      secrets.existingSecret: opensign-identity
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: production
      externalSecrets.items:
        - secretKey: master-key
          remoteRef:
            key: opensign/master-key
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: spec.secretStoreRef.kind, value: ClusterSecretStore }
      - equal: { path: spec.target.name, value: opensign-identity }
      - equal: { path: 'spec.data[0].remoteRef.key', value: opensign/master-key }
