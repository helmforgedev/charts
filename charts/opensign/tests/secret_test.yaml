# SPDX-License-Identifier: Apache-2.0
suite: OpenSign identity and storage
templates:
  - templates/secret.yaml
  - templates/pvc.yaml
tests:
  - it: retains the generated Parse master key
    template: templates/secret.yaml
    asserts:
      - isKind: { of: Secret }
      - exists: { path: stringData.master-key }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
  - it: delegates identity to an existing Secret
    template: templates/secret.yaml
    set:
      secrets.existingSecret: opensign-identity
    asserts:
      - hasDocuments: { count: 0 }
  - it: retains a chart-created document claim
    template: templates/pvc.yaml
    asserts:
      - isKind: { of: PersistentVolumeClaim }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
      - equal: { path: spec.resources.requests.storage, value: 10Gi }
