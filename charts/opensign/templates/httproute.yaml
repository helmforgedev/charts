{{- if .Values.gateway.enabled }}
{{- range $component := list "frontend" "backend" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opensign.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "opensign.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  parentRefs:
    {{- toYaml $.Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- if eq $component "frontend" }}
    {{- toYaml $.Values.gateway.frontendHostnames | nindent 4 }}
    {{- else }}
    {{- toYaml $.Values.gateway.apiHostnames | nindent 4 }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "opensign.componentName" (dict "root" $ "component" $component) }}
          port: {{ ternary $.Values.service.frontendPort $.Values.service.backendPort (eq $component "frontend") }}
{{- end }}
{{- end }}
