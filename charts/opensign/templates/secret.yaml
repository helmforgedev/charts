{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "opensign.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $masterKey := .Values.secrets.masterKey -}}
{{- if and (empty $masterKey) $existing }}
  {{- $masterKey = (index $existing.data .Values.secrets.masterKeyKey | default "" | b64dec) -}}
{{- end }}
{{- if empty $masterKey }}
  {{- $masterKey = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opensign.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secrets.masterKeyKey }}: {{ $masterKey | quote }}
  {{ .Values.secrets.pfxBase64Key }}: {{ .Values.secrets.pfxBase64 | quote }}
  {{ .Values.secrets.pfxPassphraseKey }}: {{ .Values.secrets.pfxPassphrase | quote }}
  {{ .Values.secrets.smtpPasswordKey }}: {{ .Values.secrets.smtpPassword | quote }}
  {{ .Values.secrets.objectStorageAccessKeyIdKey }}: {{ .Values.secrets.objectStorageAccessKeyId | quote }}
  {{ .Values.secrets.objectStorageSecretAccessKeyKey }}: {{ .Values.secrets.objectStorageSecretAccessKey | quote }}
{{- end }}
