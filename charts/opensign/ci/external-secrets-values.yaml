# SPDX-License-Identifier: Apache-2.0
fullnameOverride: opensign
secrets:
  existingSecret: opensign-identity
externalSecrets:
  enabled: true
  refreshInterval: 5m
  secretStoreRef:
    name: helmforge-fake-store
    kind: ClusterSecretStore
  items:
    - secretKey: master-key
      remoteRef: { key: test/token }
    - secretKey: pfx-base64
      remoteRef: { key: test/password }
    - secretKey: pfx-passphrase
      remoteRef: { key: test/username }
    - secretKey: smtp-password
      remoteRef: { key: test/password }
    - secretKey: object-storage-access-key-id
      remoteRef: { key: test/username }
    - secretKey: object-storage-secret-access-key
      remoteRef: { key: test/password }
