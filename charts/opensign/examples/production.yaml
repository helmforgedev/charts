# SPDX-License-Identifier: Apache-2.0
config:
  publicUrl: https://sign.example.com
  apiUrl: https://sign-api.example.com/app

secrets:
  existingSecret: opensign-production

storage:
  type: s3
  s3:
    bucket: opensign-documents
    endpoint: https://s3.example.com
    baseUrl: https://documents.example.com
    region: us-east-1

ingress:
  enabled: true
  ingressClassName: nginx
  frontendHost: sign.example.com
  apiHost: sign-api.example.com
  tls:
    - secretName: opensign-tls
      hosts:
        - sign.example.com
        - sign-api.example.com

frontend:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  extraEgress: []

mongodb:
  architecture: replicaset
