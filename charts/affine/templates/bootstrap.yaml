{{ .Files.Get "files/bootstrap.mjs" | indent 4 }}
  start.mjs: |
{{ .Files.Get "files/start.mjs" | indent 4 }}
  tls-admission.mjs: |
{{ .Files.Get "files/tls-admission.mjs" | indent 4 }}
  readiness.mjs: |
{{ .Files.Get "files/readiness.mjs" | indent 4 }}
