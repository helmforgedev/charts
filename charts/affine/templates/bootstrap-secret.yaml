{{- if not .Values.bootstrap.existingSecret }}
{{- $name := include "affine.bootstrapSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $value := .Values.bootstrap.password | default (get $data .Values.bootstrap.passwordKey | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "affine.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.bootstrap.passwordKey }}: {{ $value | b64enc | quote }}
{{- end }}
