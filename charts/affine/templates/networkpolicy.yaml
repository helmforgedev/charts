{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "affine.fullname" . }}
  labels: {{ include "affine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "affine.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.egressIsolation }}, Egress{{ end }}]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports: [{protocol: TCP, port: http}]
    {{- if .Values.metrics.enabled }}
    - from: {{ toYaml .Values.metrics.ingressFrom | nindent 8 }}
      ports: [{protocol: TCP, port: metrics}]
    {{- end }}
  {{- if .Values.networkPolicy.egressIsolation }}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: {{ get (.Values.postgresql.service | default dict) "port" | default 5432 }}}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis}
      ports: [{protocol: TCP, port: {{ get (get (.Values.redis.service | default dict) "ports" | default dict) "redis" | default 6379 }}}]
    - to: {{ toYaml .Values.networkPolicy.dnsEgress | nindent 8 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.extraEgress }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "affine.fullname" . }}-redis
  labels: {{ include "affine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "affine.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ get (get (.Values.redis.service | default dict) "ports" | default dict) "redis" | default 6379 }}
  egress: []
{{- end }}
