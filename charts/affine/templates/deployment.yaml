{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "affine.fullname" . }}
  labels: {{ include "affine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {{ include "affine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "affine.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/bootstrap: {{ printf "%s%s%s" (toJson .Values.bootstrap) (.Files.Get "files/bootstrap.mjs") (.Files.Get "files/start.mjs") | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "affine.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}{{- end }}
      initContainers:
        - name: bootstrap
          image: {{ include "affine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, /helmforge/bootstrap.mjs]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          env:
            {{- include "affine.environment" . | nindent 12 }}
            - {name: BOOTSTRAP_NAME, value: {{ .Values.bootstrap.name | quote }}}
            - {name: BOOTSTRAP_EMAIL, value: {{ .Values.bootstrap.email | quote }}}
          volumeMounts:
            {{- include "affine.mounts" . | nindent 12 }}
            - {name: bootstrap-auth, mountPath: /bootstrap-auth, readOnly: true}
      containers:
        - name: affine
          image: {{ include "affine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, /helmforge/start.mjs]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: http, containerPort: {{ .Values.server.port }}}
            {{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}}
            {{- end }}
          env: {{ include "affine.environment" . | nindent 12 }}
          {{- range $name, $probe := .Values.probes }}
          {{- if $probe.enabled }}
          {{ $name }}Probe:
            {{- if eq $name "readiness" }}
            exec: {command: [node, /helmforge/readiness.mjs]}
            {{- else }}
            httpGet: {path: /info, port: http}
            {{- end }}
            {{- omit $probe "enabled" | toYaml | nindent 12 }}
          {{- end }}{{- end }}
          volumeMounts: {{ include "affine.mounts" . | nindent 12 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}{{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}{{- end }}
      volumes:
        {{- if and (not .Values.postgresql.enabled) .Values.database.tls.caSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.database.tls.caSecret }}
            items: [{key: {{ .Values.database.tls.caKey }}, path: ca.crt}]
        {{- end }}
        {{- if and (not .Values.redis.enabled) .Values.cache.tls.caSecret }}
        - name: redis-ca
          secret:
            secretName: {{ .Values.cache.tls.caSecret }}
            items: [{key: {{ .Values.cache.tls.caKey }}, path: ca.crt}]
        {{- end }}
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "affine.claimName" . }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: {{ .Values.runtime.temporarySize }}}}
        - {name: generated-schema, emptyDir: {sizeLimit: 8Mi}}
        - name: bootstrap-auth
          secret:
            secretName: {{ include "affine.bootstrapSecretName" . }}
            defaultMode: 288
            items: [{key: {{ .Values.bootstrap.passwordKey }}, path: password}]
        - name: bootstrap-script
          configMap: {name: {{ include "affine.fullname" . | trunc 53 | trimSuffix "-" }}-bootstrap}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}{{- end }}
