# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: affine
description: Collaborative knowledge workspace with private native onboarding, pgvector PostgreSQL and authenticated Redis.
type: application
version: 0.1.0
appVersion: 0.27.4
kubeVersion: '>=1.26.0-0'
maintainers:
  - name: helmforgedev
  - name: mberlofa
keywords:
  - affine
  - workspace
  - knowledge
  - collaboration
home: https://helmforge.dev/docs/charts/affine
sources:
  - https://github.com/helmforgedev/charts/tree/main/charts/affine
  - https://github.com/toeverything/affine
icon: https://helmforge.dev/icons/charts/affine.png
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Add native collaborative workspace with durable identity"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
    - name: Maicon Berlofa
      email: maicon.berloffa@gmail.com
  helmforge.dev/maturity: stable
  helmforge.dev/signed: gpg+cosign
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/links: |
    - name: Official Website
      url: https://affine.pro
    - name: Documentation
      url: https://helmforge.dev/docs/charts/affine
dependencies:
  - name: postgresql
    version: 2.0.5
    repository: https://repo.helmforge.dev
    condition: postgresql.enabled
  - name: redis
    version: 2.0.1
    repository: https://repo.helmforge.dev
    condition: redis.enabled
