# SPDX-License-Identifier: Apache-2.0
persistence:
  size: 1Gi
postgresql:
  standalone:
    persistence:
      size: 2Gi
fullnameOverride: affine-production
serviceAccount:
  name: affine-production-runtime
redis:
  serviceAccount:
    create: false
    name: affine-production-runtime
  standalone:
    persistence:
      size: 1Gi
server:
  publicUrl: https://knowledge.example.test
bootstrap:
  email: owner@example.test
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - podSelector: {}
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 3Gi
