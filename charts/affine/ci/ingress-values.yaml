# SPDX-License-Identifier: Apache-2.0
persistence:
  size: 1Gi
postgresql:
  standalone:
    persistence:
      size: 2Gi
redis:
  standalone:
    persistence:
      size: 1Gi
fullnameOverride: affine-ingress
server:
  publicUrl: https://affine.example.test
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: affine.example.test
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: affine-edge-tls
      hosts:
        - affine.example.test
