# SPDX-License-Identifier: Apache-2.0
persistence:
  size: 1Gi
postgresql:
  standalone:
    persistence:
      size: 2Gi
redis:
  standalone:
    persistence:
      size: 1Gi
fullnameOverride: affine-eso
bootstrap:
  existingSecret: affine-eso-admin
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: affine-eso-admin
      spec:
        target:
          template:
            engineVersion: v2
            data:
              admin-password: '{{ .password | sha256sum | trunc 32 }}'
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
