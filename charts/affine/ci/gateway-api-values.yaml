# SPDX-License-Identifier: Apache-2.0
persistence:
  size: 1Gi
postgresql:
  standalone:
    persistence:
      size: 2Gi
redis:
  standalone:
    persistence:
      size: 1Gi
fullnameOverride: affine-gateway
server:
  publicUrl: https://affine.example.test
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: public
          namespace: gateway-system
          sectionName: https
      hostnames:
        - affine.example.test
    - name: affine-alternate
      parentRefs:
        - name: public
          namespace: gateway-system
      hostnames:
        - workspace.example.test
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: X-HelmForge
                    value: affine
