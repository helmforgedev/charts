# SPDX-License-Identifier: Apache-2.0
# Install vector in the target PostgreSQL database before starting AFFiNE.
# Replace documentation CIDRs with the actual database/cache destination ranges.
postgresql:
  enabled: false
redis:
  enabled: false
database:
  host: postgres.example.com
  name: affine
  username: affine
  passwordSecret: affine-postgres
  passwordKey: password
  tls:
    enabled: true
    caSecret: postgres-ca
    caKey: ca.crt
cache:
  host: redis.example.com
  port: 6380
  passwordSecret: affine-redis
  passwordKey: password
  tls:
    enabled: true
    caSecret: redis-ca
    caKey: ca.crt
networkPolicy:
  extraEgress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 192.0.2.20/32
      ports:
        - protocol: TCP
          port: 6380
