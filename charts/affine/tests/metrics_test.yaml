# SPDX-License-Identifier: Apache-2.0
suite: AFFiNE native observability
templates:
  - templates/metrics.yaml
tests:
  - it: does not expose metrics by default
    asserts:
      - hasDocuments:
          count: 0
  - it: creates a separate private Service and actual Prometheus CRDs
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Service
        documentIndex: 0
      - isKind:
          of: ServiceMonitor
        documentIndex: 1
      - isKind:
          of: PrometheusRule
        documentIndex: 2
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
        documentIndex: 1
      - equal:
          path: spec.groups[0].rules[0].alert
          value: AFFiNEMetricsUnavailable
        documentIndex: 2
