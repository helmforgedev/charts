# SPDX-License-Identifier: Apache-2.0
suite: AFFiNE services and exposure
templates:
  - templates/service.yaml
tests:
  - it: exposes only application traffic by default
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 3010
              targetPort: http
              protocol: TCP
  - it: preserves dual-stack selection
    set:
      service.ipFamilyPolicy: PreferDualStack
      service.ipFamilies:
        - IPv4
        - IPv6
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - equal:
          path: spec.ipFamilies
          value:
            - IPv4
            - IPv6
