{{- if and (include "appwrite.backupEnabled" .) .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appwrite.backupServiceAccountName" . }}
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- include "appwrite.renderAnnotations" (dict "root" . "specific" .Values.backup.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
