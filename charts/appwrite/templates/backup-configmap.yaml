{{- if include "appwrite.backupEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appwrite.fullname" . }}-backup-scripts
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
  {{- include "appwrite.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  mariadb-backup.sh: |
    #!/bin/sh
    set -eu
    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backup/out/${BACKUP_ARCHIVE_PREFIX}-mariadb-${timestamp}.sql.gz"
    mkdir -p /backup/out
    export MYSQL_PWD="${DB_PASSWORD}"
    mysqldump \
      --host="${DB_HOST}" \
      --port="${DB_PORT}" \
      --user="${DB_USERNAME}" \
      "${DB_NAME}" \
      "$@" | gzip -c > "${archive}"
    printf "%s" "${archive}" > /backup/out/backup-file
  upload-backup.sh: |
    #!/bin/sh
    set -eu
    archive="$(cat /backup/out/backup-file)"
    target="backup/${S3_BUCKET}"
    if [ -n "${S3_PREFIX:-}" ]; then
      target="${target}/${S3_PREFIX}"
    fi
    if [ "${S3_CREDENTIALS_FROM_POD_IDENTITY}" = "true" ]; then
      export MC_HOST_backup="${S3_ENDPOINT}"
      sts_domain="amazonaws.com"
      case "${AWS_REGION}" in
        cn-*) sts_domain="amazonaws.com.cn" ;;
      esac
      export MC_STS_ENDPOINT_backup="https://sts.${AWS_REGION}.${sts_domain}"
    else
      mc --config-dir "${MC_CONFIG_DIR}" alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
    fi
    if [ "${S3_CREATE_BUCKET_IF_NOT_EXISTS}" = "true" ]; then
      if [ "${S3_CREDENTIALS_FROM_POD_IDENTITY}" = "true" ]; then
        mc --config-dir "${MC_CONFIG_DIR}" mb --ignore-existing --region="${AWS_REGION}" "backup/${S3_BUCKET}"
      else
        mc --config-dir "${MC_CONFIG_DIR}" mb --ignore-existing "backup/${S3_BUCKET}"
      fi
    fi
    mc --config-dir "${MC_CONFIG_DIR}" cp "${archive}" "${target}/"
{{- end }}
