{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.appwrite.existingSecret }}
{{- $stored := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "appwrite.fullname" .))) | default dict }}
{{- $data := $stored.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.fullname" . }}-secret
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
type: Opaque
data:
  appwrite-openssl-key: {{ if .Values.appwrite.openSslKeyV1 }}{{ .Values.appwrite.openSslKeyV1 | b64enc | quote }}{{ else }}{{ index $data "appwrite-openssl-key" | default (randAlphaNum 64 | sha256sum | b64enc) | quote }}{{ end }}
  appwrite-jwt-secret: {{ index $data "appwrite-jwt-secret" | default (randAlphaNum 128 | b64enc) | quote }}
  {{- if and .Values.appwrite.smtp.host .Values.appwrite.smtp.password (not .Values.appwrite.smtp.existingSecret) }}
  smtp-password: {{ .Values.appwrite.smtp.password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (eq (include "appwrite.databaseMode" .) "external") (not .Values.database.external.existingSecret) .Values.database.external.rootPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.fullname" . }}-database
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ .Values.database.external.rootPassword | b64enc | quote }}
{{- end }}
{{- if and (eq (include "appwrite.cacheMode" .) "external") (not .Values.cache.external.existingSecret) .Values.cache.external.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.fullname" . }}-redis
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.cache.external.password | b64enc | quote }}
{{- end }}
{{- if and (include "appwrite.backupEnabled" .) (not .Values.backup.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.backupSecretName" . }}
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.existingSecretAccessKeyKey }}: {{ .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.existingSecretSecretKeyKey }}: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
