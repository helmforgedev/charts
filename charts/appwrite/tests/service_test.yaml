# SPDX-License-Identifier: Apache-2.0
suite: service
templates:
  - templates/service.yaml
tests:
  - it: should render three services
    asserts:
      - hasDocuments:
          count: 3

  - it: should render API service as ClusterIP
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-api
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose API on port 80
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-api
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 80
            targetPort: http
            protocol: TCP

  - it: should render console service
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-console
    asserts:
      - isKind:
          of: Service

  - it: should render realtime service
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-realtime
    asserts:
      - isKind:
          of: Service

  - it: should keep the API service port independent from its listener
    set:
      service.port: 8088
      api.containerPort: 18088
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-api
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8088
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: should keep the Console service port independent from its listener
    set:
      console.servicePort: 8089
      console.containerPort: 18089
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-console
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8089
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: should keep the realtime service port independent from its listener
    set:
      realtime.servicePort: 8090
      realtime.containerPort: 18090
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-appwrite-realtime
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8090
      - equal:
          path: spec.ports[0].targetPort
          value: http
