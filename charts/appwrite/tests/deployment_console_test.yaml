# SPDX-License-Identifier: Apache-2.0
suite: deployment-console
templates:
  - templates/deployment-console.yaml
tests:
  - it: should render console Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-appwrite-console
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should use console image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/appwrite/new:1.2.74-self-hosted"

  - it: should have component label
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: console
  - it: should expose Console IV on its official port with same-origin API
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APPWRITE_ENDPOINT_SAME_ORIGIN
            value: "true"

  - it: should always have 1 replica
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should configure the real Console listener on a custom port
    set:
      console.containerPort: 3100
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3100
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "3100"
