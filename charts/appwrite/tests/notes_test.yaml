# SPDX-License-Identifier: Apache-2.0

suite: notes
templates:
  - templates/NOTES.txt
tests:
  - it: prints HTTP URLs when Ingress TLS is not configured
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: appwrite.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - matchRegexRaw:
          pattern: "Console: http://appwrite\\.example\\.com/"
      - notMatchRegexRaw:
          pattern: "Console: https://appwrite\\.example\\.com/"

  - it: prints HTTPS URLs when Ingress TLS is configured
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: appwrite.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: appwrite-tls
          hosts:
            - appwrite.example.com
    asserts:
      - matchRegexRaw:
          pattern: "Console: https://appwrite\\.example\\.com/"
