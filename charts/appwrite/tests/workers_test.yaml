# SPDX-License-Identifier: Apache-2.0
suite: workers
templates:
  - templates/deployment-workers.yaml
  - templates/secret.yaml
tests:
  - it: should render 15 supported worker deployments by default
    template: templates/deployment-workers.yaml
    asserts:
      - hasDocuments:
          count: 15

  - it: should wait for database and redis before starting workers
    template: templates/deployment-workers.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-redis

  - it: should not render disabled worker
    template: templates/deployment-workers.yaml
    set:
      workers:
        jobs:
          enabled: false
    asserts:
      - hasDocuments:
          count: 14
  - it: should use the official worker entrypoint
    template: templates/deployment-workers.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [worker-builds]
