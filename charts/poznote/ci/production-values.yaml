---
persistence:
  data:
    enabled: true
    size: 10Gi

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: notes.example.com
  tls:
    - secretName: notes-tls
      hosts:
        - notes.example.com

pdb:
  enabled: true

networkPolicy:
  enabled: true
  egress:
    enabled: true
    allowDNS: true
