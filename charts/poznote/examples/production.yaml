# SPDX-License-Identifier: Apache-2.0
---
persistence:
  data:
    enabled: true
    storageClass: fast-retain
    size: 20Gi

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: notes.example.com
  tls:
    - secretName: notes-tls
      hosts:
        - notes.example.com

pdb:
  enabled: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    enabled: true
    allowDNS: true
