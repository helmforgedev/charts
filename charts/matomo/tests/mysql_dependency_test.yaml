# SPDX-License-Identifier: Apache-2.0
suite: matomo MySQL dependency contract
templates:
  - charts/mysql/templates/configmap.yaml
  - charts/mysql/templates/statefulset-source.yaml
tests:
  - it: forwards the standalone persistence size to the bundled MySQL PVC
    template: charts/mysql/templates/statefulset-source.yaml
    set:
      mysql:
        architecture: standalone
        standalone:
          persistence:
            size: 11Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 11Gi
