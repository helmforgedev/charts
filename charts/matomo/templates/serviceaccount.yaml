{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matomo.serviceAccountName" . }}
  namespace: {{ include "matomo.namespace" . | quote }}
  labels:
    {{- include "matomo.labels" . | nindent 4 }}
  {{- include "matomo.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
