# SPDX-License-Identifier: Apache-2.0
suite: optional resources
templates:
  - templates/serviceaccount.yaml
  - templates/httproute.yaml
  - templates/externalsecret.yaml
  - templates/extra-manifests.yaml
tests:
  - it: should render a dedicated ServiceAccount
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: should render a Gateway API route to the HTTP Service
    template: templates/httproute.yaml
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: public
          namespace: gateway-system
      gateway.hostnames:
        - git.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-gitea-http
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 3000

  - it: should render an ExternalSecret for admin credentials
    template: templates/externalsecret.yaml
    set:
      admin.existingSecret: gitea-admin
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: platform-secrets
      externalSecrets.data:
        - secretKey: admin-password
          remoteRef:
            key: gitea/admin
            property: password
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: gitea-admin

  - it: should render extra manifests
    template: templates/extra-manifests.yaml
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: gitea-extra
          data:
            owner: platform
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: gitea-extra
