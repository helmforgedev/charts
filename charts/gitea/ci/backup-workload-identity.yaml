# Backup with workload identity ServiceAccount
backup:
  enabled: true
  schedule: "0 3 * * *"
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/gitea-backup
    automountServiceAccountToken: true
  s3:
    endpoint: https://minio.minio.svc:9000
    bucket: gitea-backups
    prefix: gitea
    accessKey: minioadmin
    secretKey: minioadmin
commonAnnotations:
  acme.com/managed-by: helmforge
