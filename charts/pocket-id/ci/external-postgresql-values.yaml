# SPDX-License-Identifier: Apache-2.0
fullnameOverride: pocket-id-external
postgresql:
  enabled: false
database:
  host: fixture-postgresql
  name: pocketid
  username: pocketid
  passwordSecret: fixture-postgresql-auth
  passwordKey: user-password
  caSecret: fixture-postgresql-tls
  type: postgresql
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: fixture-postgresql
      ports:
        - protocol: TCP
          port: 5432
persistence:
  size: 1Gi
