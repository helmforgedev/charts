fullnameOverride: pocket-id-metrics
metrics:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels: {app: pocket-id-monitor}
  serviceMonitor:
    enabled: true
    interval: 5s
    scrapeTimeout: 3s
  prometheusRule:
    enabled: true
persistence:
  size: 1Gi
