# SPDX-License-Identifier: Apache-2.0
fullnameOverride: pocket-id-eso
encryption:
  existingSecret: pocket-id-eso-key
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: pocket-id-eso-key
      spec:
        target:
          template:
            engineVersion: v2
            data:
              encryption-key: '{{ .password | sha256sum }}'
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
persistence:
  size: 1Gi
