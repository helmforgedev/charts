    app.kubernetes.io/part-of: helmforge
    helmforge.dev/runtime-fixture: 'true'
spec:
  serviceName: fixture-postgresql-primary-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: fixture-postgresql
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/part-of: postgresql
      app.kubernetes.io/role: standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: fixture-postgresql
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/part-of: postgresql
        app.kubernetes.io/role: standalone
        helmforge.dev/runtime-fixture: 'true'
      annotations:
        checksum/config: 24fa8409b77bd1c828ed0cd2352ba3907c9d4a900d830061ab9da19597415573
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: tls-volume-permissions
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - '-ec'
            - |
              set -eu
              cp "/tls-source/tls.crt" "/tls-fixed/tls.crt"
              cp "/tls-source/tls.key" "/tls-fixed/tls.key"
              cp "/tls-source/ca.crt" "/tls-fixed/ca.crt"
              chown 999:999 "/tls-fixed/tls.crt" "/tls-fixed/tls.key" "/tls-fixed/ca.crt"
              chmod 0644 "/tls-fixed/tls.crt" "/tls-fixed/ca.crt"
              chmod 0600 "/tls-fixed/tls.key"
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tls-source
              mountPath: /tls-source
              readOnly: true
            - name: tls-fixed
              mountPath: /tls-fixed
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          args:
            - '-c'
            - config_file=/etc/postgresql/generated/postgresql.conf
            - '-c'
            - hba_file=/etc/postgresql/generated/pg_hba.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: pocketid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-postgresql-auth
                  key: postgres-password
            - name: APP_DATABASE
              value: pocketid
            - name: APP_USERNAME
              value: pocketid
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-postgresql-auth
                  key: user-password
            - name: PGSSLMODE
              value: require
            - name: PGSSLROOTCERT
              value: /tls/ca.crt
          livenessProbe:
            exec:
              command:
                - sh
                - '-ec'
                - >-
                  export PGSSLMODE="require"; export PGSSLROOTCERT=/tls/ca.crt;PGPASSWORD="${POSTGRES_PASSWORD}"
                  pg_isready -U postgres -h 127.0.0.1 -p 5432 -d postgres
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - '-ec'
                - >-
                  DATA_DIR="${PGDATA:-/var/lib/postgresql/data/pgdata}"

                  if [ ! -s "${DATA_DIR}/PG_VERSION" ]; then
                    exit 1
                  fi

                  export PGSSLMODE="require"; export PGSSLROOTCERT=/tls/ca.crt;export PGPASSWORD="${POSTGRES_PASSWORD}"

                  if psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1" >/dev/null 2>&1; then
                    if ! psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'postgres'" | grep -qx 1; then
                      createdb -U postgres -h 127.0.0.1 -p 5432 postgres
                    fi
