# SPDX-License-Identifier: Apache-2.0
# Namespace-local Prometheus stack for validating the chart monitoring contract.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocket-id-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pocket-id-monitor
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pocket-id-monitor
subjects:
  - kind: ServiceAccount
    name: pocket-id-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pocket-id-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-id-monitor-config
  labels:
    helmforge.dev/runtime-fixture: "true"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: pocket-id
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: pocket-id
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - replacement: metrics
            target_label: endpoint
  rules.yml: |
    groups:
      - name: pocket-id-metrics.native
        rules:
          - alert: PocketIDMetricsUnavailable
            expr: up{endpoint="metrics"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pocket ID native metrics target is unavailable
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-pocket-id-monitor
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  serviceName: pocket-id-monitor
  replicas: 1
  selector:
    matchLabels:
      app: pocket-id-monitor
  template:
    metadata:
      labels:
        app: pocket-id-monitor
        helmforge.dev/runtime-fixture: "true"
    spec:
      serviceAccountName: pocket-id-monitor
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: pocket-id-monitor-config
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id-monitor
spec:
  selector:
    app: pocket-id-monitor
  ports:
    - name: http
      port: 9090
      targetPort: 9090
