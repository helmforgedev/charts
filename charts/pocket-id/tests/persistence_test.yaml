# SPDX-License-Identifier: Apache-2.0
suite: Pocket ID persistence contract
templates:
  - pvc.yaml
tests:
  - it: retains the chart-created workspace claim
    asserts:
      - equal: { path: "metadata.annotations['helm.sh/resource-policy']", value: keep }
      - equal: { path: spec.resources.requests.storage, value: 5Gi }
      - equal: { path: 'spec.accessModes[0]', value: ReadWriteOnce }
  - it: omits the claim when an existing PVC is selected
    set:
      persistence.existingClaim: restored-pocket-id
    asserts:
      - hasDocuments: { count: 0 }
