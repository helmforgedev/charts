# SPDX-License-Identifier: Apache-2.0
suite: Pocket ID Service contract
templates:
  - service.yaml
tests:
  - it: exposes the configured Service port through the named application target
    set:
      service.port: 8443
      server.port: 1511
    asserts:
      - equal: { path: 'spec.ports[0].port', value: 8443 }
      - equal: { path: 'spec.ports[0].targetPort', value: http }
  - it: renders an explicit dual-stack contract
    set:
      service.ipFamilyPolicy: RequireDualStack
      service.ipFamilies: [IPv6, IPv4]
    asserts:
      - equal: { path: spec.ipFamilyPolicy, value: RequireDualStack }
      - equal: { path: spec.ipFamilies, value: [IPv6, IPv4] }
