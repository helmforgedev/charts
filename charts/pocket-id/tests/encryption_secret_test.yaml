# SPDX-License-Identifier: Apache-2.0
suite: Pocket ID encryption identity contract
templates:
  - encryption-secret.yaml
tests:
  - it: creates a retained encryption Secret by default
    asserts:
      - equal: { path: kind, value: Secret }
      - equal: { path: "metadata.annotations['helm.sh/resource-policy']", value: keep }
      - isNotNull: { path: data.encryption-key }
  - it: omits the generated Secret when an existing Secret is selected
    set:
      encryption.existingSecret: pocket-id-identity
    asserts:
      - hasDocuments: { count: 0 }
