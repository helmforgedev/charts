{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.encryption.existingSecret }}
{{- $name := include "pocket-id.encryptionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $value := .Values.encryption.key | default (get $data .Values.encryption.secretKey | default "" | b64dec) | default (randBytes 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "pocket-id.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.encryption.secretKey }}: {{ $value | b64enc | quote }}
{{- end }}
