{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pocket-id.fullname" . | trunc 55 | trimSuffix "-" }}-metrics
  labels: {{ include "pocket-id.labels" . | nindent 4 }}
spec:
  {{- if .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ .Values.service.ipFamilyPolicy }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies: {{ toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
  selector: {{ include "pocket-id.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pocket-id.fullname" . }}
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{ include "pocket-id.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pocket-id.fullname" . }}
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  groups:
    - name: {{ include "pocket-id.fullname" . }}.native
      rules:
        - alert: PocketIDMetricsUnavailable
          expr: up{namespace={{ .Release.Namespace | quote }},service={{ printf "%s-metrics" (include "pocket-id.fullname" . | trunc 55 | trimSuffix "-") | quote }}} == 0
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Pocket ID native metrics target is unavailable"}
        {{- with .Values.metrics.prometheusRule.additionalRules }}{{ toYaml . | nindent 8 }}{{- end }}
{{- end }}
{{- end }}
