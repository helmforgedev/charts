# SPDX-License-Identifier: Apache-2.0
# Production-oriented NoteDiscovery deployment using a pre-created config
# Secret. See docs/production.md for the required config.yaml structure.
notediscovery:
  allowedOrigins:
    - https://notes.example.com
  debug: false

auth:
  enabled: true
  existingSecret: notediscovery-config
  existingSecretKey: config.yaml

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: notes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: notediscovery-tls
      hosts:
        - notes.example.com

persistence:
  size: 20Gi

pdb:
  enabled: true

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
