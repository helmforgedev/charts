# Production-like authenticated single-replica scenario.
notediscovery:
  allowedOrigins:
    - https://notes.example.com
  debug: false

auth:
  enabled: true
  secretKey: ci-production-session-secret-with-stable-entropy
  password: CiProductionPassword2026!
  sessionMaxAge: 28800

persistence:
  size: 20Gi

pdb:
  enabled: true

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
