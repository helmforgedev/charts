{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (include "ntfy.databaseEnabled" .) (not .Values.ntfy.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntfy.dbSecretName" . }}
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
  {{- with .Values.ntfy.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  database-url: {{ include "ntfy.databaseUrl" . | quote }}
{{- end }}
{{- if and (include "ntfy.adminEnabled" .) (not .Values.ntfy.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntfy.adminSecretName" . }}
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
  {{- with .Values.ntfy.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  username: {{ include "ntfy.adminUsername" . | quote }}
  {{- if .Values.ntfy.admin.password }}
  password: {{ .Values.ntfy.admin.password | quote }}
  {{- else }}
  {{- $secret := (lookup "v1" "Secret" .Release.Namespace (include "ntfy.adminSecretName" .)) }}
  {{- if and $secret $secret.data (hasKey $secret.data (include "ntfy.adminSecretPasswordKey" .)) }}
  password: {{ index $secret.data (include "ntfy.adminSecretPasswordKey" .) | b64dec | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
