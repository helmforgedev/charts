{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ntfy.fullname" . }}-backup
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- include "ntfy.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "ntfy.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- if .Values.backup.s3.credentialsFromPodIdentity }}
          serviceAccountName: {{ include "ntfy.backupServiceAccountName" . }}
          automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
          {{- else }}
          serviceAccountName: {{ include "ntfy.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: archive
              image: {{ .Values.backup.images.archiver | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  ARCHIVE="/backup/{{ .Values.backup.archivePrefix }}-${TIMESTAMP}.tar.gz"
                  echo "Creating archive ${ARCHIVE}..."
                  tar czf "${ARCHIVE}" -C /var/cache/ntfy .
                  echo "Archive created: $(du -h "${ARCHIVE}" | cut -f1)"
              volumeMounts:
                - name: data
                  mountPath: /var/cache/ntfy
                  readOnly: true
                - name: backup-staging
                  mountPath: /backup
                - name: backup-tmp
                  mountPath: /tmp
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
          containers:
            - name: upload
              image: {{ .Values.backup.images.uploader | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                  export MC_HOST_s3="${S3_ENDPOINT}"
                  STS_DOMAIN="amazonaws.com"
                  case "${AWS_REGION}" in
                    cn-*) STS_DOMAIN="amazonaws.com.cn" ;;
                  esac
                  export MC_STS_ENDPOINT_s3="https://sts.${AWS_REGION}.${STS_DOMAIN}"
                  {{- else }}
                  mc alias set s3 "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" --api S3v4
                  {{- end }}
                  {{- if .Values.backup.s3.createBucketIfNotExists }}
                  {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                  mc mb --ignore-existing --region="${AWS_REGION}" "s3/${S3_BUCKET}"
                  {{- else }}
                  mc mb --ignore-existing "s3/${S3_BUCKET}"
                  {{- end }}
                  {{- end }}
                  ARCHIVE=$(ls -t /backup/*.tar.gz | head -1)
                  BASENAME=$(basename "${ARCHIVE}")
                  mc cp "${ARCHIVE}" "s3/${S3_BUCKET}/{{ .Values.backup.s3.prefix }}/${BASENAME}"
                  echo "Uploaded ${BASENAME} to s3/${S3_BUCKET}/{{ .Values.backup.s3.prefix }}/"
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                - name: AWS_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- else }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ntfy.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretAccessKeyKey }}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ntfy.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretSecretKeyKey }}
                {{- end }}
              volumeMounts:
                - name: backup-staging
                  mountPath: /backup
                  readOnly: true
                - name: backup-tmp
                  mountPath: /tmp
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "ntfy.dataClaimName" . }}
            - name: backup-staging
              emptyDir:
                sizeLimit: {{ .Values.backup.scratchSizeLimit }}
            - name: backup-tmp
              emptyDir:
                sizeLimit: {{ .Values.backup.tmpSizeLimit }}
{{- end }}
