apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ntfy.fullname" . }}
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ntfy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ntfy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "ntfy.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or (include "ntfy.databaseEnabled" .) (include "ntfy.adminEnabled" .) }}
      initContainers:
        {{- if include "ntfy.databaseEnabled" . }}
        - name: wait-for-db
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Waiting for database at {{ include "ntfy.dbHost" . }}:{{ include "ntfy.dbPort" . }}..."
              until nc -z -w2 {{ include "ntfy.dbHost" . }} {{ include "ntfy.dbPort" . }}; do
                echo "Database not ready, retrying in 2s..."
                sleep 2
              done
              echo "Database is ready."
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- if include "ntfy.adminEnabled" . }}
        - name: init-admin
          image: {{ include "ntfy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              AUTH_FILE="/var/cache/ntfy/auth.db"
              mkdir -p /var/cache/ntfy
              if [ ! -f "$AUTH_FILE" ]; then
                ntfy serve --auth-file=/var/cache/ntfy/auth.db --listen-http=:18080 &
                PID=$!
                for i in $(seq 1 30); do
                  if [ -f "$AUTH_FILE" ]; then break; fi
                  sleep 1
                done
                kill -TERM $PID 2>/dev/null || true
                wait $PID 2>/dev/null || true
              fi
              if [ ! -f "$AUTH_FILE" ]; then
                echo "ERROR: Failed to initialize $AUTH_FILE within timeout" >&2
                exit 1
              fi
              echo "Bootstrapping admin user '$ADMIN_USER'..."
              NTFY_AUTH_FILE="$AUTH_FILE" ntfy user add --role={{ .Values.ntfy.admin.role | default "admin" | quote }} --ignore-exists "$ADMIN_USER"
          env:
            - name: ADMIN_USER
              {{- if and .Values.ntfy.admin.existingSecret .Values.ntfy.admin.existingSecretUsernameKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ntfy.adminSecretName" . }}
                  key: {{ .Values.ntfy.admin.existingSecretUsernameKey }}
              {{- else }}
              value: {{ include "ntfy.adminUsername" . | quote }}
              {{- end }}
            - name: NTFY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ntfy.adminSecretName" . }}
                  key: {{ include "ntfy.adminSecretPasswordKey" . }}
          volumeMounts:
            - name: data
              mountPath: /var/cache/ntfy
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: ntfy
          image: {{ include "ntfy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            {{- if and .Values.ntfy.enableMetrics .Values.ntfy.metricsListenHttp }}
            - name: metrics
              containerPort: {{ include "ntfy.metricsPort" . }}
              protocol: TCP
            {{- end }}
          env:
            {{- if include "ntfy.databaseEnabled" . }}
            - name: NTFY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ntfy.dbSecretName" . }}
                  key: {{ include "ntfy.dbSecretKey" . }}
            {{- end }}
            {{- with .Values.ntfy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/cache/ntfy
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ntfy.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ntfy.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
