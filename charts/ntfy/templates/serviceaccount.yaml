{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ntfy.serviceAccountName" . }}
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
  {{- include "ntfy.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
{{- end }}
