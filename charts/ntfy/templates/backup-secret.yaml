{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntfy.backupSecretName" . }}
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | default "" | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | default "" | quote }}
{{- end }}
