# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# ntfy Helm Chart - Default Values
# =============================================================================
# Focus: self-hosted push notification service with HTTP-based pub-sub

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# =============================================================================
# Image
# =============================================================================

image:
  # -- ntfy container image
  repository: docker.io/binwiederhier/ntfy
  # -- Image tag
  tag: "v2.31.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================================================
# ntfy Configuration
# =============================================================================

ntfy:
  # -- Public base URL of the instance (e.g. https://ntfy.example.com)
  baseUrl: ""
  # -- Default access for unauthenticated users (read-write, read-only, write-only, deny-all)
  authDefaultAccess: "read-write"
  # -- Initial administrator account created on startup/bootstrap
  admin:
    # -- Enable automatic administrator user creation
    enabled: false
    # -- Admin username
    username: "admin"
    # -- Admin password (auto-generated if empty and no existingSecret provided)
    password: ""
    # -- Role to assign to the user (admin, user)
    role: "admin"
    # -- Existing secret containing admin credentials
    existingSecret: ""
    # -- Key in existing secret containing the admin password
    existingSecretPasswordKey: password
    # -- Key in existing secret containing the admin username (optional)
    existingSecretUsernameKey: ""
    # -- Annotations to add to the chart-managed admin Secret
    annotations: {}
  # -- Enable behind-proxy mode (trust X-Forwarded-For headers)
  behindProxy: true
  # -- Enable Prometheus metrics endpoint at /metrics
  enableMetrics: false
  # -- Separate metrics listen address (e.g. :9090). Empty uses main port.
  metricsListenHttp: ""
  # -- Attachment total size limit per visitor (e.g. 100M)
  attachmentTotalSizeLimit: ""
  # -- Attachment file size limit (e.g. 15M)
  attachmentFileSizeLimit: ""
  # -- Attachment expiry duration (e.g. 3h)
  attachmentExpiryDuration: ""
  # -- Abuse ban-feed configuration for an external fail2ban or equivalent consumer
  banFeed:
    # -- Enable the abuse ban-feed
    enabled: false
    # -- Writable file where confirmed abusive visitors are appended
    file: /var/cache/ntfy/ban.log
    # -- Rolling window used to count weighted strikes per visitor prefix
    window: 10m
    # -- Weighted strikes per window before a visitor prefix is written to the ban file
    threshold: 100
    # -- Per-code weights in KEY:WEIGHT format; longest match wins
    weights:
      - "42909:10"
  # -- Extra server.yml configuration lines (appended to ConfigMap)
  # -- @default -- `""`
  extraConfig: ""
  # -- Extra environment variables for the container
  # -- @default -- `[]`
  extraEnv: []
  # -- Database configuration for message cache, access control, and web push.
  # When enabled, SQLite file options are omitted.
  database:
    # -- Database mode: sqlite | postgresql
    mode: sqlite
    # -- External PostgreSQL configuration (used when postgresql subchart is disabled)
    external:
      host: ""
      port: "5432"
      name: ntfy
      username: ntfy
      password: ""
      # -- Existing secret containing the database password
      existingSecret: ""
      # -- Key in the existing secret containing the password
      existingSecretPasswordKey: password
      # -- Or existing secret containing the full connection URL (e.g. postgres://user:pass@host:5432/db)
      existingSecretUrlKey: database-url
    # -- Legacy existingSecret containing the full PostgreSQL connection URL
    existingSecret: ""
    # -- Key in the legacy existingSecret
    existingSecretKey: database-url
    # -- Deprecated: use postgresql.enabled or database.mode=postgresql instead
    enabled: false

# =============================================================================
# Subcharts
# =============================================================================

postgresql:
  # -- Deploy PostgreSQL as an embedded HelmForge subchart
  enabled: false
  architecture: standalone
  auth:
    database: ntfy
    username: ntfy
    # -- PostgreSQL password (auto-generated if empty)
    password: ""
    existingSecret: ""
    existingSecretUserPasswordKey: user-password

# =============================================================================
# External Secrets Operator
# =============================================================================

externalSecrets:
  # -- Render ExternalSecret resources
  enabled: false
  # -- Default refresh interval for ExternalSecret resources
  refreshInterval: 1h
  # -- ExternalSecret definitions with complete spec blocks
  items: []

# =============================================================================
# Persistence
# =============================================================================

persistence:
  # -- Enable persistence for cache and auth databases
  enabled: true
  # -- Storage size
  size: 2Gi
  # -- Storage class
  storageClass: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Use an existing PVC
  existingClaim: ""

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- ServiceAccount name
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

# =============================================================================
# Service
# =============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP service port
  port: 80
  # -- Annotations for the Service
  annotations: {}
  # -- Service IP family policy: SingleStack | PreferDualStack | RequireDualStack. Empty uses cluster default.
  ipFamilyPolicy: ~
  # -- Service IP families override. Empty uses cluster default.
  ipFamilies: []

# =============================================================================
# Ingress
# =============================================================================

ingress:
  # -- Enable ingress for ntfy
  enabled: false
  # -- Ingress class name (for example: traefik, nginx)
  ingressClassName: traefik
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Ingress hosts
  hosts: []
    # - host: ntfy.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - hosts:
    #     - ntfy.example.com
    #   secretName: ntfy-tls

# =============================================================================
# Gateway API
# =============================================================================

gateway:
  # -- Enable Gateway API HTTPRoute (alternative to Ingress; requires Gateway API CRDs)
  enabled: false
  # -- Annotations for the HTTPRoute
  annotations: {}
  # -- parentRefs pointing to your Gateway resource
  parentRefs: []
  #   - name: envoy
  #     namespace: envoy-gateway
  # -- Hostnames the HTTPRoute matches
  hostnames: []
  # -- Path prefix
  path: /
  # -- Path match type
  pathType: PathPrefix

# =============================================================================
# Probes
# =============================================================================

probes:
  startup:
    enabled: true
    path: /v1/health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    path: /v1/health
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /v1/health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# Metrics (Prometheus)
# =============================================================================

metrics:
  # -- Create a ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    # -- Interval for Prometheus scraping
    interval: 30s
    # -- Additional labels for the ServiceMonitor
    labels: {}

# =============================================================================
# Resources and Security
# =============================================================================

resources: {}

podSecurityContext: {}

securityContext: {}

# =============================================================================
# Scheduling
# =============================================================================

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

podLabels: {}
podAnnotations: {}

# =============================================================================
# Extra
# =============================================================================

extraVolumes: []
extraVolumeMounts: []

# -- Extra manifests to deploy alongside the chart
extraManifests: []

# =============================================================================
# Backup (S3 CronJob)
# =============================================================================
backup:
  # -- Enable S3 backup CronJob for cache, SQLite databases, and attachments
  enabled: false
  # -- Cron schedule (default: daily at 03:00 UTC)
  schedule: "0 3 * * *"
  # -- Suspend the CronJob
  suspend: false
  # -- Concurrency policy
  concurrencyPolicy: Forbid
  # -- Successful job history limit
  successfulJobsHistoryLimit: 3
  # -- Failed job history limit
  failedJobsHistoryLimit: 3
  # -- Backoff limit
  backoffLimit: 1
  # -- Archive filename prefix
  archivePrefix: ntfy

  images:
    # -- Image for creating tar archives
    archiver: docker.io/library/alpine:3.22
    # -- Image for uploading to S3
    uploader: docker.io/helmforge/mc:1.0.0

  # -- Resource requests and limits for backup jobs
  resources: {}

  s3:
    # -- S3-compatible endpoint URL
    endpoint: ""
    # -- S3 bucket name
    bucket: ""
    # -- S3 key prefix
    prefix: ntfy
    # -- Create bucket if it does not exist
    createBucketIfNotExists: true
    # -- Existing secret name containing S3 credentials
    existingSecret: ""
    # -- Secret key for access key in existing secret
    existingSecretAccessKeyKey: access-key
    # -- Secret key for secret key in existing secret
    existingSecretSecretKeyKey: secret-key
    # -- Inline access key
    accessKey: ""
    # -- Inline secret key
    secretKey: ""
