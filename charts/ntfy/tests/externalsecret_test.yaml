# SPDX-License-Identifier: Apache-2.0
suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render ExternalSecrets by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a database ExternalSecret
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: ntfy-database
          spec:
            secretStoreRef:
              name: helmforge-fake-store
              kind: ClusterSecretStore
            target:
              name: ntfy-database
            data:
              - secretKey: database-url
                remoteRef:
                  key: ntfy/database
                  property: url
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: ntfy-database
      - equal:
          path: spec.target.name
          value: ntfy-database
      - equal:
          path: spec.secretStoreRef.name
          value: helmforge-fake-store
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: should default the target name from the item name
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: database
          spec:
            secretStoreRef:
              name: helmforge-fake-store
              kind: ClusterSecretStore
    asserts:
      - equal:
          path: metadata.name
          value: test-ntfy-database
      - equal:
          path: spec.target.name
          value: test-ntfy-database

  - it: should render multiple ExternalSecrets
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: database
          spec:
            secretStoreRef:
              name: helmforge-fake-store
              kind: ClusterSecretStore
        - name: integration
          spec:
            dataFrom:
              - sourceRef:
                  generatorRef:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: Password
                    name: generated-password
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-ntfy-integration
        documentIndex: 1

  - it: should require a store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: ntfy-database
          spec:
            target:
              name: ntfy-database
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.items[0] requires spec.secretStoreRef or a dataFrom sourceRef"
