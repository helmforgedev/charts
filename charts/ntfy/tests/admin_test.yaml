# SPDX-License-Identifier: Apache-2.0
suite: Admin Bootstrap
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
  - templates/configmap.yaml
  - templates/validate.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render admin secret or init container by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: should render admin secret and init container when admin is enabled
    set:
      ntfy.admin.enabled: true
      ntfy.admin.password: "supersecret"
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-admin
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/binwiederhier/ntfy:v2.32.0
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: ADMIN_USER
            value: admin
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: NTFY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-ntfy-admin
                key: password

  - it: should render admin secret with username and password
    template: templates/secret.yaml
    set:
      ntfy.admin.enabled: true
      ntfy.admin.password: "mycustompass"
      ntfy.admin.annotations:
        custom-annotation: "true"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-ntfy-admin
      - equal:
          path: metadata.annotations.custom-annotation
          value: "true"
      - isSubset:
          path: stringData
          content:
            username: admin
            password: mycustompass

  - it: should not render chart admin secret when existingSecret is provided
    template: templates/secret.yaml
    set:
      ntfy.admin.enabled: true
      ntfy.admin.existingSecret: custom-admin-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should reject admin existingSecret when existingSecretPasswordKey is empty
    template: templates/validate.yaml
    set:
      ntfy.admin.enabled: true
      ntfy.admin.existingSecret: custom-admin-secret
      ntfy.admin.existingSecretPasswordKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "ntfy.admin.existingSecretPasswordKey must not be empty when ntfy.admin.existingSecret is configured"
