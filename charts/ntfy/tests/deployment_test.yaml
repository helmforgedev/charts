# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/validate.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment by default
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-ntfy
      - notExists:
          path: 'spec.selector.matchLabels["app.kubernetes.io/component"]'
      - equal:
          path: 'spec.template.metadata.labels["app.kubernetes.io/component"]'
          value: server

  - it: should use Recreate strategy
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should set the correct image
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/binwiederhier/ntfy:v2.32.0

  - it: should pass serve argument
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: serve

  - it: should expose the default unprivileged listener
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 2586
            protocol: TCP

  - it: should configure the process when the container port changes
    template: templates/deployment.yaml
    set:
      containerPorts.http: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should mount config and data volumes
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/ntfy
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/cache/ntfy

  - it: should use PVC for data when persistence enabled
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: test-ntfy-data

  - it: should use emptyDir when persistence disabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir:
              sizeLimit: 1Gi

  - it: should apply the hardened runtime defaults
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.volumes[2].emptyDir.sizeLimit
          value: 128Mi

  - it: should use HTTP health probes
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /v1/health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /v1/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /v1/health

  - it: should have config checksum annotation
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: should load the PostgreSQL URL from an existing Secret
    template: templates/deployment.yaml
    set:
      ntfy.database.enabled: true
      ntfy.database.existingSecret: ntfy-database
      ntfy.database.existingSecretKey: database-url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NTFY_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: ntfy-database
                key: database-url

  - it: should reject PostgreSQL without configuration
    template: templates/validate.yaml
    set:
      ntfy.database.mode: postgresql
    asserts:
      - failedTemplate:
          errorMessage: "PostgreSQL is enabled but neither postgresql.enabled, ntfy.database.existingSecret, nor ntfy.database.external.host is configured"

  - it: should expose containerPort metrics in Deployment when metricsListenHttp is set
    template: templates/deployment.yaml
    set:
      ntfy.enableMetrics: true
      ntfy.metricsListenHttp: ":9090"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: should reject invalid metricsListenHttp without port in validate
    template: templates/validate.yaml
    set:
      ntfy.metricsListenHttp: ":abc"
    asserts:
      - failedTemplate:
          errorMessage: "ntfy.metricsListenHttp must end with a valid port number (1-65535), got: :abc"

  - it: should configure subchart PostgreSQL connection
    template: templates/deployment.yaml
    set:
      postgresql.enabled: true
      postgresql.auth.password: "secret123"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NTFY_DATABASE_URL
            valueFrom:
                secretKeyRef:
                  name: test-ntfy-db
                  key: database-url

  - it: should configure external PostgreSQL host connection
    template: templates/deployment.yaml
    set:
      ntfy.database.mode: postgresql
      ntfy.database.external.host: "postgres.internal"
      ntfy.database.external.password: "secret123"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NTFY_DATABASE_URL
            valueFrom:
                secretKeyRef:
                  name: test-ntfy-db
                  key: database-url

  - it: should render wait-for-db init container when postgresql is enabled
    template: templates/deployment.yaml
    set:
      postgresql.enabled: true
      postgresql.auth.password: "secret123"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/library/busybox:1.37

  - it: should reject a parallel listener environment override
    template: templates/validate.yaml
    set:
      ntfy.extraEnv:
        - name: NTFY_LISTEN_HTTP
          value: ":9000"
    asserts:
      - failedTemplate:
          errorMessage: "ntfy: ntfy.extraEnv must not override NTFY_LISTEN_HTTP; use containerPorts.http"

  - it: should reject a parallel listener config override
    template: templates/validate.yaml
    set:
      ntfy.extraConfig: "listen-http: ':9000'"
    asserts:
      - failedTemplate:
          errorMessage: "ntfy: ntfy.extraConfig must not override listen-http/listen_http; use containerPorts.http"

  - it: should reject a quoted underscore listener config override
    template: templates/validate.yaml
    set:
      ntfy.extraConfig: "'listen_http': ':9000'"
    asserts:
      - failedTemplate:
          errorMessage: "ntfy: ntfy.extraConfig must not override listen-http/listen_http; use containerPorts.http"

  - it: should reject reserved pod selector labels
    template: templates/validate.yaml
    set:
      podLabels:
        app.kubernetes.io/component: custom
    asserts:
      - failedTemplate:
          errorMessage: "ntfy: podLabels must not override reserved selector label app.kubernetes.io/component"
