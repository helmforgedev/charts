# SPDX-License-Identifier: Apache-2.0
suite: Service
templates:
  - templates/service.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-ntfy

  - it: should use port 80
    asserts:
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: http
            protocol: TCP
      - equal:
          path: 'spec.selector["app.kubernetes.io/component"]'
          value: server

  - it: should expose metrics port when enableMetrics and metricsListenHttp are set
    set:
      ntfy.enableMetrics: true
      ntfy.metricsListenHttp: ":9090"
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: metrics
            protocol: TCP
