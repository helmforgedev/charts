# SPDX-License-Identifier: Apache-2.0
suite: ConfigMap
templates:
  - templates/configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a ConfigMap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-ntfy

  - it: should contain server.yml with defaults
    asserts:
      - matchRegex:
          path: data["server.yml"]
          pattern: "listen-http.*:80"
      - matchRegex:
          path: data["server.yml"]
          pattern: "cache-file.*cache.db"
      - matchRegex:
          path: data["server.yml"]
          pattern: "auth-default-access.*read-write"
      - matchRegex:
          path: data["server.yml"]
          pattern: "behind-proxy.*true"
      - notMatchRegex:
          path: data["server.yml"]
          pattern: "ban-file"

  - it: should set base-url when configured
    set:
      ntfy.baseUrl: "https://ntfy.example.com"
    asserts:
      - matchRegex:
          path: data["server.yml"]
          pattern: "base-url.*ntfy.example.com"

  - it: should enable metrics when configured
    set:
      ntfy.enableMetrics: true
    asserts:
      - matchRegex:
          path: data["server.yml"]
          pattern: "enable-metrics.*true"

  - it: should render the abuse ban-feed when enabled
    set:
      ntfy.banFeed.enabled: true
      ntfy.banFeed.file: /var/cache/ntfy/ban.log
      ntfy.banFeed.window: 5m
      ntfy.banFeed.threshold: 20
      ntfy.banFeed.weights:
        - "42909:10"
        - "*:1"
    asserts:
      - matchRegex:
          path: data["server.yml"]
          pattern: "ban-file.*var/cache/ntfy/ban.log"
      - matchRegex:
          path: data["server.yml"]
          pattern: "ban-window.*5m"
      - matchRegex:
          path: data["server.yml"]
          pattern: "ban-threshold: 20"
      - matchRegex:
          path: data["server.yml"]
          pattern: "ban-weights:[\\s\\S]*42909:10"
      - matchRegex:
          path: data["server.yml"]
          pattern: "ban-weights:[\\s\\S]*\\*:1"
