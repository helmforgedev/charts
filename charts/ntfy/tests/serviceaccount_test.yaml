# SPDX-License-Identifier: Apache-2.0
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: should not create a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the dedicated ServiceAccount when enabled
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ntfy
