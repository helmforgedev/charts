persistence:
  enabled: true

backup:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ntfy-backup
  s3:
    endpoint: https://s3.amazonaws.com
    bucket: ntfy-backups
    region: us-east-1
    credentialsFromPodIdentity: true
