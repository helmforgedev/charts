# SPDX-License-Identifier: Apache-2.0
ntfy:
  extraEnv:
    - name: HELMFORGE_TEST_SECRET
      valueFrom:
        secretKeyRef:
          name: ntfy-database
          key: database-url

externalSecrets:
  enabled: true
  items:
    - fullnameOverride: ntfy-database
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: ntfy-database
          creationPolicy: Owner
        data:
          - secretKey: database-url
            remoteRef:
              key: test/password
