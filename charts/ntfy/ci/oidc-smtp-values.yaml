# SPDX-License-Identifier: Apache-2.0
ntfy:
  baseUrl: "https://ntfy.example.com"
oidc:
  enabled: true
  issuerUrl: "https://auth.example.com"
  clientId: "ntfy-client"
  clientSecret: "test-client-secret"
  redirectUrl: "https://ntfy.example.com/oauth/callback"
  logoutRedirectUrl: "https://ntfy.example.com"
  defaultAccess: "read-write"
smtp:
  enabled: true
  senderAddr: "mail.example.com:587"
  senderFrom: "ntfy@example.com"
  senderUser: "ntfy-mailer"
  senderPass: "mailer-password"
  senderVerify: true
