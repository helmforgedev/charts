# SPDX-License-Identifier: Apache-2.0
websocket:
  enabled: true
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: id
      component: hbbs
      hostnames:
        - id.rustdesk.example.com
      parentRefs:
        - name: shared-gateway
          namespace: gateway-system
          sectionName: https
    - name: relay
      component: hbbr
      hostnames:
        - relay.rustdesk.example.com
      parentRefs:
        - name: shared-gateway
          namespace: gateway-system
          sectionName: https
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
