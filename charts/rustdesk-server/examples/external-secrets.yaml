# SPDX-License-Identifier: Apache-2.0
auth:
  existingSecret: rustdesk-identity
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: rustdesk-identity
      spec:
        secretStoreRef:
          name: production-vault
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: id_ed25519
            remoteRef:
              key: production/rustdesk
              property: id_ed25519
          - secretKey: id_ed25519.pub
            remoteRef:
              key: production/rustdesk
              property: id_ed25519.pub
