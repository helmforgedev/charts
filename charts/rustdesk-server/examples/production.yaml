# SPDX-License-Identifier: Apache-2.0
server:
  relayServers:
    - rustdesk.example.com:21117
auth:
  existingSecret: rustdesk-identity
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 192.0.2.0/24
networkPolicy:
  ingressFrom:
    - ipBlock:
        cidr: 192.0.2.0/24
persistence:
  size: 5Gi
