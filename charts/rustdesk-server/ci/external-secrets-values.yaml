# SPDX-License-Identifier: Apache-2.0
auth:
  existingSecret: rustdesk-eso-identity
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: rustdesk-eso-identity
      spec:
        secretStoreRef:
          name: rustdesk-test-store
          kind: SecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: id_ed25519
            remoteRef:
              key: id_ed25519
          - secretKey: id_ed25519.pub
            remoteRef:
              key: id_ed25519.pub
