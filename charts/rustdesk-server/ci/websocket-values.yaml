# SPDX-License-Identifier: Apache-2.0
websocket:
  enabled: true
ingress:
  enabled: true
  rendezvousHost: id.rustdesk.example.test
  relayHost: relay.rustdesk.example.test
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: id
      component: hbbs
      hostnames:
        - id.rustdesk.example.test
      parentRefs:
        - name: shared-gateway
    - name: relay
      component: hbbr
      hostnames:
        - relay.rustdesk.example.test
      parentRefs:
        - name: shared-gateway
