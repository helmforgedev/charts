# SPDX-License-Identifier: Apache-2.0
suite: Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should use an explicitly supplied encryption key
    set:
      metabase.encryptionSecretKey: stable-encryption-key-for-test-123
    asserts:
      - equal:
          path: stringData.encryption-secret-key
          value: stable-encryption-key-for-test-123
        documentIndex: 0
  - it: should render app secret by default
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-metabase-app
        documentIndex: 0

  - it: should not render app secret when existingSecret is set
    set:
      metabase.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should render db secret for external db with inline password
    set:
      postgresql.enabled: false
      database.external.host: db.example.com
      database.external.password: "my-password"
    asserts:
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-metabase-db
        documentIndex: 1
