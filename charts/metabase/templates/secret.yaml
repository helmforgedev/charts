{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.metabase.existingSecret }}
{{- $secretName := printf "%s-app" (include "metabase.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := .Values.metabase.encryptionSecretKey }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "encryption-secret-key" | default "" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-app" (include "metabase.fullname" .) }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-secret-key: {{ $key | default (randAlphaNum 32) | quote }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "metabase.fullname" .) }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "metabase.fullname" .) }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
