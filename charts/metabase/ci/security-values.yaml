# CI: optional disruption and traffic controls
pdb:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

networkPolicy:
  enabled: true
  ingress:
    extraFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
  egress:
    enabled: true
    extraEgress:
      - to:
          - ipBlock:
              cidr: 10.40.0.0/16
        ports:
          - protocol: TCP
            port: 5432
