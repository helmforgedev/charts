# SPDX-License-Identifier: Apache-2.0
database:
  type: postgresql
  existingSecret: atuin-database
externalSecrets:
  enabled: true
  items:
    - name: atuin-database
      spec:
        secretStoreRef:
          name: production
          kind: ClusterSecretStore
        target:
          name: atuin-database
        data:
          - secretKey: db-uri
            remoteRef:
              key: /atuin/database
              property: uri
