# SPDX-License-Identifier: Apache-2.0
suite: Atuin exposure
templates:
  - templates/ingress.yaml
  - templates/gateway-httproute.yaml
tests:
  - it: renders no public route by default
    asserts:
      - hasDocuments: { count: 0 }
  - it: renders ingress
    values:
      - ../ci/ingress-values.yaml
    asserts:
      - isKind: { of: Ingress }
        template: templates/ingress.yaml
  - it: renders HTTPRoute
    values:
      - ../ci/gateway-api-values.yaml
    asserts:
      - isKind: { of: HTTPRoute }
        template: templates/gateway-httproute.yaml
