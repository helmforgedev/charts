# SPDX-License-Identifier: Apache-2.0
suite: Atuin External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: renders no resources by default
    asserts:
      - hasDocuments: { count: 0 }
  - it: preserves the native ExternalSecret spec
    values:
      - ../ci/external-secrets-values.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: atuin-external-fixture
      - equal:
          path: spec.data[0].secretKey
          value: token
      - equal:
          path: spec.refreshInterval
          value: 1h
  - it: defaults the target name to a literal fullname override
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: atuin-runtime
          spec:
            refreshInterval: 15m
            secretStoreRef:
              name: production
              kind: ClusterSecretStore
            data: []
    asserts:
      - equal:
          path: metadata.name
          value: atuin-runtime
      - equal:
          path: spec.target.name
          value: atuin-runtime
      - equal:
          path: spec.refreshInterval
          value: 15m
  - it: rejects an item without a store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            data: []
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true"
  - it: renders multiple items
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: database
          spec:
            secretStoreRef:
              name: production
              kind: ClusterSecretStore
            data: []
        - name: webhook
          spec:
            secretStoreRef:
              name: production
              kind: ClusterSecretStore
            data: []
    asserts:
      - hasDocuments:
          count: 2
