# SPDX-License-Identifier: Apache-2.0
suite: Atuin validation
templates:
  - templates/validate.yaml
tests:
  - it: rejects SQLite replicas
    set:
      replicaCount: 2
    asserts:
      - failedTemplate: { errorMessage: "SQLite requires replicaCount=1" }
  - it: rejects SQLite autoscaling
    set:
      autoscaling.enabled: true
    asserts:
      - failedTemplate: { errorMessage: "autoscaling is not supported with SQLite" }
  - it: requires a Secret for external PostgreSQL
    set:
      database.type: postgresql
    asserts:
      - failedTemplate: { errorMessage: "external PostgreSQL requires database.existingSecret containing the complete URI" }
  - it: accepts bundled PostgreSQL
    set:
      database.type: postgresql
      postgresql.enabled: true
    asserts:
      - hasDocuments: { count: 0 }
  - it: rejects bundled and external PostgreSQL together
    set:
      database.type: postgresql
      database.existingSecret: external-database
      postgresql.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "database.existingSecret cannot be combined with postgresql.enabled=true"
