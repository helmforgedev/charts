# SPDX-License-Identifier: Apache-2.0
suite: Atuin persistence
templates:
  - templates/pvc.yaml
tests:
  - it: creates the SQLite claim
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
  - it: uses an existing claim without creating another
    set:
      persistence.existingClaim: atuin-data
    asserts:
      - hasDocuments:
          count: 0
