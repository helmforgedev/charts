externalSecrets:
  enabled: true
  items:
    - name: atuin-external-fixture
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: atuin-external-fixture
        data:
          - secretKey: token
            remoteRef:
              key: test/token
atuin:
  extraEnv:
    - name: HELMFORGE_ESO_TOKEN
      valueFrom:
        secretKeyRef:
          name: atuin-external-fixture
          key: token
