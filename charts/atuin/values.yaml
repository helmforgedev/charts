# SPDX-License-Identifier: Apache-2.0

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  repository: ghcr.io/atuinsh/atuin
  tag: "18.23.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

atuin:
  openRegistration: false
  path: ""
  maxRecordSize: 1GiB
  logLevel: atuin_server=info
  fakeVersion: ""
  registerWebhook:
    existingSecret: ""
    key: url
    username: ""
  extraEnv: []
  envFrom: []

database:
  type: sqlite
  sqlite:
    path: /config/atuin.db
  existingSecret: ""
  existingSecretKey: db-uri

postgresql:
  enabled: false
  architecture: standalone
  auth:
    database: atuin
    username: atuin
    existingSecret: ""
    existingSecretUserPasswordKey: user-password

databaseUriHelper:
  image:
    repository: docker.io/library/node
    tag: 24.21.0-alpine3.23
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8888
  annotations: {}
  ipFamilyPolicy: ""
  ipFamilies: []

ingress:
  enabled: false
  ingressClassName: traefik
  annotations: {}
  hosts: []
  tls: []

gatewayAPI:
  enabled: false
  httpRoutes: []

metrics:
  enabled: false
  port: 9001
  service:
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

externalSecrets:
  enabled: false
  refreshInterval: 1h
  items: []

probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy: {}
podAnnotations: {}
podLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 60
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

networkPolicy:
  enabled: false
  extraIngress: []
  extraEgress: []

extraVolumes: []
extraVolumeMounts: []
extraContainers: []
extraInitContainers: []
extraManifests: []
