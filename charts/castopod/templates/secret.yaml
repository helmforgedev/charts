{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.analytics.existingSecret }}
{{- $name := printf "%s-analytics" (include "castopod.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
type: Opaque
stringData:
  analytics-salt: {{ include "castopod.persistedSecretValue" (dict "root" . "name" $name "key" "analytics-salt" "value" .Values.analytics.salt "length" 64) | quote }}
{{- end }}
---
{{- if and .Values.castopod.admin.create (not .Values.castopod.admin.existingSecret) }}
{{- $name := include "castopod.adminSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ include "castopod.persistedSecretValue" (dict "root" . "name" $name "key" "admin-password" "value" .Values.castopod.admin.password) | quote }}
{{- end }}
---
{{- if and (not .Values.mariadb.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "castopod.fullname" .) }}
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "castopod.fullname" .) }}
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
