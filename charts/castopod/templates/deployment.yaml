{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- define "castopod.runtimeEnv" -}}
- name: CADDY_HTTP_PORT
  value: {{ .Values.castopod.port | quote }}
- name: HEALTHCHECK_PATH
  value: {{ .Values.probes.path | quote }}
{{- with .Values.castopod.extraEnv }}
{{ toYaml . }}
{{- end }}
{{- end -}}
{{- define "castopod.dataMounts" -}}
- name: data
  mountPath: /var/www/html/writable
- name: data
  mountPath: /var/www/html/public/media
  subPath: public-media
- name: env
  mountPath: /var/www/html/.env
  subPath: .env
  readOnly: true
{{- end -}}
{{- $baseURL := include "castopod.baseURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "castopod.fullname" . }}
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "castopod.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "castopod.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "castopod.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: setup
          image: {{ include "castopod.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + DATABASE_WAIT_TIMEOUT ))
              until php -r 'try { new PDO("mysql:host=".getenv("CP_DATABASE_HOSTNAME").";port=".getenv("CP_DATABASE_PORT").";dbname=".getenv("CP_DATABASE_NAME"), getenv("CP_DATABASE_USERNAME"), getenv("CP_DATABASE_PASSWORD")); } catch (Throwable $e) { exit(1); }'; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Database ${CP_DATABASE_HOSTNAME}:${CP_DATABASE_PORT} not reachable after ${DATABASE_WAIT_TIMEOUT}s" >&2
                  exit 1
                fi
                echo "Waiting for database ${CP_DATABASE_HOSTNAME}:${CP_DATABASE_PORT}..."
                sleep 3
              done
              mkdir -p /mnt/data/public-media
              cp -an /var/www/html/public/media/. /mnt/data/public-media/
              # The upstream bootstrap writes .env, runs migrations, and clears the cache.
              # It does not write the database port, so a patched copy adds it to .env.
              # Its log prints the whole .env, so only non-secret lines are shown.
              sed '/^database.default.DBPrefix=/a database.default.port=${CP_DATABASE_PORT}'                 /etc/s6-overlay/s6-rc.d/bootstrap/prepare-environment.sh > /tmp/prepare-environment.sh
              if ! grep -q '^database.default.port=' /tmp/prepare-environment.sh; then
                echo "Unable to add the database port to the upstream bootstrap script" >&2
                exit 1
              fi
              if ! sh /tmp/prepare-environment.sh > /tmp/prepare.log 2>&1; then
                grep -vE '^[A-Za-z0-9_.]+=' /tmp/prepare.log >&2 || true
                exit 1
              fi
              grep -vE '^[A-Za-z0-9_.]+=' /tmp/prepare.log || true
              cp /var/www/html/.env /mnt/env/.env
              if [ "${CASTOPOD_ADMIN_CREATE}" = "true" ]; then
                if out=$(printf '%s\n%s\n' "$CASTOPOD_ADMIN_PASSWORD" "$CASTOPOD_ADMIN_PASSWORD" | php spark install:create-superadmin -n "$CASTOPOD_ADMIN_USERNAME" -e "$CASTOPOD_ADMIN_EMAIL" 2>&1); then
                  echo "Superadmin ${CASTOPOD_ADMIN_USERNAME} created"
                elif printf '%s' "$out" | grep -q "already created"; then
                  echo "Superadmin already exists; skipped"
                else
                  printf '%s\n' "$out" | grep -vF "$CASTOPOD_ADMIN_PASSWORD" >&2
                  exit 1
                fi
              fi
          env:
            - name: DATABASE_WAIT_TIMEOUT
              value: {{ .Values.setup.databaseWaitTimeoutSeconds | quote }}
            - name: CP_BASEURL
              value: {{ $baseURL | quote }}
            {{- with .Values.castopod.mediaBaseURL }}
            - name: CP_MEDIA_BASEURL
              value: {{ . | quote }}
            {{- end }}
            {{- if hasPrefix "http://" $baseURL }}
            - name: CP_DISABLE_HTTPS
              value: "1"
            {{- end }}
            - name: CP_ADMIN_GATEWAY
              value: {{ .Values.castopod.adminGateway | quote }}
            - name: CP_AUTH_GATEWAY
              value: {{ .Values.castopod.authGateway | quote }}
            - name: CP_DATABASE_HOSTNAME
              value: {{ include "castopod.dbHost" . | quote }}
            - name: CP_DATABASE_PORT
              value: {{ include "castopod.dbPort" . | quote }}
            - name: CP_DATABASE_NAME
              value: {{ include "castopod.dbName" . | quote }}
            - name: CP_DATABASE_USERNAME
              value: {{ include "castopod.dbUsername" . | quote }}
            - name: CP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "castopod.dbSecretName" . }}
                  key: {{ include "castopod.dbSecretPasswordKey" . }}
            - name: CP_ANALYTICS_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "castopod.analyticsSecretName" . }}
                  key: {{ include "castopod.analyticsSecretKey" . }}
            {{- if .Values.redis.enabled }}
            - name: CP_REDIS_HOST
              value: {{ include "castopod.redisHost" . | quote }}
            - name: CP_REDIS_PORT
              value: "6379"
            - name: CP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "castopod.redisSecretName" . }}
                  key: {{ include "castopod.redisSecretKey" . }}
            {{- end }}
            - name: CASTOPOD_ADMIN_CREATE
              value: {{ .Values.castopod.admin.create | quote }}
            {{- if .Values.castopod.admin.create }}
            - name: CASTOPOD_ADMIN_USERNAME
              value: {{ .Values.castopod.admin.username | quote }}
            - name: CASTOPOD_ADMIN_EMAIL
              value: {{ .Values.castopod.admin.email | quote }}
            - name: CASTOPOD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "castopod.adminSecretName" . }}
                  key: {{ include "castopod.adminSecretKey" . }}
            {{- end }}
            {{- include "castopod.runtimeEnv" . | nindent 12 }}
          {{- with .Values.setup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /mnt/data
            - name: env
              mountPath: /mnt/env
      containers:
        - name: castopod
          image: {{ include "castopod.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - frankenphp
            - run
            - --config
            - /etc/frankenphp/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: {{ .Values.castopod.port }}
              protocol: TCP
          env:
            {{- include "castopod.runtimeEnv" . | nindent 12 }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "castopod.dataMounts" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.scheduler.enabled }}
        - name: scheduler
          image: {{ include "castopod.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - supercronic
            - /etc/s6-overlay/s6-rc.d/supercronic/crontab
          env:
            {{- include "castopod.runtimeEnv" . | nindent 12 }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "castopod.dataMounts" . | nindent 12 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "castopod.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: env
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
