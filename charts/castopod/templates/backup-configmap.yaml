{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "castopod.fullname" . }}-backup-scripts
  labels:
    {{- include "castopod.labels" . | nindent 4 }}
  {{- include "castopod.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  writable-backup.sh: |
    #!/bin/sh
    set -eu
    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backup/out/${BACKUP_ARCHIVE_PREFIX}-writable-${timestamp}.tar.gz"
    mkdir -p /backup/out
    tar czf "${archive}" -C /data/writable .
    printf "%s" "${archive}" > /backup/out/backup-file
  upload-backup.sh: |
    #!/bin/sh
    set -eu
    archive="$(cat /backup/out/backup-file)"
    target="backup/${S3_BUCKET}"
    if [ -n "${S3_PREFIX:-}" ]; then
      target="${target}/${S3_PREFIX}"
    fi
    if [ "${S3_CREDENTIALS_FROM_POD_IDENTITY:-false}" = "true" ]; then
      export MC_HOST_backup="${S3_ENDPOINT}"
      sts_domain="amazonaws.com"
      case "${AWS_REGION:-}" in
        cn-*) sts_domain="amazonaws.com.cn" ;;
      esac
      export MC_STS_ENDPOINT_backup="https://sts.${AWS_REGION:-us-east-1}.${sts_domain}"
    else
      mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
    fi
    if [ "${S3_CREATE_BUCKET_IF_NOT_EXISTS}" = "true" ]; then
      if [ "${S3_CREDENTIALS_FROM_POD_IDENTITY:-false}" = "true" ]; then
        mc mb --ignore-existing --region="${AWS_REGION:-us-east-1}" "backup/${S3_BUCKET}"
      else
        mc mb --ignore-existing "backup/${S3_BUCKET}"
      fi
    fi
    mc cp "${archive}" "${target}/"
{{- end }}
