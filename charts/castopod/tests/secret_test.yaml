# SPDX-License-Identifier: Apache-2.0
suite: Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render the analytics and admin secrets by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-castopod-analytics
        documentIndex: 0
      - matchRegex:
          path: stringData.analytics-salt
          pattern: ^[A-Za-z0-9]{64}$
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-castopod-admin
        documentIndex: 1
      - matchRegex:
          path: stringData.admin-password
          pattern: ^[A-Za-z0-9]{32}$
        documentIndex: 1

  - it: should keep explicit analytics salt and admin password
    set:
      analytics.salt: fixed-salt
      castopod.admin.password: fixed-password
    asserts:
      - equal:
          path: stringData.analytics-salt
          value: fixed-salt
        documentIndex: 0
      - equal:
          path: stringData.admin-password
          value: fixed-password
        documentIndex: 1

  - it: should not render chart secrets when existing secrets are used
    set:
      analytics.existingSecret: my-secret
      castopod.admin.existingSecret: my-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render the admin secret when superadmin creation is disabled
    set:
      castopod.admin.create: false
    asserts:
      - hasDocuments:
          count: 1

  - it: should render db secret for external db with inline password
    set:
      mariadb.enabled: false
      database.external.host: db.example.com
      database.external.password: "my-password"
    asserts:
      - equal:
          path: metadata.name
          value: test-castopod-db
        documentIndex: 2
      - equal:
          path: stringData.password
          value: my-password
        documentIndex: 2

  - it: should not render db secret when existingSecret is set
    set:
      mariadb.enabled: false
      database.external.host: db.example.com
      database.external.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 2
