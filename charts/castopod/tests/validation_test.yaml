# SPDX-License-Identifier: Apache-2.0
suite: Validation
templates:
  - templates/validate.yaml
tests:
  - it: should render no validation manifest by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when external database host is missing
    set:
      mariadb.enabled: false
      database.external.password: secret
    asserts:
      - failedTemplate:
          errorMessage: "database.external.host is required when mariadb.enabled is false"

  - it: should fail when external database credentials are missing
    set:
      mariadb.enabled: false
      database.external.host: mariadb.example.com
    asserts:
      - failedTemplate:
          errorMessage: "database.external.password or database.external.existingSecret is required when mariadb.enabled is false"

  - it: should fail when ingress is enabled without hosts
    set:
      ingress.enabled: true
      ingress.hosts: []
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled requires ingress.hosts to contain at least one host"

  - it: should reject an ingress host entry without hostname through the schema
    set:
      ingress.enabled: true
      ingress.hosts:
        - paths:
            - path: /
              pathType: Prefix
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'host'"

  - it: should fail when backup endpoint is missing
    set:
      backup.enabled: true
      backup.s3.bucket: castopod
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail when backup bucket is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.bucket is required when backup.enabled is true"

  - it: should fail when backup access key is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: castopod
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.accessKey or backup.s3.existingSecret is required when backup.enabled is true"

  - it: should fail when backup secret key is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: castopod
      backup.s3.accessKey: access
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.secretKey or backup.s3.existingSecret is required when backup.enabled is true"

  - it: should fail when podLabels override selector labels
    set:
      podLabels:
        app.kubernetes.io/name: custom
    asserts:
      - failedTemplate:
          errorMessage: 'podLabels must not override selector label "app.kubernetes.io/name"'

  - it: should fail on a floating image tag
    set:
      image.tag: latest
    asserts:
      - failedTemplate:
          errorMessage: "image.tag must be a pinned Castopod release; floating tags are not supported"

  - it: should fail when Redis authentication is disabled
    set:
      redis.enabled: true
      redis.auth.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "redis.auth.enabled must be true: Castopod refuses to use Redis without a password"

  - it: should fail when the superadmin email is empty
    set:
      castopod.admin.email: ""
    asserts:
      - failedTemplate:
          errorPattern: "castopod.admin.email"

  - it: should reject a short superadmin password through the schema
    set:
      castopod.admin.password: short
    asserts:
      - failedTemplate:
          errorPattern: "admin/password"

  - it: should reject a base URL with a trailing slash
    set:
      castopod.baseURL: "https://podcast.example.com/"
    asserts:
      - failedTemplate:
          errorPattern: "baseURL"

  - it: should reject a privileged listener port through the schema
    set:
      castopod.port: 80
    asserts:
      - failedTemplate:
          errorPattern: "castopod/port"

  - it: should fail when gatewayAPI is enabled without routes
    set:
      gatewayAPI.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gatewayAPI.httpRoutes must contain at least one route when gatewayAPI.enabled=true"

  - it: should fail when an HTTPRoute has no parentRefs
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - name: public
          hostnames: [podcast.example.com]
    asserts:
      - failedTemplate:
          errorMessage: "every gatewayAPI.httpRoutes[] entry requires parentRefs"

  - it: should reject HTTPRoutes that render the same name
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - parentRefs:
            - name: gw-a
        - parentRefs:
            - name: gw-b
    asserts:
      - failedTemplate:
          errorPattern: "renders the HTTPRoute name"
