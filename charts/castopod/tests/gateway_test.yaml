# SPDX-License-Identifier: Apache-2.0
suite: Gateway API
templates:
  - templates/gateway-httproute.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render HTTPRoutes by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should route to the Castopod Service
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - name: public
          parentRefs:
            - name: shared-gateway
              namespace: gateway-system
          hostnames:
            - podcast.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: test-castopod-public
      - equal:
          path: spec.hostnames[0]
          value: podcast.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: test-castopod
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
