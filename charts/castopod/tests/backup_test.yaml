# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-cronjob.yaml
  - templates/backup-serviceaccount.yaml
  - templates/backup-configmap.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render backup cronjob by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render backup serviceaccount by default
    template: templates/backup-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render backup resources with static credentials
    set:
      backup:
        enabled: true
        s3:
          endpoint: https://s3.example.com
          bucket: backups
          accessKey: minioadmin
          secretKey: minioadmin
    template: templates/backup-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-castopod-backup

  - it: should render backup cronjob with dedicated service account
    set:
      backup:
        enabled: true
        s3:
          endpoint: https://s3.example.com
          bucket: backups
          accessKey: minioadmin
          secretKey: minioadmin
    template: templates/backup-cronjob.yaml
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-castopod-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should support ambient workload identity without static secret
    set:
      backup:
        enabled: true
        s3:
          endpoint: https://s3.amazonaws.com
          bucket: backups
          region: us-east-1
          credentialsFromPodIdentity: true
    template: templates/secret.yaml
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: test-castopod-backup
