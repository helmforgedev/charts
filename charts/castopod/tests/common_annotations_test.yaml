# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/pvc.yaml
tests:
  - it: should add common annotations to deployment
    set:
      commonAnnotations:
        example.com/owner: platform
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: should let service annotations override common annotations
    set:
      commonAnnotations:
        example.com/owner: platform
      service.annotations:
        example.com/owner: networking
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: networking

  - it: should let serviceaccount annotations override common annotations
    set:
      serviceAccount.create: true
      commonAnnotations:
        example.com/owner: platform
      serviceAccount.annotations:
        example.com/owner: identity
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: identity

  - it: should add common annotations to persistent volume claim
    set:
      commonAnnotations:
        example.com/owner: storage
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: storage
