# SPDX-License-Identifier: Apache-2.0
suite: Secret
templates:
  - templates/secret.yaml
tests:
  - it: should generate the secret key and admin password by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx-app
        documentIndex: 0
      - exists:
          path: data["secret-key"]
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-paperless-ngx-admin
        documentIndex: 1
      - exists:
          path: data["admin-password"]
        documentIndex: 1

  - it: should use provided secret values
    set:
      paperless.secretKey: my-secret-key
      paperless.admin.password: my-admin-password
    asserts:
      - equal:
          path: data["secret-key"]
          value: bXktc2VjcmV0LWtleQ==
        documentIndex: 0
      - equal:
          path: data["admin-password"]
          value: bXktYWRtaW4tcGFzc3dvcmQ=
        documentIndex: 1

  - it: should not create secrets that are provided externally
    set:
      paperless.existingSecret: paperless-app
      paperless.admin.existingSecret: paperless-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: should create external database and valkey secrets
    set:
      postgresql.enabled: false
      valkey.enabled: false
      database.external.host: pg.example.internal
      database.external.password: dbpass
      valkey.external.host: valkey.example.internal
      valkey.external.password: valkeypass
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: data["database-password"]
          value: ZGJwYXNz
        documentIndex: 2
      - equal:
          path: data["valkey-password"]
          value: dmFsa2V5cGFzcw==
        documentIndex: 3

  - it: should fail when an external database has no credentials
    set:
      postgresql.enabled: false
      database.external.host: pg.example.internal
    asserts:
      - failedTemplate:
          errorMessage: "database.external.password or database.external.existingSecret is required when database.mode=external"
