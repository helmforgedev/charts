# SPDX-License-Identifier: Apache-2.0
suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
tests:
  - it: should render an ExternalSecret targeting the existing database secret
    set:
      postgresql.enabled: false
      database.external.host: pg.example.internal
      database.external.existingSecret: paperless-db
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: vault
      externalSecrets.data:
        - secretKey: database-password
          remoteRef:
            key: paperless/db
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: paperless-db

  - it: should require an existing database secret to avoid drift
    set:
      externalSecrets.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.enabled requires database.external.existingSecret to be set to prevent credential drift between the chart-managed Secret and the ExternalSecret."
