# SPDX-License-Identifier: Apache-2.0
# Convert Word, Excel, PowerPoint, LibreOffice files and .eml emails.
tika:
  enabled: true

gotenberg:
  enabled: true

persistence:
  media:
    size: 50Gi
  consume:
    # Shared scanner drop folder, for example an NFS or SMB backed claim
    existingClaim: scanner-inbox

paperless:
  consumer:
    # NFS and SMB do not support inotify
    pollingInterval: 60
    recursive: true
