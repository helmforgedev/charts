# SPDX-License-Identifier: Apache-2.0
paperless:
  url: https://paperless.example.com
  timeZone: Europe/Berlin
  ocrLanguage: deu+eng

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: paperless.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: paperless-tls
      hosts:
        - paperless.example.com
