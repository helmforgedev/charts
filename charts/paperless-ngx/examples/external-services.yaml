# SPDX-License-Identifier: Apache-2.0
database:
  mode: external
  external:
    host: postgres.example.internal
    name: paperless
    username: paperless
    existingSecret: paperless-db
  options: "sslmode=require"

postgresql:
  enabled: false

valkey:
  enabled: false
  external:
    host: valkey.example.internal
    existingSecret: paperless-valkey

paperless:
  existingSecret: paperless-app
  admin:
    existingSecret: paperless-admin
