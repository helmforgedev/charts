{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paperless-ngx.serviceAccountName" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  {{- include "paperless-ngx.renderAnnotations" (dict "root" . "context" "serviceAccount") | nindent 2 }}
{{- end }}
