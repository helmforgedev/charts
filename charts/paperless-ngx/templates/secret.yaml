{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.paperless.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.secretKeySecretName" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := include "paperless-ngx.secretKeySecretName" . }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing (not .Values.paperless.secretKey) }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else if .Values.paperless.secretKey }}
  secret-key: {{ .Values.paperless.secretKey | b64enc | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.paperless.admin.enabled (not .Values.paperless.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.adminSecretName" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := include "paperless-ngx.adminSecretName" . }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing (not .Values.paperless.admin.password) }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else if .Values.paperless.admin.password }}
  admin-password: {{ .Values.paperless.admin.password | b64enc | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (eq (include "paperless-ngx.databaseMode" .) "external") (not .Values.database.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-database
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := printf "%s-database" (include "paperless-ngx.fullname" .) }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing (not .Values.database.external.password) }}
  database-password: {{ index $existing.data "database-password" }}
  {{- else if .Values.database.external.password }}
  database-password: {{ .Values.database.external.password | b64enc | quote }}
  {{- else }}
  {{- fail "database.external.password or database.external.existingSecret is required when database.mode=external" }}
  {{- end }}
{{- end }}
{{- if and (eq (include "paperless-ngx.valkeyMode" .) "external") .Values.valkey.external.password (not .Values.valkey.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-valkey
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
data:
  valkey-password: {{ .Values.valkey.external.password | b64enc | quote }}
{{- end }}
