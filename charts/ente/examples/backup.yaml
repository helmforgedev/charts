# PostgreSQL backup to an independent S3 bucket.
backup:
  enabled: true
  schedule: "0 3 * * *"
  s3:
    endpoint: https://backup.ente.test
    bucket: platform-backups
    prefix: ente/postgresql
    existingSecret: ente-backup-s3

# For Amazon S3, replace existingSecret with:
#   region: us-east-1
#   credentialsFromPodIdentity: true
# and configure backup.serviceAccount for IRSA or an EKS Pod Identity association.
