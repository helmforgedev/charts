# SPDX-License-Identifier: Apache-2.0
# Gateway API routes. Configure HTTPS on the referenced listener.
gateway:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  routes:
    - name: museum
      service: museum
      hostnames:
        - api.ente.test
    - name: photos
      service: photos
      hostnames:
        - photos.ente.test
    - name: accounts
      service: accounts
      hostnames:
        - accounts.ente.test
