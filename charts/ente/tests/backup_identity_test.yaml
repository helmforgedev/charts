# SPDX-License-Identifier: Apache-2.0
suite: Ente backup workload identity
templates:
  - templates/backup-cronjob.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret.yaml
  - templates/validate.yaml
tests:
  - it: uses ambient AWS credentials without static Secret references
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ente-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[4].name
          value: AWS_REGION
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: S3_ACCESS_KEY

  - it: creates a dedicated annotated ServiceAccount
    template: templates/backup-serviceaccount.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      commonAnnotations:
        example.com/owner: platform
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ente-backup
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ente-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/ente-backup

  - it: does not create static backup credentials for workload identity
    template: templates/secret.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - hasDocuments:
          count: 2

  - it: requires region for workload identity
    template: templates/validate.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - failedTemplate:
          errorMessage: backup.enabled=true requires backup.s3.region when workload identity is enabled

  - it: requires an existing dedicated ServiceAccount when creation is disabled
    template: templates/validate.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: backup.serviceAccount.name is required when workload identity is enabled and creation is disabled
