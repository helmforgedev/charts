# SPDX-License-Identifier: Apache-2.0
suite: Ente runtime configuration
templates:
  - templates/configmap.yaml
tests:
  - it: renders the default Museum listener for API and worker
    asserts:
      - matchRegex:
          path: data["museum-api.yaml"]
          pattern: "port: 8080"
      - matchRegex:
          path: data["museum-worker.yaml"]
          pattern: "port: 8080"
  - it: renders an overridden Museum listener for API and worker
    set:
      museum.containerPorts.http: 18080
    asserts:
      - matchRegex:
          path: data["museum-api.yaml"]
          pattern: "port: 18080"
      - matchRegex:
          path: data["museum-worker.yaml"]
          pattern: "port: 18080"
