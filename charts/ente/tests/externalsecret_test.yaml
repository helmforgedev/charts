# SPDX-License-Identifier: Apache-2.0
suite: Ente External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: omits ExternalSecrets by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a complete ExternalSecret
    set:
      externalSecrets:
        enabled: true
        items:
          - name: museum
            spec:
              secretStoreRef:
                name: fake
                kind: ClusterSecretStore
              dataFrom:
                - extract:
                    key: ente/museum
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.refreshInterval
          value: 1h
  - it: defaults the target Secret name
    set:
      externalSecrets:
        enabled: true
        items:
          - name: museum
            spec:
              secretStoreRef:
                name: fake
              dataFrom:
                - extract:
                    key: ente/museum
    asserts:
      - equal:
          path: spec.target.name
          value: museum
  - it: rejects duplicate rendered names
    set:
      externalSecrets:
        enabled: true
        items:
          - name: duplicate
            spec:
              secretStoreRef:
                name: fake
              dataFrom:
                - extract:
                    key: one
          - name: duplicate
            spec:
              secretStoreRef:
                name: fake
              dataFrom:
                - extract:
                    key: two
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items render duplicate ExternalSecret name "duplicate"
  - it: requires a store reference
    set:
      externalSecrets:
        enabled: true
        items:
          - spec:
              data:
                - secretKey: encryption-key
                  remoteRef:
                    key: ente
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[0].spec.data[0] requires a store or generator reference when spec.secretStoreRef.name is absent
