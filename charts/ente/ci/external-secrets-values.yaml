# SPDX-License-Identifier: Apache-2.0
museum:
  existingSecret: ente-museum
storage:
  s3:
    existingSecret: ente-s3
externalSecrets:
  enabled: true
  items:
    - name: museum
      spec:
        secretStoreRef:
          name: ente-runtime-fake-store
          kind: SecretStore
        target:
          name: ente-museum
        data:
          - secretKey: encryption-key
            remoteRef:
              key: ente/encryption-key
          - secretKey: hash-key
            remoteRef:
              key: ente/hash-key
          - secretKey: jwt-secret
            remoteRef:
              key: ente/jwt-secret
    - name: s3
      spec:
        secretStoreRef:
          name: ente-runtime-fake-store
          kind: SecretStore
        target:
          name: ente-s3
        data:
          - secretKey: access-key
            remoteRef:
              key: ente/s3-access-key
          - secretKey: secret-key
            remoteRef:
              key: ente/s3-secret-key
