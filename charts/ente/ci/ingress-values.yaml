# SPDX-License-Identifier: Apache-2.0
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: api.ente.test
      service: museum
      paths:
        - path: /
          pathType: Prefix
    - host: photos.ente.test
      service: photos
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ente-tls
      hosts:
        - api.ente.test
        - photos.ente.test
