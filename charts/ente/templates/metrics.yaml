{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ente.fullname" . }}-metrics
  labels:
    {{- include "ente.labels" . | nindent 4 }}
    app.kubernetes.io/component: museum-api
  {{- include "ente.renderAnnotations" (dict "root" . "specific" .Values.metrics.service.annotations) | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.museum.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "ente.componentLabels" (dict "root" . "component" "museum-api") | nindent 4 }}
{{- end }}
