# SPDX-License-Identifier: Apache-2.0
fullnameOverride: ghostfolio
ghostfolio:
  existingSecret: ghostfolio-application
externalSecrets:
  enabled: true
  refreshInterval: 5m
  items:
    - fullnameOverride: ghostfolio-application
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: access-token-salt
            remoteRef:
              key: test/token
          - secretKey: jwt-secret-key
            remoteRef:
              key: test/password
