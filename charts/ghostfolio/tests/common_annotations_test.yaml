# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/gateway-httproute.yaml
release:
  name: test
  namespace: default
tests:
  - it: should add common annotations to chart-owned resources
    set:
      commonAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/deployment.yaml
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/service.yaml

  - it: should let service annotations override common annotations
    template: templates/service.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
      service:
        annotations:
          example.com/owner: networking
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: networking

  - it: should merge common annotations into HTTPRoutes with route precedence
    template: templates/gateway-httproute.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
        example.com/environment: production
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: public
            annotations:
              example.com/owner: networking
            parentRefs:
              - name: public
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: networking
      - equal:
          path: metadata.annotations["example.com/environment"]
          value: production
