# SPDX-License-Identifier: Apache-2.0
suite: External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: renders nothing while disabled
    asserts:
      - hasDocuments: { count: 0 }
  - it: injects refresh interval and defaults the target name
    set:
      externalSecrets.enabled: true
      externalSecrets.refreshInterval: 5m
      externalSecrets.items:
        - name: application
          spec:
            secretStoreRef: { name: production, kind: ClusterSecretStore }
            data:
              - secretKey: jwt-secret-key
                remoteRef: { key: ghostfolio/jwt }
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: spec.refreshInterval, value: 5m }
      - equal: { path: spec.target.name, value: RELEASE-NAME-ghostfolio-application }
  - it: preserves a literal fullname override and explicit target
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: platform-secret
          spec:
            secretStoreRef: { name: production, kind: SecretStore }
            target: { name: ghostfolio-runtime }
            dataFrom: [{ extract: { key: ghostfolio } }]
    asserts:
      - equal: { path: metadata.name, value: platform-secret }
      - equal: { path: spec.target.name, value: ghostfolio-runtime }
  - it: renders multiple resources
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: one
          spec: { secretStoreRef: { name: store, kind: SecretStore }, dataFrom: [{ extract: { key: one } }] }
        - name: two
          spec: { secretStoreRef: { name: store, kind: SecretStore }, dataFrom: [{ extract: { key: two } }] }
    asserts:
      - hasDocuments: { count: 2 }
