# SPDX-License-Identifier: Apache-2.0
suite: Validation
templates:
  - templates/validate.yaml
tests:
  - it: rejects multiple replicas
    set: { replicaCount: 2 }
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: replicaCount must remain 1 because migrations, seed, and cron do not document distributed locking" }
  - it: rejects ambiguous PostgreSQL modes
    set:
      database.external.enabled: true
      database.external.host: pg.internal
      database.external.existingSecret: db
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: database.external.enabled and postgresql.enabled are mutually exclusive" }
  - it: requires an external database Secret
    set:
      postgresql.enabled: false
      database.external.enabled: true
      database.external.host: pg.internal
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: database.external.existingSecret is required" }
  - it: rejects ambiguous Redis modes
    set:
      redis.external.enabled: true
      redis.external.host: redis.internal
      redis.external.existingSecret: redis
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: redis.external.enabled and redis.enabled are mutually exclusive" }
  - it: requires all OIDC credentials
    set: { oidc.enabled: true }
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: oidc.issuer is required when OIDC is enabled" }
  - it: enforces the upstream readiness timeout minimum
    set: { probes.readiness.timeoutSeconds: 4 }
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: probes.readiness.timeoutSeconds must be at least 5 for the upstream Redis health check" }
  - it: rejects simultaneous Ingress and Gateway API exposure
    set:
      ingress.enabled: true
      gatewayAPI.enabled: true
    asserts:
      - failedTemplate: { errorMessage: "ghostfolio: enable either ingress or gatewayAPI, not both" }
