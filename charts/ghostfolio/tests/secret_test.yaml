suite: Application secrets
templates:
  - templates/secret.yaml
tests:
  - it: creates both required random salts by default
    asserts:
      - isKind: { of: Secret }
      - exists: { path: data.access-token-salt }
      - exists: { path: data.jwt-secret-key }
      - equal: { path: type, value: Opaque }
  - it: does not create an application Secret when an existing Secret is configured
    set:
      ghostfolio.existingSecret: managed-ghostfolio
    asserts:
      - hasDocuments: { count: 0 }
  - it: supports custom keys in the generated Secret
    set:
      ghostfolio.accessTokenSaltKey: token_salt
      ghostfolio.jwtSecretKey: jwt_key
    asserts:
      - exists: { path: data.token_salt }
      - exists: { path: data.jwt_key }
