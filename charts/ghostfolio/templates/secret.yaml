{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.ghostfolio.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghostfolio.applicationSecretName" . }}
  labels:
    {{- include "ghostfolio.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $name := include "ghostfolio.applicationSecretName" . }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing (get $existing.data .Values.ghostfolio.accessTokenSaltKey) }}
  {{ .Values.ghostfolio.accessTokenSaltKey }}: {{ get $existing.data .Values.ghostfolio.accessTokenSaltKey }}
  {{- else }}
  {{ .Values.ghostfolio.accessTokenSaltKey }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (get $existing.data .Values.ghostfolio.jwtSecretKey) }}
  {{ .Values.ghostfolio.jwtSecretKey }}: {{ get $existing.data .Values.ghostfolio.jwtSecretKey }}
  {{- else }}
  {{ .Values.ghostfolio.jwtSecretKey }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
