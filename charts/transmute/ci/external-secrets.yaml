auth:
  existingSecret: transmute-ci-auth
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: transmute-ci-auth
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: transmute-ci-auth
          creationPolicy: Owner
        data:
          - secretKey: AUTH_SECRET_KEY
            remoteRef:
              key: test/token
