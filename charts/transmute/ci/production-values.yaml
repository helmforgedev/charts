resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2048Mi
persistence:
  enabled: true
  size: 50Gi
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: transmute.internal.net
      paths:
        - path: /
          pathType: Prefix
