# SPDX-License-Identifier: Apache-2.0
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2048Mi
persistence:
  enabled: true
  size: 50Gi
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: transmute.internal.net
      paths:
        - path: /
          pathType: Prefix
networkPolicy:
  enabled: true
  ingressFrom:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
