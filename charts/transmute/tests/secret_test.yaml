# SPDX-License-Identifier: Apache-2.0
suite: secret contract
templates: [secret.yaml]
tests:
  - it: creates a signing Secret by default
    asserts:
      - isKind: { of: Secret }
      - exists: { path: "stringData.AUTH_SECRET_KEY" }
  - it: uses an explicit signing key
    set: { auth: { secretKey: "12345678901234567890123456789012" } }
    asserts:
      - equal: { path: "stringData.AUTH_SECRET_KEY", value: "12345678901234567890123456789012" }
  - it: stores an inline OIDC client secret
    set:
      config: { appUrl: "https://transmute.example.com" }
      oidc:
        {
          enabled: true,
          issuerUrl: "https://id.example.com",
          clientId: transmute,
          clientSecret: oidc-value,
        }
    asserts:
      - equal: { path: "stringData.OIDC_CLIENT_SECRET", value: oidc-value }
  - it: does not own an existing Secret
    set: { auth: { existingSecret: platform-auth } }
    asserts:
      - hasDocuments: { count: 0 }
