# SPDX-License-Identifier: Apache-2.0
suite: secret tests
templates:
  - secret.yaml
tests:
  - it: should render default secret
    asserts:
      - isKind:
          of: Secret

  - it: should not render secret when existingSecret is specified
    set:
      auth:
        existingSecret: my-pre-existing-secret
    asserts:
      - hasDocuments:
          count: 0
