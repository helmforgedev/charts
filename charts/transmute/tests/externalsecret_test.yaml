suite: External Secrets contract
templates: [externalsecret.yaml]
tests:
  - it: is disabled by default
    asserts: [{ hasDocuments: { count: 0 } }]
  - it: renders a complete item
    set:
      {
        externalSecrets:
          {
            enabled: true,
            items:
              [
                {
                  name: auth,
                  spec:
                    {
                      secretStoreRef: { name: vault, kind: ClusterSecretStore },
                      data:
                        [
                          {
                            secretKey: AUTH_SECRET_KEY,
                            remoteRef: { key: transmute },
                          },
                        ],
                    },
                },
              ],
          },
      }
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: "spec.secretStoreRef.name", value: vault }
      - equal: { path: "spec.target.name", value: RELEASE-NAME-transmute-auth }
  - it: preserves an explicit target name
    set:
      {
        externalSecrets:
          {
            enabled: true,
            items:
              [
                {
                  spec:
                    {
                      secretStoreRef: { name: vault },
                      target: { name: shared-auth },
                    },
                },
              ],
          },
      }
    asserts: [{ equal: { path: "spec.target.name", value: shared-auth } }]
  - it: applies the default refresh interval
    set:
      {
        externalSecrets:
          {
            enabled: true,
            refreshInterval: 15m,
            items: [{ spec: { secretStoreRef: { name: vault } } }],
          },
      }
    asserts: [{ equal: { path: "spec.refreshInterval", value: 15m } }]
  - it: supports multiple items
    set:
      {
        externalSecrets:
          {
            enabled: true,
            items:
              [
                { name: auth, spec: { secretStoreRef: { name: vault } } },
                { name: oidc, spec: { secretStoreRef: { name: vault } } },
              ],
          },
      }
    asserts: [{ hasDocuments: { count: 2 } }]
  - it: rejects duplicate derived resource names
    set:
      externalSecrets:
        enabled: true
        items:
          - spec: { secretStoreRef: { name: vault } }
          - name: auth
            spec: { secretStoreRef: { name: vault } }
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items contains duplicate derived resource name "RELEASE-NAME-transmute-auth"
  - it: rejects unsupported data generator references
    set:
      externalSecrets:
        enabled: true
        items:
          - spec:
              data:
                - secretKey: generated
                  sourceRef: { generatorRef: { name: password } }
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec.secretStoreRef.name, data[].sourceRef.storeRef.name or a supported dataFrom[].sourceRef is required
