suite: external secret tests
templates:
  - externalsecret.yaml
tests:
  - it: should not render external secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render external secret when enabled
    set:
      externalSecrets:
        enabled: true
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        data:
          - secretKey: admin-password
            remoteRef:
              key: secret/transmute
              property: password
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.data[0].secretKey
          value: admin-password
