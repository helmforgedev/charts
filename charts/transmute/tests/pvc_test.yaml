# SPDX-License-Identifier: Apache-2.0
suite: persistence contract
templates: [pvc.yaml]
tests:
  - it: creates a ReadWriteOnce claim
    asserts:
      - isKind: { of: PersistentVolumeClaim }
      - equal: { path: "spec.accessModes[0]", value: ReadWriteOnce }
  - it: requests the configured capacity
    set: { persistence: { size: 50Gi } }
    asserts: [{ equal: { path: "spec.resources.requests.storage", value: 50Gi } }]
  - it: disables dynamic provisioning with dash
    set: { persistence: { storageClass: "-" } }
    asserts: [{ equal: { path: "spec.storageClassName", value: "" } }]
  - it: reuses an existing claim
    set: { persistence: { existingClaim: shared-data } }
    asserts: [{ hasDocuments: { count: 0 } }]
