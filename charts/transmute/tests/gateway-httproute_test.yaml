# SPDX-License-Identifier: Apache-2.0
suite: gateway-httproute tests
templates:
  - gateway-httproute.yaml
tests:
  - it: should not render gateway-httproute by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render canonical gateway-httproute when enabled
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: default
            parentRefs:
              - name: default-gateway
                namespace: gateway-system
            hostnames:
              - transmute.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: default-gateway
      - equal:
          path: spec.hostnames[0]
          value: transmute.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-transmute

  - it: should support custom path rules
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: custom
            parentRefs:
              - name: custom-gateway
            rules:
              - matches:
                  - path:
                      type: Exact
                      value: /api
                backendRefs:
                  - name: custom-backend
                    port: 8080
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: custom-backend
