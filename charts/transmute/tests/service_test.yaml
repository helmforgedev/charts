# SPDX-License-Identifier: Apache-2.0
suite: service contract
templates: [service.yaml]
tests:
  - it: renders a ClusterIP Service
    asserts:
      - isKind: { of: Service }
      - equal: { path: "spec.type", value: ClusterIP }
  - it: routes the configured port to the named container port
    set: { service: { port: 9090 } }
    asserts:
      - equal: { path: "spec.ports[0].port", value: 9090 }
      - equal: { path: "spec.ports[0].targetPort", value: http }
  - it: omits IP family settings by default
    asserts:
      - notExists: { path: "spec.ipFamilyPolicy" }
      - notExists: { path: "spec.ipFamilies" }
  - it: renders SingleStack
    set: { service: { ipFamilyPolicy: SingleStack } }
    asserts: [{ equal: { path: "spec.ipFamilyPolicy", value: SingleStack } }]
  - it: renders PreferDualStack
    set: { service: { ipFamilyPolicy: PreferDualStack } }
    asserts: [{ equal: { path: "spec.ipFamilyPolicy", value: PreferDualStack } }]
  - it: preserves IP family order
    set:
      {
        service: { ipFamilyPolicy: RequireDualStack, ipFamilies: [IPv6, IPv4] },
      }
    asserts:
      - equal: { path: "spec.ipFamilyPolicy", value: RequireDualStack }
      - equal: { path: "spec.ipFamilies", value: [IPv6, IPv4] }
