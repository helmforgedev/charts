suite: serviceaccount tests
templates:
  - serviceaccount.yaml
tests:
  - it: should render default service account
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-transmute

  - it: should not render service account when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
