# SPDX-License-Identifier: Apache-2.0
# Production configuration for Transmute
replicaCount: 1
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi
persistence:
  enabled: true
  size: 50Gi
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: transmute.example.com
      paths:
        - path: /
          pathType: Prefix
