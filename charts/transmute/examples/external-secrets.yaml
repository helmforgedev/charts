# External Secrets Operator configuration
auth:
  existingSecret: transmute-production-auth
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: transmute-production-auth
      spec:
        secretStoreRef:
          name: cluster-vault
          kind: ClusterSecretStore
        target:
          name: transmute-production-auth
          creationPolicy: Owner
        data:
          - secretKey: AUTH_SECRET_KEY
            remoteRef:
              key: secrets/transmute
              property: auth-secret-key
          - secretKey: OIDC_CLIENT_SECRET
            remoteRef:
              key: secrets/transmute
              property: oidc-client-secret
