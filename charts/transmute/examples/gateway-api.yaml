# Gateway API HTTPRoute configuration example for Transmute
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: envoy-gateway
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway-system
      hostnames:
        - transmute.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
