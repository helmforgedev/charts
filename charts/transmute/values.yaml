# SPDX-License-Identifier: Apache-2.0
global: {}

# Transmute stores its users, jobs, uploads and outputs in one local data
# directory backed by SQLite. Horizontal replicas are intentionally unsupported.
replicaCount: 1

image:
  # -- Container image repository for Transmute
  repository: ghcr.io/transmute-app/transmute
  # -- Container image tag (defaults to Chart.appVersion)
  tag: "v2.1.1"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Secrets for pulling images from private registries
imagePullSecrets: []
# -- Override chart name
nameOverride: ""
# -- Override full release name
fullnameOverride: ""
# -- Labels added to every chart resource
commonLabels: {}

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""
  # -- Automount API credentials for a Service Account
  automountServiceAccountToken: false

# -- Annotations to add to the pod metadata
podAnnotations: {}
# -- Labels to add to the pod metadata
podLabels: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

containerPorts:
  # -- HTTP port exposed by the Transmute process
  http: 8080

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Kubernetes Service port
  port: 8080
  # -- Annotations for the Service
  annotations: {}
  # -- IP family policy. Omit for the cluster default.
  # ipFamilyPolicy: PreferDualStack
  # -- Ordered Service IP families. Omit for the cluster default.
  # ipFamilies:
  #   - IPv4
  #   - IPv6

# -- Application runtime configuration
config:
  # -- Public URL used for OIDC callbacks and generated links
  appUrl: ""
  # -- Path to persistent application data
  dataDir: /app/data
  # -- Number of concurrent conversion workers
  conversionWorkerConcurrency: 5
  # -- Minutes before a conversion job is considered stale
  conversionJobStaleAfterMinutes: 60
  # -- Number of concurrent compression workers
  compressionWorkerConcurrency: 5
  # -- Allow conversions that invalidate PDF digital signatures
  invalidatePdfDigitalSignatures: false
  # -- Maximum upload chunk size in bytes; 0 uses the upstream default
  maxChunkSize: 0
  # -- Allow requests without authentication
  allowUnauthenticated: false
  # -- Optional path to a domain authentication configuration file
  domainAuthConfigPath: ""

# -- Authentication settings
auth:
  # -- JWT signing key. Leave empty to generate and preserve a 64-character key in a Secret
  secretKey: ""
  # -- Existing Secret containing the JWT signing key and, when OIDC is enabled, the OIDC client secret
  existingSecret: ""
  # -- Key in auth.existingSecret containing the JWT signing key
  secretKeyKey: AUTH_SECRET_KEY
  # -- JWT signing algorithm
  algorithm: HS256
  # -- Access-token lifetime in minutes
  accessTokenExpireMinutes: 60

# -- OpenID Connect (OIDC) Single Sign-On configuration
oidc:
  # -- Enable OIDC authentication
  enabled: false
  # -- Public issuer URL used for browser redirects and discovery
  issuerUrl: ""
  # -- Optional internal issuer URL used for pod-to-provider communication
  internalUrl: ""
  # -- OIDC Client ID
  clientId: ""
  # -- OIDC client secret; prefer auth.existingSecret in production
  clientSecret: ""
  # -- Key in auth.existingSecret containing the OIDC client secret
  clientSecretKey: OIDC_CLIENT_SECRET
  # -- Label displayed on the SSO button
  displayName: SSO
  # -- Claim used as the local username
  usernameClaim: preferred_username
  # -- Automatically create users after successful OIDC login
  autoCreateUsers: true
  # -- Automatically start OIDC from the authentication page
  autoLaunch: false

ingress:
  # -- Enable ingress record generation
  enabled: false
  # -- Ingress class name
  ingressClassName: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: transmute.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []

# -- Gateway API HTTPRoute configuration
gatewayAPI:
  # -- Enable canonical Gateway API HTTPRoutes
  enabled: false
  # -- Route definitions with parentRefs, hostnames, rules, labels and annotations
  httpRoutes: []

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /api/health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

persistence:
  # -- Enable persistence. Transmute v2 requires this to remain true
  enabled: true
  # -- PVC storage access mode
  accessModes:
    - ReadWriteOnce
  # -- PVC storage request size
  size: 20Gi
  # -- Storage class name (set to '-' to disable dynamic provisioning)
  storageClass: ""
  # -- Annotations for the PVC
  annotations: {}
  # -- Path where volume is mounted inside container
  mountPath: /app/data
  # -- Name of an existing PVC to use
  existingClaim: ""

# -- External Secrets Operator (ESO) integration
externalSecrets:
  # -- Enable ExternalSecret resource creation
  enabled: false
  # -- ExternalSecret API version
  apiVersion: external-secrets.io/v1
  # -- Default refresh interval for items that omit spec.refreshInterval
  refreshInterval: 1h
  # -- ExternalSecret definitions. Each item accepts metadata and a complete spec
  items: []

# -- Additional environment variables
env: []
# -- Additional environment variables from ConfigMaps or Secrets
envFrom: []

# -- Additional volume mounts
volumeMounts: []
# -- Additional volumes
volumes: []

networkPolicy:
  # -- Create a NetworkPolicy for the Transmute pod
  enabled: false
  # -- Peers allowed to connect to the HTTP port; empty allows same-namespace pods
  ingressFrom: []
  # -- Isolate egress. OIDC requires DNS and provider egress rules in extraEgress
  egressIsolation: false
  # -- Explicit egress rules used when egressIsolation is true
  extraEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
