{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "transmute.secretName" . }}
{{- $secretKey := .Values.auth.secretKey | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "transmute.labels" . | nindent 4 }}
type: Opaque
stringData:
  TRANSMUTE_SECRET_KEY: {{ $secretKey | quote }}
  {{- if .Values.auth.initialAdmin.email }}
  INITIAL_ADMIN_EMAIL: {{ .Values.auth.initialAdmin.email | quote }}
  {{- end }}
  {{- if .Values.auth.initialAdmin.password }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.auth.initialAdmin.password | quote }}
  {{- end }}
  {{- if and .Values.oidc.enabled .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
