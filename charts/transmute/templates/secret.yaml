{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "transmute.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $generated := randAlphaNum 64 }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.auth.secretKeyKey) }}
{{- $generated = (index $existing.data .Values.auth.secretKeyKey | b64dec) }}
{{- end }}
{{- $secretKey := .Values.auth.secretKey | default $generated }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "transmute.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeyKey }}: {{ $secretKey | quote }}
  {{- if and .Values.oidc.enabled .Values.oidc.clientSecret }}
  {{ .Values.oidc.clientSecretKey }}: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
