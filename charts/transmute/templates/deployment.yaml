apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transmute.fullname" . }}
  labels:
    {{- include "transmute.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "transmute.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transmute.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "transmute.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: transmute
          image: {{ include "transmute.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: STORAGE_DIR
              value: {{ .Values.config.storageDir | quote }}
            - name: QUEUE_CONCURRENCY
              value: {{ .Values.config.queueConcurrency | quote }}
            - name: JOB_TIMEOUT
              value: {{ .Values.config.jobTimeout | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: ALLOW_REGISTRATION
              value: {{ .Values.auth.allowRegistration | quote }}
            {{- if .Values.auth.enabled }}
            - name: TRANSMUTE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: TRANSMUTE_SECRET_KEY
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: INITIAL_ADMIN_EMAIL
                  optional: true
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: INITIAL_ADMIN_PASSWORD
                  optional: true
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_URL
              value: {{ .Values.oidc.providerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: OIDC_AUTO_REGISTER
              value: {{ .Values.oidc.autoRegister | quote }}
            - name: OIDC_DISABLE_LOCAL_AUTH
              value: {{ .Values.oidc.disableLocalAuth | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "transmute.claimName" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
