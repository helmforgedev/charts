{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transmute.fullname" . }}
  labels:
    {{- include "transmute.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "transmute.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transmute.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "transmute.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: transmute
          image: {{ include "transmute.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPorts.http | quote }}
            - name: HOME
              value: /tmp/home
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: CONVERSION_WORKER_CONCURRENCY
              value: {{ .Values.config.conversionWorkerConcurrency | quote }}
            - name: CONVERSION_JOB_STALE_AFTER_MINUTES
              value: {{ .Values.config.conversionJobStaleAfterMinutes | quote }}
            - name: COMPRESSION_WORKER_CONCURRENCY
              value: {{ .Values.config.compressionWorkerConcurrency | quote }}
            - name: INVALIDATE_PDF_DIGITAL_SIGNATURES
              value: {{ .Values.config.invalidatePdfDigitalSignatures | quote }}
            - name: MAX_CHUNK_SIZE
              value: {{ .Values.config.maxChunkSize | quote }}
            - name: ALLOW_UNAUTHENTICATED
              value: {{ .Values.config.allowUnauthenticated | quote }}
            - name: AUTH_ALGORITHM
              value: {{ .Values.auth.algorithm | quote }}
            - name: AUTH_ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.auth.accessTokenExpireMinutes | quote }}
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: {{ .Values.auth.secretKeyKey }}
            {{- with .Values.config.appUrl }}
            - name: APP_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.domainAuthConfigPath }}
            - name: DOMAIN_AUTH_CONFIG_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            {{- with .Values.oidc.internalUrl }}
            - name: OIDC_INTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "transmute.secretName" . }}
                  key: {{ .Values.oidc.clientSecretKey }}
            - name: OIDC_DISPLAY_NAME
              value: {{ .Values.oidc.displayName | quote }}
            - name: OIDC_USERNAME_CLAIM
              value: {{ .Values.oidc.usernameClaim | quote }}
            - name: OIDC_AUTO_CREATE_USERS
              value: {{ .Values.oidc.autoCreateUsers | quote }}
            - name: OIDC_AUTO_LAUNCH
              value: {{ .Values.oidc.autoLaunch | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "transmute.claimName" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
