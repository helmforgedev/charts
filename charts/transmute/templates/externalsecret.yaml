{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- $seenNames := dict }}
{{- range $index, $item := .Values.externalSecrets.items | default list }}
{{- $name := include "transmute.externalSecretName" (dict "root" $ "item" $item "index" $index) }}
{{- if hasKey $seenNames $name }}{{- fail (printf "externalSecrets.items contains duplicate derived resource name %q" $name) }}{{- end }}
{{- $_ := set $seenNames $name true }}
{{- $spec := deepCopy ($item.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}
{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}
{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}{{- $_ := set $target "name" $name }}{{- $_ := set $spec "target" $target }}{{- end }}
{{- $hasStoreRef := ne (dig "secretStoreRef" "name" "" $spec) "" }}
{{- range ($spec.data | default list) }}{{- if (dig "sourceRef" "storeRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}{{- end }}
{{- range ($spec.dataFrom | default list) }}{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}{{- end }}
{{- if not $hasStoreRef }}{{- fail "externalSecrets.items[].spec.secretStoreRef.name, data[].sourceRef.storeRef.name or a supported dataFrom[].sourceRef is required" }}{{- end }}
---
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "transmute.labels" $ | nindent 4 }}
    {{- with $item.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
