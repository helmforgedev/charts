{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transmute.fullname" . }}
  labels:
    {{- include "transmute.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transmute.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressIsolation }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
  {{- if .Values.networkPolicy.egressIsolation }}
  egress:
    {{- toYaml .Values.networkPolicy.extraEgress | nindent 4 }}
  {{- end }}
{{- end }}
