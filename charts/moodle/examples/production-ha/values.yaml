# SPDX-License-Identifier: Apache-2.0
replicaCount: 3
moodle:
  wwwroot: https://learn.example.com
  sslProxy: true
  existingSecret: learning-admin
persistence:
  existingClaim: learning-rwx
  accessModes:
    - ReadWriteMany
postgresql:
  enabled: false
database:
  connectTimeout: 600
  host: postgres.learning.svc.cluster.local
  existingSecret: learning-db
  sslMode: verify-full
  tlsSecret: learning-db-ca
sessions:
  enabled: true
  host: redis.learning.svc.cluster.local
  existingSecret: learning-redis
pdb:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
