# SPDX-License-Identifier: Apache-2.0
# The single-node lab exercises concurrent readers/writers on one shared claim.
# It does not certify a production multi-node RWX CSI implementation.
replicaCount: 2
persistence:
  existingClaim: moodle-shared-data
  accessModes: [ReadWriteMany]
sessions:
  enabled: true
redis:
  enabled: true
pdb:
  enabled: true
