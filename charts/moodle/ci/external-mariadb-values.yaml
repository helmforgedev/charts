# SPDX-License-Identifier: Apache-2.0
postgresql:
  enabled: false
database:
  type: mariadb
  host: moodle-external-mariadb
  port: 3307
  existingSecret: moodle-external-mariadb
  existingSecretPasswordKey: application-password
  mysqlSslMode: verify-full
  tlsSecret: moodle-external-mariadb
  connectTimeout: 600
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
networkPolicy:
  enabled: true
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: moodle-external-mariadb
      ports:
        - {port: 3307, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: moodle-monitor
      ports:
        - {port: 9090, protocol: TCP}
