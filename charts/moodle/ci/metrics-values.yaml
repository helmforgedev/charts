# SPDX-License-Identifier: Apache-2.0
containerPorts:
  http: 18080
service:
  port: 18081
metrics:
  enabled: true
  port: 19090
  prometheusRule:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
networkPolicy:
  enabled: true
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: moodle-monitor
      ports:
        - {port: 9090, protocol: TCP}
