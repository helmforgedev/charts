# SPDX-License-Identifier: Apache-2.0
metrics:
  enabled: true
  prometheusRule:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
networkPolicy:
  enabled: true
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: moodle-monitor
      ports:
        - {port: 9090, protocol: TCP}
