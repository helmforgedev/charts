apiVersion: v1
kind: Service
metadata:
  name: moodle-external-mysql
spec:
  selector:
    app: moodle-external-mysql
  ports:
    - {name: database, port: 3307, targetPort: 3307}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-external-mysql
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodle-external-mysql
  template:
    metadata:
      labels:
        app: moodle-external-mysql
        helmforge.dev/runtime-fixture: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: database
          image: docker.io/library/mysql:9.7.2
          args: [--port=3307, --ssl-ca=/tls/ca.crt, --ssl-cert=/tls/tls.crt, --ssl-key=/tls/tls.key, --require-secure-transport=ON]
          env:
            - {name: MYSQL_DATABASE, value: moodle}
            - {name: MYSQL_USER, value: moodle}
            - {name: MYSQL_ROOT_PASSWORD, value: HelmForgeLabRoot-Only-27}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: moodle-external-mysql, key: application-password}
          readinessProbe:
            exec:
              command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --host=127.0.0.1 --port=3307 --user=moodle --ssl-ca=/tls/ca.crt --ssl-mode=VERIFY_IDENTITY --execute="SELECT 1" moodle']
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: moodle-external-mysql
---
# SPDX-License-Identifier: Apache-2.0
# Requires the Prometheus Operator in the HelmForge lab. Namespace-local test stack.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moodle-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moodle-monitor
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moodle-monitor
subjects:
  - kind: ServiceAccount
    name: moodle-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moodle-monitor
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: moodle-monitor
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  version: v3.14.0
  image: quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
  replicas: 1
  serviceAccountName: moodle-monitor
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/name: moodle
  ruleSelector:
    matchLabels:
      app.kubernetes.io/name: moodle
  scrapeInterval: 15s
  scrapeTimeout: 10s
  evaluationInterval: 15s
  retention: 1h
  podMetadata:
    labels:
      app: moodle-monitor
      helmforge.dev/runtime-fixture: "true"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
  storage:
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: moodle-monitor
spec:
  selector:
    prometheus: moodle-monitor
  ports:
    - name: http
      port: 9090
      targetPort: 9090
