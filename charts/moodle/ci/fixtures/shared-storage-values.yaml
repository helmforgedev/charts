# Local-path lab fixture: RWO allows multiple consumers on the same node.
# Production requires a real RWX claim; do not deploy this fixture in production.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-shared-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
