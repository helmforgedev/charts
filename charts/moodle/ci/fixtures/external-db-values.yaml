# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: moodle-external-db
spec:
  selector:
    app: moodle-external-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-external-db
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodle-external-db
  template:
    metadata:
      labels:
        app: moodle-external-db
        helmforge.dev/runtime-fixture: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: prepare-tls
          image: docker.io/library/postgres:18.6-trixie
          command: [sh, -ec, 'cp /source/tls.crt /source/tls.key /tls/; chmod 600 /tls/tls.key']
          volumeMounts:
            - {name: tls-source, mountPath: /source, readOnly: true}
            - {name: tls, mountPath: /tls}
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie
          args: [postgres, -c, ssl=on, -c, ssl_cert_file=/tls/tls.crt, -c, ssl_key_file=/tls/tls.key]
          env:
            - {name: POSTGRES_DB, value: moodle}
            - {name: POSTGRES_USER, value: moodle}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: moodle-external-db, key: password}
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, moodle, -d, moodle]
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          emptyDir: {}
        - name: tls-source
          secret:
            secretName: moodle-external-db
---
