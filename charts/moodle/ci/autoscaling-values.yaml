fullnameOverride: moodle
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
sessions:
  enabled: true
redis:
  enabled: true
  architecture: standalone
