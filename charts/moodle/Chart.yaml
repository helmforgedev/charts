# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: moodle
description: Moodle LMS with immutable upstream code, serialized installation, PostgreSQL and managed cron
type: application
version: 1.0.0
appVersion: "5.2.2"
kubeVersion: ">=1.26.0-0"
home: https://helmforge.dev/docs/charts/moodle
icon: https://helmforge.dev/icons/charts/moodle.png
sources:
  - https://github.com/helmforgedev/charts/tree/main/charts/moodle
  - https://github.com/moodle/moodle
  - https://github.com/moodlehq/moodle-php-apache
keywords: [moodle, lms, education, php, kubernetes]
maintainers:
  - name: helmforgedev
  - name: mberlofa
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: add production chart with authenticated prometheus monitoring (#1156)"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/prerelease: "false"
  helmforge.dev/maturity: stable
  helmforge.dev/signed: gpg+cosign
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
  artifacthub.io/links: |
    - name: Official Website
      url: https://moodle.org
    - name: Documentation
      url: https://helmforge.dev/docs/charts/moodle
    - name: Source
      url: https://github.com/helmforgedev/charts/tree/main/charts/moodle
    - name: support
      url: https://github.com/helmforgedev/charts/issues
dependencies:
  - name: postgresql
    version: 2.0.5
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 2.0.1
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
