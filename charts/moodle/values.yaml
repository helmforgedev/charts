# SPDX-License-Identifier: Apache-2.0
# -- Override the chart name.
nameOverride: ""
# -- Override resource names.
fullnameOverride: ""
# -- Additional resource labels; selector labels are reserved.
commonLabels: {}
# -- Number of web pods; multiple replicas require RWX and Redis sessions.
replicaCount: 1
# -- Official PHP/Apache runtime, separately pinned from the Moodle code.
image:
  # -- Image repository; custom images must contain the same PHP/Apache tools.
  repository: docker.io/moodlehq/moodle-php-apache
  # -- Human-readable PHP variant; digest pins the actual bytes.
  tag: 8.4-bookworm
  # -- Multi-architecture manifest digest.
  digest: sha256:922af51668352004b4255cdc1f726a63f0cee7c1354eaf66dd8d5f2c7cc379b5
  # -- Container image pull policy.
  pullPolicy: IfNotPresent
# -- Registry credentials.
imagePullSecrets: []
# -- Immutable Moodle code distribution, prepared once per pod.
source:
  # -- archive downloads a verified release; image copies code baked into image.path.
  mode: archive
  # -- Official release archive or an HTTPS mirror of identical bytes.
  url: https://download.moodle.org/download.php/direct/stable502/moodle-5.2.2.tgz
  # -- SHA-256 of the archive; verified before extraction.
  sha256: 72be209e7c0f5341b87de0bc993b2430087fda2769d8c3cc2f32736d1513e88c
  # -- Source directory in a custom image when mode=image.
  imagePath: /opt/moodle
  # -- Maximum HTTPS download time per attempt in seconds.
  downloadTimeout: 180
# -- Moodle application settings.
moodle:
  # -- Public URL without trailing slash. Set the real HTTPS URL in production.
  wwwroot: http://localhost:8080
  # -- Full site name used only on first installation.
  siteName: Moodle Learning Platform
  # -- Short site name used only on first installation.
  shortName: Moodle
  # -- Installation language. Non-English language packs require upstream egress.
  language: en
  # -- Administrative account name used only on first installation.
  adminUser: admin
  # -- Administrative contact email.
  adminEmail: admin@example.com
  # -- Inline bootstrap password; generated and preserved when empty.
  adminPassword: ""
  # -- Existing bootstrap secret. Password changes do not reset an installed account.
  existingSecret: ""
  # -- Bootstrap secret password key.
  existingSecretPasswordKey: admin-password
  # -- Enable automated first installation into an empty application database.
  autoInstall: true
  # -- Allow TLS termination at a trusted proxy; pair with HTTPS wwwroot.
  sslProxy: false
  # -- Enable only when proxy rewrites Host; ordinary Ingress preserves Host.
  reverseProxy: false
  # -- Disable browser-based plugin installation and code updates.
  disableUpdateAutodeploy: true
  # -- Disable outgoing email, useful in restored or staging environments.
  noEmailEver: false
  # -- Site timezone, configured consistently for PHP and Moodle.
  timezone: UTC
  # -- Additional config.php statements before Moodle setup; trusted administrator code.
  extraConfig: ""
  # -- Extra environment variables for PHP workloads, including cron.
  extraEnv: []
  # -- Extra environment sources for PHP workloads.
  extraEnvFrom: []
# -- Application database connection; disable every database subchart for an external server.
database:
  # -- Backend: postgresql, mysql or mariadb. Changing an installed site's backend requires a separate data migration.
  type: postgresql
  # -- External database hostname; ignored when the selected subchart is enabled.
  host: ""
  # -- External database port; zero selects 5432 for PostgreSQL or 3306 for MySQL/MariaDB.
  port: 0
  # -- External database name.
  name: moodle
  # -- External database user.
  username: moodle
  # -- External database password Secret, required when all database subcharts are disabled.
  existingSecret: ""
  # -- Password key in the external Secret.
  existingSecretPasswordKey: password
  # -- Moodle table prefix; at most ten alphanumeric/underscore characters.
  prefix: mdl_
  # -- PostgreSQL libpq SSL mode; use verify-full with a CA for external PostgreSQL.
  sslMode: prefer
  # -- MySQL/MariaDB TLS mode: disable, require (encryption only), or verify-full (CA and hostname).
  mysqlSslMode: disable
  # -- MySQL/MariaDB collation; Unicode utf8mb4 is required for full Moodle character support.
  collation: utf8mb4_unicode_ci
  # -- Optional Secret containing the database CA certificate.
  tlsSecret: ""
  # -- CA certificate key in database.tlsSecret.
  tlsCAKey: ca.crt
  # -- Maximum wait for authenticated DB connectivity and installer lock.
  connectTimeout: 180
# -- Bundled HelmForge PostgreSQL; full subchart values may be overridden.
postgresql:
  # -- Deploy PostgreSQL.
  enabled: true
  # -- Standalone or replication; external database is recommended for managed HA.
  architecture: standalone
  # -- Database bootstrap credentials.
  auth:
    # -- Initial database name.
    database: moodle
    # -- Initial application user.
    username: moodle
    # -- Application password; generated by the subchart when empty.
    password: ""
    # -- Existing PostgreSQL credentials Secret.
    existingSecret: ""
    # -- Application password key.
    existingSecretUserPasswordKey: user-password
# -- Bundled HelmForge MySQL; full subchart values may be overridden.
mysql:
  # -- Deploy MySQL; requires database.type=mysql and the other database subcharts disabled.
  enabled: false
  # -- Standalone or replication; the Moodle connection always targets the writable Service.
  architecture: standalone
  # -- Application bootstrap credentials.
  auth:
    # -- Initial database name.
    database: moodle
    # -- Initial application user.
    username: moodle
    # -- Application password; generated by the subchart when empty.
    password: ""
    # -- Existing MySQL credentials Secret.
    existingSecret: ""
    # -- Application password key.
    existingSecretUserPasswordKey: mysql-user-password
# -- Bundled HelmForge MariaDB; full subchart values may be overridden.
mariadb:
  # -- Deploy MariaDB; requires database.type=mariadb and the other database subcharts disabled.
  enabled: false
  # -- Standalone or replication; the Moodle connection always targets the writable Service.
  architecture: standalone
  # -- Application bootstrap credentials.
  auth:
    # -- Initial database name.
    database: moodle
    # -- Initial application user.
    username: moodle
    # -- Application password; generated by the subchart when empty.
    password: ""
    # -- Existing MariaDB credentials Secret.
    existingSecret: ""
    # -- Application password key.
    existingSecretUserPasswordKey: mariadb-user-password
# -- Redis session options; independent of Moodle MUC cache mappings.
sessions:
  # -- Use Redis sessions; requires bundled Redis or an external Redis endpoint.
  enabled: false
  # -- External Redis hostname.
  host: ""
  # -- External Redis port.
  port: 6379
  # -- Redis logical database dedicated to Moodle sessions.
  database: 0
  # -- Key prefix; isolate each Moodle installation.
  prefix: moodle_session_
  # -- External Redis password Secret; empty permits unauthenticated external Redis.
  existingSecret: ""
  # -- Redis password key.
  existingSecretPasswordKey: redis-password
  # -- Optional Secret containing CA for Redis TLS.
  tlsSecret: ""
  # -- Redis CA certificate key.
  tlsCAKey: ca.crt
  # -- Maximum time to acquire a session lock in seconds.
  acquireLockTimeout: 120
  # -- Session lock expiration in seconds.
  lockExpire: 7200
# -- Optional HelmForge Redis subchart for sessions.
redis:
  # -- Deploy Redis; also set sessions.enabled=true.
  enabled: false
  # -- Supported bundled topology: standalone.
  architecture: standalone
  # -- Redis authentication options.
  auth:
    # -- Require Redis authentication.
    enabled: true
    # -- Inline Redis password, generated when empty.
    password: ""
    # -- Existing Redis credentials Secret.
    existingSecret: ""
    # -- Password key.
    existingSecretPasswordKey: redis-password
# -- Persistent Moodle data, always outside the web root.
persistence:
  # -- Enable persistent moodledata. Disable only for disposable tests.
  enabled: true
  # -- Existing data claim; accessModes must describe its real capabilities.
  existingClaim: ""
  # -- Storage class; empty uses cluster default, '-' disables dynamic class selection.
  storageClass: ""
  # -- Use ReadWriteMany for multiple web replicas.
  accessModes: [ReadWriteOnce]
  # -- Requested data capacity.
  size: 10Gi
  # -- Retain chart-created data PVC when uninstalling.
  retain: true
  # -- Additional PVC annotations.
  annotations: {}
# -- PHP runtime configuration.
php:
  # -- Memory limit for each PHP process; align with pod concurrency/resources.
  memoryLimit: 256M
  # -- Maximum uploaded file size.
  uploadMaxFilesize: 64M
  # -- Maximum POST size, at least uploadMaxFilesize.
  postMaxSize: 64M
  # -- Moodle requires at least 5000 form input variables.
  maxInputVars: 5000
  # -- HTTP execution time limit; CLI tasks are not constrained by this value.
  maxExecutionTime: 300
  # -- Additional PHP INI directives.
  extraIni: ""
# -- Apache prefork concurrency; each child may consume php.memoryLimit.
apache:
  # -- Maximum concurrent PHP requests per web pod.
  maxRequestWorkers: 8
# -- Cron sidecar shares code and data with its web pod, including RWO storage.
cron:
  # -- Run scheduled Moodle tasks; Moodle database locks coordinate multiple pods.
  enabled: true
  # -- Interval between invocations; a running task is never overlapped in the same pod.
  interval: 60
  # -- Cron container requests and limits.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
# -- Additional ad-hoc task processing in a separate sidecar.
adhoc:
  # -- Enable a dedicated ad-hoc worker; normal cron already handles ad-hoc tasks.
  enabled: false
  # -- Upstream keep-alive duration in seconds.
  keepAlive: 55
  # -- Worker requests and limits.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
# -- Explicit maintenance window; stops web/task pods before running an operator-requested job.
maintenance:
  # -- Scale web pods to zero and run the selected maintenance action.
  enabled: false
  # -- Unique operation identifier. Change for each operation to create a new Job.
  runId: manual-1
  # -- Upstream CLI operation: upgrade, checks, purge-caches, enable, or disable.
  action: checks
  # -- Maximum execution time; unsuccessful upgrades stay in maintenance.
  activeDeadlineSeconds: 1800
# -- Optional authenticated Moodle application metrics through tool_monitoring.
metrics:
  # -- Install/configure the plugin and expose a private metrics listener.
  enabled: false
  # -- Existing Secret containing the bearer token; empty generates a retained Secret.
  existingSecret: ""
  # -- Key containing a nonempty token in the metrics Secret.
  existingSecretTokenKey: token
  # -- Upstream plugin distribution; keep installed plugins through maintenance operations.
  plugin:
    # -- archive downloads pinned source; image requires the plugin in the application image.
    mode: archive
    # -- Immutable upstream tool_monitoring 1.1.0 archive.
    url: https://codeload.github.com/daniil-berg/moodle-tool_monitoring/tar.gz/23c45f66b6c3ed409b0749017b3387c1744016cc
    # -- SHA-256 checked before extracting plugin code.
    sha256: dc7a5256e93e10b0514fcb752767e2554b7aa0cd24e8c8d74e54c33b358028e1
  # -- Built-in metrics managed by Helm; custom plugin metrics remain administrator-managed.
  enabledMetrics: [courses, overdue_tasks, quiz_attempts_in_progress, user_accounts, users_online]
  # -- Prometheus Operator discovery; requires its CRDs and an existing Prometheus instance.
  serviceMonitor:
    # -- Create an authenticated ServiceMonitor for the private metrics Service.
    enabled: false
    # -- Labels matching the Prometheus serviceMonitorSelector.
    labels: {}
    # -- Extra ServiceMonitor annotations.
    annotations: {}
    # -- Scrape interval; metrics query Moodle's database.
    interval: 60s
    # -- Per-scrape timeout, lower than interval.
    scrapeTimeout: 20s
    # -- Target relabeling rules.
    relabelings: []
    # -- Metric relabeling rules; avoid summing global Moodle counts across web replicas.
    metricRelabelings: []
  # -- Allowed metrics clients when NetworkPolicy is enabled; empty permits any client on port 9090.
  ingressFrom: []
  # -- Optional alerts evaluated by an existing Prometheus Operator stack.
  prometheusRule:
    # -- Create scrape availability and persistent overdue-task alerts; requires ServiceMonitor.
    enabled: false
    # -- Labels matching the Prometheus ruleSelector.
    labels: {}
    # -- How long all scrape targets must be missing or down before alerting.
    unavailableFor: 5m
    # -- How long overdue tasks must remain present before alerting.
    overdueTasksFor: 15m
# -- Outbound SMTP settings.
smtp:
  # -- SMTP server hostname with optional port, for example smtp.example.com:587.
  hosts: ""
  # -- Transport security: empty, tls, or ssl.
  security: tls
  # -- SMTP user.
  username: ""
  # -- Secret containing SMTP password.
  existingSecret: ""
  # -- SMTP password key.
  existingSecretPasswordKey: smtp-password
  # -- Sender address for automated notifications.
  noReplyAddress: noreply@example.com
# -- Web container resources.
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
# -- Source preparation and installation resources.
initResources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}
# -- Pod filesystem ownership and seccomp.
podSecurityContext:
  runAsUser: 33
  runAsGroup: 33
  runAsNonRoot: true
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}
# -- Container hardening applied to web, init, cron and worker.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
# -- Grace period for Apache and in-flight tasks before Kubernetes terminates pods.
terminationGracePeriodSeconds: 120
# -- Pod labels; selector labels are reserved.
podLabels: {}
# -- Pod annotations.
podAnnotations: {}
# -- Node placement.
nodeSelector: {}
# -- Node taint tolerations.
tolerations: []
# -- Pod affinity and anti-affinity.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Scheduling priority class.
priorityClassName: ""
# -- Extra volumes for CA certificates or trusted extensions.
extraVolumes: []
# -- Extra mounts shared by PHP containers.
extraVolumeMounts: []
# -- Dedicated service account configuration.
serviceAccount:
  # -- Create the account.
  create: true
  # -- Account name override.
  name: ""
  # -- Account annotations.
  annotations: {}
# -- Web service options.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port; Apache listens on unprivileged 8080.
  port: 80
  # -- Service annotations.
  annotations: {}
  # -- Optional IP family policy; omitted for cluster default.
  # ipFamilyPolicy: PreferDualStack
  # -- Optional ordered IP families.
  # ipFamilies: [IPv4, IPv6]
# -- Ingress configuration; configure moodle.wwwroot consistently.
ingress:
  # -- Render an Ingress.
  enabled: false
  # -- Ingress controller class.
  ingressClassName: ""
  # -- Controller-specific annotations, including upload limits.
  annotations: {}
  # -- Host/path definitions.
  hosts: []
  # -- TLS certificate references.
  tls: []
# -- Canonical Gateway API integration.
gatewayAPI:
  # -- Render HTTPRoutes.
  enabled: false
  # -- HTTPRoute definitions with parentRefs, hostnames and rules.
  httpRoutes: []
# -- Canonical External Secrets integration.
externalSecrets:
  # -- Render ExternalSecret objects; operator must already exist.
  enabled: false
  # -- Default refresh interval.
  refreshInterval: 1h
  # -- ExternalSecret definitions containing complete specs.
  items: []
# -- Autoscaling requires shared data and Redis sessions.
autoscaling:
  # -- Enable HPA.
  enabled: false
  # -- Minimum web replicas.
  minReplicas: 2
  # -- Maximum web replicas.
  maxReplicas: 5
  # -- Target CPU utilization percentage.
  targetCPUUtilizationPercentage: 70
# -- Voluntary disruption protection.
pdb:
  # -- Render PDB; use only with multiple web replicas.
  enabled: false
  # -- Minimum healthy web pods.
  minAvailable: 1
# -- Network isolation; additional external endpoints use explicit extraEgress rules.
networkPolicy:
  # -- Enable NetworkPolicy.
  enabled: false
  # -- Allowed ingress peers; empty permits all sources to the web port.
  ingressFrom: []
  # -- Additional egress rules for external DB/Redis, SMTP, plugins or storage.
  extraEgress: []
