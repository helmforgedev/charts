# SPDX-License-Identifier: Apache-2.0
suite: Moodle externalsecret
templates:
  - templates/*.yaml
tests:
  - it: disabled by default
    asserts:
      - hasDocuments:
          count: 0
    template: templates/externalsecret.yaml
  - it: defaults target and refresh
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: moodle-auth
          spec:
            secretStoreRef:
              name: vault
              kind: ClusterSecretStore
            data: []
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: spec.target.name
          value: moodle-auth
      - equal:
          path: spec.refreshInterval
          value: 1h
    template: templates/externalsecret.yaml
  - it: rejects missing store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            data: []
    asserts:
      - failedTemplate:
          errorMessage: >-
            externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name
            is required when externalSecrets.enabled=true
    template: templates/externalsecret.yaml
