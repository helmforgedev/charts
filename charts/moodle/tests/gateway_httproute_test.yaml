suite: Moodle gateway-httproute
templates:
  - templates/*.yaml
tests:
  - it: disabled by default
    asserts:
      - hasDocuments:
          count: 0
    template: templates/gateway-httproute.yaml
  - it: defaults route backend to web
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - hostnames:
            - learn.example.com
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
    template: templates/gateway-httproute.yaml
  - it: renders multiple named routes
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes:
        - name: a
        - name: b
    asserts:
      - hasDocuments:
          count: 2
    template: templates/gateway-httproute.yaml
