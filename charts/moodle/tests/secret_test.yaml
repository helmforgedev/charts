# SPDX-License-Identifier: Apache-2.0
suite: Moodle secret
templates:
  - templates/*.yaml
tests:
  - it: does not duplicate existing administrator secret
    set:
      moodle.existingSecret: moodle-admin
    asserts:
      - hasDocuments:
          count: 0
    template: templates/secret.yaml
  - it: encodes explicit bootstrap password
    set:
      moodle.adminPassword: Test-password-2026!
    asserts:
      - equal:
          path: data.admin-password
          value: VGVzdC1wYXNzd29yZC0yMDI2IQ==
    template: templates/secret.yaml
