# SPDX-License-Identifier: Apache-2.0
suite: Moodle networkpolicy
templates:
  - templates/*.yaml
tests:
  - it: disabled by default
    asserts:
      - hasDocuments:
          count: 0
    template: templates/networkpolicy.yaml
  - it: isolates ingress and egress
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
    template: templates/networkpolicy.yaml
  - it: follows custom web and metrics listeners
    set:
      networkPolicy.enabled: true
      containerPorts.http: 18080
      metrics.enabled: true
      metrics.port: 19090
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 19090
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 18080
      - equal:
          path: spec.egress[0].ports[0].port
          value: 18080
      - equal:
          path: spec.egress[0].ports[1].port
          value: 19090
    template: templates/networkpolicy.yaml
  - it: includes extra SMTP egress
    set:
      networkPolicy.enabled: true
      networkPolicy.extraEgress:
        - ports:
            - port: 587
              protocol: TCP
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 587
                protocol: TCP
    template: templates/networkpolicy.yaml
