{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moodle.fullname" . }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moodle.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.metrics.enabled }}
    - ports:
        - {port: 9090, protocol: TCP}
      {{- with .Values.metrics.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    - ports:
        - {port: 8080, protocol: TCP}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "moodle.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
        {{- if .Values.metrics.enabled }}
        - {port: 9090, protocol: TCP}
        {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if include "moodle.dbBundled" . }}
    - to:
        - podSelector:
            matchLabels:
              {{- include (printf "%s.selectorLabels" .Values.database.type) (index .Subcharts .Values.database.type) | nindent 14 }}
      ports:
        - {port: {{ ternary 5432 3306 (eq .Values.database.type "postgresql") }}, protocol: TCP}
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: redis
      ports:
        - {port: 6379, protocol: TCP}
    {{- end }}
    {{- if or (eq .Values.source.mode "archive") (and .Values.metrics.enabled (eq .Values.metrics.plugin.mode "archive")) }}
    - ports:
        - {port: 443, protocol: TCP}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
