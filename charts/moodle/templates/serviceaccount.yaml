{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moodle.serviceAccountName" . }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- include "moodle.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
