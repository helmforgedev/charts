{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.metrics.enabled (not .Values.metrics.existingSecret) }}
{{- $name := include "moodle.metricsSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := randAlphaNum 48 }}
{{- if and $existing (hasKey $existing.data .Values.metrics.existingSecretTokenKey) }}
{{- $token = index $existing.data .Values.metrics.existingSecretTokenKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.metrics.existingSecretTokenKey }}: {{ $token | b64enc | quote }}
{{- end }}
