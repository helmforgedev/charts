# SPDX-License-Identifier: Apache-2.0
agent:
  model: fixture/helmforge-fixture
  allowTools:
    - read
    - write
credentials:
  existingSecret: openclaw-provider-credentials
gateway:
  chatCompletions:
    enabled: true
config:
  values:
    models:
      mode: replace
      providers:
        fixture:
          baseUrl: http://openclaw-provider:8080/v1
          apiKey: ${OPENCLAW_FIXTURE_API_KEY}
          api: openai-completions
          models:
            - id: helmforge-fixture
              name: Local acceptance fixture
              reasoning: false
              input:
                - text
              contextWindow: 128000
              maxTokens: 4096
              cost:
                input: 0
                output: 0
                cacheRead: 0
                cacheWrite: 0
networkPolicy:
  allowInternet: false
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: openclaw-provider
      ports:
        - protocol: TCP
          port: 8080
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app: openclaw-provider
