  selector:
    matchLabels:
      app: openclaw-provider
  template:
    metadata:
      labels:
        app: openclaw-provider
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: ghcr.io/openclaw/openclaw:2026.9.4@sha256:cc596b846506a5f4cfcee111394a2725f375f01cca2ebb492a161fd1b747f101
          command:
            - node
            - /fixture/server.mjs
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: fixture
          configMap:
            name: openclaw-provider
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
