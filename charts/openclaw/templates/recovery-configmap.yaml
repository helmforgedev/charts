{{- if or .Values.backup.enabled .Values.restore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}-recovery
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  archive.mjs: |
    {{- .Files.Get "files/archive.mjs" | nindent 4 }}
  s3.sh: |
    {{- .Files.Get "files/s3.sh" | nindent 4 }}
{{- end }}
