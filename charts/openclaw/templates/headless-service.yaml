apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw.fullname" . }}-headless
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports: [{name: api, port: 18789, targetPort: api}]
  selector:
    {{- include "openclaw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
