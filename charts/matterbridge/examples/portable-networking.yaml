# SPDX-License-Identifier: Apache-2.0
# Advanced mode: the CNI must transport LAN multicast and IPv6 independently.
network:
  hostNetwork: false

matterService:
  enabled: true
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4

service:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
