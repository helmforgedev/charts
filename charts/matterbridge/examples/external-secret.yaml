externalSecrets:
  enabled: true
  items:
    - name: plugin
      spec:
        secretStoreRef:
          name: production-secrets
          kind: ClusterSecretStore
        target:
          name: matterbridge-plugin
        data:
          - secretKey: token
            remoteRef:
              key: matterbridge/plugin
              property: token

extraEnvFrom:
  - secretRef:
      name: matterbridge-plugin
