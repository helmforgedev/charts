suite: Common annotations
templates:
  - templates/statefulset.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/pvc.yaml
tests:
  - it: renders common annotations across resources
    set:
      serviceAccount.create: true
      commonAnnotations:
        helmforge.dev/test: verified
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/test"]
          value: verified
        template: templates/statefulset.yaml
      - equal:
          path: spec.template.metadata.annotations["helmforge.dev/test"]
          value: verified
        template: templates/statefulset.yaml
      - equal:
          path: metadata.annotations["helmforge.dev/test"]
          value: verified
        template: templates/service.yaml
      - equal:
          path: metadata.annotations["helmforge.dev/test"]
          value: verified
        template: templates/serviceaccount.yaml
      - equal:
          path: metadata.annotations["helmforge.dev/test"]
          value: verified
        template: templates/pvc.yaml
