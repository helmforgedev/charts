{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $existingAuthSecret := lookup "v1" "Secret" .Release.Namespace (include "mongodb.fullname" .) -}}
{{- $existingAuthData := default (dict) $existingAuthSecret.data -}}
{{- $existingRootUsername := index $existingAuthData "mongodb-root-username" -}}
{{- $existingRootPassword := index $existingAuthData "mongodb-root-password" -}}
{{- $existingKeySecret := lookup "v1" "Secret" .Release.Namespace (include "mongodb.keySecretName" .) -}}
{{- $existingKeyData := default (dict) $existingKeySecret.data -}}
{{- $existingReplicaSetKey := index $existingKeyData "replica-set-key" -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- if .Values.persistence.enabled }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if $existingRootUsername }}
  mongodb-root-username: {{ $existingRootUsername | quote }}
  {{- else }}
  mongodb-root-username: {{ .Values.auth.rootUser | b64enc | quote }}
  {{- end }}
  {{- if $existingRootPassword }}
  mongodb-root-password: {{ $existingRootPassword | quote }}
  {{- else if .Values.auth.rootPassword }}
  mongodb-root-password: {{ .Values.auth.rootPassword | b64enc | quote }}
  {{- else }}
  mongodb-root-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (include "mongodb.backupEnabled" .) (not .Values.backup.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.backupSecretName" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.existingSecretAccessKeyKey }}: {{ .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.existingSecretSecretKeyKey }}: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
---
{{- if and (include "mongodb.needsKeyFile" .) (not .Values.auth.existingKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.keySecretName" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- if .Values.persistence.enabled }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if $existingReplicaSetKey }}
  replica-set-key: {{ $existingReplicaSetKey | quote }}
  {{- else if .Values.auth.replicaSetKey }}
  replica-set-key: {{ .Values.auth.replicaSetKey | b64enc | quote }}
  {{- else }}
  replica-set-key: {{ randAlphaNum 756 | b64enc | quote }}
  {{- end }}
{{- end }}
