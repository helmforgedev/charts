{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if include "mongodb.isReplicaSet" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mongodb.fullname" . }}-rs-init
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: rs-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "mongodb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rs-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rs-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.auth.enabled }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.secretName" . }}
                  key: mongodb-root-username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.secretName" . }}
                  key: mongodb-root-password
            {{- end }}
          command:
            - bash
            - -c
            - |
              set -e

              FULLNAME="{{ include "mongodb.fullname" . }}"
              HEADLESS="{{ include "mongodb.headlessServiceName" . }}"
              ARBITER_NAME="{{ include "mongodb.arbiterName" . }}"
              ARBITER_HEADLESS="{{ include "mongodb.arbiterHeadlessServiceName" . }}"
              NAMESPACE="{{ .Release.Namespace }}"
              RS_NAME="{{ .Values.replicaSet.name }}"
              MEMBERS={{ include "mongodb.replicaCount" . }}
              ARBITER_ENABLED="{{ .Values.arbiter.enabled }}"
              PORT={{ .Values.port }}

              {{- if .Values.auth.enabled }}
              AUTH_ARGS="-u $MONGO_USER -p $MONGO_PASS --authenticationDatabase admin"
              {{- else }}
              AUTH_ARGS=""
              {{- end }}

              SEED="${FULLNAME}-0.${HEADLESS}.${NAMESPACE}.svc.cluster.local:${PORT}"
              ARBITER="${ARBITER_NAME}-0.${ARBITER_HEADLESS}.${NAMESPACE}.svc.cluster.local:${PORT}"

              echo "Waiting for the seed member to be ready..."
              until mongosh --host "$SEED" $AUTH_ARGS --quiet --eval "db.adminCommand('ping')" 2>/dev/null; do
                echo "  Waiting for ${FULLNAME}-0..."
                sleep 5
              done

              echo "Checking if replica set is already initialized..."
              RS_STATUS=$(mongosh --host "$SEED" $AUTH_ARGS --quiet --eval "
                try { rs.status().ok } catch(e) { 0 }
              " 2>/dev/null || echo "0")

              if [ "$RS_STATUS" = "1" ]; then
                echo "Replica set already initialized. Reconciling members..."

                PRIMARY=""
                for attempt in $(seq 1 60); do
                  PRIMARY=$(mongosh --host "$SEED" $AUTH_ARGS --quiet --eval "db.hello().primary || ''" 2>/dev/null || true)
                  if [ -n "$PRIMARY" ]; then
                    break
                  fi
                  sleep 2
                done
                if [ -z "$PRIMARY" ]; then
                  echo "ERROR: Replica set has no elected primary for reconciliation." >&2
                  exit 1
                fi

                preserve_implicit_write_concern() {
                  mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "
                    const current = db.adminCommand({ getDefaultRWConcern: 1 });
                    if (current.defaultWriteConcernSource === 'implicit') {
                      const votingMembers = rs.conf().members.filter((member) => member.votes !== 0);
                      const arbiters = votingMembers.filter((member) => member.arbiterOnly === true).length;
                      const dataBearing = votingMembers.length - arbiters;
                      const votingMajority = Math.floor(votingMembers.length / 2) + 1;
                      const writeConcern = arbiters > 0 && dataBearing <= votingMajority ? 1 : 'majority';
                      const result = db.adminCommand({
                        setDefaultRWConcern: 1,
                        defaultWriteConcern: { w: writeConcern },
                        writeConcern: { w: 'majority' }
                      });
                      if (result.ok !== 1) {
                        throw new Error('failed to preserve the implicit default write concern');
                      }
                      print('Promoted implicit default write concern to global: ' + writeConcern);
                    } else {
                      print('Keeping operator-managed global default write concern.');
                    }
                  "
                }

                for i in $(seq 0 $((MEMBERS - 1))); do
                  MEMBER="${FULLNAME}-${i}.${HEADLESS}.${NAMESPACE}.svc.cluster.local:${PORT}"
                  MEMBER_EXISTS=$(mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "
                    rs.conf().members.some((member) => member.host === '${MEMBER}')
                  " 2>/dev/null)
                  if [ "$MEMBER_EXISTS" != "true" ]; then
                    echo "Adding data-bearing member: $MEMBER"
                    preserve_implicit_write_concern
                    mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "rs.add('${MEMBER}')"
                  fi
                done

                ARBITER_EXISTS=$(mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "
                  rs.conf().members.some((member) => member.host === '${ARBITER}' && member.arbiterOnly === true)
                " 2>/dev/null)

                if [ "$ARBITER_ENABLED" = "true" ]; then
                  until mongosh --host "$ARBITER" --quiet --eval "db.adminCommand('ping')" 2>/dev/null; do
                    echo "  Waiting for arbiter..."
                    sleep 5
                  done
                  if [ "$ARBITER_EXISTS" != "true" ]; then
                    echo "Adding arbiter: $ARBITER"
                    preserve_implicit_write_concern
                    mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "rs.addArb('${ARBITER}')"
                  fi
                elif [ "$ARBITER_EXISTS" = "true" ]; then
                  echo "Removing disabled arbiter: $ARBITER"
                  preserve_implicit_write_concern
                  mongosh --host "$PRIMARY" $AUTH_ARGS --quiet --eval "rs.remove('${ARBITER}')"
                fi

                echo "Replica set is configured."
                exit 0
              fi

              echo "Initializing replica set '${RS_NAME}'..."
              MEMBERS_JSON=""
              for i in $(seq 0 $((MEMBERS - 1))); do
                MEMBER="${FULLNAME}-${i}.${HEADLESS}.${NAMESPACE}.svc.cluster.local:${PORT}"
                if [ -n "$MEMBERS_JSON" ]; then
                  MEMBERS_JSON="${MEMBERS_JSON},"
                fi
                MEMBERS_JSON="${MEMBERS_JSON}{_id:${i},host:'${MEMBER}'}"
              done

              if [ "$ARBITER_ENABLED" = "true" ]; then
                until mongosh --host "$ARBITER" --quiet --eval "db.adminCommand('ping')" 2>/dev/null; do
                  echo "  Waiting for arbiter..."
                  sleep 5
                done
                MEMBERS_JSON="${MEMBERS_JSON},{_id:${MEMBERS},host:'${ARBITER}',arbiterOnly:true}"
              fi

              mongosh --host "$SEED" $AUTH_ARGS --quiet --eval "
                rs.initiate({
                  _id: '${RS_NAME}',
                  members: [${MEMBERS_JSON}]
                })
              "

              echo "Waiting for replica set to elect primary..."
              for attempt in $(seq 1 60); do
                IS_PRIMARY=$(mongosh --host "$SEED" $AUTH_ARGS --quiet --eval "
                  rs.status().members.some((member) => member.stateStr === 'PRIMARY')
                " 2>/dev/null || echo "false")
                if [ "$IS_PRIMARY" = "true" ]; then
                  echo "Primary elected. Replica set ready."
                  exit 0
                fi
                sleep 2
              done

              echo "ERROR: Primary election timed out after replica set initialization." >&2
              exit 1
{{- end }}
