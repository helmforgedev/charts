{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if or (include "mongodb.isStandalone" .) (include "mongodb.isReplicaSet" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- include "mongodb.renderAnnotations" (dict "root" . "specific" .Values.annotations) | nindent 2 }}
spec:
  serviceName: {{ include "mongodb.headlessServiceName" . }}
  replicas: {{ include "mongodb.replicaCount" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mongodb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  template:
    {{- include "mongodb.podTemplate" (dict "root" . "component" "mongodb") | nindent 4 }}
  {{- if and .Values.persistence.enabled (or .Values.persistence.retentionPolicy.whenDeleted .Values.persistence.retentionPolicy.whenScaled) }}
  persistentVolumeClaimRetentionPolicy:
    {{- with .Values.persistence.retentionPolicy.whenDeleted }}
    whenDeleted: {{ . }}
    {{- end }}
    {{- with .Values.persistence.retentionPolicy.whenScaled }}
    whenScaled: {{ . }}
    {{- end }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mongodb.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "mongodb.statefulSetStorage" (dict "root" . "name" (include "mongodb.fullname" .) "fallback" .Values.persistence.size) }}
  {{- end }}
{{- end }}
