# SPDX-License-Identifier: Apache-2.0
architecture: sharded

auth:
  enabled: false

initContainerResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

sharded:
  initJob:
    asHook: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 512Mi
  mongos:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  configServer:
    replicaCount: 3
    persistence:
      size: 2Gi
  shards:
    count: 2
    membersPerShard: 3
    persistence:
      size: 4Gi

persistence:
  enabled: true
  size: 4Gi
