# SPDX-License-Identifier: Apache-2.0
suite: Managed Secret upgrade retention
templates:
  - secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-mongodb
        namespace: default
      data:
        mongodb-root-username: cmV0YWluZWQtdXNlcg==
        mongodb-root-password: cmV0YWluZWQtcGFzc3dvcmQ=
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-mongodb-keyfile
        namespace: default
      data:
        replica-set-key: cmV0YWluZWQta2V5
tests:
  - it: should retain credentials already bound to persistent data
    set:
      architecture: replicaset
      auth.rootUser: replacement-user
      auth.rootPassword: replacement-password
      auth.replicaSetKey: replacement-key
    asserts:
      - equal:
          path: data["mongodb-root-username"]
          value: cmV0YWluZWQtdXNlcg==
        documentIndex: 0
      - equal:
          path: data["mongodb-root-password"]
          value: cmV0YWluZWQtcGFzc3dvcmQ=
        documentIndex: 0
      - equal:
          path: data["replica-set-key"]
          value: cmV0YWluZWQta2V5
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 1
