# SPDX-License-Identifier: Apache-2.0
suite: Arbiter
templates:
  - templates/arbiter-service.yaml
  - templates/arbiter-statefulset.yaml
  - templates/job-rs-init.yaml
release:
  name: test
  namespace: default
tests:
  - it: does not render arbiter resources by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/arbiter-service.yaml
      - hasDocuments:
          count: 0
        template: templates/arbiter-statefulset.yaml

  - it: renders a dedicated arbiter headless service
    template: templates/arbiter-service.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-mongodb-arbiter-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: arbiter

  - it: renders one lightweight arbiter with stable DNS and ephemeral data
    template: templates/arbiter-statefulset.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: test-mongodb-arbiter
      - equal:
          path: spec.serviceName
          value: test-mongodb-arbiter-headless
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: arbiter
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/mongo:8.3.8
      - contains:
          path: spec.template.spec.containers[0].args
          content: --replSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: registers and reconciles the arbiter in the replica set
    template: templates/job-rs-init.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
    asserts:
      - matchRegex:
          path: metadata.annotations["helm.sh/hook"]
          pattern: post-install,post-upgrade
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: ARBITER_ENABLED="true"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: rs\.addArb
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: arbiterOnly:true
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: rs\.remove
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: member\.stateStr === 'PRIMARY'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: db\.hello\(\)\.primary
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: getDefaultRWConcern
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: setDefaultRWConcern

  - it: preserves write concern before scaling a PSA topology from two to four data members
    template: templates/job-rs-init.yaml
    set:
      architecture: replicaset
      replicaSet.members: 4
      arbiter.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'MEMBERS=4'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'echo "Adding data-bearing member: \$MEMBER"\s+preserve_implicit_write_concern'

  - it: bounds the arbiter StatefulSet name for a maximum-length fullname override
    template: templates/arbiter-statefulset.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'

  - it: bounds the arbiter Service name for a maximum-length fullname override
    template: templates/arbiter-service.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'

  - it: reuses the bounded arbiter name in the reconciliation hook
    template: templates/job-rs-init.yaml
    set:
      architecture: replicaset
      replicaSet.members: 2
      arbiter.enabled: true
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ARBITER_NAME="[a-z0-9-]{1,63}"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ARBITER="\$\{ARBITER_NAME\}-0\.'
