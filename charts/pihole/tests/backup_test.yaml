# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-configmap.yaml
  - templates/backup-cronjob.yaml
  - templates/backup-secret.yaml
  - templates/backup-serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should use a dedicated ServiceAccount for static credential backups
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: pihole
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-pihole-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: test-pihole-backup
                key: access-key

  - it: should use workload identity without static credential environment variables
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: pihole
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-pihole-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY

  - it: should render a dedicated annotated backup ServiceAccount
    template: templates/backup-serviceaccount.yaml
    set:
      backup.enabled: true
      commonAnnotations:
        example.com/team: platform
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pihole-backup
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-pihole-backup
      - equal:
          path: metadata.annotations["example.com/team"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/pihole-backup

  - it: should not render a static credential Secret for workload identity
    template: templates/backup-secret.yaml
    set:
      backup.enabled: true
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure the MinIO client for workload identity
    template: templates/backup-configmap.yaml
    set:
      backup.enabled: true
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - matchRegex:
          path: data["upload.sh"]
          pattern: 'MC_STS_ENDPOINT_s3="https://sts\.\$\{AWS_REGION\}\.\$\{STS_DOMAIN\}"'
      - notMatchRegex:
          path: data["upload.sh"]
          pattern: "mc alias set"
