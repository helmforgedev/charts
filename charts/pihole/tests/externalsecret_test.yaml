# SPDX-License-Identifier: Apache-2.0
suite: ExternalSecret Tests
templates:
  - templates/externalsecret.yaml
release:
  name: test
  namespace: default

tests:
  - it: should not render ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ExternalSecret when configured correctly
    set:
      externalSecrets:
        enabled: true
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: secret/pihole/admin
              property: password
      admin:
        existingSecret: pihole-vault-secret
        existingSecretKey: password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: test-pihole-admin
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: pihole-vault-secret
