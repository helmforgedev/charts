{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pihole
  policyTypes:
    - Ingress
  ingress:
    - {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - port: dns-tcp
          protocol: TCP
        - port: dns-udp
          protocol: UDP
        - port: http
          protocol: TCP
        {{- if .Values.dhcp.enabled }}
        - port: dhcp
          protocol: UDP
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - port: metrics
          protocol: TCP
        {{- end }}
{{- end }}
