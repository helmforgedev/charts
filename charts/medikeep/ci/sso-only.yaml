# SPDX-License-Identifier: Apache-2.0
medikeep:
  sso:
    enabled: true
    providerType: github
    clientId: helmforge-ci
    redirectUri: https://medikeep.example.com/auth/sso/callback
secrets:
  ssoClientSecret: helmforge-ci-placeholder
app:
  env:
    - name: SSO_ONLY_MODE
      value: "1"
    - name: SSO_AUTO_REDIRECT
      value: "false"
