# SPDX-License-Identifier: Apache-2.0
# Production-like single-replica scenario with durable PHI storage.
app:
  debug: false
  enableApiDocs: false

secrets:
  secretKey: ci-production-secret-key-2026-with-stable-runtime-entropy
  adminDefaultPassword: CiProductionAdmin2026!

persistence:
  uploads:
    size: 20Gi
  backups:
    size: 20Gi
  logs:
    enabled: false

pdb:
  enabled: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    enabled: true
    allowDNS: true

postgresql:
  auth:
    postgresPassword: ci-postgres-password
    password: ci-medikeep-password
  standalone:
    persistence:
      size: 20Gi
