suite: medikeep value validation
templates:
  - templates/validate.yaml
tests:
  - it: fails when replicaCount is greater than one
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "replicaCount > 1 is not supported because MediKeep stores uploads, logs, and generated backups on pod-local writable volumes"
  - it: fails when external database host is missing
    set:
      postgresql.enabled: false
      database.external.password: external-password
    asserts:
      - failedTemplate:
          errorMessage: "database.external.host is required when postgresql.enabled=false"
  - it: fails when external database password is missing
    set:
      postgresql.enabled: false
      database.external.host: postgres.example.com
    asserts:
      - failedTemplate:
          errorMessage: "database.external.password or database.external.existingSecret is required when postgresql.enabled=false"
  - it: fails when externalSecrets is enabled without items
    set:
      externalSecrets.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.items must contain at least one item when externalSecrets.enabled=true"
  - it: rejects public exposure with the upstream default administrator password
    set:
      ingress.enabled: true
      ingress.hosts[0].host: medikeep.example.com
    asserts:
      - failedTemplate:
          errorMessage: "public exposure requires secrets.existingSecret or secrets.adminDefaultPassword to prevent the upstream default administrator password"
  - it: rejects NodePort exposure with the upstream default administrator password
    set:
      service.type: NodePort
    asserts:
      - failedTemplate:
          errorMessage: "public exposure requires secrets.existingSecret or secrets.adminDefaultPassword to prevent the upstream default administrator password"
  - it: rejects LoadBalancer exposure with the upstream default administrator password
    set:
      service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: "public exposure requires secrets.existingSecret or secrets.adminDefaultPassword to prevent the upstream default administrator password"
  - it: requires an external database destination under egress isolation
    set:
      postgresql.enabled: false
      database.external.host: postgres.example.com
      database.external.password: external-password
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "networkPolicy.egress.databaseTo is required for an external database when egress isolation is enabled"
