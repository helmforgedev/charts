suite: medikeep production contract
templates:
  - templates/deployment.yaml
  - templates/networkpolicy.yaml
  - templates/pdb.yaml
tests:
  - it: keeps production debugging disabled and sensitive logs ephemeral
    template: templates/deployment.yaml
    set:
      app.debug: false
      app.enableApiDocs: false
      persistence.logs.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEBUG
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_API_DOCS
            value: "false"
      - equal:
          path: spec.template.spec.volumes[2].emptyDir
          value: {}
  - it: isolates application traffic and database egress
    template: templates/networkpolicy.yaml
    values:
      - ../ci/production-values.yaml
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: postgresql
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
  - it: protects the supported single replica from voluntary disruption
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
