{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medikeep.fullname" . }}
  labels:
    {{- include "medikeep.labels" . | nindent 4 }}
  {{- include "medikeep.renderAnnotations" (dict "root" . "specific" dict) | nindent 2 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "medikeep.selectorLabels" . | nindent 6 }}
{{- end }}
