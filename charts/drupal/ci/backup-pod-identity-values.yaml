backup:
  enabled: true
  suspend: true
  s3:
    endpoint: https://s3.us-east-1.amazonaws.com
    bucket: drupal-backups
    region: us-east-1
    credentialsFromPodIdentity: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/drupal-backup
