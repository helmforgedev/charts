{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.backup.enabled .Values.backup.s3.credentialsFromPodIdentity .Values.backup.serviceAccount.create }}
{{- $_ := include "drupal.backupEnabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drupal.backupServiceAccountName" . }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- $annotations := mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.backup.serviceAccount.annotations | default dict) -}}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
