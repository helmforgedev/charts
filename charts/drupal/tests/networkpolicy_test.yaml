# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ingress-only policy on the application listener
    set:
      networkPolicy.enabled: true
      containerPorts.http: 8080
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080

  - it: should render DNS database HTTPS and SMTP egress rules
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.allowHTTPS: true
      networkPolicy.egress.allowSMTP: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: UDP
            port: 53
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 3306
      - contains:
          path: spec.egress[2].ports
          content:
            protocol: TCP
            port: 443
      - contains:
          path: spec.egress[3].ports
          content:
            protocol: TCP
            port: 587

  - it: should render an empty ingress list for default deny ingress
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.allowSameNamespace: false
    asserts:
      - equal:
          path: spec.ingress
          value: []

  - it: should render custom ingress and egress rules
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.extraFrom:
        - ipBlock:
            cidr: 10.1.0.0/16
      networkPolicy.egress.enabled: true
      networkPolicy.egress.extraTo:
        - ipBlock:
            cidr: 10.2.0.0/16
      networkPolicy.egress.extraEgress:
        - to:
            - ipBlock:
                cidr: 10.3.0.0/16
          ports:
            - protocol: TCP
              port: 5432
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            ipBlock:
              cidr: 10.1.0.0/16
      - equal:
          path: spec.egress[2]
          value:
            to:
              - ipBlock:
                  cidr: 10.2.0.0/16
      - equal:
          path: spec.egress[3]
          value:
            to:
              - ipBlock:
                  cidr: 10.3.0.0/16
            ports:
              - protocol: TCP
                port: 5432

  - it: should render an empty egress list when every source is disabled
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.allowDNS: false
      networkPolicy.egress.allowSameNamespaceDatabase: false
      networkPolicy.egress.allowHTTPS: false
      networkPolicy.egress.allowSMTP: false
    asserts:
      - equal:
          path: spec.egress
          value: []
