# SPDX-License-Identifier: Apache-2.0
suite: Backup Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render inline S3 credentials only when backup is enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: countly
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.access-key
          value: access
      - equal:
          path: stringData.secret-key
          value: secret

  - it: should not render when an existing S3 Secret is used
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: countly
      backup.s3.existingSecret: countly-s3
    asserts:
      - hasDocuments:
          count: 0
