# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - backup-cronjob.yaml
  - backup-configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not create backup configmap when disabled
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create backup cronjob when disabled
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create backup CronJob when enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "0 3 * * *"

  - it: should create backup ConfigMap with mongodump script
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isNotEmpty:
          path: data["mongodb-backup.sh"]
      - matchRegex:
          path: data["mongodb-backup.sh"]
          pattern: 'mongodump --config="\$\{config_file\}"'
      - matchRegex:
          path: data["mongodb-backup.sh"]
          pattern: 'chmod 0600 "\$\{config_file\}"'
      - notMatchRegex:
          path: data["mongodb-backup.sh"]
          pattern: '--uri='

  - it: should mount the mongodb subchart password without exposing it in arguments
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_URI
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].volumeMounts
          content:
            name: mongodb-root-password
            mountPath: /run/secrets/mongodb-root-password
            readOnly: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[4].secret.items[0].key
          value: mongodb-root-password

  - it: should use the external MongoDB Secret URI for backup
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
      mongodb.enabled: false
      externalMongodb.enabled: true
      externalMongodb.existingSecret: countly-mongodb
      externalMongodb.existingSecretUriKey: mongodb-uri
    template: backup-cronjob.yaml
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_URI
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].volumeMounts
          content:
            name: mongodb-uri
            mountPath: /run/secrets/mongodb-uri
            readOnly: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[4].secret.secretName
          value: countly-mongodb
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[4].secret.items[0].key
          value: mongodb-uri

  - it: should write inline database URI to the private mongodump config
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
      backup.database.uri: mongodb://backup:secret@mongodb.example.com:27017/countly
    template: backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_URI
            value: mongodb://backup:secret@mongodb.example.com:27017/countly
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].volumeMounts
          content:
            name: mongodump-config
            mountPath: /run/mongodump-config

  - it: should pass mongodump arguments without shell evaluation
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
      backup.database.mongodumpArgs:
        - --readPreference=secondaryPreferred
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].args[0]
          value: --readPreference=secondaryPreferred

  - it: should harden backup containers and disable API tokens
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: docker.io/library/mongo:8.0.34

  - it: should fail without s3 endpoint
    set:
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"
