# SPDX-License-Identifier: Apache-2.0
# The Secret key mongodb-uri contains the complete managed MongoDB URI.
mongodb:
  enabled: false

externalMongodb:
  enabled: true
  existingSecret: countly-mongodb
  existingSecretUriKey: mongodb-uri

networkPolicy:
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.30.40/32
      ports:
        - protocol: TCP
          port: 27017
