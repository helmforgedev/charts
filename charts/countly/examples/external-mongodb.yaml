# SPDX-License-Identifier: Apache-2.0
# The Secret key mongodb-uri contains the complete managed MongoDB URI.
mongodb:
  enabled: false

externalMongodb:
  enabled: true
  existingSecret: countly-mongodb
  existingSecretUriKey: mongodb-uri

networkPolicy:
  egress:
    # DNS is required before Countly can resolve the managed MongoDB hostname.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.20.30.40/32
      ports:
        - protocol: TCP
          port: 27017
