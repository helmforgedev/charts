# SPDX-License-Identifier: Apache-2.0
suite: DocuSeal identity secret
templates:
  - templates/secret.yaml
tests:
  - it: creates retained application identity by default
    asserts:
      - isKind: { of: Secret }
      - equal: { path: "metadata.annotations['helm.sh/resource-policy']", value: keep }
      - exists: { path: data.secret-key-base }
      - exists: { path: data.encryption-secret }
  - it: delegates identity to an existing Secret
    set:
      docuseal.existingSecret: docuseal-identity
    asserts:
      - hasDocuments: { count: 0 }
