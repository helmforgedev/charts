{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "docuseal.fullname" . }}
  labels:
    {{- include "docuseal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "docuseal.secretName" . }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy }}
  data:
    {{- toYaml .Values.externalSecrets.items | nindent 4 }}
{{- end }}
