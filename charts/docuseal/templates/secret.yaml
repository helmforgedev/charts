{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.docuseal.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docuseal.secretName" . }}
  labels:
    {{- include "docuseal.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "docuseal.secretName" .) }}
  {{- $secretKey := .Values.docuseal.secretKeyBaseKey }}
  {{ $secretKey }}: {{ if .Values.docuseal.secretKeyBase }}{{ .Values.docuseal.secretKeyBase | b64enc | quote }}{{ else if and $existing (get $existing.data $secretKey) }}{{ get $existing.data $secretKey }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- $encryptionKey := .Values.docuseal.encryptionSecretKey }}
  {{ $encryptionKey }}: {{ if .Values.docuseal.encryptionSecret }}{{ .Values.docuseal.encryptionSecret | b64enc | quote }}{{ else if and $existing (get $existing.data $encryptionKey) }}{{ get $existing.data $encryptionKey }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
