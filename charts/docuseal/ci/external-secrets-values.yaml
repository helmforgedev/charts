# SPDX-License-Identifier: Apache-2.0
fullnameOverride: docuseal
docuseal:
  existingSecret: docuseal-identity
externalSecrets:
  enabled: true
  refreshInterval: 5m
  secretStoreRef:
    name: helmforge-fake-store
    kind: ClusterSecretStore
  items:
    - secretKey: secret-key-base
      remoteRef: { key: test/token }
    - secretKey: encryption-secret
      remoteRef: { key: test/password }
