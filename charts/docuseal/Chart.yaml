# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: docuseal
description: Production-ready DocuSeal electronic signatures with PostgreSQL, Redis, and durable attachments
type: application
version: 1.1.0
appVersion: "3.3.3"
kubeVersion: ">=1.26.0-0"
home: https://helmforge.dev/docs/charts/docuseal
icon: https://helmforge.dev/icons/charts/docuseal.png
sources:
  - https://github.com/helmforgedev/charts
  - https://github.com/docusealco/docuseal
keywords: [docuseal, electronic-signature, documents, pdf, self-hosted]
maintainers:
  - name: helmforgedev
  - name: mberlofa
dependencies:
  - name: postgresql
    version: 2.1.1
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 3.1.0
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
