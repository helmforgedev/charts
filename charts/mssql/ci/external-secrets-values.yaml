# SPDX-License-Identifier: Apache-2.0
fullnameOverride: mssql-eso
license:
  acceptEULA: true
auth:
  existingSecret: mssql-eso-auth
initdb:
  databases:
    - name: acceptance
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: mssql-eso-auth
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          template:
            engineVersion: v2
            data:
              sa-password: Hf9!{{ .password }}
              probe-password: Hf9!{{ .password }}
              metrics-password: Hf9!{{ .password }}
              backup-password: Hf9!{{ .password }}
        data:
          - secretKey: password
            remoteRef:
              key: test/password
