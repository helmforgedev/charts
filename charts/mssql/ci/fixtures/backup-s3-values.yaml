  name: mssql-s3-admin
  labels: {helmforge.dev/runtime-fixture: "true"}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: mssql-ci-admin
  AWS_SECRET_ACCESS_KEY: mssql-ci-admin-secret-never-production
