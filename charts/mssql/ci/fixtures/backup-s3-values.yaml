apiVersion: v1
kind: ConfigMap
metadata:
  name: mssql-s3-config
  labels: {helmforge.dev/runtime-fixture: "true"}
data:
  s3.json: |
    {"identities":[{"name":"ci-admin","credentials":[{"accessKey":"mssql-ci-admin","secretKey":"mssql-ci-admin-secret-never-production"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"ci-backup","credentials":[{"accessKey":"mssql-ci-backup","secretKey":"mssql-ci-backup-secret-never-production"}],"actions":["Read:mssql-backups","Write:mssql-backups","List:mssql-backups"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-s3
  labels: {helmforge.dev/runtime-fixture: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mssql-s3, component: server}
  template:
    metadata:
      labels: {app: mssql-s3, component: server, helmforge.dev/runtime-fixture: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
          command: [weed]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=4
            - -filer
            - -s3
            - -s3.config=/config/s3.json
            - -s3.cert.file=/tls/tls.crt
            - -s3.key.file=/tls/tls.key
          workingDir: /data
          ports:
            - {name: s3, containerPort: 8333}
          startupProbe:
            tcpSocket: {port: s3}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: {name: mssql-s3-config}
        - name: tls
          secret: {secretName: mssql-s3-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-s3
  labels: {app: mssql-s3, helmforge.dev/runtime-fixture: "true"}
spec:
  selector: {app: mssql-s3, component: server}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mssql-s3-create-bucket
  labels: {helmforge.dev/runtime-fixture: "true"}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels: {app: mssql-s3, component: setup, helmforge.dev/runtime-fixture: "true"}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: create-bucket
          image: public.ecr.aws/aws-cli/aws-cli:2.36.43@sha256:d948ee299a7ffcaec0d6052a00b9f4c513c61cacfaedfe68b098c85808394441
          command: [/bin/bash, -ec]
          args:
            - |
              set -u
              export AWS_MAX_ATTEMPTS=1
              probe_key="helmforge-fixture-readiness/${HOSTNAME}.bin"
              # One MiB exercises volume storage rather than only small inline filer metadata.
              dd if=/dev/zero of=/tmp/probe.upload bs=1048576 count=1 status=none
              expected="$(sha256sum /tmp/probe.upload)"; expected="${expected%% *}"
              s3() {
                aws --endpoint-url https://mssql-s3:8333 --cli-connect-timeout 2 --cli-read-timeout 3 s3api "$@"
              }
              for ((attempt=0; attempt<60 && SECONDS<180; attempt++)); do
                if s3 head-bucket --bucket mssql-backups >/tmp/readiness-error 2>&1 ||
                  s3 create-bucket --bucket mssql-backups >/tmp/readiness-error 2>&1; then
                  if s3 put-object --bucket mssql-backups --key "$probe_key" --body /tmp/probe.upload >/tmp/readiness-error 2>&1 &&
                    s3 get-object --bucket mssql-backups --key "$probe_key" /tmp/probe.download >/tmp/readiness-error 2>&1; then
                    actual="$(sha256sum /tmp/probe.download)"; actual="${actual%% *}"
                    if [[ "$actual" == "$expected" && "$(stat -c %s /tmp/probe.download)" == 1048576 ]] &&
                      s3 delete-object --bucket mssql-backups --key "$probe_key" >/tmp/readiness-error 2>&1; then
                      echo 'HTTPS S3 fixture passed real object upload, download, byte/hash verification and exact probe cleanup'
                      exit 0
                    fi
                  fi
                fi
                sleep 2
              done
              echo 'HTTPS S3 fixture data path did not become ready within its bounded retry budget' >&2
              cat /tmp/readiness-error >&2
              exit 1
          envFrom:
            - secretRef: {name: mssql-s3-admin}
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: AWS_CA_BUNDLE, value: /tls/ca.crt}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            - {name: AWS_PAGER, value: ""}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ca, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          secret: {secretName: mssql-s3-ca}
        - name: tmp
          emptyDir: {}
