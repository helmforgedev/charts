# SPDX-License-Identifier: Apache-2.0
suite: Canonical ExternalSecret identity
templates: [externalsecret.yaml]
tests:
  - it: permits independent per-entry stores and a dataFrom generator without a global store
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: mixed
          spec:
            data:
              - secretKey: first
                remoteRef: {key: first}
                sourceRef: {storeRef: {name: first-store, kind: SecretStore}}
              - secretKey: second
                remoteRef: {key: second}
                sourceRef: {storeRef: {name: second-store, kind: SecretStore}}
            dataFrom:
              - sourceRef:
                  generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: password}
              - extract: {key: third}
                sourceRef: {storeRef: {name: third-store, kind: SecretStore}}
    asserts:
      - hasDocuments: {count: 1}
      - equal:
          path: spec.data[1].sourceRef.storeRef.name
          value: second-store
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: password
  - it: allows global-store fallback alongside an independently sourced entry
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            secretStoreRef: {name: default-store}
            data:
              - secretKey: first
                remoteRef: {key: first}
                sourceRef: {storeRef: {name: override-store}}
              - secretKey: second
                remoteRef: {key: second}
            dataFrom: [{extract: {key: third}}]
    asserts:
      - hasDocuments: {count: 1}
  - it: rejects an unsourced data sibling even when an earlier entry has a store
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            data:
              - secretKey: first
                remoteRef: {key: first}
                sourceRef: {storeRef: {name: store}}
              - secretKey: second
                remoteRef: {key: second}
    asserts:
      - failedTemplate: {errorPattern: 'every ExternalSecret data entry requires'}
  - it: rejects an unsourced dataFrom sibling after a valid generator
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            dataFrom:
              - sourceRef:
                  generatorRef: {kind: Password, name: password}
              - extract: {key: second}
    asserts:
      - failedTemplate: {errorPattern: 'every ExternalSecret dataFrom entry requires'}
  - it: does not allow a sourced data entry to supply a different unsourced dataFrom
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            data:
              - secretKey: first
                remoteRef: {key: first}
                sourceRef: {storeRef: {name: store}}
            dataFrom: [{extract: {key: second}}]
    asserts:
      - failedTemplate: {errorPattern: 'every ExternalSecret dataFrom entry requires'}
  - it: rejects generatorRef under data even if a global store exists
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            secretStoreRef: {name: store}
            data:
              - secretKey: first
                remoteRef: {key: first}
                sourceRef: {generatorRef: {kind: Password, name: password}}
    asserts:
      - failedTemplate: {errorPattern: 'data entries do not support generatorRef'}
  - it: rejects combining a dataFrom generator with extract
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            dataFrom:
              - extract: {key: first}
                sourceRef: {generatorRef: {kind: Password, name: password}}
    asserts:
      - failedTemplate: {errorPattern: 'generatorRef cannot be combined with extract or find'}
  - it: rejects ambiguous dataFrom generator and store sources
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            dataFrom:
              - sourceRef:
                  storeRef: {name: store}
                  generatorRef: {kind: Password, name: password}
    asserts:
      - failedTemplate: {errorPattern: 'cannot combine storeRef and generatorRef'}
  - it: does not synchronize SQL credentials before explicit license consent
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            secretStoreRef: {name: vault, kind: ClusterSecretStore}
            target: {name: sql-auth}
            data: [{secretKey: sa-password, remoteRef: {key: sql/password}}]
    asserts:
      - hasDocuments: {count: 0}
  - it: renders item target and store references without changing the contract
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: sql-auth-external
          spec:
            secretStoreRef: {name: vault, kind: ClusterSecretStore}
            target: {name: sql-auth, creationPolicy: Owner}
            data: [{secretKey: sa-password, remoteRef: {key: sql/password}}]
    asserts:
      - equal: {path: 'apiVersion', value: external-secrets.io/v1}
      - equal: {path: 'spec.target.name', value: sql-auth}
      - equal: {path: 'spec.refreshInterval', value: 1h}
      - equal: {path: 'spec.secretStoreRef.name', value: vault}
  - it: rejects two implicit authentication resource names
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec: {secretStoreRef: {name: vault}}
        - spec: {secretStoreRef: {name: vault}}
    asserts:
      - failedTemplate: {errorPattern: 'names must be unique'}
  - it: rejects resource names colliding after truncation
    set:
      license.acceptEULA: true
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-one
          spec: {secretStoreRef: {name: vault}}
        - fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-two
          spec: {secretStoreRef: {name: vault}}
    asserts:
      - failedTemplate: {errorPattern: 'names must be unique'}
