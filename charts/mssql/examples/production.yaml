# SPDX-License-Identifier: Apache-2.0
license:
  acceptEULA: true
sql:
  edition: Standard
  memoryLimitMB: 6144
auth:
  existingSecret: mssql-auth
tls:
  existingSecret: mssql-tls
resources:
  requests:
    cpu: '4'
    memory: 8Gi
  limits:
    cpu: '4'
    memory: 8Gi
persistence:
  size: 100Gi
initdb:
  databases:
    - name: application
      username: application
      existingSecret: application-db
      recoveryModel: SIMPLE
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: applications
      podSelector:
        matchLabels:
          app.kubernetes.io/name: application
