# SPDX-License-Identifier: Apache-2.0
# Explicit EULA acceptance and Developer edition are for this evaluation example.
license:
  acceptEULA: true
sql:
  edition: Developer
metrics:
  # External DSNs use certificate=/tls/ca.pem (the Secret key remains ca.crt).
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  prometheusRule:
    enabled: true
    labels:
      release: prometheus
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
