# SPDX-License-Identifier: Apache-2.0
license:
  acceptEULA: true
auth:
  existingSecret: mssql-auth
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: mssql-auth
      spec:
        secretStoreRef:
          name: production-secrets
          kind: ClusterSecretStore
        data:
          - secretKey: sa-password
            remoteRef:
              key: production/mssql
              property: sa-password
          - secretKey: probe-password
            remoteRef:
              key: production/mssql
              property: probe-password
          - secretKey: metrics-password
            remoteRef:
              key: production/mssql
              property: metrics-password
          - secretKey: backup-password
            remoteRef:
              key: production/mssql
              property: backup-password
