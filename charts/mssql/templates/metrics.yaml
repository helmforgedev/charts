{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.license.acceptEULA .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mssql.fullname" . }}-metrics
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
data:
  sql_exporter.yml: |
    global:
      scrape_timeout: 8s
      scrape_timeout_offset: 500ms
      max_connections: 2
      max_idle_connections: 1
    target:
      # Upstream checks this field before applying SQLEXPORTER_TARGET_DSN.
      data_source_name: sqlserver://invalid.invalid:1433
      collectors: [mssql]
    collector_files:
      - /config/mssql.collector.yml
  mssql.collector.yml: |
    {{- .Files.Get "files/mssql.collector.yml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mssql.fullname" . }}-metrics
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mssql.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mssql.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: metrics
      annotations:
        checksum/collector: {{ .Files.Get "files/mssql.collector.yml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ printf "%s:%s" .Values.metrics.image.repository .Values.metrics.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/config/sql_exporter.yml
            - {{ printf "-web.listen-address=:%v" .Values.metrics.port | quote }}
          env:
            - name: SQLEXPORTER_TARGET_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret | default (printf "%s-metrics" (include "mssql.fullname" .)) }}
                  key: {{ .Values.metrics.secretKey | default "dsn" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "mssql.fullname" . }}-metrics
        - name: tls
          secret:
            secretName: {{ include "mssql.tlsSecret" . }}
            items:
              - key: ca.crt
                path: ca.pem
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mssql.fullname" . }}-metrics
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
    monitoring.helmforge.dev/component: mssql-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "mssql.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mssql.fullname" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      monitoring.helmforge.dev/component: mssql-metrics
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mssql.fullname" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "mssql.fullname" . }}.availability
      rules:
        - alert: MSSQLMetricsUnavailable
          expr: >-
            up{namespace={{ .Release.Namespace | quote }},service={{ printf "%s-metrics" (include "mssql.fullname" .) | quote }}} == 0
            or absent(up{namespace={{ .Release.Namespace | quote }},service={{ printf "%s-metrics" (include "mssql.fullname" .) | quote }}})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: SQL Server metrics are unavailable or missing
            description: Check exporter connectivity, SQL credentials, collector permissions, and Prometheus discovery.
        - alert: MSSQLDatabaseNotOnline
          expr: >-
            mssql_database_state{namespace={{ .Release.Namespace | quote }},service={{ printf "%s-metrics" (include "mssql.fullname" .) | quote }}} != 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A monitored SQL Server database is not online
            description: Check database recovery state and planned maintenance before taking action.
{{- end }}
{{- end }}
