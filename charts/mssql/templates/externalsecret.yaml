{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.license.acceptEULA .Values.externalSecrets.enabled }}
{{- include "mssql.validateExternalSecrets" . }}
{{- range .Values.externalSecrets.items | default list }}
{{- $externalSecretName := include "mssql.externalSecretName" (dict "root" $ "item" .) }}
{{- $spec := deepCopy (.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}
{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}
{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}
{{- $_ := set $target "name" $externalSecretName }}
{{- $_ := set $spec "target" $target }}
{{- end }}
{{- $hasStoreRef := not (empty (dig "secretStoreRef" "name" "" $spec)) }}
{{- range ($spec.data | default list) }}
{{- if hasKey (.sourceRef | default dict) "generatorRef" }}
{{- fail "ExternalSecret data entries do not support generatorRef; use dataFrom instead" }}
{{- end }}
{{- if and (not $hasStoreRef) (not (dig "sourceRef" "storeRef" "name" "" .)) }}
{{- fail "every ExternalSecret data entry requires sourceRef.storeRef.name when spec.secretStoreRef.name is absent" }}
{{- end }}
{{- end }}
{{- range ($spec.dataFrom | default list) }}
{{- $source := .sourceRef | default dict }}
{{- if and (hasKey $source "storeRef") (hasKey $source "generatorRef") }}
{{- fail "ExternalSecret dataFrom sourceRef cannot combine storeRef and generatorRef" }}
{{- end }}
{{- if and (hasKey $source "generatorRef") (or .extract .find) }}
{{- fail "ExternalSecret dataFrom generatorRef cannot be combined with extract or find" }}
{{- end }}
{{- if and (not $hasStoreRef) (not (or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .))) }}
{{- fail "every ExternalSecret dataFrom entry requires sourceRef.storeRef.name or sourceRef.generatorRef.name when spec.secretStoreRef.name is absent" }}
{{- end }}
{{- end }}
{{- if and (not $hasStoreRef) (not $spec.data) (not $spec.dataFrom) }}
{{- fail "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $externalSecretName }}
  labels:
    {{- include "mssql.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
