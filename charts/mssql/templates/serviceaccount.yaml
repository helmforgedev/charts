{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.license.acceptEULA .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mssql.serviceAccountName" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
