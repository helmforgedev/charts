{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.license.acceptEULA .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mssql.serviceAccountName" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  {{- include "mssql.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
