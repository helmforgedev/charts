{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.license.acceptEULA }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $dataAnnotations := deepCopy (.Values.persistence.annotations | default dict) }}
{{- if .Values.persistence.retain }}{{- $_ := set $dataAnnotations "helm.sh/resource-policy" "keep" }}{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mssql.dataClaim" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  {{- include "mssql.renderAnnotations" (dict "root" . "specific" $dataAnnotations) | nindent 2 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ ternary "" .Values.persistence.storageClass (eq .Values.persistence.storageClass "-") | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.staging.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mssql.backupClaim" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  {{- include "mssql.renderAnnotations" (dict "root" . "specific" (ternary (dict "helm.sh/resource-policy" "keep") (dict) .Values.backup.staging.retain)) | nindent 2 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.backup.staging.storageClass }}
  storageClassName: {{ ternary "" .Values.backup.staging.storageClass (eq .Values.backup.staging.storageClass "-") | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.staging.size }}
{{- end }}
{{- end }}
