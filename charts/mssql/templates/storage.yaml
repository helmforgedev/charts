{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.license.acceptEULA }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mssql.dataClaim" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ ternary "" .Values.persistence.storageClass (eq .Values.persistence.storageClass "-") | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.staging.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mssql.backupClaim" . }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
  {{- if .Values.backup.staging.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.backup.staging.storageClass }}
  storageClassName: {{ ternary "" .Values.backup.staging.storageClass (eq .Values.backup.staging.storageClass "-") | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.staging.size }}
{{- end }}
{{- end }}
