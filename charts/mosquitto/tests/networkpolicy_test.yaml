# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: should allow only named broker listener ports by default
    documentIndex: 0
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: broker
      - contains:
          path: spec.ingress[0].ports
          content:
            port: mqtt
            protocol: TCP
      - contains:
          path: spec.ingress[0].ports
          content:
            port: websocket
            protocol: TCP

  - it: should render a separate MQTTX policy when enabled
    set:
      mqttxWeb.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: mqttx-web
      - contains:
          path: spec.ingress[0].ports
          content:
            port: http
            protocol: TCP

  - it: should omit all NetworkPolicies when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
