# SPDX-License-Identifier: Apache-2.0
suite: Validation
templates:
  - templates/validate.yaml
tests:
  - it: should render no validation manifest by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should reject multiple standalone replicas
    set:
      broker.replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: architecture.mode=standalone requires broker.replicaCount=1"

  - it: should reject one federated replica
    set:
      architecture.mode: federated
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: architecture.mode=federated requires broker.replicaCount>=2"

  - it: should reject TLS without an existing certificate Secret
    set:
      broker.tls.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: broker.tls.certSecretName is required when broker.tls.enabled=true"

  - it: should reject WebSocket ingress without hosts
    set:
      websocketIngress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: websocketIngress.hosts must contain at least one host when websocketIngress.enabled=true"

  - it: should reject MQTTX ingress without the companion deployment
    set:
      mqttxWeb.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: mqttxWeb.enabled must be true when mqttxWeb.ingress.enabled=true"

  - it: should reject broker selector label overrides
    set:
      podLabels:
        app.kubernetes.io/component: custom
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: podLabels must not override the selector label app.kubernetes.io/component"

  - it: should reject MQTTX selector label overrides
    set:
      mqttxWeb.podLabels:
        app.kubernetes.io/name: custom
    asserts:
      - failedTemplate:
          errorMessage: "mosquitto: podLabels must not override the selector label app.kubernetes.io/name"
