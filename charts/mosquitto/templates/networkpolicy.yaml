{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mosquitto.fullname" . }}-broker
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  podSelector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: broker
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- if not .Values.broker.tls.enabled }}
        - port: mqtt
          protocol: TCP
        {{- end }}
        {{- if .Values.broker.listeners.websocketEnabled }}
        - port: websocket
          protocol: TCP
        {{- end }}
        {{- if .Values.broker.tls.enabled }}
        - port: mqtts
          protocol: TCP
        {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.mqttxWeb.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mosquitto.fullname" . }}-mqttx
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqttx-web
spec:
  podSelector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqttx-web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.mqttxExtraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
