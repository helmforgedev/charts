{{- if .Values.mqttxWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosquitto.fullname" . }}-mqttx
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqttx-web
spec:
  replicas: {{ .Values.mqttxWeb.replicaCount }}
  selector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqttx-web
  template:
    metadata:
      labels:
        {{- include "mosquitto.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mqttx-web
        {{- with .Values.mqttxWeb.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mqttxWeb.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      serviceAccountName: {{ include "mosquitto.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.mqttxWeb.podSecurityContext | nindent 8 }}
      containers:
        - name: mqttx-web
          image: {{ include "mosquitto.mqttxImage" . | quote }}
          imagePullPolicy: {{ .Values.mqttxWeb.image.pullPolicy }}
          args:
            - http-server
            - -p
            - {{ .Values.mqttxWeb.containerPort | quote }}
          env:
            - name: HELMFORGE_DEFAULT_CONNECTION_NAME
              value: {{ .Values.mqttxWeb.broker.connectionName | quote }}
            - name: HELMFORGE_DEFAULT_BROKER_URL
              value: {{ include "mosquitto.websocketUrl" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.mqttxWeb.containerPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.mqttxWeb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.mqttxWeb.securityContext | nindent 12 }}
{{- end }}
{{- if .Values.mqttxWeb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosquitto.fullname" . }}-mqttx
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqttx-web
  {{- with .Values.mqttxWeb.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mqttxWeb.service.type }}
  selector:
    {{- include "mosquitto.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mqttx-web
  ports:
    - name: http
      port: {{ .Values.mqttxWeb.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
