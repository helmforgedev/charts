{{- include "gophish.validateAll" . }}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophish.fullname" . }}-backup
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- include "gophish.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    ts="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backup/{{ .Values.backup.archivePrefix }}-${ts}.tar.gz"
    db_path="{{ .Values.database.sqlite.path }}"
    data_dir="{{ include "gophish.sqliteDirectory" . }}"
    if [ ! -f "${db_path}" ]; then
      echo "SQLite database not found at ${db_path}" >&2
      exit 1
    fi
    tar -czf "${archive}" -C "${data_dir}" .
    sha256sum "${archive}" > "${archive}.sha256"
    echo "${archive}" > /backup/latest-archive
    echo "Created ${archive}"
  upload.sh: |
    #!/bin/sh
    set -eu
    archive="$(cat /backup/latest-archive)"
    target="backup/{{ .Values.backup.s3.prefix }}/$(basename "${archive}")"
    {{- if .Values.backup.s3.credentialsFromPodIdentity }}
    export MC_HOST_backup="${S3_ENDPOINT}"
    sts_domain="amazonaws.com"
    case "${AWS_REGION}" in
      cn-*) sts_domain="amazonaws.com.cn" ;;
    esac
    export MC_STS_ENDPOINT_backup="https://sts.${AWS_REGION}.${sts_domain}"
    {{- else }}
    mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" --api S3v4
    {{- end }}
    {{- if .Values.backup.s3.createBucketIfNotExists }}
    mc mb --ignore-existing "backup/{{ .Values.backup.s3.bucket }}"
    {{- end }}
    mc cp "${archive}" "backup/{{ .Values.backup.s3.bucket }}/{{ .Values.backup.s3.prefix }}/"
    mc cp "${archive}.sha256" "backup/{{ .Values.backup.s3.bucket }}/{{ .Values.backup.s3.prefix }}/"
    echo "Uploaded ${target}"
{{- end }}
