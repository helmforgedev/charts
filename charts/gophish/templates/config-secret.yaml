{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "gophish.validateAll" . }}
{{- if not .Values.gophish.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophish.configSecretName" . }}
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
  {{- include "gophish.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  {{ include "gophish.configSecretKey" . }}: |
    {{- include "gophish.configPayload" . | nindent 4 }}
{{- end }}
