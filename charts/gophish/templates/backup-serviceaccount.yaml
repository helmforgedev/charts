{{- include "gophish.validateAll" . }}
{{- if and .Values.backup.enabled .Values.backup.s3.credentialsFromPodIdentity .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophish.backupServiceAccountName" . }}
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- include "gophish.renderAnnotations" (dict "root" . "specific" .Values.backup.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
