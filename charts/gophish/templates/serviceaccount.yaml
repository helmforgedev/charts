{{- include "gophish.validateAll" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophish.serviceAccountName" . }}
  labels:
    {{- include "gophish.labels" . | nindent 4 }}
  {{- include "gophish.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
