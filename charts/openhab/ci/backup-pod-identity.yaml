commonAnnotations:
  helmforge.dev/contract-test: openhab

backup:
  enabled: true
  suspend: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/openhab-backup
  s3:
    endpoint: https://s3.amazonaws.com
    bucket: openhab-backups
    region: us-east-1
    credentialsFromPodIdentity: true
