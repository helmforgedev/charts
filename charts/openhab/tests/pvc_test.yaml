# SPDX-License-Identifier: Apache-2.0
suite: PersistentVolumeClaims
templates:
  - pvc.yaml
tests:
  - it: should create 3 PVCs by default
    asserts:
      - hasDocuments:
          count: 3

  - it: should create userdata PVC with correct size
    documentIndex: 0
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce

  - it: should create conf PVC with correct size
    documentIndex: 1
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: should create addons PVC with correct size
    documentIndex: 2
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi

  - it: should not create PVCs when existing claims are set
    set:
      persistence.userdata.existingClaim: smarthome-data
      persistence.conf.existingClaim: smarthome-data
      persistence.addons.existingClaim: smarthome-data
    asserts:
      - hasDocuments:
          count: 0

  - it: should set custom storageClass for userdata
    set:
      persistence.userdata.storageClass: fast-ssd
    documentIndex: 0
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: should not create userdata PVC when disabled
    set:
      persistence.userdata.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: should create no PVCs when all disabled
    set:
      persistence.userdata.enabled: false
      persistence.conf.enabled: false
      persistence.addons.enabled: false
    asserts:
      - hasDocuments:
          count: 0
