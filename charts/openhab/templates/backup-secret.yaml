{{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsFromPodIdentity) (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhab.fullname" . }}-backup
  namespace: {{ include "openhab.namespace" . }}
  labels:
    {{- include "openhab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- include "openhab.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
{{- end }}
