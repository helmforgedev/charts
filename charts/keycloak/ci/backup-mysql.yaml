# CI: Backup enabled with MySQL subchart
mode: production

hostname:
  hostname: https://sso.example.com

deployment:
  progressDeadlineSeconds: 1200

mysql:
  enabled: true
  auth:
    database: keycloak
    username: keycloak
    password: ci-test-password
  config:
    # The CI database is disposable. Avoid synchronous durability overhead on
    # nested container storage while preserving production defaults.
    myCnf: |
      [mysqld]
      innodb_doublewrite=OFF
      innodb_flush_log_at_trx_commit=0
      sync_binlog=0

backup:
  enabled: true
  suspend: true
  s3:
    endpoint: https://minio.example.com
    bucket: keycloak-backups
    accessKey: test-access
    secretKey: test-secret
