# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - backup-configmap.yaml
  - backup-cronjob.yaml
  - backup-serviceaccount.yaml
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render backup resources by default
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render backup cronjob by default
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render backup configmap for postgresql subchart mode
    set:
      postgresql.enabled: true
      postgresql.auth.password: devpass
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: backup-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap

  - it: should render backup cronjob for postgresql subchart mode
    set:
      postgresql.enabled: true
      postgresql.auth.password: devpass
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: backup-cronjob.yaml
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: test-postgresql
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should render backup cronjob for mysql subchart mode
    set:
      mysql.enabled: true
      mysql.auth.password: devpass
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: test-mysql

  - it: should use ambient AWS credentials with a dedicated ServiceAccount
    set:
      postgresql.enabled: true
      postgresql.auth.password: devpass
      backup.enabled: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/keycloak-backup
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-keycloak-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
          any: true

  - it: should create the annotated backup ServiceAccount
    set:
      postgresql.enabled: true
      postgresql.auth.password: devpass
      commonAnnotations:
        example.com/owner: platform
      backup.enabled: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/keycloak-backup
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    template: backup-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-keycloak-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/keycloak-backup
