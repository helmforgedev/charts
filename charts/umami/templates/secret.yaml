{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (not .Values.umami.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.app.enabled)) }}
{{- $name := printf "%s-app" (include "umami.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingValue := dig "data" "app-secret" "" ($existing | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
  {{- include "umami.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  {{- if .Values.umami.appSecret }}
  app-secret: {{ .Values.umami.appSecret | b64enc | quote }}
  {{- else if $existingValue }}
  app-secret: {{ $existingValue | quote }}
  {{- else }}
  app-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.database.external.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.database.enabled)) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "umami.fullname" .) }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
  {{- include "umami.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsFromPodIdentity) (not .Values.backup.s3.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.backup.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "umami.fullname" .) }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
  {{- include "umami.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
