# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - backup-cronjob.yaml
  - backup-configmap.yaml
  - backup-serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not create backup configmap when disabled
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create backup cronjob when disabled
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create backup CronJob when enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "0 3 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should create backup ConfigMap when enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: should use custom schedule
    set:
      backup.enabled: true
      backup.schedule: "0 */6 * * *"
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */6 * * *"

  - it: should set suspend flag
    set:
      backup.enabled: true
      backup.suspend: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.suspend
          value: true

  - it: should use postgresql subchart host by default
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: test-postgresql

  - it: should fail without s3 endpoint
    set:
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail without s3 bucket
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.bucket is required when backup.enabled is true"

  - it: should use workload identity without static credential references
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    template: backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-umami-backup
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1

  - it: should render a dedicated IRSA-annotated backup ServiceAccount
    set:
      commonAnnotations:
        example.com/owner: platform
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/umami-backup
    template: backup-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-umami-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/umami-backup

  - it: should require a region for workload identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.credentialsFromPodIdentity: true
    template: backup-cronjob.yaml
    asserts:
      - failedTemplate:
          errorMessage: backup.s3.region is required when backup.s3.credentialsFromPodIdentity is true
