# SPDX-License-Identifier: Apache-2.0
suite: Managed Secret upgrade retention
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-umami-app
        namespace: default
      data:
        app-secret: cmV0YWluZWQtYXBwLXNlY3JldA==
tests:
  - it: should retain the generated application secret
    asserts:
      - equal:
          path: data["app-secret"]
          value: cmV0YWluZWQtYXBwLXNlY3JldA==

  - it: should prefer an explicit application secret
    set:
      umami.appSecret: replacement-app-secret
    asserts:
      - equal:
          path: data["app-secret"]
          value: cmVwbGFjZW1lbnQtYXBwLXNlY3JldA==
