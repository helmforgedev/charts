initContainers:
  waitForDatabase:
    enabled: false

extraInitContainers:
  - name: platform-database-readiness
    image: docker.io/library/busybox:1.37
    command:
      - sh
      - -ec
    args:
      - |
        until nc -z -w2 umami-ci-wait-for-db-disabled-postgresql 5432; do
          sleep 2
        done
