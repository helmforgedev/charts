# CI scenario: render an S3 backup that uses a dedicated workload identity.
backup:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/postgresql-backup
  s3:
    endpoint: https://s3.us-east-2.amazonaws.com
    bucket: postgresql-backups
    region: us-east-2
    credentialsFromPodIdentity: true
