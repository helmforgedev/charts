{{- if include "postgresql.backupEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-backup-scripts
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- include "postgresql.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  postgresql-backup.sh: |
    #!/bin/sh
    set -eu
    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backup/out/${BACKUP_ARCHIVE_PREFIX}-postgresql-${timestamp}.sql.gz"
    mkdir -p /backup/out
    export PGPASSWORD="${POSTGRES_PASSWORD}"
    pg_dumpall ${PG_DUMPALL_EXTRA_ARGS:-} \
      --host="${DB_HOST}" \
      --port="${DB_PORT}" \
      --username=postgres \
      --database=postgres | gzip -c > "${archive}"
    printf "%s" "${archive}" > /backup/out/backup-file
  upload-backup.sh: |
    #!/bin/sh
    set -eu
    archive="$(cat /backup/out/backup-file)"
    target="backup/${S3_BUCKET}"
    if [ -n "${S3_PREFIX:-}" ]; then
      target="${target}/${S3_PREFIX}"
    fi
    {{- if .Values.backup.s3.credentialsFromPodIdentity }}
    export MC_HOST_backup="${S3_ENDPOINT}"
    sts_domain="amazonaws.com"
    case "${AWS_REGION}" in
      cn-*) sts_domain="amazonaws.com.cn" ;;
    esac
    export MC_STS_ENDPOINT_backup="https://sts.${AWS_REGION}.${sts_domain}"
    {{- else }}
    mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
    {{- end }}
    if [ "${S3_CREATE_BUCKET_IF_NOT_EXISTS}" = "true" ]; then
      {{- if .Values.backup.s3.credentialsFromPodIdentity }}
      mc mb --ignore-existing --region="${AWS_REGION}" "backup/${S3_BUCKET}"
      {{- else }}
      mc mb --ignore-existing "backup/${S3_BUCKET}"
      {{- end }}
    fi
    mc cp "${archive}" "${target}/"
{{- end }}
