{{- if and (include "postgresql.backupEnabled" .) .Values.backup.s3.credentialsFromPodIdentity .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgresql.backupServiceAccountName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- include "postgresql.renderAnnotations" (dict "root" . "specific" .Values.backup.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
{{- end }}
