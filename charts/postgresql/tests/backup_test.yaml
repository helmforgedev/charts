# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-configmap.yaml
  - templates/backup-cronjob.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render backup resources by default
    template: templates/backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render backup cronjob by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render backup configmap
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["postgresql-backup.sh"]
          pattern: "--database=postgres"

  - it: should render backup cronjob
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/backup-cronjob.yaml
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: test-postgresql
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should use the IAM credential chain for Pod Identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.us-east-2.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-2
      backup.s3.credentialsFromPodIdentity: true
    template: templates/backup-configmap.yaml
    asserts:
      - matchRegex:
          path: data["upload-backup.sh"]
          pattern: "export MC_HOST_backup=\"\\$\\{S3_ENDPOINT\\}\""
      - matchRegex:
          path: data["upload-backup.sh"]
          pattern: "export MC_STS_ENDPOINT_backup=\"https://sts\\.\\$\\{AWS_REGION\\}\\.\\$\\{sts_domain\\}\""
      - matchRegex:
          path: data["upload-backup.sh"]
          pattern: "mc mb --ignore-existing --region=\"\\$\\{AWS_REGION\\}\""
      - notMatchRegex:
          path: data["upload-backup.sh"]
          pattern: "mc alias set"

  - it: should inject AWS region and use the dedicated backup ServiceAccount
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.us-east-2.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-2
      backup.s3.credentialsFromPodIdentity: true
    template: templates/backup-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-postgresql-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-2
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY

  - it: should create an annotated dedicated ServiceAccount for Pod Identity
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.us-east-2.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-2
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/postgresql-backup
    template: templates/backup-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/postgresql-backup

  - it: should reject Pod Identity without a region
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.credentialsFromPodIdentity: true
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.region is required when backup.s3.credentialsFromPodIdentity is true"

  - it: should require an existing dedicated ServiceAccount when creation is disabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.us-east-2.amazonaws.com
      backup.s3.bucket: backups
      backup.s3.region: us-east-2
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "backup.serviceAccount.name is required when Pod Identity is enabled and backup.serviceAccount.create is false"

  - it: should render backup secret when using inline s3 credentials
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    template: templates/secret.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Secret

  - it: should not require inline s3 credentials when backup ExternalSecret is enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: backups
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: platform-secrets
      externalSecrets.backup.enabled: true
      externalSecrets.backup.accessKeyRemoteRef:
        key: postgresql/backup
        property: access-key
      externalSecrets.backup.secretKeyRemoteRef:
        key: postgresql/backup
        property: secret-key
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
