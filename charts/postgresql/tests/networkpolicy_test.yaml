# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not create NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - hasDocuments:
          count: 1

  - it: should allow all pods in same namespace by default
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector: {}

  - it: should allow ingress on postgres port
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 5432

  - it: should add egress policy when enabled
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: TCP
            port: 5432
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: UDP
            port: 53
      - contains:
          path: spec.egress[2].ports
          content:
            protocol: TCP
            port: 443

  - it: should render extraEgress rules when specified
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.extraEgress:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - protocol: TCP
              port: 8080
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - protocol: TCP
                port: 8080

  - it: should render deprecated extraTo rules when specified
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.extraTo:
        - to:
            - ipBlock:
                cidr: 172.16.0.0/12
          ports:
            - protocol: TCP
              port: 9000
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 172.16.0.0/12
            ports:
              - protocol: TCP
                port: 9000
