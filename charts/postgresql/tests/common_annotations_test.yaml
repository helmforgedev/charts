# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/statefulset-primary.yaml
  - templates/configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: applies common annotations to the client Service
    template: templates/service.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: lets Service annotations override common annotations
    template: templates/service.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
      service:
        annotations:
          example.com/owner: database
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: database

  - it: applies common annotations to the workload ServiceAccount
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      commonAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: applies common annotations to the primary StatefulSet without copying them to the pod template
    template: templates/statefulset-primary.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - notExists:
          path: spec.template.metadata.annotations["example.com/owner"]
