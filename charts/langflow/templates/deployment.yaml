{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: Deployment
{{- $securityProfile := .Values.securityProfile | default dict }}
{{- $securityProfileEnabled := get $securityProfile "enabled" | default false }}
{{- $usedMountPaths := dict .Values.persistence.mountPath true }}
{{- range (.Values.extraVolumeMounts | default list) }}
{{- if .mountPath }}
{{- $_ := set $usedMountPaths .mountPath true }}
{{- end }}
{{- end }}
{{- $mountRuntimeTmp := and $securityProfileEnabled (not (hasKey $usedMountPaths "/tmp")) }}
{{- $mountRuntimeNpm := and $securityProfileEnabled (not (hasKey $usedMountPaths "/app/.npm")) }}
{{- $mountRuntimeOptNpm := and $securityProfileEnabled (not (hasKey $usedMountPaths "/opt/app-root/src/.npm")) }}
metadata:
  name: {{ include "langflow.fullname" . }}
  labels:
    {{- include "langflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "langflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "langflow.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "langflow.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $explicitPodSecurityContext := .Values.podSecurityContext | default dict }}
      {{- $podSecurityContext := $explicitPodSecurityContext }}
      {{- if $securityProfileEnabled }}
      {{- $defaultPodSecurityContext := dict "runAsNonRoot" true "runAsUser" 1000 "runAsGroup" 0 "seccompProfile" (dict "type" "RuntimeDefault") }}
      {{- $profilePodSecurityContext := get $securityProfile "podSecurityContext" | default dict }}
      {{- $podSecurityContext = mergeOverwrite (deepCopy $defaultPodSecurityContext) $profilePodSecurityContext $explicitPodSecurityContext }}
      {{- if hasKey $explicitPodSecurityContext "seccompProfile" }}
      {{- $_ := set $podSecurityContext "seccompProfile" (deepCopy (get $explicitPodSecurityContext "seccompProfile")) }}
      {{- else if hasKey $profilePodSecurityContext "seccompProfile" }}
      {{- $_ := set $podSecurityContext "seccompProfile" (deepCopy (get $profilePodSecurityContext "seccompProfile")) }}
      {{- end }}
      {{- end }}
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ include "langflow.name" . }}
          image: {{ include "langflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.app.command }}
          command:
            {{- toYaml .Values.app.command | nindent 12 }}
          {{- end }}
          {{- if .Values.app.args }}
          args:
            {{- toYaml .Values.app.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP

          env:
            - name: LANGFLOW_HOST
              value: "0.0.0.0"
            - name: LANGFLOW_PORT
              value: {{ .Values.app.port | quote }}
            - name: LANGFLOW_CONFIG_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: LANGFLOW_SAVE_DB_IN_CONFIG_DIR
              value: "true"
            - name: LANGFLOW_OPEN_BROWSER
              value: "false"
            - name: LANGFLOW_AUTO_LOGIN
              value: {{ .Values.auth.autoLogin | quote }}
            - name: LANGFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "langflow.fullname" .) .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKeyKey }}
            - name: LANGFLOW_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "langflow.fullname" .) .Values.auth.existingSecret }}
                  key: {{ .Values.auth.superuserKey }}
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "langflow.fullname" .) .Values.auth.existingSecret }}
                  key: {{ .Values.auth.superuserPasswordKey }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: LANGFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-database" (include "langflow.fullname" .)) .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            {{- end }}
            {{- range .Values.app.env }}
            - name: {{ .name }}
              {{- if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ default "" .value | quote }}
              {{- end }}
            {{- end }}
            
            {{- with .Values.app.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          {{- with .Values.app.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- $securityContext := .Values.securityContext | default dict }}
          {{- if $securityProfileEnabled }}
          {{- $defaultContainerSecurityContext := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
          {{- $profileContainerSecurityContext := get $securityProfile "containerSecurityContext" | default dict }}
          {{- $securityContext = mergeOverwrite (deepCopy $defaultContainerSecurityContext) $profileContainerSecurityContext $securityContext }}
          {{- end }}
          {{- with $securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if $mountRuntimeTmp }}
            - { name: runtime-tmp, mountPath: /tmp }
            {{- end }}
            {{- if $mountRuntimeNpm }}
            - { name: runtime-npm, mountPath: /app/.npm }
            {{- end }}
            {{- if $mountRuntimeOptNpm }}
            - { name: runtime-opt-npm, mountPath: /opt/app-root/src/.npm }
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "langflow.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $mountRuntimeTmp }}
        - { name: runtime-tmp, emptyDir: {} }
        {{- end }}
        {{- if $mountRuntimeNpm }}
        - { name: runtime-npm, emptyDir: {} }
        {{- end }}
        {{- if $mountRuntimeOptNpm }}
        - { name: runtime-opt-npm, emptyDir: {} }
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
