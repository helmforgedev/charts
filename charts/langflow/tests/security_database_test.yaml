# SPDX-License-Identifier: Apache-2.0
suite: langflow security and database
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
tests:
  - it: stops old instances before starting migrations and requires login
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_AUTO_LOGIN
            value: "false"
        template: templates/deployment.yaml
  - it: allows explicit development automatic login
    set:
      auth.autoLogin: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_AUTO_LOGIN
            value: "true"
        template: templates/deployment.yaml
  - it: generates required credentials and wires them by default
    asserts:
      - isKind:
          of: Secret
        template: templates/secret.yaml
      - matchRegex:
          path: stringData.secret-key
          pattern: "^[A-Za-z0-9_-]{43}=$"
        template: templates/secret.yaml
      - equal:
          path: stringData.superuser
          value: langflow
        template: templates/secret.yaml
      - isNotEmpty:
          path: stringData.superuser-password
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-langflow
                key: secret-key
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_SUPERUSER
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-langflow
                key: superuser
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_SUPERUSER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-langflow
                key: superuser-password
        template: templates/deployment.yaml
  - it: renders auth secret and wires Langflow secret env vars
    values:
      - secure-values.yaml
    asserts:
      - isKind:
          of: Secret
        template: templates/secret.yaml
      - equal:
          path: stringData.secret-key
          value: test-secret-key
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-langflow
                key: secret-key
        template: templates/deployment.yaml
  - it: renders external database URL secret
    values:
      - external-database-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGFLOW_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-langflow-database
                key: database-url
        template: templates/deployment.yaml
