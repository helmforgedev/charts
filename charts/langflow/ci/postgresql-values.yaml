# SPDX-License-Identifier: Apache-2.0
# Real external PostgreSQL for database migration and encrypted credential checks.
database:
  mode: external
  url: postgresql+psycopg://langflow:ci-langflow-database@langflow-postgresql:5432/langflow
extraManifests:
  - apiVersion: v1
    kind: Service
    metadata:
      name: langflow-postgresql
    spec:
      selector:
        app: langflow-postgresql
      ports:
        - name: postgresql
          port: 5432
          targetPort: postgresql
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: langflow-postgresql
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: langflow-postgresql
      template:
        metadata:
          labels:
            app: langflow-postgresql
        spec:
          securityContext:
            fsGroup: 999
          containers:
            - name: postgresql
              image: docker.io/library/postgres:18.6-trixie
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
              env:
                - name: POSTGRES_DB
                  value: langflow
                - name: POSTGRES_USER
                  value: langflow
                - name: POSTGRES_PASSWORD
                  value: ci-langflow-database
              ports:
                - name: postgresql
                  containerPort: 5432
              readinessProbe:
                exec:
                  command: [pg_isready, -U, langflow, -d, langflow]
                periodSeconds: 5
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql
          volumes:
            - name: data
              emptyDir: {}
