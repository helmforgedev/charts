# SPDX-License-Identifier: Apache-2.0
fullnameOverride: papra-s3
persistence:
  size: 1Gi
storage:
  driver: s3
  encryptionSecret: fixture-encryption
  s3:
    endpoint: http://fixture-s3:8333
    region: us-east-1
    bucket: papra
    existingSecret: fixture-s3
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels: {app: fixture-s3}
      ports: [{protocol: TCP, port: 8333}]
