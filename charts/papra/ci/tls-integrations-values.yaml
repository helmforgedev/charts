# SPDX-License-Identifier: Apache-2.0
fullnameOverride: papra-tls
persistence:
  size: 1Gi
storage:
  driver: s3
  encryptionSecret: fixture-encryption
  s3:
    endpoint: https://fixture-integrations:9443
    region: us-east-1
    bucket: papra
    existingSecret: fixture-s3
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-integrations
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9443
server:
  trustedCaSecret: fixture-integrations-tls
database:
  remoteUrl: https://fixture-integrations:8443
  authTokenSecret: fixture-libsql
