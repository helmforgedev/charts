# SPDX-License-Identifier: Apache-2.0
fullnameOverride: papra-libsql
persistence:
  size: 1Gi
database:
  remoteUrl: libsql://fixture-libsql:8080?tls=0
  authTokenSecret: fixture-libsql
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-libsql
      ports:
        - protocol: TCP
          port: 8080
