{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "papra.validate" . }}
{{- if (not .Values.auth.existingSecret) }}
{{- $name := include "papra.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $value := .Values.auth.secret | default (get $data .Values.auth.secretKey | default "" | b64dec) | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "papra.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ $value | b64enc | quote }}
{{- end }}
