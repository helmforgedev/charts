{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "papra.serviceAccountName" . }}
  labels:
    {{- include "papra.labels" . | nindent 4 }}
  {{- include "papra.renderAnnotations" (dict "root" . "context" "serviceAccount") | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
