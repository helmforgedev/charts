{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "papra.fullname" . | trunc 53 | trimSuffix "-" }}-bootstrap
  labels: {{ include "papra.labels" . | nindent 4 }}
data:
  bootstrap.mjs: |
    {{- .Files.Get "files/bootstrap.mjs" | nindent 4 }}
{{- end }}
