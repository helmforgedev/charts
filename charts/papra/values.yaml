# SPDX-License-Identifier: Apache-2.0
# -- Name Override.
nameOverride: ''
# -- Fullname Override.
fullnameOverride: ''
# -- Common Labels.
commonLabels: {}
# -- Single writer; only one replica is supported for native jobs and document state.
replicaCount: 1
# -- Image.
image:
  # -- Repository.
  repository: ghcr.io/papra-hq/papra
  # -- Tag.
  tag: 26.6.2-rootless
  # -- Pull Policy.
  pullPolicy: IfNotPresent
# -- Image Pull Secrets.
imagePullSecrets: []
# -- Auth.
auth:
  # -- Session signing secret; empty generates and retains a strong value. Prefer an existing Secret for GitOps.
  secret: ''
  # -- Existing Secret containing the stable session signing key; takes precedence over generated state.
  existingSecret: ''
  # -- Secret Key.
  secretKey: auth-secret
  # -- Allow native password signup for ordinary users; closed by default. Does not restrict custom OAuth providers.
  allowRegistration: false
# -- Server.
server:
  # -- Port.
  port: 1221
  # -- Browser-facing origin used by native authentication. Use the exact HTTPS origin in production.
  publicUrl: http://localhost:1221
  # -- Existing Secret with a CA bundle extending Node trust for HTTPS integrations.
  trustedCaSecret: ''
  # -- CA bundle key; TLS verification remains enabled.
  trustedCaKey: ca.crt
# -- Additional unmanaged environment variables; authentication, storage and database settings are chart-owned.
extraEnv: []
# -- Advanced environment imports for both migrations/bootstrap and the application. Explicit managed variables take precedence.
envFrom: []
# -- Persistent native background queue, stored separately from the application database on the data volume.
tasks:
  # -- Run the native worker alongside the web API. False pauses consumption while preserving pending work.
  workerEnabled: true
  # -- Local persistent libSQL polling interval. Completed jobs are retained; in-flight jobs have no native crash reaper.
  pollIntervalMs: 1000
# -- Native database connection. Papra supports SQLite and libSQL, not PostgreSQL or MySQL.
database:
  # -- Empty uses the persistent local SQLite database; remote URLs must use libsql:// or https://.
  remoteUrl: ''
  # -- Existing Secret containing a remote libSQL authentication token.
  authTokenSecret: ''
  # -- Remote authentication token key.
  authTokenKey: auth-token
  # -- Existing Secret with the local database encryption key, selected before first database creation.
  encryptionSecret: ''
  # -- Local database encryption key. Preserve the exact key for recovery; remote URLs cannot use it.
  encryptionKey: database-encryption-key
# -- Native original-document storage and optional envelope encryption.
storage:
  # -- filesystem or s3. SQLite and configuration still require persistent storage with S3.
  driver: filesystem
  # -- Existing Secret containing the native document encryption key ring.
  encryptionSecret: ''
  # -- Secret key containing one 64-hex key or versioned keys such as 001:hex,002:hex.
  encryptionKey: document-encryption-keys
  s3:
    # -- Use path-style bucket addressing for compatible endpoints.
    forcePathStyle: true
    # -- S3 API endpoint.
    endpoint: ''
    # -- S3 region.
    region: ''
    # -- Existing bucket; the chart does not create buckets.
    bucket: ''
    # -- Existing Secret containing native static S3 credentials.
    existingSecret: ''
    # -- Access key identifier key.
    accessKeyIdKey: access-key-id
    # -- Secret access key key.
    secretAccessKeyKey: secret-access-key
# -- Service Account.
serviceAccount:
  # -- Create.
  create: true
  # -- Name.
  name: ''
  # -- Annotations.
  annotations: {}
  # -- Automount Service Account Token.
  automountServiceAccountToken: false
# -- Service.
service:
  # -- Type.
  type: ClusterIP
  # -- Port.
  port: 1221
  # -- Annotations.
  annotations: {}
  # -- Ip Family Policy.
  ipFamilyPolicy: ''
  # -- Ip Families.
  ipFamilies: []
# -- Ingress.
ingress:
  # -- Enabled.
  enabled: false
  # -- Ingress Class Name.
  ingressClassName: ''
  # -- Annotations.
  annotations: {}
  # -- Hosts.
  hosts: []
  # -- Tls.
  tls: []
# -- Gateway.
gateway:
  # -- Enabled.
  enabled: false
  # -- Annotations.
  annotations: {}
  # -- Parent Refs.
  parentRefs: []
  # -- Hostnames.
  hostnames: []
  # -- Path.
  path: /
  # -- Path Type.
  pathType: PathPrefix
# -- External Secrets.
externalSecrets:
  # -- Enabled.
  enabled: false
  # -- Refresh Interval.
  refreshInterval: 1h
  # -- Items.
  items: []
# -- Network Policy.
networkPolicy:
  # -- Enabled.
  enabled: true
  # -- HTTP client peers; empty permits same-namespace pods. Add ingress-controller selectors when publishing the service.
  ingressFrom: []
  # -- Deny unlisted egress; explicitly allow S3, libSQL, mail and identity provider destinations.
  egressIsolation: true
  # -- DNS peers; adapt these selectors when the cluster uses different DNS labels.
  dnsEgress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # -- Web Egress.
  webEgress: []
  # -- Web Ports.
  webPorts:
    - 443
  # -- Extra Egress.
  extraEgress: []
# -- Probes.
probes:
  # -- Startup.
  startup:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/health
    # -- Failure Threshold.
    failureThreshold: 60
    # -- Period Seconds.
    periodSeconds: 5
    # -- Timeout Seconds.
    timeoutSeconds: 5
  # -- Readiness.
  readiness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/health
    # -- Failure Threshold.
    failureThreshold: 3
    # -- Period Seconds.
    periodSeconds: 10
    # -- Timeout Seconds.
    timeoutSeconds: 5
  # -- Liveness.
  liveness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /api/ping
    # -- Failure Threshold.
    failureThreshold: 3
    # -- Period Seconds.
    periodSeconds: 20
    # -- Timeout Seconds.
    timeoutSeconds: 5
# -- Resources.
resources:
  # -- Requests.
  requests:
    # -- Cpu.
    cpu: 250m
    # -- Memory.
    memory: 512Mi
  # -- Limits.
  limits:
    # -- Cpu.
    cpu: '1'
    # -- Memory.
    memory: 1Gi
# -- Pod Security Context.
podSecurityContext:
  # -- Run As Non Root.
  runAsNonRoot: true
  # -- Run As User.
  runAsUser: 1000
  # -- Run As Group.
  runAsGroup: 1000
  # -- Fs Group.
  fsGroup: 1000
  # -- Fs Group Change Policy.
  fsGroupChangePolicy: OnRootMismatch
  # -- Seccomp Profile.
  seccompProfile:
    # -- Type.
    type: RuntimeDefault
# -- Security Context.
securityContext:
  # -- Allow Privilege Escalation.
  allowPrivilegeEscalation: false
  # -- Read Only Root Filesystem.
  readOnlyRootFilesystem: true
  # -- Capabilities.
  capabilities:
    # -- Drop.
    drop:
      - ALL
# -- Pod Labels.
podLabels: {}
# -- Pod Annotations.
podAnnotations: {}
# -- Node Selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- Topology Spread Constraints.
topologySpreadConstraints: []
# -- Priority Class Name.
priorityClassName: ''
# -- Termination Grace Period Seconds.
terminationGracePeriodSeconds: 30
# -- Persistence.
persistence:
  # -- Enabled.
  enabled: true
  # -- Existing Claim.
  existingClaim: ''
  # -- Storage Class.
  storageClass: ''
  # -- Size.
  size: 5Gi
  # -- Access Modes.
  accessModes:
    - ReadWriteOnce
  # -- Retain.
  retain: true
  # -- Annotations.
  annotations: {}
# -- Bootstrap.
bootstrap:
  # -- Enabled.
  enabled: true
  # -- Email.
  email: admin@example.test
  # -- Name.
  name: Administrator
  # -- Password.
  password: ''
  # -- Existing Secret.
  existingSecret: ''
  # -- Password Key.
  passwordKey: password
# -- Runtime.
runtime:
  # -- Temporary Size.
  temporarySize: 1Gi
  # -- Home Size.
  homeSize: 256Mi
