# SPDX-License-Identifier: Apache-2.0
# Provision database, bucket and Secrets separately; replace destination IPs with actual endpoints.
database:
  remoteUrl: https://database.example.com
  authTokenSecret: papra-libsql
storage:
  driver: s3
  encryptionSecret: papra-document-keys
  s3:
    endpoint: https://s3.example.com
    region: us-east-1
    bucket: papra
    forcePathStyle: true
    existingSecret: papra-s3
networkPolicy:
  webEgress:
    - ipBlock: {cidr: 192.0.2.8/32}
    - ipBlock: {cidr: 192.0.2.9/32}
