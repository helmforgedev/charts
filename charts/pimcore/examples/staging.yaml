---
cache:
  enabled: true
redis:
  enabled: true

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: pimcore.staging.example.com

networkPolicy:
  enabled: true
  egress:
    enabled: true
    extraEgress:
      - ports:
          - protocol: TCP
            port: 443
