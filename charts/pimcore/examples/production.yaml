---
image:
  repository: registry.example.com/platform/pimcore-project
  tag: "2026.2.8-1"

project:
  bootstrap:
    enabled: false
  persistence:
    enabled: false

auth:
  existingSecret: pimcore-registration

web:
  replicaCount: 3

worker:
  enabled: true
  replicaCount: 2

maintenance:
  enabled: true

assets:
  persistence:
    storageClass: nfs-rwx
    accessModes:
      - ReadWriteMany
    size: 100Gi

mercure:
  anonymous: false

networkPolicy:
  enabled: true
