# SPDX-License-Identifier: Apache-2.0
---
mariadb:
  enabled: false
rabbitmq:
  enabled: false
redis:
  enabled: false

database:
  mode: external
  external:
    host: mariadb.database.svc
    name: pimcore
    username: pimcore
    existingSecret: pimcore-database

queue:
  mode: external
  external:
    host: rabbitmq.messaging.svc
    username: pimcore
    vhost: pimcore
    existingSecret: pimcore-rabbitmq

cache:
  enabled: true
  mode: external
  external:
    host: redis.cache.svc
    existingSecret: pimcore-redis
