# SPDX-License-Identifier: Apache-2.0
---
cache:
  enabled: true
redis:
  enabled: true
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: pimcore.example.com
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: shared-gateway
      hostnames:
        - pimcore.example.com
networkPolicy:
  enabled: true
  egress:
    enabled: true
    extraEgress:
      - ports:
          - protocol: TCP
            port: 443
