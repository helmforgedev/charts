# SPDX-License-Identifier: Apache-2.0
suite: pimcore routing
templates:
  - ingress.yaml
  - gateway-httproute.yaml
tests:
  - it: omits ingress by default
    template: ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders ingress class and host
    template: ingress.yaml
    set:
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - host: pimcore.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: pimcore.example.com
  - it: defaults HTTPRoute backend to the service
    template: gateway-httproute.yaml
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - parentRefs:
              - name: shared-gateway
            hostnames:
              - pimcore.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
      - equal:
          path: spec.parentRefs[0].name
          value: shared-gateway
  - it: preserves unique indices in maximum-length fallback route names
    template: gateway-httproute.yaml
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      gatewayAPI:
        enabled: true
        httpRoutes:
          - parentRefs:
              - name: shared-gateway
          - parentRefs:
              - name: shared-gateway
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-0
        documentIndex: 0
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-1
        documentIndex: 1
