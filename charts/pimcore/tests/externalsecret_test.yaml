suite: pimcore External Secrets
templates:
  - externalsecret.yaml
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders multiple items with default refresh interval
    set:
      externalSecrets:
        enabled: true
        items:
          - name: application
            spec:
              secretStoreRef:
                name: helmforge-fake-store
                kind: ClusterSecretStore
              target:
                name: pimcore-app
              data:
                - secretKey: secret-key
                  remoteRef:
                    key: test/token
          - name: bootstrap
            spec:
              secretStoreRef:
                name: helmforge-fake-store
                kind: ClusterSecretStore
              target:
                name: pimcore-bootstrap
              data:
                - secretKey: password
                  remoteRef:
                    key: test/password
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.refreshInterval
          value: 1h
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pimcore-application
        documentIndex: 0
      - equal:
          path: spec.target.name
          value: pimcore-app
        documentIndex: 0
      - equal:
          path: spec.target.name
          value: pimcore-bootstrap
        documentIndex: 1
  - it: preserves literal fullnameOverride
    set:
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: shared-pimcore-secret
            spec:
              secretStoreRef:
                name: production
                kind: ClusterSecretStore
              dataFrom:
                - extract:
                    key: pimcore/application
    asserts:
      - equal:
          path: metadata.name
          value: shared-pimcore-secret
