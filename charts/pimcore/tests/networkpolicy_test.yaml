# SPDX-License-Identifier: Apache-2.0
suite: pimcore network policy
templates:
  - networkpolicy.yaml
tests:
  - it: uses configured HTTP and Mercure listeners
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      mercure.enabled: true
      containerPorts.http: 18080
      containerPorts.mercure: 13000
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 18080
      - equal:
          path: spec.ingress[0].ports[1].port
          value: 13000
      - equal:
          path: spec.egress[3].ports[0].port
          value: 13000
  - it: restricts DNS egress to the configured cluster DNS pods
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[0].ports[1].protocol
          value: TCP
