{{- if and .Values.project.persistence.enabled (not .Values.project.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pimcore.projectClaim" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
  {{- with .Values.project.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.project.persistence.accessModes | nindent 4 }}
  {{- with .Values.project.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.project.persistence.size }}
{{- end }}
{{- if and .Values.assets.persistence.enabled (not .Values.assets.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pimcore.assetsClaim" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
  {{- with .Values.assets.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.assets.persistence.accessModes | nindent 4 }}
  {{- with .Values.assets.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.assets.persistence.size }}
{{- end }}
