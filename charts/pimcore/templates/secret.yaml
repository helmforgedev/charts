{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pimcore.secretName" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.applicationSecretKey }}: {{ include "pimcore.stableSecretValue" (dict "root" . "name" (include "pimcore.secretName" .) "key" .Values.auth.applicationSecretKey "provided" .Values.auth.applicationSecret "length" 64) | quote }}
  {{ .Values.auth.adminPasswordKey }}: {{ include "pimcore.stableSecretValue" (dict "root" . "name" (include "pimcore.secretName" .) "key" .Values.auth.adminPasswordKey "provided" .Values.auth.adminPassword "length" 32) | quote }}
  {{ .Values.auth.productKeyKey }}: {{ .Values.auth.productKey | quote }}
  {{ .Values.auth.instanceIdentifierKey }}: {{ .Values.auth.instanceIdentifier | quote }}
  {{ .Values.auth.encryptionSecretKey }}: {{ .Values.auth.encryptionSecret | quote }}
  {{ .Values.auth.mercureJWTKey }}: {{ include "pimcore.stableSecretValue" (dict "root" . "name" (include "pimcore.secretName" .) "key" .Values.auth.mercureJWTKey "provided" .Values.auth.mercureJWT "length" 64) | quote }}
{{- end }}
{{- if and (eq .Values.database.mode "external") (not .Values.database.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pimcore.databaseSecretName" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
{{- if and (eq .Values.queue.mode "external") (not .Values.queue.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pimcore.queueSecretName" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.queue.external.password | quote }}
{{- end }}
{{- if and .Values.cache.enabled (eq .Values.cache.mode "external") (not .Values.cache.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pimcore.cacheSecretName" . }}
  namespace: {{ include "pimcore.namespace" . | quote }}
  labels:
    {{- include "pimcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.cache.external.password | quote }}
{{- end }}
