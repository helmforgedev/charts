{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- range $index, $item := .Values.externalSecrets.items }}
{{- if gt $index 0 }}
---
{{- end }}
{{- $name := include "stalwart.externalSecretName" (dict "root" $ "item" $item "index" $index) }}
{{- $spec := deepCopy $item.spec }}
{{- if not $spec.refreshInterval }}{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}{{- end }}
{{- if not $spec.target }}{{- $_ := set $spec "target" (dict "name" $name) }}{{- else if not $spec.target.name }}{{- $_ := set $spec.target "name" $name }}{{- end }}
{{- $hasStore := and $spec.secretStoreRef $spec.secretStoreRef.name }}
{{- $hasSource := false }}
{{- range (default list $spec.data) }}{{- if and .sourceRef (or (and .sourceRef.storeRef .sourceRef.storeRef.name) (and .sourceRef.generatorRef .sourceRef.generatorRef.name)) }}{{- $hasSource = true }}{{- end }}{{- end }}
{{- range (default list $spec.dataFrom) }}{{- if and .sourceRef (or (and .sourceRef.storeRef .sourceRef.storeRef.name) (and .sourceRef.generatorRef .sourceRef.generatorRef.name)) }}{{- $hasSource = true }}{{- end }}{{- end }}
{{- if not (or $hasStore $hasSource) }}{{- fail "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true" }}{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stalwart.labels" $ | nindent 4 }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
