{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.headlessServiceName" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  {{- with .Values.service.headless.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  {{- with .Values.service.headless.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.headless.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: management
      port: {{ .Values.ports.management.servicePort }}
      targetPort: management
      protocol: TCP
  selector:
    {{- include "stalwart.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.httpServiceName" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.service.http.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
    {{- with .Values.monitoring.serviceAnnotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  type: {{ .Values.service.http.type }}
  {{- with .Values.service.http.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.http.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $name, $port := .Values.ports }}
    {{- if and $port.enabled (eq $port.service "http") }}
    - name: {{ $name }}
      port: {{ $port.servicePort }}
      targetPort: {{ $name }}
      protocol: TCP
    {{- end }}
    {{- end }}
    {{- range .Values.extraPorts }}
    {{- if eq .service "http" }}
    - name: {{ .name }}
      port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "stalwart.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.mailServiceName" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  {{- with .Values.service.mail.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.mail.type }}
  {{- with .Values.service.mail.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.mail.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.mail.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $name, $port := .Values.ports }}
    {{- if and $port.enabled (eq $port.service "mail") }}
    - name: {{ $name }}
      port: {{ $port.servicePort }}
      targetPort: {{ $name }}
      protocol: TCP
    {{- end }}
    {{- end }}
    {{- range .Values.extraPorts }}
    {{- if eq .service "mail" }}
    - name: {{ .name }}
      port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "stalwart.selectorLabels" . | nindent 4 }}
