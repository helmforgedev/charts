{{- if eq .Values.config.source "generated" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.configName" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.config.dataStore | toPrettyJson | nindent 4 }}
{{- end }}
