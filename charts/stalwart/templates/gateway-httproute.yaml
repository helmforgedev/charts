{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gatewayAPI.enabled }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "stalwart.routeName" (dict "root" $ "route" $route "kind" "http" "index" $index) }}
  labels:
    {{- include "stalwart.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if $route.rules }}
    {{- toYaml $route.rules | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "stalwart.httpServiceName" $ }}
          port: {{ include "stalwart.servicePort" (dict "root" $ "name" (default "https" $route.backendPort) "service" "http") }}
    {{- end }}
{{- end }}
{{- end }}
