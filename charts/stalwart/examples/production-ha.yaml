# SPDX-License-Identifier: Apache-2.0
replicaCount: 3
podManagementPolicy: OrderedReady
persistence:
  enabled: false
config:
  source: existingSecret
  existingSecret:
    name: stalwart-bootstrap
    key: config.json
extraEnvFrom:
  - secretRef:
      name: stalwart-store-credentials
applyJob:
  enabled: true
  plan:
    source: existingSecret
    existingSecret: stalwart-management-plan
    key: plan.ndjson
  env:
    - name: STALWART_URL
      value: http://stalwart-http:8080
  envFrom:
    - secretRef:
        name: stalwart-cli-auth
