# SPDX-License-Identifier: Apache-2.0
config:
  source: existingSecret
  existingSecret:
    name: stalwart-bootstrap
    key: config.json
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: stalwart-bootstrap
      spec:
        secretStoreRef:
          name: platform-vault
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: config.json
            remoteRef:
              key: production/stalwart
              property: config.json
