# SPDX-License-Identifier: Apache-2.0
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: public
          namespace: gateway-system
          sectionName: https
      hostnames: [mail.example.com]
  tcpRoutes:
    - name: smtp
      backendPort: smtp
      parentRefs:
        - name: mail
          namespace: gateway-system
          sectionName: smtp
  tlsRoutes:
    - name: imaps
      backendPort: imaps
      parentRefs:
        - name: mail
          namespace: gateway-system
          sectionName: imaps
      hostnames: [mail.example.com]
