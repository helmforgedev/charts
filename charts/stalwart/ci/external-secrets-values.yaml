# SPDX-License-Identifier: Apache-2.0
extraEnvFrom:
  - secretRef:
      name: stalwart-runtime
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: stalwart-runtime
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: STALWART_TEST_TOKEN
            remoteRef:
              key: test/token
