# SPDX-License-Identifier: Apache-2.0
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: shared-gateway
      hostnames:
        - mail.example.com
  tcpRoutes:
    - name: smtp
      backendPort: smtp
      parentRefs:
        - name: mail-gateway
          sectionName: smtp
  tlsRoutes:
    - name: imaps
      backendPort: imaps
      parentRefs:
        - name: mail-gateway
          sectionName: imaps
      hostnames:
        - mail.example.com
