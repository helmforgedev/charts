# SPDX-License-Identifier: Apache-2.0
suite: Stalwart HTTPRoute
templates:
  - templates/gateway-httproute.yaml
tests:
  - it: renders no route by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the HTTP route
    values:
      - ../ci/gateway-api-values.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 443
