# SPDX-License-Identifier: Apache-2.0
suite: Stalwart ExternalSecret
templates:
  - templates/externalsecret.yaml
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0
  - it: defaults target and refresh interval
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: credentials
          spec:
            secretStoreRef:
              name: vault
              kind: ClusterSecretStore
            data:
              - secretKey: password
                remoteRef:
                  key: stalwart
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stalwart-credentials
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-stalwart-credentials
      - equal:
          path: spec.refreshInterval
          value: 1h
  - it: rejects missing source
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            target:
              name: broken
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true
