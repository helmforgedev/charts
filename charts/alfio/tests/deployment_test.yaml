# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-alfio

  - it: should use Recreate strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should use 1 replica
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should checksum the database connection configuration
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret-configuration"]
          pattern: "^[a-f0-9]{64}$"

  - it: should set the correct image with default tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/alfio/alf.io:2.0-M5-2609"

  - it: should set custom image tag
    set:
      image.tag: "2.0-M5-2410-1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/alfio/alf.io:2.0-M5-2410-1"

  - it: should set Spring profiles env var
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_PROFILES_ACTIVE
            value: "jdbc-session"

  - it: should wire the configured listener port into the process and container
    set:
      alfio.containerPort: 8081
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8081
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_PORT
            value: "8081"

  - it: should apply secure runtime defaults
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: should set DATASOURCE_URL with subchart host
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_URL
            value: "jdbc:postgresql://test-postgresql:5432/alfio"

  - it: should set DATASOURCE_USERNAME
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_USERNAME
            value: "alfio"

  - it: should reference postgresql subchart secret for DATASOURCE_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-postgresql-auth
                key: user-password

  - it: should set DATASOURCE_DRIVER
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_DRIVER
            value: "org.postgresql.Driver"

  - it: should set DATASOURCE_PLATFORM
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_PLATFORM
            value: "postgresql"

  - it: should not set BASE_URL when empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BASE_URL
          any: true

  - it: should set BASE_URL when configured
    set:
      alfio.baseUrl: "https://tickets.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BASE_URL
            value: "https://tickets.example.com"

  - it: should have wait-for-db init container
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db

  - it: should set external database host when subchart is disabled
    set:
      postgresql.enabled: false
      database.external.host: db.example.com
      database.external.port: "5433"
      database.external.name: my_alfio
      database.external.username: alfio_user
      database.external.password: my-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_URL
            value: "jdbc:postgresql://db.example.com:5433/my_alfio"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_USERNAME
            value: "alfio_user"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-alfio-db
                key: password

  - it: should use existing secret for external db password
    set:
      postgresql.enabled: false
      database.external.host: db.example.com
      database.external.existingSecret: my-db-secret
      database.external.existingSecretPasswordKey: db-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: db-pass

  - it: should use HTTP probes on /healthz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: should set extra env vars
    set:
      alfio.extraEnv:
        - name: ALFIO_LOG_LEVEL
          value: "DEBUG"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALFIO_LOG_LEVEL
            value: "DEBUG"

  - it: should set resources
    set:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
