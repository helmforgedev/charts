# SPDX-License-Identifier: Apache-2.0
auth:
  existingSecret: siyuan-auth
persistence:
  size: 20Gi
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: notes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: siyuan-tls
      hosts:
        - notes.example.com
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-system
