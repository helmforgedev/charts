{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "siyuan.validate" . }}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "siyuan.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $code := .Values.auth.accessCode | default (get $data .Values.auth.accessCodeKey | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "siyuan.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.accessCodeKey }}: {{ $code | b64enc | quote }}
{{- end }}
