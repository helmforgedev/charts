# SPDX-License-Identifier: Apache-2.0
suite: notes
templates:
  - templates/NOTES.txt
tests:
  - it: should render notes with default values
    asserts:
      - matchRegexRaw:
          pattern: "1\. Application overview:"
      - matchRegexRaw:
          pattern: "Happy Helmforging :\)"
      - matchRegexRaw:
          pattern: "- Plugins: velero-plugin-for-aws \(default\)"

  - it: should render notes with plugins disabled
    set:
      plugins.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "- Plugins: none"

  - it: should render notes with extra plugins and default disabled without leading comma
    set:
      plugins.enabled: false
      plugins.extra:
        - name: velero-plugin-for-gcp
    asserts:
      - matchRegexRaw:
          pattern: "- Plugins: velero-plugin-for-gcp"

  - it: should render node-agent and metrics sections when enabled
    set:
      nodeAgent.enabled: true
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "Node-agent DaemonSet:"
      - matchRegexRaw:
          pattern: "Prometheus Operator ServiceMonitor resource is enabled\."
