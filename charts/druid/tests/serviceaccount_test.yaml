# SPDX-License-Identifier: Apache-2.0
suite: service account
templates:
  - templates/serviceaccount.yaml
tests:
  - it: does not create a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 0

  - it: disables API credential mounting on a chart-owned ServiceAccount
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: allows API credential mounting when explicitly enabled
    set:
      serviceAccount.create: true
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
