# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - networkpolicy.yaml
release:
  name: test
  namespace: valkey-ns
tests:
  - it: should apply common annotations to NetworkPolicy metadata
    template: networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      commonAnnotations:
        example.com/team: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/team"]
          value: platform
