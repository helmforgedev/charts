apiVersion: v1
kind: Pod
metadata:
  name: {{ include "opencut.testName" . | quote }}
  labels:
    {{- include "opencut.labels" . | nindent 4 }}
  {{- include "opencut.renderAnnotations" (dict "root" . "specific" (dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) | nindent 2 }}
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      command:
        - sh
        - -ec
        - |
          wget -qO- http://{{ include "opencut.fullname" . }}:{{ .Values.service.port }}/api/health
          wget -qO- http://{{ include "opencut.fullname" . }}:{{ .Values.service.port }}/ | grep -qi opencut
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
