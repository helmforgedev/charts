containerPorts:
  http: 3080

service:
  port: 9080

redisHttp:
  containerPorts:
    http: 8080
  service:
    port: 9081

opencut:
  siteUrl: http://opencut.localtest.me:9080
  betterAuthSecret: custom-port-better-auth-secret
  marbleWorkspaceKey: custom-port-workspace

postgresql:
  auth:
    password: opencut
    postgresPassword: opencut-postgres
  standalone:
    persistence:
      enabled: false

redis:
  standalone:
    persistence:
      enabled: false

pdb:
  enabled: false

networkPolicy:
  enabled: true
