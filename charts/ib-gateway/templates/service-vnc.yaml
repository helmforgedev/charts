{{- if .Values.vnc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ib-gateway.fullname" . }}-vnc
  labels:
    {{- include "ib-gateway.labels" . | nindent 4 }}
  {{- with .Values.vnc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.vnc.service.type }}
  {{- with .Values.vnc.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.vnc.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "ib-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: vnc
      port: {{ .Values.vnc.service.port }}
      targetPort: vnc
      protocol: TCP
{{- end }}
