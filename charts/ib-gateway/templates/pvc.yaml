{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ib-gateway.claimName" . }}
  labels:
    {{- include "ib-gateway.labels" . | nindent 4 }}
  {{- $pvcAnnotations := deepCopy (.Values.persistence.annotations | default dict) -}}
  {{- if .Values.persistence.retain -}}
    {{- $_ := set $pvcAnnotations "helm.sh/resource-policy" "keep" -}}
  {{- end -}}
  {{- include "ib-gateway.renderAnnotations" (dict "root" . "specific" $pvcAnnotations) | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if eq .Values.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
