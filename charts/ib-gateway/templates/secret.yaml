{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ib-gateway.fullname" . }}
  labels:
    {{- include "ib-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.usernameKey }}: {{ .Values.auth.username | quote }}
  {{ .Values.auth.passwordKey }}: {{ .Values.auth.password | quote }}
  {{ .Values.auth.paperUsernameKey }}: {{ .Values.auth.paperUsername | quote }}
  {{ .Values.auth.paperPasswordKey }}: {{ .Values.auth.paperPassword | quote }}
  {{- if and .Values.vnc.enabled (not .Values.vnc.existingSecret) }}
  {{ .Values.vnc.passwordKey }}: {{ .Values.vnc.password | quote }}
  {{- end }}
{{- end }}
