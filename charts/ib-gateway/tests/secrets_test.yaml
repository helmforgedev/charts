# SPDX-License-Identifier: Apache-2.0
suite: IB Gateway secrets
templates:
  - secret.yaml
  - externalsecret.yaml
tests:
  - it: renders the managed Secret by default
    template: secret.yaml
    asserts:
      - isKind: {of: Secret}
      - equal: {path: stringData.username, value: ""}
      - equal: {path: stringData.password, value: ""}
  - it: omits the managed Secret for existing credentials
    template: secret.yaml
    set: {auth.existingSecret: credentials}
    asserts:
      - hasDocuments: {count: 0}
  - it: renders VNC password only when enabled
    template: secret.yaml
    set:
      vnc.enabled: true
      vnc.password: secret
    asserts:
      - equal: {path: stringData.vnc-password, value: secret}
  - it: omits ExternalSecret by default
    template: externalsecret.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: defaults ExternalSecret target and refresh interval
    template: externalsecret.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            secretStoreRef:
              name: store
              kind: ClusterSecretStore
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.target.name, value: RELEASE-NAME-ib-gateway}
      - equal: {path: spec.refreshInterval, value: 1h}
  - it: supports a literal ExternalSecret name
    template: externalsecret.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: fixed-secret
          spec:
            secretStoreRef:
              name: store
    asserts:
      - equal: {path: metadata.name, value: fixed-secret}
      - equal: {path: spec.target.name, value: fixed-secret}
