# SPDX-License-Identifier: Apache-2.0
suite: IB Gateway common annotations contract
templates:
  - deployment.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - service-vnc.yaml
values:
  - ../values.yaml
set:
  commonAnnotations:
    helmforge.dev/contract: present
    example.com/tier: standard
  serviceAccount:
    create: true
  podDisruptionBudget:
    enabled: true
  networkPolicy:
    enabled: true
  persistence:
    enabled: true
  vnc:
    enabled: true
tests:
  - it: applies common annotations to Deployment
    template: deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
      - equal:
          path: metadata.annotations["example.com/tier"]
          value: standard

  - it: applies common annotations to Secret
    template: secret.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to Service
    template: service.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to ServiceAccount
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to PodDisruptionBudget
    template: poddisruptionbudget.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to NetworkPolicy
    template: networkpolicy.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to PersistentVolumeClaim
    template: pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to VNC Service
    template: service-vnc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
