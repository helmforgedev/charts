# SPDX-License-Identifier: Apache-2.0
# Project IBKR credentials from an existing ClusterSecretStore.
auth:
  existingSecret: ib-gateway-credentials
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: ib-gateway-credentials
      spec:
        secretStoreRef:
          name: production-secrets
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: username
            remoteRef:
              key: trading/ibkr
              property: username
          - secretKey: password
            remoteRef:
              key: trading/ibkr
              property: password
