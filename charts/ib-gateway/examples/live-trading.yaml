# Live trading remains read-only until the operator explicitly changes the value.
auth:
  existingSecret: ib-gateway-live
gateway:
  tradingMode: live
  readOnlyApi: true
  existingSessionDetectedAction: primary
  autoRestartTime: "11:59 PM"
persistence:
  enabled: true
  size: 5Gi
