# SPDX-License-Identifier: Apache-2.0
# Safe paper-trading deployment using credentials from an existing Secret.
auth:
  existingSecret: ib-gateway-paper
gateway:
  tradingMode: paper
  readOnlyApi: true
  acceptIncoming: manual
persistence:
  enabled: true
  size: 2Gi
networkPolicy:
  apiIngressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: trading-bot
