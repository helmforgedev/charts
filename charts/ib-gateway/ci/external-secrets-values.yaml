# SPDX-License-Identifier: Apache-2.0
terminationGracePeriodSeconds: 5
auth:
  existingSecret: ib-gateway-external
persistence:
  enabled: false
workload:
  command:
    - sh
    - -ec
  args:
    - >-
      socat TCP-LISTEN:4002,fork,reuseaddr EXEC:/bin/cat &
      echo $! >/tmp/pid_paper;
      socat TCP-LISTEN:4004,fork,reuseaddr TCP:127.0.0.1:4002 &
      wait
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: ib-gateway-external
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: username
            remoteRef:
              key: test/username
          - secretKey: password
            remoteRef:
              key: test/password
