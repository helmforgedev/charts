# SPDX-License-Identifier: Apache-2.0
terminationGracePeriodSeconds: 5
auth:
  username: ci-paper-user
  password: ci-paper-password
persistence:
  enabled: false
workload:
  command: [sh, -ec]
  args:
    - >-
      socat TCP-LISTEN:4002,fork,reuseaddr EXEC:/bin/cat &
      echo $! >/tmp/pid_paper;
      socat TCP-LISTEN:4004,fork,reuseaddr TCP:127.0.0.1:4002 &
      wait
networkPolicy:
  egressIsolation: true
  extraEgress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 443
