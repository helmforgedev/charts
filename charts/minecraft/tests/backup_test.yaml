# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-cronjob.yaml
  - templates/backup-configmap.yaml
  - templates/backup-serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render CronJob by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render ConfigMap by default
    template: templates/backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render CronJob when backup enabled
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: test-minecraft-backup

  - it: should set schedule from values
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.schedule: "0 2 * * *"
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - equal:
          path: spec.schedule
          value: "0 2 * * *"

  - it: should have pre-backup and archive init containers
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: pre-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].name
          value: archive
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: docker.io/itzg/minecraft-server:2026.11.1
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].image
          value: docker.io/itzg/minecraft-server:2026.11.1

  - it: should have upload and post-backup containers
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: upload
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].name
          value: post-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].image
          value: docker.io/itzg/minecraft-server:2026.11.1

  - it: should use existing secret for S3 credentials
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: my-s3-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: my-s3-secret

  - it: should render backup scripts ConfigMap when backup enabled
    template: templates/backup-configmap.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - isKind:
          of: ConfigMap
      - isNotNull:
          path: data["pre-backup.sh"]
      - isNotNull:
          path: data["archive-backup.sh"]
      - isNotNull:
          path: data["post-backup.sh"]
      - isNotNull:
          path: data["upload-backup.sh"]

  - it: should render backup ServiceAccount when backup enabled
    template: templates/backup-serviceaccount.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://minio.example.com
      backup.s3.bucket: test-bucket
      backup.s3.existingSecret: backup-s3
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-minecraft-backup
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should configure workload identity when credentialsFromPodIdentity is true
    template: templates/backup-cronjob.yaml
    set:
      rcon.enabled: true
      persistence.enabled: true
      backup.enabled: true
      backup.s3.endpoint: https://s3.us-west-2.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.credentialsFromPodIdentity: true
      backup.s3.region: us-west-2
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[4].name
          value: S3_CREDENTIALS_FROM_POD_IDENTITY
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[4].value
          value: "true"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[5].name
          value: AWS_REGION
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[5].value
          value: us-west-2
