backup:
  enabled: true
  schedule: "0 30 2 * * *"
  s3:
    endpoint: https://minio.example.com
    bucket: vaultwarden-backups
    prefix: sqlite
    existingSecret: vaultwarden-backup-s3
    # For an endpoint signed by a private CA, create this Secret separately.
    # caSecret: vaultwarden-s3-ca
    # caKey: ca.crt
    # Emergency compatibility only; disables TLS certificate verification.
    # insecureSkipVerify: false

data:
  persistence:
    enabled: true
