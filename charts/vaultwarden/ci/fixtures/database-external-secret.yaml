apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-external-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden-external-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden-external-postgresql
        helmforge.dev/runtime-fixture: "true"
    spec:
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.4-trixie
          env:
            - name: POSTGRES_DB
              value: vaultwarden
            - name: POSTGRES_USER
              value: vaultwarden
            - name: POSTGRES_PASSWORD
              value: change-me
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --username=vaultwarden
                - --dbname=vaultwarden
            periodSeconds: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-external-postgresql
spec:
  selector:
    app.kubernetes.io/name: vaultwarden-external-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-database
type: Opaque
stringData:
  database-url: postgres://vaultwarden:change-me@vaultwarden-external-postgresql:5432/vaultwarden
