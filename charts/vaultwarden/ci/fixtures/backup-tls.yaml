apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-s3-create-bucket
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: hermes-s3
        helmforge.dev/runtime-fixture: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: create-bucket
          image: docker.io/helmforge/mc:1.0.0
          command: [/bin/sh, -ec]
          args:
            - |
              for attempt in $(seq 1 60); do
                if mc --insecure alias set fixture https://hermes-s3:8333 "$ACCESS_KEY" "$SECRET_KEY" >/tmp/error 2>&1 &&
                  mc --insecure mb --ignore-existing fixture/vaultwarden-backups >/tmp/error 2>&1; then
                  echo 'HTTPS S3 fixture ready'
                  exit 0
                fi
                sleep 2
              done
              cat /tmp/error >&2
              exit 1
          env:
            - {name: ACCESS_KEY, value: vaultwarden-ci-backup}
            - {name: SECRET_KEY, value: vaultwarden-ci-backup-secret-never-production}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
