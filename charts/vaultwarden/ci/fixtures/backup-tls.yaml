apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-s3
  labels:
    app: hermes-s3
    helmforge.dev/runtime-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-s3
  template:
    metadata:
      labels:
        app: hermes-s3
        helmforge.dev/runtime-fixture: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
          command: [weed]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=4
            - -filer
            - -s3
            - -s3.config=/config/s3.json
            - -s3.cert.file=/tls/tls.crt
            - -s3.key.file=/tls/tls.key
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: vaultwarden-s3-config
        - name: tls
          secret:
            secretName: vaultwarden-s3-tls
