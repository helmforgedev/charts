# CI scenario: ExternalSecrets with drift guard (GR-061)

admin:
  existingSecret: vaultwarden-credentials

externalSecrets:
  enabled: true
  secretStoreRef:
    name: helmforge-fake-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: test/token
