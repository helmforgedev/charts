# SPDX-License-Identifier: Apache-2.0
suite: Gateway API
templates:
  - httproute.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a complete HTTPRoute
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - name: shared-gateway
          namespace: ingress
      gateway.hostnames:
        - vault.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: spec.parentRefs[0].name
          value: shared-gateway
      - equal:
          path: spec.hostnames[0]
          value: vault.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: test-vaultwarden
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80

  - it: should fail when enabled without parent references
    set:
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.parentRefs is required when gateway.enabled=true"

  - it: should fail when a parent reference has no name
    set:
      gateway.enabled: true
      gateway.parentRefs:
        - namespace: ingress
    asserts:
      - failedTemplate:
          errorMessage: "gateway.parentRefs[0].name is required when gateway.enabled=true"
