# SPDX-License-Identifier: Apache-2.0
suite: External Secret
templates:
  - externalsecret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the admin credential ExternalSecret
    set:
      admin.existingSecret: vaultwarden-admin
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: production
      externalSecrets.data:
        - secretKey: admin-token
          remoteRef:
            key: vaultwarden/admin
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: test-vaultwarden-credentials
      - equal:
          path: spec.secretStoreRef.name
          value: production
      - equal:
          path: spec.target.name
          value: vaultwarden-admin
      - equal:
          path: spec.data[0].secretKey
          value: admin-token

  - it: should fail without an existing admin Secret target
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: production
      externalSecrets.data:
        - secretKey: admin-token
          remoteRef:
            key: vaultwarden/admin
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.enabled requires admin.existingSecret to be set to prevent credential drift between the chart-managed Secret and the ExternalSecret."

  - it: should fail without data mappings
    set:
      admin.existingSecret: vaultwarden-admin
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: production
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.data must not be empty when externalSecrets.enabled=true"

  - it: should fail without the admin token mapping
    set:
      admin.existingSecret: vaultwarden-admin
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: production
      externalSecrets.data:
        - secretKey: smtp-password
          remoteRef:
            key: vaultwarden/smtp
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.data must include a mapping for key 'admin-token' (ADMIN_TOKEN)"

  - it: should fail without a SecretStore name
    set:
      admin.existingSecret: vaultwarden-admin
      externalSecrets.enabled: true
      externalSecrets.data:
        - secretKey: admin-token
          remoteRef:
            key: vaultwarden/admin
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true"
