# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - deployment.yaml
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should be a Deployment
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: should have correct name
    template: deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-vaultwarden

  - it: should use the correct image
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/vaultwarden/server:1.37.1"

  - it: should have 1 replica
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should have correct selector labels
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: vaultwarden
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test

  - it: should set pod security context
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: should have probes by default
    template: deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: should prefix probe paths with the domain subpath
    template: deployment.yaml
    set:
      domain: https://example.com/vaultwarden
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /vaultwarden/alive
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /vaultwarden/alive
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /vaultwarden/alive

  - it: should not duplicate the domain subpath in a custom probe path
    template: deployment.yaml
    set:
      domain: https://example.com/vaultwarden
      probes:
        liveness:
          path: /vaultwarden/health
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /vaultwarden/health

  - it: should prefix a similar path that is not at the domain path boundary
    template: deployment.yaml
    set:
      domain: https://example.com/vault
      probes:
        liveness:
          path: /vaultish/health
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /vault/vaultish/health

  - it: should mount data volume
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data

  - it: should set SIGNUPS_ALLOWED env var
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNUPS_ALLOWED
            value: "false"

  - it: should set ENABLE_WEBSOCKET env var
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_WEBSOCKET
            value: "true"

  - it: should configure trusted proxies and unauthenticated rate limits
    template: deployment.yaml
    set:
      vaultwarden.proxy.trustedProxies: "10.0.0.0/8,192.168.0.0/16"
      vaultwarden.rateLimit.unauthenticated.seconds: 120
      vaultwarden.rateLimit.unauthenticated.maxBurst: 25
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IP_HEADER_TRUSTED_PROXIES
            value: "10.0.0.0/8,192.168.0.0/16"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UNAUTHENTICATED_RATELIMIT_SECONDS
            value: "120"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UNAUTHENTICATED_RATELIMIT_MAX_BURST
            value: "25"

  - it: should bind Rocket to a non-privileged port by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8085
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROCKET_ADDRESS
            value: "0.0.0.0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROCKET_PORT
            value: "8085"

  - it: should use service.targetPort as the Rocket port
    template: deployment.yaml
    set:
      service.targetPort: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROCKET_PORT
            value: "8080"
