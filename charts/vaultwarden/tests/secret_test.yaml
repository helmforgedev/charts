# SPDX-License-Identifier: Apache-2.0
suite: Secrets
templates:
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render generated Secrets by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an inline admin token Secret
    set:
      admin.token: fixture-admin-token
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-vaultwarden-admin
      - equal:
          path: data["admin-token"]
          value: Zml4dHVyZS1hZG1pbi10b2tlbg==

  - it: should not generate the admin Secret when an existing Secret is selected
    set:
      admin.existingSecret: vaultwarden-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an inline SMTP password Secret
    set:
      smtp.enabled: true
      smtp.host: smtp.example.com
      smtp.from: vault@example.com
      smtp.password: fixture-smtp-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-vaultwarden-smtp
      - equal:
          path: data["smtp-password"]
          value: Zml4dHVyZS1zbXRwLXBhc3N3b3Jk

  - it: should render a stable PostgreSQL connection Secret
    set:
      database.mode: postgresql
      postgresql.enabled: true
      postgresql.auth.password: fixture-database-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-vaultwarden-database
      - matchRegex:
          path: stringData["database-url"]
          pattern: '^postgresql://vaultwarden:fixture-database-password@test-postgresql:5432/vaultwarden$'

  - it: should use the PostgreSQL subchart client Service name
    set:
      database.mode: postgresql
      postgresql.enabled: true
      postgresql.fullnameOverride: custom-postgresql-service
      postgresql.auth.password: fixture-database-password
    asserts:
      - matchRegex:
          path: stringData["database-url"]
          pattern: '^postgresql://vaultwarden:fixture-database-password@custom-postgresql-service:5432/vaultwarden$'

  - it: should use the MySQL subchart client Service name
    set:
      database.mode: mysql
      mysql.enabled: true
      mysql.fullnameOverride: custom-mysql-service
      mysql.auth.password: fixture-database-password
    asserts:
      - matchRegex:
          path: stringData["database-url"]
          pattern: '^mysql://vaultwarden:fixture-database-password@custom-mysql-service:3306/vaultwarden$'

  - it: should keep suffixed Secret names within the DNS label limit
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      admin.token: fixture-admin-token
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^.{1,63}$'
      - matchRegex:
          path: metadata.name
          pattern: '-admin$'
