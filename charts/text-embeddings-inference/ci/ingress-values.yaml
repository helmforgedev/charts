fullnameOverride: tei-ingress
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: embeddings.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: embeddings-tls
      hosts:
        - embeddings.example.com
