# SPDX-License-Identifier: Apache-2.0
# Production baseline with ingress, persisted keys, and explicit resources.

postgresql:
  enabled: true
  auth:
    database: mhq-oss
    username: middleware

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: middleware.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - middleware.example.com
      secretName: middleware-tls
