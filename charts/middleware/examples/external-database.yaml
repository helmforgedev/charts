# Middleware with operator-managed PostgreSQL. Create middleware-database first.

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  host: postgres.database.svc.cluster.local
  port: 5432
  name: mhq-oss
  user: middleware
  existingSecret: middleware-database
  existingSecretPasswordKey: password
  sslMode: require

persistence:
  enabled: true
  size: 1Gi
