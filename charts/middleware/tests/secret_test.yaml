# SPDX-License-Identifier: Apache-2.0
suite: External database Secret
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render for the bundled database
    asserts:
      - hasDocuments:
          count: 0

  - it: should store an inline external password in a Secret
    set:
      postgresql.enabled: false
      externalDatabase.enabled: true
      externalDatabase.host: postgres.example.com
      externalDatabase.password: secure-value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-middleware-external-database
      - equal:
          path: stringData.user-password
          value: secure-value

  - it: should not render when an existing Secret is used
    set:
      postgresql.enabled: false
      externalDatabase.enabled: true
      externalDatabase.host: postgres.example.com
      externalDatabase.existingSecret: database-credentials
    asserts:
      - hasDocuments:
          count: 0
