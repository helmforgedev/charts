# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should render arbitrary resources
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: extension-config
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: extension-config
