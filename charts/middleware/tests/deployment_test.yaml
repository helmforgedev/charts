# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-middleware

  - it: should use Recreate strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should set the correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/middlewareeng/middleware:0.3.1"

  - it: should expose three ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 3333
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: analytics
            containerPort: 9696
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: sync
            containerPort: 9697
            protocol: TCP

  - it: should disable the internal database and enable upstream Redis
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_ENABLED
            value: "true"

  - it: should set PostgreSQL connection from subchart
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: "test-postgresql"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: test-postgresql-auth
                key: user-password

  - it: should set Redis connection from subchart
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: "localhost"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6385"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_ENABLED
            value: "true"

  - it: should use external database when configured
    set:
      postgresql.enabled: false
      externalDatabase.enabled: true
      externalDatabase.host: ext-db.example.com
      externalDatabase.name: mydb
      externalDatabase.user: myuser
      externalDatabase.password: mypass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: "ext-db.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: test-middleware-external-database
                key: user-password

  - it: should run migrations and signal backend startup
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: migrate-database
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: dbmate.*--wait.*up
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: runtime-signal
            mountPath: /tmp/pubsub

  - it: should migrate an external database with its existing Secret
    set:
      postgresql.enabled: false
      externalDatabase.enabled: true
      externalDatabase.host: ext-db
      externalDatabase.existingSecret: ext-db-secret
      externalDatabase.existingSecretPasswordKey: password
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: ext-db-secret
                key: password

  - it: should mount the key volume at the upstream configuration path
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/backend/analytics_server/mhq/config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-logs
            mountPath: /var/log/redis

  - it: should require all three processes for startup and readiness
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: 3333.*9696.*9697.*6385
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 3333.*9696.*9697.*6385

  - it: should wire custom ports into the actual upstream processes
    set:
      middleware.frontendPort: 4333
      middleware.analyticsPort: 10696
      middleware.syncPort: 10697
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "4333"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANALYTICS_SERVER_PORT
            value: "10696"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SYNC_SERVER_PORT
            value: "10697"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 4333.*10696.*10697.*6385

  - it: should honor bundled PostgreSQL naming and Secret overrides
    set:
      postgresql.fullnameOverride: shared-postgres
      postgresql.auth.existingSecret: shared-postgres-credentials
      postgresql.auth.existingSecretUserPasswordKey: app-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: shared-postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: shared-postgres-credentials
                key: app-password

  - it: should disable API token mounting and apply hardening defaults
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should render extra volumes and mounts
    set:
      extraVolumes:
        - name: ca
          secret:
            secretName: custom-ca
      extraVolumeMounts:
        - name: ca
          mountPath: /etc/custom-ca
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca
            secret:
              secretName: custom-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca
            mountPath: /etc/custom-ca
            readOnly: true
