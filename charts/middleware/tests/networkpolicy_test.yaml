# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: should restrict ingress to the named frontend port and preserve provider egress
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http
      - equal:
          path: spec.egress[0]
          value: {}

  - it: should not render when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow configured ingress peers
    set:
      networkPolicy.additionalIngressFrom:
        - namespaceSelector:
            matchLabels:
              access: allowed
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels.access
          value: allowed

  - it: should replace unrestricted egress with configured rules
    set:
      networkPolicy.additionalEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  access: providers
          ports:
            - port: 443
              protocol: TCP
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels.access
          value: providers
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443
