{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "middleware.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "middleware.fullname" . }}
  labels:
    {{- include "middleware.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "middleware.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "middleware.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/external-database-secret: {{ include "middleware.externalDatabaseSecret" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "middleware.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: migrate-database
          image: {{ include "middleware.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              export DATABASE_URL="$(python3 -c 'import os; from urllib.parse import quote; print("postgresql://{}:{}@{}:{}/{}?sslmode={}".format(quote(os.environ["DB_USER"], safe=""), quote(os.environ["DB_PASS"], safe=""), os.environ["DB_HOST"], os.environ["DB_PORT"], quote(os.environ["DB_NAME"], safe=""), quote(os.environ["PGSSLMODE"], safe="")))')"
              cd /app
              dbmate --wait --wait-timeout=300s --no-dump-schema up
              printf '%s\n' 'mhq-oss DB initialized' > /tmp/pubsub/db_init
          env:
            {{- include "middleware.databaseEnv" . | nindent 12 }}
            {{- with .Values.middleware.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-signal
              mountPath: /tmp/pubsub
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      containers:
        - name: middleware
          image: {{ include "middleware.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.middleware.frontendPort }}
              protocol: TCP
            - name: analytics
              containerPort: {{ .Values.middleware.analyticsPort }}
              protocol: TCP
            - name: sync
              containerPort: {{ .Values.middleware.syncPort }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ .Values.middleware.environment | quote }}
            - name: POSTGRES_DB_ENABLED
              value: {{ .Values.middleware.internalDbEnabled | quote }}
            - name: REDIS_ENABLED
              value: {{ .Values.middleware.internalRedisEnabled | quote }}
            {{- include "middleware.databaseEnv" . | nindent 12 }}
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6385"
            - name: PORT
              value: {{ .Values.middleware.frontendPort | quote }}
            - name: ANALYTICS_SERVER_PORT
              value: {{ .Values.middleware.analyticsPort | quote }}
            - name: SYNC_SERVER_PORT
              value: {{ .Values.middleware.syncPort | quote }}
            - name: INTERNAL_API_BASE_URL
              value: {{ printf "http://localhost:%v" .Values.middleware.analyticsPort | quote }}
            - name: INTERNAL_SYNC_API_BASE_URL
              value: {{ printf "http://localhost:%v" .Values.middleware.syncPort | quote }}
            - name: NEXT_PUBLIC_APP_ENVIRONMENT
              value: {{ .Values.middleware.environment | quote }}
            - name: TZ
              value: {{ .Values.middleware.timezone | quote }}
            {{- with .Values.middleware.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ printf ": > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/6385" .Values.middleware.frontendPort .Values.middleware.analyticsPort .Values.middleware.syncPort | quote }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ printf ": > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/%v; : > /dev/tcp/127.0.0.1/6385" .Values.middleware.frontendPort .Values.middleware.analyticsPort .Values.middleware.syncPort | quote }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/analytics_server/mhq/config
            - name: runtime-signal
              mountPath: /tmp/pubsub
            - name: redis-logs
              mountPath: /var/log/redis
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: runtime-signal
          emptyDir: {}
        - name: redis-logs
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "middleware.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
