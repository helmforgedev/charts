apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetes-mcp-server.fullname" . }}
  labels:
    {{- include "kubernetes-mcp-server.labels" . | nindent 4 }}
  {{- include "kubernetes-mcp-server.renderAnnotations" (dict "root" . "specific" dict) | nindent 2 }}
data:
  00-base.toml: |
{{ include "kubernetes-mcp-server.baseConfigToml" . | nindent 4 }}
{{- if .Values.mcp.configToml }}
  10-custom.toml: |
{{ .Values.mcp.configToml | nindent 4 }}
{{- end }}
