suite: kubernetes-mcp-server runtime
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml
  - templates/pvc.yaml
tests:
  - it: renders safe default arguments
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --read-only
      - contains:
          path: spec.template.spec.containers[0].args
          content: --disable-destructive
      - contains:
          path: spec.template.spec.containers[0].args
          content: --stateless
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-provider=in-cluster
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.runAsGroup
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
  - it: preserves a legacy root user override without creating a conflicting non-root flag
    template: templates/deployment.yaml
    set:
      podSecurityContext.runAsUser: 0
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot
  - it: preserves an explicit non-root override
    template: templates/deployment.yaml
    set:
      podSecurityContext.runAsNonRoot: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
  - it: does not hide an explicitly conflicting security context
    template: templates/deployment.yaml
    set:
      podSecurityContext.runAsUser: 0
      podSecurityContext.runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
  - it: renders TOML config file
    values:
      - config-values.yaml
    asserts:
      - isKind:
          of: ConfigMap
        template: templates/configmap.yaml
      - matchRegex:
          path: data["config.toml"]
          pattern: "read_only = true"
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: "^[a-f0-9]{64}$"
        template: templates/deployment.yaml
  - it: renders persistence PVC and data mount
    set:
      persistence.enabled: true
      persistence.storageClass: fast-ssd
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        template: templates/pvc.yaml
      - equal:
          path: spec.storageClassName
          value: fast-ssd
        template: templates/pvc.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-kubernetes-mcp-server
        template: templates/deployment.yaml
