# SPDX-License-Identifier: Apache-2.0
suite: StatefulSet Replicas
templates:
  - statefulset-replicas.yaml
  - configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should seed a TCP-capable root account for local probes
    template: statefulset-replicas.yaml
    set:
      architecture: replication
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "--read-only=OFF --super-read-only=OFF"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "MYSQL_PWD=\"\\$\\{MYSQL_ROOT_PASSWORD\\}\" mysql --socket=/tmp/mysql.sock -uroot < /tmp/source.sql[\\s\\S]*MYSQL_PWD=\"\\$\\{MYSQL_ROOT_PASSWORD\\}\" mysql --socket=/tmp/mysql.sock -uroot <<EOSQL[\\s\\S]*SET GLOBAL super_read_only = OFF;[\\s\\S]*CREATE USER IF NOT EXISTS 'root'@'%'"

  - it: should guard replica clone retries with a completion sentinel
    template: statefulset-replicas.yaml
    set:
      architecture: replication
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "CLONE_DONE=\"\\$\\{DATA_DIR\\}/\\.helmforge-clone-complete\""
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "touch \"\\$\\{CLONE_DONE\\}\""

  - it: should configure resources for the clone init container
    template: statefulset-replicas.yaml
    set:
      architecture: replication
      replication.readReplicas.clone.resources.requests.cpu: 100m
      replication.readReplicas.clone.resources.requests.memory: 128Mi
      replication.readReplicas.clone.resources.limits.cpu: 500m
      replication.readReplicas.clone.resources.limits.memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 512Mi

  - it: should omit clone init container resources by default
    template: statefulset-replicas.yaml
    set:
      architecture: replication
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[0].resources

  - it: should disable service account token automount by default
    template: statefulset-replicas.yaml
    set:
      architecture: replication
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
