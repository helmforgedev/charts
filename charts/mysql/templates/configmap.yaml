apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.configMapName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- include "mysql.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  {{- include "mysql.configMapData" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.initdbConfigMapName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- include "mysql.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  {{- include "mysql.initdbConfigMapData" . | nindent 2 }}
