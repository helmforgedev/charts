# SPDX-License-Identifier: Apache-2.0
{{- if and (include "mysql.backupEnabled" .) .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mysql.backupServiceAccountName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- $saAnnotations := mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.backup.serviceAccount.annotations | default dict) -}}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
