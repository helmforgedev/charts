# SPDX-License-Identifier: Apache-2.0
{{- if include "mysql.backupEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.fullname" . }}-backup-scripts
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- include "mysql.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  mysql-backup.sh: |
    #!/bin/sh
    set -eu
    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backup/out/${BACKUP_ARCHIVE_PREFIX}-mysql-${timestamp}.sql.gz"
    mkdir -p /backup/out
    export MYSQL_PWD="${MYSQL_ROOT_PASSWORD}"
    mysqldump ${MYSQL_DUMP_EXTRA_ARGS:-} ${MYSQL_CLI_TLS_ARGS:-} \
      --host="${DB_HOST}" \
      --port="${DB_PORT}" \
      --user=root \
      --all-databases | gzip -c > "${archive}"
    printf "%s" "${archive}" > /backup/out/backup-file
  upload-backup.sh: |
    #!/bin/sh
    set -eu
    archive="$(cat /backup/out/backup-file)"
    target="backup/${S3_BUCKET}"
    if [ -n "${S3_PREFIX:-}" ]; then
      target="${target}/${S3_PREFIX}"
    fi
    {{- if .Values.backup.s3.credentialsFromPodIdentity }}
    # Pod Identity / IRSA: no static keys. helmforge/mc only consults the AWS
    # credential chain when MC_STS_ENDPOINT_<alias> is set; a bare MC_HOST signs
    # with an empty access key. The STS URL is not called for Pod Identity:
    # minio-go reads AWS_CONTAINER_CREDENTIALS_FULL_URI instead. AWS_REGION is
    # set on the upload container from backup.s3.region.
    export MC_HOST_backup="${S3_ENDPOINT}"
    # Commercial and GovCloud STS hosts use amazonaws.com. China partitions use amazonaws.com.cn.
    # IRSA calls this URL. Pod Identity ignores it and reads the container credential URI.
    sts_domain="amazonaws.com"
    case "${AWS_REGION}" in
      cn-*) sts_domain="amazonaws.com.cn" ;;
    esac
    export MC_STS_ENDPOINT_backup="https://sts.${AWS_REGION}.${sts_domain}"
    {{- else }}
    mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
    {{- end }}
    if [ "${S3_CREATE_BUCKET_IF_NOT_EXISTS}" = "true" ]; then
      mc mb --ignore-existing "backup/${S3_BUCKET}"
    fi
    mc cp "${archive}" "${target}/"
{{- end }}
