# CI: Backup enabled with Pod Identity / IRSA (no static S3 credentials)
backup:
  enabled: true
  suspend: true
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mysql-backup-test
  s3:
    endpoint: https://s3.amazonaws.com
    bucket: mysql-backups-test
    region: us-east-1
    credentialsFromPodIdentity: true
