# SPDX-License-Identifier: Apache-2.0
fullnameOverride: ryot-eso
auth:
  existingSecret: ryot-eso-auth
bootstrap:
  existingSecret: ryot-eso-bootstrap
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: ryot-eso-auth
      spec:
        target:
          template:
            engineVersion: v2
            data:
              admin-access-token: '{{ .password }}-fixture-administrator-token'
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
    - fullnameOverride: ryot-eso-bootstrap
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
