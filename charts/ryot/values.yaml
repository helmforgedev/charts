# SPDX-License-Identifier: Apache-2.0
# -- Name Override.
nameOverride: ''
# -- Fullname Override.
fullnameOverride: ''
# -- Common Labels.
commonLabels: {}
# -- One scheduler and writer; multiple replicas are not supported by this chart.
replicaCount: 1
# -- Image.
image:
  # -- Repository.
  repository: ghcr.io/ignisda/ryot
  # -- Tag.
  tag: v10.5.0
  # -- Pull Policy.
  pullPolicy: IfNotPresent
# -- Image Pull Secrets.
imagePullSecrets: []
# -- Auth.
auth:
  # -- Administrator override, generated and retained when empty. Use at least 32 characters or an existing Secret.
  adminAccessToken: ''
  # -- Existing Secret.
  existingSecret: ''
  # -- Admin Access Token Key.
  adminAccessTokenKey: admin-access-token
# -- Server.
server:
  # -- Port.
  port: 8000
  # -- Public Url.
  publicUrl: http://localhost:8000
# -- Extra Env.
extraEnv: []
# -- Database.
database:
  # -- Host.
  host: ''
  # -- Port.
  port: 5432
  # -- Name.
  name: ryot
  # -- Username.
  username: ryot
  # -- Password Secret.
  passwordSecret: ''
  # -- Password Key.
  passwordKey: password
  # -- Empty selects disable for bundled PostgreSQL and verify-full for external PostgreSQL.
  sslMode: ''
  # -- Ca Secret.
  caSecret: ''
  # -- Ca Key.
  caKey: ca.crt
  # -- Connection Timeout.
  connectionTimeout: 180
  # -- Client Image.
  clientImage:
    # -- Repository.
    repository: docker.io/library/postgres
    # -- Tag.
    tag: 18.6-trixie
    # -- Pull Policy.
    pullPolicy: IfNotPresent
# -- Service Account.
serviceAccount:
  # -- Create.
  create: true
  # -- Name.
  name: ''
  # -- Annotations.
  annotations: {}
  # -- Automount Service Account Token.
  automountServiceAccountToken: false
# -- Service.
service:
  # -- Type.
  type: ClusterIP
  # -- Port.
  port: 8000
  # -- Annotations.
  annotations: {}
  # -- Ip Family Policy.
  ipFamilyPolicy: ''
  # -- Ip Families.
  ipFamilies: []
# -- Ingress.
ingress:
  # -- Enabled.
  enabled: false
  # -- Ingress Class Name.
  ingressClassName: ''
  # -- Annotations.
  annotations: {}
  # -- Hosts.
  hosts: []
  # -- Tls.
  tls: []
# -- Gateway.
gatewayAPI:
  # -- Render canonical Gateway API HTTPRoutes.
  enabled: false
  # -- Route definitions with parentRefs, hostnames, rules, labels and annotations.
  httpRoutes: []
# -- External Secrets.
externalSecrets:
  # -- Enabled.
  enabled: false
  # -- Refresh Interval.
  refreshInterval: 1h
  # -- Items.
  items: []
# -- Network Policy.
networkPolicy:
  # -- Enabled.
  enabled: true
  # -- Ingress From.
  ingressFrom: []
  # -- Egress Isolation.
  egressIsolation: true
  # -- DNS peers; adapt selectors for clusters with different DNS labels.
  dnsEgress:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
  # -- Web Egress.
  webEgress: []
  # -- Web Ports.
  webPorts:
    - 443
  # -- Extra Egress.
  extraEgress: []
# -- Probes.
probes:
  # -- Startup.
  startup:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /health
    # -- Failure Threshold.
    failureThreshold: 60
    # -- Period Seconds.
    periodSeconds: 5
    # -- Timeout Seconds.
    timeoutSeconds: 5
  # -- Readiness.
  readiness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /health
    # -- Failure Threshold.
    failureThreshold: 3
    # -- Period Seconds.
    periodSeconds: 10
    # -- Timeout Seconds.
    timeoutSeconds: 5
  # -- Liveness.
  liveness:
    # -- Enabled.
    enabled: true
    # -- Path.
    path: /health
    # -- Failure Threshold.
    failureThreshold: 3
    # -- Period Seconds.
    periodSeconds: 20
    # -- Timeout Seconds.
    timeoutSeconds: 5
# -- Resources.
resources:
  # -- Requests.
  requests:
    # -- Cpu.
    cpu: 250m
    # -- Memory.
    memory: 512Mi
  # -- Limits.
  limits:
    # -- Cpu.
    cpu: '2'
    # -- Memory.
    memory: 2Gi
# -- Pod Security Context.
podSecurityContext:
  # -- Run As Non Root.
  runAsNonRoot: true
  # -- Run As User.
  runAsUser: 1001
  # -- Run As Group.
  runAsGroup: 1001
  # -- Fs Group.
  fsGroup: 1001
  # -- Fs Group Change Policy.
  fsGroupChangePolicy: OnRootMismatch
  # -- Seccomp Profile.
  seccompProfile:
    # -- Type.
    type: RuntimeDefault
# -- Security Context.
securityContext:
  # -- Allow Privilege Escalation.
  allowPrivilegeEscalation: false
  # -- Read Only Root Filesystem.
  readOnlyRootFilesystem: true
  # -- Capabilities.
  capabilities:
    # -- Drop.
    drop:
      - ALL
# -- Pod Labels.
podLabels: {}
# -- Pod Annotations.
podAnnotations: {}
# -- Node Selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- Topology Spread Constraints.
topologySpreadConstraints: []
# -- Priority Class Name.
priorityClassName: ''
# -- Termination Grace Period Seconds.
terminationGracePeriodSeconds: 30
# -- Bootstrap.
bootstrap:
  # -- Enabled.
  enabled: true
  # -- Username.
  username: admin
  # -- Password.
  password: ''
  # -- Existing Secret.
  existingSecret: ''
  # -- Password Key.
  passwordKey: password
# -- Runtime.
runtime:
  # -- Temporary Size.
  temporarySize: 1Gi
  # -- Home Size.
  homeSize: 256Mi
# -- Postgresql.
postgresql:
  # -- Keep the bundled database immutable outside explicit runtime/data mounts.
  securityContext:
    readOnlyRootFilesystem: true
  # -- Writable temporary and Unix socket directories for the official PostgreSQL image.
  extraVolumes:
    - {name: postgres-tmp, emptyDir: {sizeLimit: 1Gi}}
    - {name: postgres-socket, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
  # -- Preserve these mounts when overriding extraVolumeMounts.
  extraVolumeMounts:
    - {name: postgres-tmp, mountPath: /tmp}
    - {name: postgres-socket, mountPath: /var/run/postgresql}
  # -- Isolate the bundled database; same-namespace clients still need native credentials.
  networkPolicy:
    enabled: true
    egress:
      enabled: true
      allowDNS: true
      allowSameNamespacePostgreSQL: false
      allowHTTPS: false
  # -- Install required extensions as the database administrator on first initialization, before application migrations.
  initdb:
    # -- Preserve this script when customizing first-boot SQL. External databases need equivalent DBA preparation.
    scripts:
      # -- Uses the subchart's actual application database and administrator connection.
      20-ryot-extensions.sh: |
        #!/bin/bash
        set -euo pipefail
        export PGPASSWORD="${POSTGRES_PASSWORD}"
        psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname "${APP_DATABASE}" <<'SQL'
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pg_trgm";
        SQL
  # -- Enabled.
  enabled: true
  # -- Architecture.
  architecture: standalone
  # -- Auth.
  auth:
    # -- Database.
    database: ryot
    # -- Username.
    username: ryot
    # -- Existing Secret.
    existingSecret: ''
    # -- Existing Secret User Password Key.
    existingSecretUserPasswordKey: user-password
