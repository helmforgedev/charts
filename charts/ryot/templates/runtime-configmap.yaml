apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ryot.fullname" . | trunc 55 | trimSuffix "-" }}-runtime
  labels: {{ include "ryot.labels" . | nindent 4 }}
data:
  database.mjs: |
    {{- .Files.Get "files/database.mjs" | nindent 4 }}
  database-guard.sh: |
    {{- .Files.Get "files/database-guard.sh" | nindent 4 }}
  bootstrap.mjs: |
    {{- .Files.Get "files/bootstrap.mjs" | nindent 4 }}
