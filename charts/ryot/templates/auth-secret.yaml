{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if (not .Values.auth.existingSecret) }}
{{- $name := include "ryot.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $value := .Values.auth.adminAccessToken | default (get $data .Values.auth.adminAccessTokenKey | default "" | b64dec) | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "ryot.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.adminAccessTokenKey }}: {{ $value | b64enc | quote }}
{{- end }}
