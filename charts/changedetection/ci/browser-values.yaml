# Local deterministic runtime fixture; production keeps restricted URLs blocked.
browser:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
changedetection:
  fetchWorkers: 2
  extraEnv:
    - name: ALLOW_IANA_RESTRICTED_ADDRESSES
      value: "true"
persistence:
  size: 1Gi
