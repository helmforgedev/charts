{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.auth.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "rustfs.secretName" .) }}
{{- $data := $existing.data | default dict }}
{{- $password := .Values.auth.secretKey | default (get $data "secret-key" | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.secretName" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.auth.accessKey | b64enc | quote }}
  secret-key: {{ $password | b64enc | quote }}
{{- end }}
