{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (has .Values.architecture (list "distributed" "cluster")) (not .Values.auth.rpcExistingSecret) }}
{{- $name := printf "%s-rpc" (include "rustfs.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $password := .Values.auth.rpcSecret | default (get $data "rpc-secret" | default "" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
data:
  rpc-secret: {{ $password | b64enc | quote }}
{{- end }}
