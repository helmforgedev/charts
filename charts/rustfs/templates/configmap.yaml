apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rustfs.fullname" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
data:
  RUSTFS_VOLUMES: {{ include "rustfs.volumes" . | quote }}
  RUSTFS_ADDRESS: {{ printf "0.0.0.0:%d" (int .Values.containerPorts.api) | quote }}
  RUSTFS_CONSOLE_ADDRESS: {{ printf "0.0.0.0:%d" (int .Values.containerPorts.console) | quote }}
  RUSTFS_CONSOLE_ENABLE: {{ .Values.config.consoleEnabled | quote }}
  RUSTFS_EXTERNAL_ADDRESS: {{ default (printf ":%d" (int .Values.containerPorts.api)) .Values.config.externalAddress | quote }}
  RUSTFS_CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: {{ .Values.config.consoleCorsAllowedOrigins | quote }}
  RUSTFS_OBS_LOGGER_LEVEL: {{ .Values.config.logLevel | quote }}
  RUSTFS_OBS_LOG_DIRECTORY: /logs
