{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rustfs.fullname" . }}-test
  labels:
    {{- include "rustfs.auxiliaryLabels" (dict "root" . "component" "health-test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "rustfs.serviceAccountName" . }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command: [wget]
      args: ["-q", "-O", "-", "http://{{ include "rustfs.fullname" . }}:{{ .Values.service.port }}/health"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
{{- end }}
