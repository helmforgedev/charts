{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustfs.fullname" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rustfs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.apiIngressFrom }}
        {{- toYaml .Values.networkPolicy.apiIngressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - {protocol: TCP, port: api}
    {{- if .Values.config.consoleEnabled }}
    - from:
        {{- if .Values.networkPolicy.consoleIngressFrom }}
        {{- toYaml .Values.networkPolicy.consoleIngressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - {protocol: TCP, port: console}
    {{- end }}
{{- end }}
