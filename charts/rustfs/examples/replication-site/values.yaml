# SPDX-License-Identifier: Apache-2.0
architecture: cluster
replicaCount: 4
auth:
  existingSecret: rustfs-credentials
replication:
  enabled: true
  mode: site
  localEndpoint: https://s3-primary.example.com
  peers:
    - name: secondary
      endpoint: https://s3-secondary.example.com
      existingSecret: secondary-credentials
      accessKeyKey: username
      secretKeyKey: password
    - name: third
      endpoint: https://s3-third.example.com
      existingSecret: third-credentials
