# SPDX-License-Identifier: Apache-2.0
# Local test peers and credentials are supplied by the matching ci/fixtures file.
architecture: cluster
replicaCount: 4
auth:
  existingSecret: rustfs-credentials
replication:
  enabled: true
  mode: site
  activeDeadlineSeconds: 180
  localEndpoint: http://rustfs-primary:9000
  peers:
    - name: secondary
      endpoint: http://rustfs-secondary:9000
      existingSecret: secondary-credentials
      accessKeyKey: username
      secretKeyKey: password
    - name: third
      endpoint: http://rustfs-third:9000
      existingSecret: third-credentials
