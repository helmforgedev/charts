apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials
  labels:
    helmforge.dev/runtime-fixture: 'true'
type: Opaque
stringData:
  access-key: fixtureadmin
  secret-key: fixture-only-rustfs-password-2026
---
apiVersion: v1
kind: Secret
metadata:
  name: secondary-credentials
  labels:
    helmforge.dev/runtime-fixture: 'true'
type: Opaque
stringData:
  username: fixtureadmin
  password: fixture-only-rustfs-password-2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-secondary
  labels:
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-secondary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-secondary
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rustfs
        image: docker.io/rustfs/rustfs:1.0.1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: api
          containerPort: 9000
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: secondary-credentials
              key: username
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secondary-credentials
              key: password
        readinessProbe:
          httpGet:
            path: /health/ready
            port: api
          periodSeconds: 3
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 3
          failureThreshold: 60
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-secondary
  labels:
    helmforge.dev/runtime-fixture: 'true'
spec:
  selector:
    app.kubernetes.io/name: rustfs-secondary
  ports:
  - name: api
    port: 9000
    targetPort: api
---
