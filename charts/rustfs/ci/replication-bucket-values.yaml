# SPDX-License-Identifier: Apache-2.0
# Local test peers and credentials are supplied by the matching ci/fixtures file.
architecture: cluster
replicaCount: 4
auth:
  existingSecret: rustfs-credentials
replication:
  enabled: true
  mode: bucket
  activeDeadlineSeconds: 180
  peers:
    - name: backup
      endpoint: http://rustfs-backup:9000
      existingSecret: backup-credentials
  buckets:
    - id: uploads-backup
      sourceBucket: uploads
      destinationPeer: backup
      destinationBucket: uploads-backup
      priority: 1
      prefix: ""
      replicate: delete,delete-marker,existing-objects
      createBuckets: true
