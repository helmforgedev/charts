widgetSecrets:
  sources:
    - name: glance-integrations
      items:
        - key: github-token
          path: github-token
config:
  data:
    pages:
      - name: Releases
        columns:
          - size: full
            widgets:
              - type: releases
                token: ${secret:github-token}
                repositories:
                  - glanceapp/glance
                  - helmforgedev/charts

