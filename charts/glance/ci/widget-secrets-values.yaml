# SPDX-License-Identifier: Apache-2.0
assets:
  existingConfigMap: glance-assets
widgetSecrets:
  sources:
    - name: glance-widget-token
      items:
        - key: token
          path: widget-token
config:
  data:
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: custom-api
                title: Verified widget
                url: http://127.0.0.1:8080/assets/payload.json
                headers:
                  X-Api-Key: ${secret:widget-token}
                template: <p>{{ .JSON.String "value" }}</p>

