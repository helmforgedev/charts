{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "glance.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $password := .Values.auth.password }}
{{- $key := .Values.auth.secretKey }}
{{- if not $password }}{{- $password = (get $data .Values.auth.passwordKey | default "" | b64dec) | default (randAlphaNum 32) }}{{- end }}
{{- if not $key }}{{- $key = (get $data .Values.auth.secretKeyKey | default "" | b64dec) | default (randBytes 64) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.passwordKey }}: {{ $password | b64enc | quote }}
  {{ .Values.auth.secretKeyKey }}: {{ $key | b64enc | quote }}
{{- end }}

