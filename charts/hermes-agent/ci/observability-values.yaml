# SPDX-License-Identifier: Apache-2.0
fullnameOverride: hermes-observability
agent:
  model: helmforge-fixture
  provider: custom:fixture
  baseUrl: http://hermes-provider:8080/v1
  apiKeyEnv: OPENAI_API_KEY
config:
  values:
    model:
      api_mode: chat_completions
    auxiliary:
      free_only: true
  policy: seed
credentials:
  existingSecret: hermes-provider-credentials
networkPolicy:
  allowInternet: false
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: hermes-provider
      ports:
        - protocol: TCP
          port: 8080
dashboard:
  enabled: true
  existingSecret: hermes-dashboard-fixture
metrics:
  enabled: true
  intervalSeconds: 5
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
