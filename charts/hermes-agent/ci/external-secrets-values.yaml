# SPDX-License-Identifier: Apache-2.0
fullnameOverride: hermes-eso
agent:
  model: helmforge-fixture
  provider: custom:fixture
  baseUrl: http://hermes-provider:8080/v1
  apiKeyEnv: OPENAI_API_KEY
config:
  values:
    model:
      api_mode: chat_completions
    auxiliary:
      free_only: true
credentials:
  existingSecret: hermes-provider-credentials
networkPolicy:
  allowInternet: false
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: hermes-provider
      ports:
        - protocol: TCP
          port: 8080
auth:
  existingSecret: hermes-eso-auth
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: hermes-eso-auth
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          template:
            engineVersion: v2
            data:
              api-key: hermes-fixture-{{ .password }}-long-token
        data:
          - secretKey: password
            remoteRef:
              key: test/password
