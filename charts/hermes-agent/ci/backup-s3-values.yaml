# SPDX-License-Identifier: Apache-2.0
fullnameOverride: hermes-agent-test
agent:
  model: helmforge-fixture
  provider: custom:fixture
  baseUrl: http://hermes-provider:8080/v1
  apiKeyEnv: OPENAI_API_KEY
  allowInsecureHTTP: true
config:
  values:
    model:
      api_mode: chat_completions
    auxiliary:
      free_only: true
credentials:
  existingSecret: hermes-provider-credentials
networkPolicy:
  allowInternet: false
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: hermes-provider
      ports:
        - protocol: TCP
          port: 8080
backup:
  enabled: true
  suspend: true
  s3:
    bucket: hermes-backups
    existingSecret: hermes-s3-credentials
    endpoint: https://hermes-s3:8333
    caSecret: hermes-s3-ca
    sse: ''
  networkPolicy:
    extraEgress:
      - to:
          - podSelector:
              matchLabels:
                app: hermes-s3
                component: server
        ports:
          - protocol: TCP
            port: 8333
