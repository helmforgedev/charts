# Create the referenced Secrets/controllers before using this example.
auth:
  existingSecret: hermes-api
credentials:
  existingSecret: hermes-provider
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: hermes-api
      spec:
        secretStoreRef:
          name: production
          kind: ClusterSecretStore
        data:
          - secretKey: api-key
            remoteRef:
              key: agents/hermes
              property: apiKey
    - fullnameOverride: hermes-provider
      spec:
        secretStoreRef:
          name: production
          kind: ClusterSecretStore
        data:
          - secretKey: OPENROUTER_API_KEY
            remoteRef:
              key: agents/hermes
              property: openrouterKey
