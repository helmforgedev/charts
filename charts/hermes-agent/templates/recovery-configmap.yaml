{{- if or .Values.backup.enabled .Values.restore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes-agent.fullname" . }}-recovery
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
data:
  archive.py: |
    {{- .Files.Get "files/archive.py" | nindent 4 }}
  s3.sh: |
    {{- .Files.Get "files/s3.sh" | nindent 4 }}
{{- end }}
