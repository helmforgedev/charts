apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes-agent.fullname" . }}-headless
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports: [{name: api, port: 8642, targetPort: api}]
  selector:
    {{- include "hermes-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
