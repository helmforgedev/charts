# SPDX-License-Identifier: Apache-2.0
suite: backup service account
templates:
  - templates/backup-serviceaccount.yaml
tests:
  - it: renders a dedicated annotated service account for workload identity
    set:
      backup.enabled: true
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/heimdall-backup
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-heimdall-backup
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/heimdall-backup
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: does not render for static credentials
    set:
      backup.enabled: true
    asserts:
      - hasDocuments:
          count: 0
