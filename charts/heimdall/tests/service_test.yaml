# SPDX-License-Identifier: Apache-2.0
suite: service
templates:
  - templates/service.yaml
tests:
  - it: should render a Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose http port
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 80
            targetPort: http
            protocol: TCP
            name: http

  - it: should keep the Service port independent from the process listener
    set:
      heimdall.containerPort: 8080
      service.port: 9080
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 9080
            targetPort: http
            protocol: TCP
            name: http
