# SPDX-License-Identifier: Apache-2.0
suite: image configuration validation
templates:
  - templates/deployment.yaml
tests:
  - it: rejects an empty image tag before creating a broken workload
    set:
      image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: image.repository and image.tag must not be empty
  - it: rejects a whitespace-only image repository
    set:
      image.repository: "   "
    asserts:
      - failedTemplate:
          errorMessage: image.repository and image.tag must not be empty
  - it: rejects ingress without hosts
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: ingress.hosts must contain at least one host when ingress.enabled is true
  - it: rejects pod labels that overwrite identity labels
    set:
      podLabels:
        app.kubernetes.io/component: client
    asserts:
      - failedTemplate:
          errorMessage: podLabels must not override required label app.kubernetes.io/component
