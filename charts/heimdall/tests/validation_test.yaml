# SPDX-License-Identifier: Apache-2.0
suite: image configuration validation
templates:
  - templates/deployment.yaml
tests:
  - it: rejects an empty image tag before creating a broken workload
    set:
      image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: image.repository and image.tag must not be empty
  - it: rejects a whitespace-only image repository
    set:
      image.repository: "   "
    asserts:
      - failedTemplate:
          errorMessage: image.repository and image.tag must not be empty
  - it: rejects ingress without hosts
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: ingress.hosts must contain at least one host when ingress.enabled is true
  - it: rejects pod labels that overwrite identity labels
    set:
      podLabels:
        app.kubernetes.io/component: client
    asserts:
      - failedTemplate:
          errorMessage: podLabels must not override required label app.kubernetes.io/component
  - it: requires a region for workload identity backups
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: heimdall-backups
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - failedTemplate:
          errorMessage: backup.s3.region is required when backup.s3.credentialsFromPodIdentity is true
  - it: requires a named service account when creation is disabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: heimdall-backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: backup.serviceAccount.name is required when backup.serviceAccount.create is false
