# SPDX-License-Identifier: Apache-2.0
suite: backup-cronjob
templates:
  - templates/backup-cronjob.yaml
tests:
  - it: should not render when backup is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when backup is enabled
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: my-backups
      backup.s3.existingSecret: s3-creds
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "0 3 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: DAC_READ_SEARCH
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should use custom schedule
    set:
      backup.enabled: true
      backup.schedule: "0 6 * * 0"
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: my-backups
      backup.s3.existingSecret: s3-creds
    asserts:
      - equal:
          path: spec.schedule
          value: "0 6 * * 0"

  - it: should reference existing S3 secret
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: my-backups
      backup.s3.existingSecret: my-s3-secret
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-secret
                key: access-key

  - it: should use workload identity without static credential references
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: my-backups
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.s3.existingSecret: ignored-secret
      backup.s3.accessKey: ignored-access-key
      backup.s3.secretKey: ignored-secret-key
      backup.serviceAccount.name: heimdall-backup
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: heimdall-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
          any: true
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          pattern: 'MC_STS_ENDPOINT_s3'
