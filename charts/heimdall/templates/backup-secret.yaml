{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsFromPodIdentity) .Values.backup.s3.accessKey .Values.backup.s3.secretKey (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heimdall.backupSecretName" . }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
  {{- include "heimdall.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
