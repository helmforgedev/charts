# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - backup-cronjob.yaml
  - backup-configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not create backup configmap when disabled
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create backup cronjob when disabled
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create backup CronJob when enabled with postgresql
    set:
      postgresql.enabled: true
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "0 3 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should create backup ConfigMap with postgres-backup script
    set:
      postgresql.enabled: true
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    template: backup-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isNotEmpty:
          path: data["postgres-backup.sh"]

  - it: should fail when backup enabled with sqlite
    template: backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    asserts:
      - failedTemplate:
          errorMessage: "backup requires PostgreSQL — set postgresql.enabled=true or database.mode=external"

  - it: should fail without s3 endpoint
    template: backup-cronjob.yaml
    set:
      postgresql.enabled: true
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail without s3 bucket
    template: backup-cronjob.yaml
    set:
      postgresql.enabled: true
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.accessKey: admin
      backup.s3.secretKey: admin123
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.bucket is required when backup.enabled is true"

  - it: should fail without an inline S3 secret key
    template: backup-cronjob.yaml
    set:
      postgresql.enabled: true
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: admin
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.secretKey or backup.s3.existingSecret is required when backup.enabled is true"

  - it: should configure external PostgreSQL backup fields
    template: backup-cronjob.yaml
    set:
      database.mode: external
      database.existingSecret: database-url
      backup.enabled: true
      backup.database.host: postgres.example.com
      backup.database.name: openwebui
      backup.database.username: openwebui
      backup.database.existingSecret: database-password
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: backups
      backup.s3.existingSecret: s3-credentials
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: postgres.example.com
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database-password
                key: database-password
