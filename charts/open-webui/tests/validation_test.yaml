# SPDX-License-Identifier: Apache-2.0
suite: Value validation
templates:
  - deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should reject bundled PostgreSQL with explicit SQLite mode
    set:
      database.mode: sqlite
      postgresql.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: database.mode=sqlite cannot be combined with postgresql.enabled=true

  - it: should reject bundled PostgreSQL with external mode
    set:
      database.mode: external
      database.existingSecret: database-credentials
      postgresql.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: database.mode=external cannot be combined with postgresql.enabled=true

  - it: should reject unsupported bundled PostgreSQL TLS
    set:
      postgresql.enabled: true
      postgresql.tls.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: postgresql.tls.enabled is not supported by the generated Open WebUI database URL

  - it: should require external database credentials
    set:
      database.mode: external
    asserts:
      - failedTemplate:
          errorMessage: database.mode=external requires database.url or database.existingSecret

  - it: should reject bundled Redis with external mode
    set:
      redis.enabled: true
      redisConfig.mode: external
      redisConfig.existingSecret: redis-credentials
    asserts:
      - failedTemplate:
          errorMessage: redisConfig.mode=external cannot be combined with redis.enabled=true

  - it: should reject unsupported bundled Redis TLS
    set:
      redis.enabled: true
      redis.tls.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: redis.tls.enabled is not supported by the bundled Open WebUI Redis URL

  - it: should require external Redis credentials
    set:
      redisConfig.mode: external
    asserts:
      - failedTemplate:
          errorMessage: redisConfig.mode=external requires redisConfig.url or redisConfig.existingSecret

  - it: should reject two app secret sources
    set:
      openWebui.secretKey: inline-secret
      openWebui.existingSecret: app-credentials
    asserts:
      - failedTemplate:
          errorMessage: openWebui.secretKey and openWebui.existingSecret are mutually exclusive

  - it: should reject two OpenAI key sources
    set:
      openWebui.openaiApiKey: inline-key
      openWebui.openaiExistingSecret: openai-credentials
    asserts:
      - failedTemplate:
          errorMessage: openWebui.openaiApiKey and openWebui.openaiExistingSecret are mutually exclusive

  - it: should require an ingress host
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: ingress.enabled requires ingress.hosts to contain at least one host

  - it: should reject reserved pod selector labels
    set:
      podLabels:
        app.kubernetes.io/component: override
    asserts:
      - failedTemplate:
          errorMessage: 'podLabels cannot override reserved selector label "app.kubernetes.io/component"'
