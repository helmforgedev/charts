# SPDX-License-Identifier: Apache-2.0
suite: Secret
templates:
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should create app secret with auto-generated key
    documentSelector:
      path: metadata.name
      value: test-open-webui-app
    asserts:
      - isKind:
          of: Secret
      - isNotEmpty:
          path: data.secret-key

  - it: should create a dedicated OpenAI Secret when an inline key is provided
    set:
      openWebui.openaiApiKey: sk-test123
    documentSelector:
      path: metadata.name
      value: test-open-webui-openai
    asserts:
      - equal:
          path: stringData.openai-api-key
          value: sk-test123

  - it: should create a Secret for an inline external database URL
    set:
      database.mode: external
      database.url: postgresql://user:password@database:5432/openwebui
    documentSelector:
      path: metadata.name
      value: test-open-webui-database
    asserts:
      - equal:
          path: stringData.database-url
          value: postgresql://user:password@database:5432/openwebui

  - it: should create a Secret for an inline external Redis URL
    set:
      redisConfig.mode: external
      redisConfig.url: redis://:password@redis:6379/0
    documentSelector:
      path: metadata.name
      value: test-open-webui-redis
    asserts:
      - equal:
          path: stringData.redis-url
          value: redis://:password@redis:6379/0

  - it: should not create the app Secret when an existing Secret is configured
    set:
      openWebui.existingSecret: app-credentials
    asserts:
      - hasDocuments:
          count: 0
