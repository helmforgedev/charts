# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should create a deployment with defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-open-webui
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: web
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should set health probe paths
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/db

  - it: should mount data volume when persistence enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/backend/data

  - it: should set WEBUI_SECRET_KEY from secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBUI_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: test-open-webui-app
                key: secret-key

  - it: should disable telemetry by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DO_NOT_TRACK
            value: "true"

  - it: should set DB_HOST when postgresql enabled
    set:
      postgresql.enabled: true
      postgresql.auth.username: openwebui
      postgresql.auth.database: openwebui
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgresql
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/library/postgres:18-alpine
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: test-postgresql

  - it: should honor PostgreSQL replication naming and credential overrides
    set:
      postgresql.enabled: true
      postgresql.architecture: replication
      postgresql.fullnameOverride: shared-database
      postgresql.auth.existingSecret: shared-database-credentials
      postgresql.auth.existingSecretUserPasswordKey: application-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: shared-database-primary
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: shared-database-credentials
                key: application-password

  - it: should set REDIS_URL when redis enabled
    set:
      redis.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBSOCKET_MANAGER
            value: redis
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-redis-auth
                key: redis-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBSOCKET_REDIS_URL
            value: redis://:$(REDIS_PASSWORD)@test-redis-client:6379/0

  - it: should honor Redis naming and credential overrides
    set:
      redis.enabled: true
      redis.fullnameOverride: shared-cache
      redis.auth.existingSecret: shared-cache-credentials
      redis.auth.existingSecretPasswordKey: application-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: shared-cache-credentials
                key: application-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: redis://:$(REDIS_PASSWORD)@shared-cache-client:6379/0

  - it: should omit Redis credentials when bundled authentication is disabled
    set:
      redis.enabled: true
      redis.auth.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: redis://test-redis-client:6379/0

  - it: should set OLLAMA_BASE_URL when configured
    set:
      openWebui.ollamaBaseUrl: http://ollama:11434
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OLLAMA_BASE_URL
            value: http://ollama:11434

  - it: should use custom image tag
    set:
      image.tag: v0.7.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/open-webui/open-webui:v0.7.0"

  - it: should reference an external database URL from a Secret
    set:
      database.mode: external
      database.existingSecret: database-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: database-credentials
                key: database-url

  - it: should reference an external Redis URL for cache and websockets
    set:
      redisConfig.mode: external
      redisConfig.existingSecret: redis-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: redis-url
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBSOCKET_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: redis-url

  - it: should not require an OpenAI API key for an unauthenticated compatible endpoint
    set:
      openWebui.openaiBaseUrl: http://local-provider:8000/v1
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENAI_API_KEY
          any: true
