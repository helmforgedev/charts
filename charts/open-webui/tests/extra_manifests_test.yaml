# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - extra-manifests.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render no documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an operator-provided manifest
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: integration-settings
          data:
            mode: external
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: integration-settings
