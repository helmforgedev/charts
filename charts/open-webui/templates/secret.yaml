{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.openWebui.existingSecret }}
{{- $name := include "open-webui.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.openWebui.existingSecretKey }}: {{ if .Values.openWebui.secretKey }}{{ .Values.openWebui.secretKey | b64enc | quote }}{{ else if hasKey $data .Values.openWebui.existingSecretKey }}{{ get $data .Values.openWebui.existingSecretKey | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
{{- if and .Values.openWebui.openaiApiKey (not .Values.openWebui.openaiExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-webui.openaiSecretName" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.openWebui.openaiExistingSecretKey }}: {{ .Values.openWebui.openaiApiKey | quote }}
{{- end }}
{{- if and (eq .Values.database.mode "external") .Values.database.url (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-webui.externalDatabaseSecretName" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (eq .Values.redisConfig.mode "external") .Values.redisConfig.url (not .Values.redisConfig.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-webui.externalRedisSecretName" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redisConfig.existingSecretKey }}: {{ .Values.redisConfig.url | quote }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-webui.backupSecretName" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.existingSecretAccessKeyKey }}: {{ .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.existingSecretSecretKeyKey }}: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
