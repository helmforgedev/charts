# SPDX-License-Identifier: Apache-2.0
suite: clickhouse helm test
templates:
  - templates/tests/test-connection.yaml
tests:
  - it: renders helm test hook under templates
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: EXPLAIN ANALYZE
      - contains:
          path: spec.containers[0].env
          content:
            name: CLICKHOUSE_EXPECTED_VERSION
            value: "26.7.3"
      - contains:
          path: spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: default
      - equal:
          path: spec.activeDeadlineSeconds
          value: 60
  - it: authenticates queries with the configured Secret
    set:
      clickhouse:
        password: test-password
    asserts:
      - contains:
          path: spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-clickhouse-auth
                key: clickhouse-password
