# SPDX-License-Identifier: Apache-2.0
suite: clickhouse listener configuration
templates:
  - configmap.yaml
tests:
  - it: configures the default server listeners
    asserts:
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<http_port>8123</http_port>"
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<tcp_port>9000</tcp_port>"
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<interserver_http_port>9009</interserver_http_port>"
  - it: configures overridden server listeners
    set:
      service.ports.http: 18123
      service.ports.tcp: 19000
      service.ports.interserver: 19009
    asserts:
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<http_port>18123</http_port>"
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<tcp_port>19000</tcp_port>"
      - matchRegex:
          path: data["helmforge.xml"]
          pattern: "<interserver_http_port>19009</interserver_http_port>"
