# SPDX-License-Identifier: Apache-2.0
# CI scenario: replicated, 1 shard x 3 replicas + 3 in-chart Keeper
architecture: replicated
replicated:
  clusterName: default
  shards: 1
  replicasPerShard: 3
  keeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      size: 2Gi
persistence:
  enabled: true
  size: 4Gi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
