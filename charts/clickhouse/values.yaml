# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# ClickHouse Helm Chart
# =============================================================================
# Uses the official clickhouse/clickhouse-server image.
# Supports architecture=standalone (default) and architecture=replicated
# (shards x replicas + optional in-chart ClickHouse Keeper).
# =============================================================================

# -- Override chart name
nameOverride: ""

# -- Override full release name
fullnameOverride: ""

# -- Override namespace for namespaced resources. The namespace must already exist.
namespaceOverride: ""

# -- Kubernetes cluster DNS domain
clusterDomain: cluster.local

# -- Labels added to all resources
commonLabels: {}

# -- Extra annotations applied to mutable resource metadata (not pod or PVC templates)
commonAnnotations: {}

# -- Deployment mode: standalone | replicated
architecture: standalone

# -- Number of ClickHouse pods when architecture=standalone. Must remain 1.
replicaCount: 1

# Replicated / multi-node topology (architecture=replicated)
replicated:
  # -- ClickHouse cluster name used in remote_servers / macros / ON CLUSTER
  clusterName: default
  # -- Number of shards
  shards: 1
  # -- Replicas per shard (e.g. 3 for a 1-shard HA cluster)
  replicasPerShard: 3
  # -- Enable internal_replication in remote_servers
  internalReplication: true
  # -- Configure distributed_ddl path under Keeper/ZooKeeper
  distributedDDL: true
  # In-chart ClickHouse Keeper (ignored when externalZookeeper.servers is set)
  keeper:
    # -- Deploy ClickHouse Keeper StatefulSet
    enabled: true
    # -- Keeper replica count (use an odd number, typically 3)
    replicaCount: 3
    image:
      # -- Official ClickHouse Keeper image repository
      repository: docker.io/clickhouse/clickhouse-keeper
      # -- Tag. Empty uses the ClickHouse server image.tag / appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    ports:
      # -- Keeper client port (ZooKeeper-compatible)
      client: 9181
      # -- Keeper Raft port
      raft: 9234
    persistence:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 8Gi
      retentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
      minAvailable: ""
    extraConfig: ""
  # -- External ZooKeeper/Keeper servers. When non-empty, in-chart keeper is not rendered.
  # Example: [{ host: zk-0.zk-hs, port: 2181 }]
  externalZookeeper:
    servers: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""

image:
  # -- Official ClickHouse image repository
  repository: docker.io/clickhouse/clickhouse-server
  # -- Official full-version tag
  tag: "26.10.11"
  # -- Image pull policy
  pullPolicy: IfNotPresent

imagePullSecrets: []

clickhouse:
  # -- Initial database created by the official entrypoint on empty data dir
  database: default
  # -- User managed by the official entrypoint on every container start
  user: default
  # -- Password managed by the official entrypoint. Empty leaves the default user passwordless; use a Secret for production.
  password: ""
  # -- Existing Secret containing the ClickHouse password
  existingSecret: ""
  # -- Secret key containing the ClickHouse password
  existingSecretPasswordKey: clickhouse-password
  # -- Enable default access management for SQL user/role management
  defaultAccessManagement: true
  # -- Additional XML under config.d/helmforge.xml
  extraConfig: ""
  # -- Additional XML under users.d/helmforge-users.xml
  extraUsersConfig: ""
  # -- Extra environment variables for the ClickHouse container
  extraEnv: []
  # -- Additional envFrom sources for the ClickHouse container
  extraEnvFrom: []

service:
  # -- Client Service type
  type: ClusterIP
  # -- Service annotations
  annotations: {}
  ports:
    # -- HTTP API port
    http: 8123
    # -- Native TCP port
    tcp: 9000
    # -- Interserver HTTP port
    interserver: 9009
    # -- Prometheus metrics port
    metrics: 9363
  headless:
    # -- Headless Service annotations
    annotations: {}
    # -- Publish not-ready addresses for stable pod DNS
    publishNotReadyAddresses: true
  # -- IP family policy: SingleStack | PreferDualStack | RequireDualStack. Empty uses cluster default.
  ipFamilyPolicy: ""
  # -- IP families. Empty uses cluster default.
  ipFamilies: []

persistence:
  # -- Enable persistent storage for /var/lib/clickhouse
  enabled: true
  # -- Storage class. Empty uses cluster default.
  storageClass: ""
  # -- PVC access modes
  accessModes:
    - ReadWriteOnce
  # -- PVC size
  size: 20Gi
  # -- PVC retention policy for volumeClaimTemplates
  retentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

logs:
  persistence:
    # -- Persist /var/log/clickhouse-server separately
    enabled: false
    # -- Storage class. Empty uses cluster default.
    storageClass: ""
    # -- PVC access modes
    accessModes:
      - ReadWriteOnce
    # -- PVC size
    size: 5Gi

metrics:
  # -- Enable built-in ClickHouse Prometheus endpoint
  enabled: false
  # -- Prometheus endpoint path
  path: /metrics
  serviceMonitor:
    # -- Create ServiceMonitor
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    namespaceSelector: {}

externalSecrets:
  # -- Render ExternalSecret resources
  enabled: false
  # -- Default refresh interval
  refreshInterval: 1h
  # -- ExternalSecret items using the canonical HelmForge items[] contract
  items: []

networkPolicy:
  # -- Create NetworkPolicy resources
  enabled: false
  ingressFrom: []
  metricsFrom: []
  egress:
    # -- Render explicit egress rules
    enabled: false
    # -- Allow DNS egress
    allowDNS: true
    # -- Extra peers
    extraTo: []
    # -- Extra complete egress rules
    extraEgress: []

podDisruptionBudget:
  # -- Compatibility setting retained; no PDB renders for the supported standalone replicaCount of 1
  enabled: true
  # -- Maximum unavailable pods
  maxUnavailable: 1
  # -- Minimum available pods. Takes precedence when set.
  minAvailable: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name override
  name: ""
  # -- ServiceAccount annotations
  annotations: {}
  # -- Automount Kubernetes API credentials
  automountServiceAccountToken: false

podSecurityContext:
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

terminationGracePeriodSeconds: 60
podManagementPolicy: Parallel
updateStrategy:
  type: RollingUpdate

podLabels: {}
podAnnotations: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraInitContainers: []
extraContainers: []
extraVolumes: []
extraVolumeMounts: []
extraManifests: []
