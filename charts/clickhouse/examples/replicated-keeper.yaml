# SPDX-License-Identifier: Apache-2.0
# Example: replicated ClickHouse with in-chart Keeper (1 shard x 3 replicas, metrics on)
architecture: replicated

clickhouse:
  database: default
  user: default
  # Prefer an existing Secret in real environments
  # existingSecret: clickhouse-auth

replicated:
  clusterName: default
  shards: 1
  replicasPerShard: 3
  keeper:
    enabled: true
    replicaCount: 3
    persistence:
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi

persistence:
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

metrics:
  enabled: true
