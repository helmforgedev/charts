# CI: Queue mode with Redis subchart
queue:
  enabled: true
  workers: 2

taskRunners:
  extraEnv:
    - name: HELMFORGE_TASK_RUNNER_PROFILE
      value: queue

redis:
  enabled: true
  auth:
    password: redis-ci-password

postgresql:
  enabled: true
  auth:
    database: n8n
    username: n8n
    password: ci-test-password
