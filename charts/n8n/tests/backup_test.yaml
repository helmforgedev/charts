# SPDX-License-Identifier: Apache-2.0
suite: Backup
templates:
  - templates/backup-cronjob.yaml
  - templates/backup-configmap.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render CronJob when backup enabled (sqlite)
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.accessKey: AKIA123
      backup.s3.secretKey: secret123
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: sqlite-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: should match custom n8n ownership for sqlite backups
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: n8n-backups
      backup.s3.accessKey: AKIA123
      backup.s3.secretKey: secret123
      securityContext.runAsUser: 1234
      securityContext.runAsGroup: 2345
      podSecurityContext.fsGroup: 3456
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 1234
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 2345
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 3456

  - it: should use postgres init for postgresql
    template: templates/backup-cronjob.yaml
    set:
      postgresql.enabled: true
      postgresql.auth.password: test
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.accessKey: AKIA123
      backup.s3.secretKey: secret123
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: postgres-backup

  - it: should render backup scripts configmap
    template: templates/backup-configmap.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.accessKey: AKIA123
      backup.s3.secretKey: secret123
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["sqlite-backup.sh"]
      - exists:
          path: data["upload-backup.sh"]

  - it: should use ambient credentials with a dedicated ServiceAccount
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-n8n-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
          any: true
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
          any: true
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
          any: true

  - it: should create and annotate the dedicated backup ServiceAccount
    template: templates/backup-serviceaccount.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/n8n-backup
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-n8n-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/n8n-backup

  - it: should use an existing dedicated backup ServiceAccount
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
      backup.serviceAccount.name: n8n-backup-identity
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: n8n-backup-identity

  - it: should reject an unnamed existing backup ServiceAccount
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: backup.serviceAccount.name is required when backup.serviceAccount.create is false

  - it: should reject ambient credentials without a region
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - failedTemplate:
          errorMessage: backup.s3.region is required when backup.s3.credentialsFromPodIdentity is true

  - it: should omit the backup credential Secret for ambient identity
    template: templates/secret.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.amazonaws.com
      backup.s3.bucket: test-bucket
      backup.s3.region: us-east-1
      backup.s3.credentialsFromPodIdentity: true
    documentSelector:
      path: metadata.name
      value: test-n8n-backup
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
