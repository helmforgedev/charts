{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $backupEnabled := include "n8n.backupEnabled" . -}}
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "n8n.fullname" . }}-backup
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- include "n8n.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "n8n.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "n8n.backupServiceAccountName" . }}
          automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            {{- if eq (include "n8n.databaseMode" .) "sqlite" }}
            - name: sqlite-backup
              image: {{ .Values.backup.images.sqlite | quote }}
              command: ["/bin/sh", "/scripts/sqlite-backup.sh"]
              securityContext:
                {{- $sqliteSecurityContext := deepCopy .Values.backup.securityContext }}
                {{- if hasKey .Values.securityContext "runAsUser" }}
                {{- $_ := set $sqliteSecurityContext "runAsUser" .Values.securityContext.runAsUser }}
                {{- end }}
                {{- if hasKey .Values.securityContext "runAsGroup" }}
                {{- $_ := set $sqliteSecurityContext "runAsGroup" .Values.securityContext.runAsGroup }}
                {{- end }}
                {{- toYaml $sqliteSecurityContext | nindent 16 }}
              env:
                - name: BACKUP_ARCHIVE_PREFIX
                  value: {{ .Values.backup.archivePrefix | quote }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-workdir
                  mountPath: /backup/out
                - name: data
                  mountPath: /data
                  readOnly: true
            {{- else if eq (include "n8n.databaseVendor" .) "postgres" }}
            - name: postgres-backup
              image: {{ .Values.backup.images.postgresql | quote }}
              command: ["/bin/sh", "/scripts/postgres-backup.sh"]
              securityContext:
                {{- toYaml .Values.backup.securityContext | nindent 16 }}
              env:
                - name: BACKUP_ARCHIVE_PREFIX
                  value: {{ .Values.backup.archivePrefix | quote }}
                - name: PG_DUMP_EXTRA_ARGS
                  value: {{ .Values.backup.database.postgresDumpArgs | quote }}
                - name: DB_HOST
                  value: {{ include "n8n.backupDatabaseHost" . | quote }}
                - name: DB_PORT
                  value: {{ include "n8n.backupDatabasePort" . | quote }}
                - name: DB_NAME
                  value: {{ include "n8n.backupDatabaseName" . | quote }}
                - name: DB_USERNAME
                  value: {{ include "n8n.backupDatabaseUsername" . | quote }}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "n8n.backupDatabasePasswordSecretName" . }}
                      key: {{ include "n8n.backupDatabasePasswordSecretKey" . }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-workdir
                  mountPath: /backup/out
            {{- end }}
          containers:
            - name: upload
              image: {{ .Values.backup.images.uploader | quote }}
              command: ["/bin/sh", "/scripts/upload-backup.sh"]
              securityContext:
                {{- toYaml .Values.backup.securityContext | nindent 16 }}
              env:
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | quote }}
                - name: S3_CREATE_BUCKET_IF_NOT_EXISTS
                  value: {{ ternary "true" "false" .Values.backup.s3.createBucketIfNotExists | quote }}
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
                {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                - name: AWS_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- else }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "n8n.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretAccessKeyKey }}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "n8n.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretSecretKeyKey }}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-workdir
                  mountPath: /backup/out
                - name: uploader-tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: {{ include "n8n.fullname" . }}-backup-scripts
                defaultMode: 0755
            - name: backup-workdir
              emptyDir: {}
            - name: uploader-tmp
              emptyDir: {}
            {{- if eq (include "n8n.databaseMode" .) "sqlite" }}
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "n8n.fullname" .)) }}
            {{- end }}
{{- end }}
