# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# Statistics for Strava Helm Chart - Default Values
# =============================================================================
# Focus: self-hosted Strava fitness dashboard with SQLite and OAuth

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
global: {}

# =============================================================================
# Image
# =============================================================================

image:
  # -- Official Dreeve container image
  repository: docker.io/robiningelbrecht/dreeve
  # -- Image tag
  tag: "v5.6.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================================================
# Dreeve Runtime
# =============================================================================

dreeve:
  # -- Public root URL used for redirects and the admin session
  appUrl: http://localhost:8080
  # -- Import mode. Existing Statistics for Strava installations should keep stravaApi.
  importMode: stravaApi
  # -- Secret used to sign the admin session cookie. Generated and preserved automatically when empty.
  appSecret: ""
  # -- Admin panel username
  adminUsername: admin
  # -- Bcrypt password hash for the admin panel. Generate it with bin/console security:hash-password.
  adminPasswordHash: ""
  # -- Optional API key for activity uploads. Empty keeps the API closed.
  apiKey: ""
  # -- Existing Secret containing Dreeve runtime secrets
  existingSecret: ""
  # -- Key in the existing Secret for APP_SECRET
  existingSecretAppSecretKey: app-secret
  # -- Key in the existing Secret for ADMIN_PASSWORD_HASH
  existingSecretAdminPasswordHashKey: admin-password-hash
  # -- Key in the existing Secret for DREEVE_API_KEY
  existingSecretApiKeyKey: api-key
  # -- Optional comma-separated admin IP or CIDR allowlist
  adminAllowedIps: ""
  # -- Trusted reverse proxy peers understood by FrankenPHP/Caddy
  trustedProxies: private_ranges

# =============================================================================
# Strava Configuration
# =============================================================================

strava:
  # -- Application port
  port: 8080
  # -- Strava OAuth Client ID (required)
  clientId: "mock-client-id"
  # -- Strava OAuth Client Secret (required)
  clientSecret: "mock-client-secret"
  # -- Strava Refresh Token (required)
  refreshToken: "mock-refresh-token"
  # -- Existing secret containing Strava credentials
  existingSecret: ""
  # -- Key in existing secret for client ID
  existingSecretClientIdKey: client-id
  # -- Key in existing secret for client secret
  existingSecretClientSecretKey: client-secret
  # -- Key in existing secret for refresh token
  existingSecretRefreshTokenKey: refresh-token
  # -- Timezone
  timezone: UTC
  # -- Legacy v4 config mounted for the one-time v5 migration. New settings are managed in the admin panel.
  config: |
    general:
      appUrl: "http://localhost:8080/"
      appSubTitle: null
      profilePictureUrl: null
      athlete:
        birthday: "1990-01-01"
        maxHeartRateFormula: fox
        restingHeartRateFormula: heuristicAgeBased
        heartRateZones:
          mode: relative
          default:
            zone1:
              from: 50
              to: 60
            zone2:
              from: 61
              to: 70
            zone3:
              from: 71
              to: 80
            zone4:
              from: 81
              to: 90
            zone5:
              from: 91
              to: null
        weightHistory:
          "2024-01-01": 75
        ftpHistory:
          cycling: []
          running: []
    appearance:
      locale: "en_US"
      unitSystem: metric
      timeFormat: 24
      dateFormat:
        short: "d-m-y"
        normal: "d-m-Y"
      dashboard:
        layout: null
      maps:
        polylineColor: "#fc6719"
        tileLayerUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        enableGreyScale: true
        heatmap:
          initialCenter: null
          initialZoom: null
      photos:
        hidePhotosForSportTypes: []
        defaultEnabledFilters:
          sportTypes: []
          countryCode: null
      sportTypesSortingOrder: []
    import:
      numberOfNewActivitiesToProcessPerImport: 250
      sportTypesToImport: []
      activityVisibilitiesToImport: []
      skipActivitiesRecordedBefore: null
      activitiesToSkipDuringImport: []
      optInToSegmentDetailImport: false
    metrics:
      excludeActivitiesFromPeakPowerOutputs: []
      eddington:
        - label: Ride
          showInNavBar: true
          showInDashboardWidget: true
          sportTypesToInclude:
            - Ride
            - MountainBikeRide
            - GravelRide
            - VirtualRide
        - label: Run
          showInNavBar: true
          showInDashboardWidget: true
          sportTypesToInclude:
            - Run
            - TrailRun
            - VirtualRun
        - label: Walk
          showInNavBar: false
          showInDashboardWidget: false
          sportTypesToInclude:
            - Walk
            - Hike
    gear:
      stravaGear: []
      recordingDevices: []
      customGear: []
    zwift:
      level: null
      racingScore: null
    integrations:
      notifications:
        services: []
      ai:
        enabled: false
        enableUI: false
        provider: openAI
        configuration:
          key: ""
          model: ""
    daemon:
      cron:
        - action: importDataAndBuildApp
          expression: "0 14 * * *"
          enabled: false
        - action: gearMaintenanceNotification
          expression: "0 14 * * *"
          enabled: false
        - action: appUpdateAvailableNotification
          expression: "0 14 * * *"
          enabled: false
  # -- Extra environment variables for the container
  # -- @default -- `[]`
  extraEnv: []

# The Dreeve daemon is mandatory in v5 and shares the application database.
daemon:
  enabled: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 5Gi
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    liveness:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

# =============================================================================
# Persistence
# =============================================================================

persistence:
  # -- Enable persistence for Statistics for Strava storage data
  enabled: true
  # -- Storage size
  size: 2Gi
  # -- Storage class
  storageClass: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Use an existing PVC
  existingClaim: ""
  bootstrap:
    # -- Prepare the upstream v4.8.8+ storage layout and keep legacy root-level SQLite files readable after upgrades
    enabled: true
    image:
      repository: docker.io/library/busybox
      tag: "1.37"
      pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- ServiceAccount name
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Mount a Kubernetes API token into the pod
  automountServiceAccountToken: false

# =============================================================================
# Service
# =============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP service port
  port: 80
  # -- Annotations for the Service
  annotations: {}
  # -- IP family policy. One of: SingleStack | PreferDualStack | RequireDualStack. Omit for cluster default.
  # @default -- omitted
  # ipFamilyPolicy: PreferDualStack
  # -- Ordered list of IP families for the Service. Each entry: IPv4 | IPv6. Omit for cluster default.
  # @default -- omitted
  # ipFamilies:
  #   - IPv4
  #   - IPv6

# =============================================================================
# Ingress
# =============================================================================

ingress:
  # -- Enable ingress for Statistics for Strava
  enabled: false
  # -- Ingress class name (for example: traefik, nginx)
  ingressClassName: traefik
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Ingress hosts
  hosts: []
    # - host: strava.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - hosts:
    #     - strava.example.com
    #   secretName: strava-tls

# =============================================================================
# Probes
# =============================================================================

probes:
  startup:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# Resources and Security
# =============================================================================

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 5Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  fsGroup: 82
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    # FrankenPHP carries this file capability upstream; Restricted PSS permits only this addition.
    add:
      - NET_BIND_SERVICE

runtimeVolumes:
  varSizeLimit: 2Gi
  caddyConfigSizeLimit: 64Mi
  caddyDataSizeLimit: 256Mi
  tmpSizeLimit: 1Gi

# =============================================================================
# Scheduling
# =============================================================================

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

podLabels: {}
podAnnotations: {}

# =============================================================================
# Extra
# =============================================================================

extraVolumes: []
extraVolumeMounts: []

# -- Extra manifests to deploy alongside the chart
extraManifests: []

networkPolicy:
  # -- Render a NetworkPolicy. Empty rule lists deny that traffic direction.
  enabled: false
  ingress: []
  egress: []

podDisruptionBudget:
  # -- Render a PodDisruptionBudget for the single-replica SQLite workload
  enabled: false
  minAvailable: 1

gatewayAPI:
  # -- Render Gateway API HTTPRoute resources
  enabled: false
  # -- HTTPRoute definitions routed to the Strava Statistics Service by default
  # @default -- `[]`
  httpRoutes: []

# Deprecated compatibility alias for gatewayAPI. Prefer gatewayAPI for new values.
gatewayApi:
  # -- Deprecated. Use gatewayAPI.enabled.
  enabled: false
  # -- Deprecated. Use gatewayAPI.httpRoutes.
  httpRoutes: []

externalSecrets:
  # -- Render ExternalSecret resources for Strava credentials
  enabled: false
  # -- ExternalSecret API version
  apiVersion: external-secrets.io/v1
  # -- ExternalSecret definitions for Strava credentials or integration tokens
  # @default -- `[]`
  items: []
