{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.dreeve.existingSecret }}
{{- $secretName := printf "%s-dreeve" (include "strava-statistics.fullname" .) -}}
{{- $appSecret := .Values.dreeve.appSecret -}}
{{- if not $appSecret -}}
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
  {{- $existingAppSecret := dig "data" "app-secret" "" $existingSecret -}}
  {{- if $existingAppSecret -}}
    {{- $appSecret = ($existingAppSecret | b64dec) -}}
  {{- else -}}
    {{- $appSecret = randAlphaNum 64 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "strava-statistics.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-secret: {{ $appSecret | quote }}
  admin-password-hash: {{ .Values.dreeve.adminPasswordHash | quote }}
  api-key: {{ .Values.dreeve.apiKey | quote }}
{{- end }}
