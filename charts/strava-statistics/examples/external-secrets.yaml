# SPDX-License-Identifier: Apache-2.0
externalSecrets:
  enabled: true
  items:
    - name: runtime
      storeRef:
        name: platform-secrets
        kind: ClusterSecretStore
      targetName: dreeve-runtime
      data:
        - secretKey: app-secret
          remoteRef:
            key: dreeve/runtime
            property: app-secret
        - secretKey: admin-password-hash
          remoteRef:
            key: dreeve/runtime
            property: admin-password-hash
    - name: strava
      storeRef:
        name: platform-secrets
        kind: ClusterSecretStore
      targetName: strava-credentials
      data:
        - secretKey: client-id
          remoteRef:
            key: strava/oauth
            property: client-id
        - secretKey: client-secret
          remoteRef:
            key: strava/oauth
            property: client-secret
        - secretKey: refresh-token
          remoteRef:
            key: strava/oauth
            property: refresh-token

dreeve:
  appUrl: https://dreeve.example.com
  existingSecret: dreeve-runtime

strava:
  existingSecret: strava-credentials
