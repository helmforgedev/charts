# SPDX-License-Identifier: Apache-2.0
suite: Validate
templates:
  - templates/validate.yaml
release:
  name: test
  namespace: default
tests:
  - it: should fail when credentials and existingSecret are omitted
    set:
      strava:
        existingSecret: ""
        clientId: ""
        clientSecret: ""
        refreshToken: ""
    asserts:
      - failedTemplate:
          errorMessage: "strava-statistics: strava.existingSecret must be set or strava.clientId, strava.clientSecret, and strava.refreshToken must be provided"
  - it: should pass when existingSecret is provided
    set:
      strava:
        existingSecret: "my-secret"
    asserts:
      - hasDocuments:
          count: 0
  - it: should pass when inline credentials are provided
    set:
      strava:
        clientId: "id"
        clientSecret: "secret"
        refreshToken: "token"
    asserts:
      - hasDocuments:
          count: 0
