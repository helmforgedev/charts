# SPDX-License-Identifier: Apache-2.0
suite: Operations resources
templates:
  - templates/networkpolicy.yaml
  - templates/pdb.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render optional resources by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a NetworkPolicy when enabled
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: strava-statistics

  - it: should render a PodDisruptionBudget when enabled
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
