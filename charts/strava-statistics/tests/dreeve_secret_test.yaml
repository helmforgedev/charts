# SPDX-License-Identifier: Apache-2.0
suite: Dreeve Secret
templates:
  - templates/dreeve-secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render Dreeve application secrets by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-strava-statistics-dreeve
      - equal:
          path: stringData["app-secret"]
          value: mock-app-secret
      - exists:
          path: stringData["admin-password-hash"]

  - it: should not render when an existing Dreeve secret is configured
    set:
      dreeve.existingSecret: dreeve-runtime
    asserts:
      - hasDocuments:
          count: 0
