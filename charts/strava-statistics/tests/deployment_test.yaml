# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-strava-statistics

  - it: should use Recreate strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should set the correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/robiningelbrecht/dreeve:v5.6.2"

  - it: should run the mandatory Dreeve daemon beside the web application
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: daemon
      - equal:
          path: spec.template.spec.containers[1].image
          value: "docker.io/robiningelbrecht/dreeve:v5.6.2"
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - bin/console
            - app:daemon:run

  - it: should allow custom image tag
    set:
      image.tag: "v4.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/robiningelbrecht/dreeve:v4.0.0"

  - it: should apply hardened pod and container security defaults
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

  - it: should set Strava env vars from secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRAVA_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: test-strava-statistics-strava
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRAVA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: test-strava-statistics-strava
                key: client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRAVA_REFRESH_TOKEN
            valueFrom:
              secretKeyRef:
                name: test-strava-statistics-strava
                key: refresh-token

  - it: should use existing secret when configured
    set:
      strava.existingSecret: my-strava-secret
      strava.existingSecretClientIdKey: my-id
      strava.existingSecretClientSecretKey: my-secret
      strava.existingSecretRefreshTokenKey: my-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRAVA_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: my-strava-secret
                key: my-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRAVA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-strava-secret
                key: my-secret

  - it: should set timezone
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: "UTC"

  - it: should configure the Dreeve v5 runtime contract
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_URL
            value: "http://localhost:8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMPORT_MODE
            value: stravaApi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_SECRET
            valueFrom:
              secretKeyRef:
                name: test-strava-statistics-dreeve
                key: app-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD_HASH
            valueFrom:
              secretKeyRef:
                name: test-strava-statistics-dreeve
                key: admin-password-hash

  - it: should mount data volume
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /var/www/config/app/config.yaml
            subPath: config.yaml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/www/storage
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/www/build
            subPath: build
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: data
            mountPath: /var/www/watch
            subPath: watch
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: app-runtime-var
            mountPath: /var/www/var

  - it: should roll pods when config changes
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: should preserve custom pod annotations
    set:
      podAnnotations:
        example.com/custom: "true"
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.metadata.annotations["example.com/custom"]
          value: "true"

  - it: should use PVC for data when persistence enabled
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: test-strava-statistics-data

  - it: should use emptyDir when persistence disabled
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].emptyDir
          value: {}

  - it: should use TCP probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value:
            - curl
            - -f
            - http://localhost:2019/metrics
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - curl
            - -f
            - http://localhost:2019/metrics
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - curl
            - -f
            - http://localhost:2019/metrics

  - it: should set container port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP

  - it: should bootstrap the upstream storage layout by default
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: storage-bootstrap
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/library/busybox:1.37"
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: data
            mountPath: /work
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "mkdir -p /work/build /work/database /work/files /work/gear-maintenance /work/watch"

  - it: should bootstrap storage when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: storage-bootstrap

  - it: should not bootstrap storage when bootstrap is disabled
    set:
      persistence.bootstrap.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
