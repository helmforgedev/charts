{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentRefs }}
  {{- fail "gateway.parentRefs is required when gateway.enabled=true" }}
{{- end }}
{{- range .Values.gateway.parentRefs }}
  {{- if not .name }}
    {{- fail "Each gateway.parentRefs entry must define a 'name' field" }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "adguard-home.fullname" . }}
  labels:
    {{- include "adguard-home.serverLabels" . | nindent 4 }}
  {{- include "adguard-home.renderAnnotations" (dict "root" . "specific" .Values.gateway.annotations) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.pathType }}
            value: {{ .Values.gateway.path | quote }}
      backendRefs:
        - name: {{ include "adguard-home.fullname" . }}-web
          port: {{ .Values.service.web.port }}
{{- end }}
