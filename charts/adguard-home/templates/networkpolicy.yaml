{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adguard-home.fullname" . }}
  labels:
    {{- include "adguard-home.serverLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "adguard-home.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.extraEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ include "adguard-home.webPort" . }}
          protocol: TCP
        - port: {{ .Values.containerPorts.dns }}
          protocol: TCP
        - port: {{ .Values.containerPorts.dns }}
          protocol: UDP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.networkPolicy.extraEgress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
