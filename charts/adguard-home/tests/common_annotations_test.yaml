# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
tests:
  - it: should add common annotations to chart-owned resources
    set:
      commonAnnotations:
        example.com/owner: platform
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: should let web service annotations override common annotations
    set:
      commonAnnotations:
        example.com/owner: platform
      service.web.annotations:
        example.com/owner: application
    template: templates/service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: application

  - it: should let service account annotations override common annotations
    set:
      serviceAccount.create: true
      commonAnnotations:
        example.com/owner: platform
      serviceAccount.annotations:
        example.com/owner: identity
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: identity
