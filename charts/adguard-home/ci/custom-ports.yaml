# SPDX-License-Identifier: Apache-2.0
# CI scenario: non-default process listeners differ from public Service ports.
containerPorts:
  setup: 3100
  http: 8080
  dns: 1053

config:
  adGuardHome:
    http:
      address: 0.0.0.0:80
      session_ttl: 720h
    users: []
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - 1.1.1.1
      bootstrap_dns:
        - 1.1.1.1
      protection_enabled: true
      filtering_enabled: true
    filtering:
      protection_enabled: true
      filtering_enabled: true
    schema_version: 29

service:
  web:
    port: 18080
  dns:
    type: ClusterIP
    port: 10553

networkPolicy:
  enabled: true
