{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- define "listmonk.appEnv" -}}
- name: LISTMONK_app__address
  value: {{ printf "0.0.0.0:%v" .Values.listmonk.port | quote }}
- name: LISTMONK_db__host
  value: {{ include "listmonk.databaseHost" . | quote }}
- name: LISTMONK_db__port
  value: {{ include "listmonk.databasePort" . | quote }}
- name: LISTMONK_db__user
  value: {{ include "listmonk.databaseUsername" . | quote }}
- name: LISTMONK_db__password
  valueFrom:
    secretKeyRef:
      name: {{ include "listmonk.databaseSecretName" . }}
      key: {{ include "listmonk.databaseSecretKey" . }}
- name: LISTMONK_db__database
  value: {{ include "listmonk.databaseName" . | quote }}
- name: LISTMONK_db__ssl_mode
  value: {{ include "listmonk.databaseSslMode" . | quote }}
{{- with .Values.listmonk.extraEnv }}
{{ toYaml . }}
{{- end }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmonk.fullname" . }}
  labels:
    {{- include "listmonk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "listmonk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "listmonk.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "listmonk.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.setup.waitImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              deadline=$(( $(date +%s) + DATABASE_WAIT_TIMEOUT ))
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}"; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "PostgreSQL not reachable after ${DATABASE_WAIT_TIMEOUT}s" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "PostgreSQL is accepting connections."
          env:
            - name: DATABASE_WAIT_TIMEOUT
              value: {{ .Values.setup.databaseWaitTimeoutSeconds | quote }}
            - name: DB_HOST
              value: {{ include "listmonk.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "listmonk.databasePort" . | quote }}
            - name: DB_USER
              value: {{ include "listmonk.databaseUsername" . | quote }}
            - name: DB_NAME
              value: {{ include "listmonk.databaseName" . | quote }}
          {{- with .Values.setup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: db-init
          image: {{ include "listmonk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              ./listmonk --install --idempotent --yes --config="" &&               ./listmonk --upgrade --yes --config=""
          env:
            {{- include "listmonk.appEnv" . | nindent 12 }}
            - name: LISTMONK_ADMIN_USER
              value: {{ .Values.listmonk.admin.username | quote }}
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmonk.adminSecretName" . }}
                  key: {{ include "listmonk.adminSecretKey" . }}
          {{- with .Values.setup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: listmonk
          image: {{ include "listmonk.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - ./listmonk
            - --config=""
          ports:
            - name: http
              containerPort: {{ .Values.listmonk.port }}
              protocol: TCP
          env:
            {{- include "listmonk.appEnv" . | nindent 12 }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: uploads
          {{- if .Values.storage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim }}
          {{- else if .Values.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "listmonk.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
