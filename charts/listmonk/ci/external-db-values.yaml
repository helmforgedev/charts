# CI: external PostgreSQL on port 5433 provided by ci/fixtures/external-db-values.yaml
postgresql:
  enabled: false

database:
  mode: external
  external:
    host: listmonk-ci-postgresql
    port: 5433
    name: listmonk_ext
    username: listmonk_ext
    existingSecret: listmonk-ci-db
    existingSecretPasswordKey: password
    sslMode: disable
