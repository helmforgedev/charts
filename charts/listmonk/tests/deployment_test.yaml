# SPDX-License-Identifier: Apache-2.0
suite: deployment
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
tests:
  - it: renders deployment with default values
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: uses correct image
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/listmonk/listmonk:v6.2.0"

  - it: exposes port 9000
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 9000
            protocol: TCP

  - it: includes wait-for-postgresql init container
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgresql
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/library/postgres:18.6-alpine
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: pg_isready

  - it: includes db-init init container
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: db-init
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LISTMONK_app__address
            value: "0.0.0.0:9000"

  - it: sets database env vars
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTMONK_app__address
            value: "0.0.0.0:9000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTMONK_db__database
            value: "listmonk"

  - it: mounts uploads volume
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: uploads
            mountPath: /listmonk/uploads

  - it: uses custom image tag
    template: templates/deployment.yaml
    set:
      image.tag: "v5.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/listmonk/listmonk:v5.0.0"

  - it: adds extra env vars
    template: templates/deployment.yaml
    set:
      listmonk.extraEnv:
        - name: TZ
          value: America/Sao_Paulo
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: America/Sao_Paulo

  - it: renders startup probe by default
    template: templates/deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: disables startup probe when configured
    template: templates/deployment.yaml
    set:
      startupProbe.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: renders with external database
    template: templates/deployment.yaml
    set:
      postgresql.enabled: false
      database.mode: external
      database.external.host: pg.example.com
      database.external.password: secret123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTMONK_db__host
            value: "pg.example.com"

  - it: changes the real listener with listmonk.port
    template: templates/deployment.yaml
    set:
      listmonk.port: 9100
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9100
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTMONK_app__address
            value: "0.0.0.0:9100"

  - it: creates the superadmin from a Secret during install
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LISTMONK_ADMIN_USER
            value: admin
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LISTMONK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-listmonk-admin
                key: admin-password

  - it: uses an existing superadmin secret
    template: templates/deployment.yaml
    set:
      listmonk.admin.existingSecret: listmonk-admin
      listmonk.admin.existingSecretPasswordKey: pw
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LISTMONK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: listmonk-admin
                key: pw

  - it: applies the hardened security contexts
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: uses the health endpoint for probes
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http

  - it: passes extra env to the app and db-init containers
    template: templates/deployment.yaml
    set:
      listmonk.extraEnv:
        - name: LISTMONK_app__root_url
          value: https://lists.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTMONK_app__root_url
            value: https://lists.example.com
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LISTMONK_app__root_url
            value: https://lists.example.com
