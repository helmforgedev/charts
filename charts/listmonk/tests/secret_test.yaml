# SPDX-License-Identifier: Apache-2.0
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders a generated superadmin password by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-listmonk-admin
      - matchRegex:
          path: stringData.admin-password
          pattern: ^[A-Za-z0-9]{32}$

  - it: keeps an explicit superadmin password
    set:
      listmonk.admin.password: fixed-password
    asserts:
      - equal:
          path: stringData.admin-password
          value: fixed-password

  - it: skips the superadmin secret when an existing secret is used
    set:
      listmonk.admin.existingSecret: listmonk-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: renders external database secret
    set:
      listmonk.admin.existingSecret: listmonk-admin
      postgresql.enabled: false
      database.mode: external
      database.external.host: pg.example.com
      database.external.password: secret123
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.database-password
          value: secret123

  - it: renders backup s3 secret
    set:
      listmonk.admin.existingSecret: listmonk-admin
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: mykey
      backup.s3.secretKey: mysecret
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.access-key
          value: mykey

  - it: does not render backup secret when existingSecret is set
    set:
      listmonk.admin.existingSecret: listmonk-admin
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: backups
      backup.s3.existingSecret: my-backup-secret
    asserts:
      - hasDocuments:
          count: 0
