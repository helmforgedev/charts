# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# Listmonk Helm Chart
# =============================================================================
# Self-hosted newsletter and mailing list manager.
# Requires PostgreSQL. SMTP is configured through the admin UI after install.
# =============================================================================

# -- Global values shared with subcharts
global: {}

# -- Override the chart name used in resource names
nameOverride: ""

# -- Override the full release name used in resource names
fullnameOverride: ""

# -- Labels added to every resource created by this chart
commonLabels: {}

# -- Number of Listmonk application replicas. Keep 1: several active instances
# process the same campaigns, and the uploads volume is ReadWriteOnce.
replicaCount: 1

image:
  # -- Listmonk container image repository
  repository: docker.io/listmonk/listmonk
  # -- Listmonk image tag (pinned; floating tags are rejected)
  tag: "v6.2.0"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

listmonk:
  # -- HTTP listener inside the container (LISTMONK_app__address)
  port: 9000
  # -- Additional environment variables for the Listmonk and db-init containers
  extraEnv: []
  admin:
    # -- Superadmin username created by the first --install (at least 3 characters)
    username: admin
    # -- Superadmin password (at least 8 characters); generated once when empty
    password: ""
    # -- Existing Secret with the superadmin password
    existingSecret: ""
    # -- Key in listmonk.admin.existingSecret
    existingSecretPasswordKey: admin-password

setup:
  # -- PostgreSQL client image used to wait for the database
  waitImage: docker.io/library/postgres:18.6-alpine
  # -- Seconds the wait-for-postgresql init container waits for the database
  databaseWaitTimeoutSeconds: 300
  # -- Resources for the init containers
  resources: {}

database:
  # -- Database mode: auto | external | postgresql
  mode: auto
  external:
    # -- External PostgreSQL hostname
    host: ""
    # -- External PostgreSQL port
    port: 5432
    # -- External PostgreSQL database name
    name: listmonk
    # -- External PostgreSQL username
    username: listmonk
    # -- External PostgreSQL password. Ignored when existingSecret is set.
    password: ""
    # -- PostgreSQL SSL mode
    sslMode: disable
    # -- Existing secret containing the external PostgreSQL password
    existingSecret: ""
    # -- Secret key for the external PostgreSQL password
    existingSecretPasswordKey: database-password

# -- Deploy PostgreSQL as a subchart
postgresql:
  enabled: true
  architecture: standalone
  auth:
    # -- PostgreSQL database name created on first run
    database: listmonk
    # -- PostgreSQL username created on first run
    username: listmonk
    # -- PostgreSQL application user password. Auto-generated if empty.
    password: ""
    # -- PostgreSQL superuser password. Auto-generated if empty.
    postgresPassword: ""
  initdb:
    scripts:
      # -- Bootstrap Listmonk database privileges and extensions on first PostgreSQL initialization.
      10-listmonk-bootstrap.sql: |
        GRANT CREATE ON DATABASE listmonk TO listmonk;
        \connect listmonk
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
  standalone:
    persistence:
      # -- Enable persistence for PostgreSQL data
      enabled: true
      # -- PVC size for PostgreSQL
      size: 8Gi

storage:
  # -- Enable persistent local storage for uploaded media
  enabled: true
  # -- Storage class for the uploads PVC
  storageClass: ""
  # -- Access mode for the uploads PVC
  accessMode: ReadWriteOnce
  # -- Size of the uploads PVC
  size: 5Gi
  # -- Existing PVC claim for uploads storage
  existingClaim: ""
  # -- Annotations for the uploads PVC
  annotations: {}

backup:
  # -- Enable built-in backup CronJob for PostgreSQL (pg_dump to S3)
  enabled: false
  # -- Backup schedule in Cron format
  schedule: "0 3 * * *"
  # -- Suspend backup execution
  suspend: false
  # -- CronJob concurrency policy
  concurrencyPolicy: Forbid
  # -- Successful job history retained by the CronJob
  successfulJobsHistoryLimit: 3
  # -- Failed job history retained by the CronJob
  failedJobsHistoryLimit: 3
  # -- Job backoff limit
  backoffLimit: 1
  # -- Prefix used in generated backup archive names
  archivePrefix: listmonk
  images:
    # -- PostgreSQL client image used for pg_dump (must not be older than the server)
    postgresql: docker.io/library/postgres:18.6-alpine
    # -- MinIO client image used for S3 upload
    uploader: docker.io/helmforge/mc:1.0.0
  # -- Resources applied to the backup dump and upload containers
  resources: {}
  database:
    # -- Extra arguments passed to pg_dump
    pgDumpArgs: ""
  s3:
    # -- S3-compatible endpoint URL
    endpoint: ""
    # -- Target bucket name
    bucket: ""
    # -- Optional key prefix inside the bucket
    prefix: listmonk
    # -- Create the bucket automatically when it does not exist yet
    createBucketIfNotExists: true
    # -- Existing secret containing access-key and secret-key
    existingSecret: ""
    # -- Secret key name for the access key inside backup.s3.existingSecret
    existingSecretAccessKeyKey: access-key
    # -- Secret key name for the secret key inside backup.s3.existingSecret
    existingSecretSecretKeyKey: secret-key
    # -- Inline access key used when backup.s3.existingSecret is not set
    accessKey: ""
    # -- Inline secret key used when backup.s3.existingSecret is not set
    secretKey: ""

service:
  # -- Service type for the Listmonk HTTP service
  type: ClusterIP
  # -- Service port exposed by the Listmonk service
  port: 80
  # -- Annotations for the Listmonk service
  annotations: {}

ingress:
  # -- Enable ingress for Listmonk
  enabled: false
  # -- Ingress class name
  ingressClassName: ""
  # -- Ingress annotations
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # -- Ingress hosts
  hosts: []
    # - host: listmonk.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - secretName: listmonk-tls
    #   hosts:
    #     - listmonk.example.com

gatewayAPI:
  # -- Render Gateway API HTTPRoute resources
  enabled: false
  # -- HTTPRoute definitions routed to the Listmonk Service by default
  # @default -- `[]`
  httpRoutes: []
    # - name: public
    #   parentRefs:
    #     - name: shared-gateway
    #       namespace: gateway-system
    #       sectionName: https
    #   hostnames:
    #     - listmonk.example.com

startupProbe:
  # -- Enable startup probe
  enabled: true
  # -- HTTP path used by the startup probe
  path: /health
  # -- Startup probe initial delay
  initialDelaySeconds: 5
  # -- Startup probe period
  periodSeconds: 5
  # -- Startup probe timeout
  timeoutSeconds: 3
  # -- Startup probe failure threshold
  failureThreshold: 30

livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- HTTP path used by the liveness probe
  path: /health
  # -- Liveness probe initial delay
  initialDelaySeconds: 0
  # -- Liveness probe period
  periodSeconds: 30
  # -- Liveness probe timeout
  timeoutSeconds: 5
  # -- Liveness probe failure threshold
  failureThreshold: 3

readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- HTTP path used by the readiness probe
  path: /health
  # -- Readiness probe initial delay
  initialDelaySeconds: 0
  # -- Readiness probe period
  periodSeconds: 10
  # -- Readiness probe timeout
  timeoutSeconds: 3
  # -- Readiness probe failure threshold
  failureThreshold: 3

# -- CPU and memory requests/limits for the Listmonk container
resources: {}

# -- Pod-level security context (Listmonk is a static binary and runs as any uid)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context for the Listmonk and init containers
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Mount the ServiceAccount token (Listmonk does not call the Kubernetes API)
automountServiceAccountToken: false

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: false
  # -- ServiceAccount name override
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Priority class name
priorityClassName: ""

# -- Grace period for shutdown, in seconds
terminationGracePeriodSeconds: 30

# -- Additional labels for the Listmonk pod
podLabels: {}

# -- Additional annotations for the Listmonk pod
podAnnotations: {}

# -- Additional volume mounts for the Listmonk container
extraVolumeMounts: []

# -- Additional volumes for the Listmonk pod
extraVolumes: []

# -- Extra Kubernetes manifests to deploy alongside the chart
extraManifests: []

# =============================================================================
# External Secrets Operator
# =============================================================================

# -- External Secrets Operator integration
externalSecrets:
  # -- Enable External Secrets Operator integration
  enabled: false
  # -- Default SecretStore / ClusterSecretStore reference
  secretStoreRef:
    # -- SecretStore name
    name: ""
    # -- SecretStore kind (SecretStore or ClusterSecretStore)
    kind: "SecretStore"
  # -- Default refresh interval for external secrets
  refreshInterval: "1h"
  # -- Creation policy for target secrets (Owner, Merge, None)
  creationPolicy: "Owner"
  # -- Deletion policy for target secrets (Retain, Delete, Merge)
  deletionPolicy: "Retain"
  # -- List of ExternalSecret resources to create
  items: []
