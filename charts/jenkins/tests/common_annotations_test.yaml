# SPDX-License-Identifier: Apache-2.0
suite: Jenkins common annotations contract
templates:
  - statefulset.yaml
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - httproute.yaml
  - servicemonitor.yaml
values:
  - ../values.yaml
set:
  commonAnnotations:
    helmforge.dev/contract: present
    example.com/tier: standard
  admin:
    create: true
  rbac:
    create: true
  pdb:
    enabled: true
  networkPolicy:
    enabled: true
  ingress:
    enabled: true
  gateway:
    enabled: true
  metrics:
    serviceMonitor:
      enabled: true
tests:
  - it: applies common annotations to StatefulSet
    template: statefulset.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
      - equal:
          path: metadata.annotations["example.com/tier"]
          value: standard

  - it: applies common annotations to ConfigMap
    template: configmap.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to Secret
    template: secret.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to Service
    template: service.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to ServiceAccount
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to Role and RoleBinding
    template: rbac.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
        documentIndex: 0
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
        documentIndex: 1

  - it: applies common annotations to PodDisruptionBudget
    template: pdb.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to NetworkPolicy
    template: networkpolicy.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to Ingress
    template: ingress.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to HTTPRoute
    template: httproute.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present

  - it: applies common annotations to ServiceMonitor
    template: servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.annotations["helmforge.dev/contract"]
          value: present
