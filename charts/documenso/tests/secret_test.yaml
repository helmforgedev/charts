# SPDX-License-Identifier: Apache-2.0
suite: Documenso immutable application secret
templates:
  - templates/secret.yaml
tests:
  - it: creates all persistent identity keys by default
    asserts:
      - isKind: { of: Secret }
      - exists: { path: data.nextauth-secret }
      - exists: { path: data.encryption-key }
      - exists: { path: data.encryption-secondary-key }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
  - it: delegates lifecycle to an existing Secret
    set:
      documenso.existingSecret: documenso-identity
    asserts:
      - hasDocuments: { count: 0 }
