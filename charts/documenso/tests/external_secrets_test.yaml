# SPDX-License-Identifier: Apache-2.0
suite: Documenso External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: renders nothing while disabled
    asserts:
      - hasDocuments: { count: 0 }
  - it: renders a native ExternalSecret item
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: identity
          spec:
            secretStoreRef: { name: production, kind: ClusterSecretStore }
            data:
              - secretKey: nextauth-secret
                remoteRef: { key: documenso/nextauth }
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: metadata.name, value: RELEASE-NAME-documenso-identity }
      - equal: { path: spec.target.name, value: RELEASE-NAME-documenso-identity }
      - equal: { path: spec.refreshInterval, value: 1h }
  - it: preserves a literal fullnameOverride and supports multiple items
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: documenso-identity
          spec:
            secretStoreRef: { name: production, kind: ClusterSecretStore }
            data:
              - secretKey: token
                remoteRef: { key: documenso/token }
        - name: smtp
          spec:
            secretStoreRef: { name: production, kind: ClusterSecretStore }
            dataFrom:
              - extract: { key: documenso/smtp }
    asserts:
      - hasDocuments: { count: 2 }
      - equal:
          path: metadata.name
          value: documenso-identity
        documentIndex: 0
  - it: rejects data without a store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: broken
          spec:
            data:
              - secretKey: token
                remoteRef: { key: documenso/token }
    asserts:
      - failedTemplate: { errorMessage: "each ExternalSecret data entry requires spec.secretStoreRef.name or sourceRef.storeRef.name; dataFrom may also use sourceRef.generatorRef.name" }
