{{- if not .Values.documenso.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "documenso.applicationSecretName" . }}
  labels:
    {{- include "documenso.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $name := include "documenso.applicationSecretName" . }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- range $key := list .Values.documenso.nextAuthSecretKey .Values.documenso.encryptionKeyKey .Values.documenso.encryptionSecondaryKeyKey }}
  {{- if and $existing (get $existing.data $key) }}
  {{ $key }}: {{ get $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
