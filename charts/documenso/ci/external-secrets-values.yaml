# SPDX-License-Identifier: Apache-2.0
fullnameOverride: documenso
documenso:
  existingSecret: documenso-application
externalSecrets:
  enabled: true
  refreshInterval: 5m
  items:
    - fullnameOverride: documenso-application
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: nextauth-secret
            remoteRef: { key: test/token }
          - secretKey: encryption-key
            remoteRef: { key: test/password }
          - secretKey: encryption-secondary-key
            remoteRef: { key: test/username }
