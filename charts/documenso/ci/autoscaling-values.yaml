# SPDX-License-Identifier: Apache-2.0
autoscaling:
  enabled: true
documenso:
  jobsProvider: bullmq
redis:
  enabled: true
objectStorage:
  provider: s3
  s3:
    bucket: documenso-ci
    existingSecret: documenso-object-storage
externalSecrets:
  enabled: true
  refreshInterval: 5m
  items:
    - fullnameOverride: documenso-object-storage
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: access-key
            remoteRef: { key: test/username }
          - secretKey: secret-key
            remoteRef: { key: test/password }
