# SPDX-License-Identifier: Apache-2.0
suite: ConfigMap
templates:
  - templates/configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a ConfigMap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-olivetin-config

  - it: should contain config.yaml key
    asserts:
      - exists:
          path: data["config.yaml"]

  - it: should include default action in config
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "Ping Google"

  - it: should disable Prometheus metrics by default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enabled: false"

  - it: should wire metrics values into the default config
    set:
      metrics.enabled: true
      metrics.port: 1341
      metrics.defaultGoMetrics: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "defaultGoMetrics: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "listenAddressPrometheus: 0.0.0.0:1341"

  - it: should preserve OliveTin runtime templates by default
    set:
      config: |
        actions:
          - title: "Echo message"
            shell: "echo {{ message }}"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "echo \\{\\{ message \\}\\}"

  - it: should allow opt-in Helm templating for config
    set:
      metrics.enabled: true
      configTpl.enabled: true
      config: |
        prometheus:
          enabled: {{ .Values.metrics.enabled }}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enabled: true"

  - it: should use custom config
    set:
      config: |
        actions:
          - title: "Hello World"
            shell: "echo hello"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "Hello World"

  - it: should enforce chart-managed metrics settings in custom config
    set:
      metrics.enabled: true
      metrics.port: 2341
      config: |
        prometheus:
          enabled: false
        actions:
          - title: "Hello World"
            shell: "echo hello"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "listenAddressPrometheus: 0.0.0.0:2341"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enabled: true"

  - it: should reject invalid custom YAML
    set:
      config: |
        actions:
          - title: broken
           shell: echo broken
    asserts:
      - failedTemplate:
          errorMessage: "config must contain valid YAML: error converting YAML to JSON: yaml: line 2: did not find expected '-' indicator"
