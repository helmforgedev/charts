# SPDX-License-Identifier: Apache-2.0
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a named ServiceAccount with annotations
    set:
      serviceAccount.create: true
      serviceAccount.name: olivetin-runner
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: olivetin-runner
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
