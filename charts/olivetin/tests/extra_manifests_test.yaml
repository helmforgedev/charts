# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render supplied Kubernetes objects
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: extra
          data:
            enabled: "true"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: extra
