# SPDX-License-Identifier: Apache-2.0
# HTTPS through an existing conventional Ingress controller.
openreplay:
  domain: replay.example.com
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: replay.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openreplay-tls
      hosts:
        - replay.example.com

