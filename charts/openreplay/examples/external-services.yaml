# Production data services managed outside this release.
openreplay:
  domain: replay.example.com
credentials:
  existingSecret: openreplay-production-credentials
postgresql:
  enabled: false
redis:
  enabled: false
clickhouse:
  enabled: false
rustfs:
  enabled: false
database:
  postgresql:
    host: postgresql.database.svc.cluster.local
  redis:
    host: valkey.database.svc.cluster.local
  clickhouse:
    host: clickhouse.database.svc.cluster.local
objectStorage:
  endpoint: s3.storage.svc.cluster.local:9000
  secure: true
scratch:
  existingClaim: openreplay-production-rwx

