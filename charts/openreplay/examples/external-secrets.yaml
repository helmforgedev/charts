# SPDX-License-Identifier: Apache-2.0
# Credentials reconciled from an existing ClusterSecretStore.
openreplay:
  domain: replay.example.com
credentials:
  existingSecret: openreplay-credentials
externalSecrets:
  enabled: true
  items:
    - name: credentials
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: production
          kind: ClusterSecretStore
        target:
          name: openreplay-credentials
          creationPolicy: Owner
        dataFrom:
          - extract:
              key: platform/openreplay/credentials

