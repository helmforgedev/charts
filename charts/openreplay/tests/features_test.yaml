# SPDX-License-Identifier: Apache-2.0
suite: OpenReplay optional features
templates:
  - templates/ingress.yaml
  - templates/gateway-httproute.yaml
  - templates/pdb.yaml
  - templates/networkpolicy.yaml
  - templates/externalsecret.yaml
  - templates/pvc.yaml
tests:
  - it: omits ingress by default
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: creates ingress with a guarded class
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.ingressClassName: nginx
      ingress.hosts[0].host: replay.test
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
  - it: creates a portable HTTPRoute
    template: templates/gateway-httproute.yaml
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - parentRefs:
              - name: shared
            hostnames:
              - replay.test
    asserts:
      - isKind:
          of: HTTPRoute
  - it: targets the internal router from HTTPRoute
    template: templates/gateway-httproute.yaml
    set:
      gatewayAPI:
        enabled: true
        httpRoutes:
          - parentRefs:
              - name: shared
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-openreplay
  - it: omits the PDB at one router replica
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: creates a PDB for two router replicas
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
      router.replicaCount: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
  - it: creates ingress-only NetworkPolicy by default
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - lengthEqual:
          path: spec.policyTypes
          count: 1
  - it: adds egress policy when requested
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
  - it: creates the scratch claim by default
    template: templates/pvc.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce
  - it: omits scratch PVC for ephemeral mode
    template: templates/pvc.yaml
    set:
      scratch.ephemeral: true
      rustfs.enabled: false
    asserts:
      - hasDocuments:
          count: 0
