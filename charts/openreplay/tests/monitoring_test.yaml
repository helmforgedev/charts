# SPDX-License-Identifier: Apache-2.0
suite: OpenReplay monitoring
templates:
  - templates/servicemonitor.yaml
tests:
  - it: omits ServiceMonitors by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates one ServiceMonitor for every enabled metrics component
    set:
      monitoring.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 15
      - isKind:
          of: ServiceMonitor
        documentIndex: 0
      - equal:
          path: spec.endpoints[0].port
          value: metrics
        documentIndex: 0
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
        documentIndex: 0
