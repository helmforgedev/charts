# SPDX-License-Identifier: Apache-2.0
suite: OpenReplay ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a dedicated ServiceAccount without an API token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: supports annotations
    set:
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: omits the ServiceAccount when creation is disabled
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0
