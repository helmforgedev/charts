# SPDX-License-Identifier: Apache-2.0
suite: OpenReplay credentials Secret
templates:
  - templates/secret.yaml
tests:
  - it: creates the complete generated credential contract
    asserts:
      - isKind:
          of: Secret
      - isNotEmpty:
          path: data["postgres-password"]
      - isNotEmpty:
          path: data["redis-password"]
      - isNotEmpty:
          path: data["clickhouse-password"]
      - isNotEmpty:
          path: data["jwt-secret"]

  - it: omits generation when an existing Secret is configured
    set:
      credentials.existingSecret: managed-openreplay
    asserts:
      - hasDocuments:
          count: 0

  - it: omits generation when External Secrets owns the target
    set:
      credentials.existingSecret: managed-openreplay
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: credentials
          spec:
            secretStoreRef:
              name: production
              kind: ClusterSecretStore
            target:
              name: managed-openreplay
    asserts:
      - hasDocuments:
          count: 0
