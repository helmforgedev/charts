# SPDX-License-Identifier: Apache-2.0
# Lightweight behavioral profile: real pinned frontend and router.
openreplay:
  domain: openreplay.test
  scheme: http
migration:
  validationMode: true
scratch:
  enabled: false
  ephemeral: true
rustfs:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
clickhouse:
  enabled: false
components:
  frontend:
    enabled: true
  alerts:
    enabled: false
  api:
    enabled: false
  assets:
    enabled: false
  assist:
    enabled: false
  canvases:
    enabled: false
  chalice:
    enabled: false
  db:
    enabled: false
  ender:
    enabled: false
  http:
    enabled: false
  images:
    enabled: false
  sink:
    enabled: false
  sourcemapreader:
    enabled: false
  spot:
    enabled: false
  storage:
    enabled: false
credentials:
  existingSecret: openreplay-credentials
externalSecrets:
  enabled: true
  items:
    - name: credentials
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: openreplay-credentials
          creationPolicy: Owner
        data:
          - secretKey: postgres-password
            remoteRef:
              key: test/token
          - secretKey: redis-password
            remoteRef:
              key: test/token
          - secretKey: clickhouse-password
            remoteRef:
              key: test/token
          - secretKey: access-key
            remoteRef:
              key: test/username
          - secretKey: secret-key
            remoteRef:
              key: test/password
          - secretKey: assist-key
            remoteRef:
              key: test/token
          - secretKey: assist-jwt-secret
            remoteRef:
              key: test/token
          - secretKey: jwt-secret
            remoteRef:
              key: test/token
          - secretKey: jwt-spot-secret
            remoteRef:
              key: test/token
          - secretKey: token-secret
            remoteRef:
              key: test/token
          - secretKey: jwt-refresh-secret
            remoteRef:
              key: test/token
          - secretKey: jwt-spot-refresh-secret
            remoteRef:
              key: test/token
          - secretKey: jwt-mcp-secret
            remoteRef:
              key: test/token

