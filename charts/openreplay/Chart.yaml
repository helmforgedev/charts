# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: openreplay
description: Production-ready OpenReplay session replay stack without a bundled ingress controller
type: application
version: 1.2.0
appVersion: "1.28.0"
kubeVersion: ">=1.31.0-0"
home: https://openreplay.com/
icon: https://helmforge.dev/icons/charts/openreplay.png
sources:
  - https://github.com/openreplay/openreplay
maintainers:
  - name: HelmForge
    url: https://helmforge.dev
keywords:
  - openreplay
  - session-replay
  - observability
  - analytics
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "complete production quality contract (#1717)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  helmforge.dev/maturity: beta
  helmforge.dev/source-issue: "1427"
dependencies:
  - name: postgresql
    version: 2.1.1
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 3.1.0
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
  - name: clickhouse
    version: 2.0.7
    repository: oci://ghcr.io/helmforgedev/helm
    condition: clickhouse.enabled
