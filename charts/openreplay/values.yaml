# SPDX-License-Identifier: Apache-2.0

# -- Global values accepted for parent-chart compatibility.
global: {}

# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""
# -- Labels added to all chart resources.
commonLabels: {}
# -- Labels added to every OpenReplay pod.
podLabels: {}
# -- Annotations added to every OpenReplay pod.
podAnnotations: {}
# -- Registry pull secrets.
imagePullSecrets: []

# -- Public OpenReplay configuration.
openreplay:
  # -- Public hostname. HTTPS is required outside local testing.
  domain: openreplay.example.com
  # -- Public URL scheme.
  scheme: https
  # -- Allow installation on non-amd64 nodes. Unsupported by upstream images.
  allowUnsupportedArchitecture: false
  # -- Extra environment variables supplied to all application components.
  extraEnv: []
  # -- Extra envFrom sources supplied to all application components.
  extraEnvFrom: []

# -- Application credential management.
credentials:
  # -- Generated Secret name. Also consumed by bundled data-service subcharts.
  secretName: openreplay-credentials
  # -- Existing Secret. Empty creates a generated Secret on first install.
  existingSecret: ""
  # -- Secret key holding the PostgreSQL password.
  postgresqlPasswordKey: postgres-password
  # -- Secret key holding the PostgreSQL superuser password for the bundled subchart.
  postgresSuperuserPasswordKey: postgres-password
  # -- Secret key holding the Valkey/Redis password.
  redisPasswordKey: redis-password
  # -- Secret key holding the ClickHouse password.
  clickhousePasswordKey: clickhouse-password
  # -- Secret key holding the S3 access key.
  s3AccessKeyKey: access-key
  # -- Secret key holding the S3 secret key.
  s3SecretKeyKey: secret-key
  # -- Secret key holding the Assist shared key.
  assistKeyKey: assist-key
  # -- Secret key holding the Assist JWT secret.
  assistJwtSecretKey: assist-jwt-secret
  # -- Secret key holding the API JWT secret.
  jwtSecretKey: jwt-secret
  # -- Secret key holding the Spot JWT secret.
  jwtSpotSecretKey: jwt-spot-secret
  # -- Secret key holding the token secret.
  tokenSecretKey: token-secret
  # -- Secret key holding the refresh JWT secret.
  jwtRefreshSecretKey: jwt-refresh-secret
  # -- Secret key holding the Spot refresh JWT secret.
  jwtSpotRefreshSecretKey: jwt-spot-refresh-secret
  # -- Secret key holding the MCP JWT secret.
  jwtMcpSecretKey: jwt-mcp-secret

# -- External Secrets Operator resources using the canonical items contract.
externalSecrets:
  # -- Render ExternalSecret resources.
  enabled: false
  # -- Default refresh interval injected into items that omit spec.refreshInterval.
  refreshInterval: 1h
  # -- ExternalSecret resources to render.
  items: []

# -- Shared scratch storage used by the ingestion pipeline.
scratch:
  # -- Create a PVC when existingClaim is empty.
  enabled: true
  # -- Existing RWX PVC name.
  existingClaim: ""
  # -- Storage class. Empty uses the cluster default.
  storageClass: ""
  # -- PVC access modes. Multi-node installs require ReadWriteMany.
  accessModes:
    - ReadWriteOnce
  # -- Scratch PVC size.
  size: 20Gi
  # -- Use emptyDir instead of a PVC. Intended only for isolated validation.
  ephemeral: false

# -- PostgreSQL connection used by OpenReplay.
database:
  postgresql:
    # -- External hostname. Empty selects the bundled subchart Service.
    host: ""
    # -- PostgreSQL port.
    port: 5432
    # -- Database name.
    database: openreplay
    # -- Database user.
    username: postgres
  redis:
    # -- External hostname. Empty selects the bundled subchart Service.
    host: ""
    # -- Redis/Valkey port.
    port: 6379
  clickhouse:
    # -- External hostname. Empty selects the bundled subchart Service.
    host: ""
    # -- Native ClickHouse port.
    nativePort: 9000
    # -- ClickHouse HTTP port.
    httpPort: 8123
    # -- Database name.
    database: default
    # -- ClickHouse user.
    username: default

# -- S3-compatible object storage connection.
objectStorage:
  # -- External S3 endpoint. Empty selects bundled RustFS.
  endpoint: ""
  # -- S3 region.
  region: us-east-1
  # -- Recordings bucket.
  recordingsBucket: mobs
  # -- Session assets bucket.
  assetsBucket: sessions-assets
  # -- Sourcemaps bucket.
  sourcemapsBucket: sourcemaps
  # -- Spot bucket.
  spotsBucket: spots
  # -- Use TLS for the S3 endpoint.
  secure: false

# -- Bundled RustFS S3-compatible object store.
rustfs:
  # -- Deploy RustFS. Disable when objectStorage.endpoint is external.
  enabled: true
  image:
    # -- Official RustFS image repository.
    repository: docker.io/rustfs/rustfs
    # -- Upstream image tag.
    tag: "1.0.0"
    # -- Manifest digest pin.
    digest: sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- RustFS application listeners.
  containerPorts:
    # -- S3 API listener port.
    s3: 9000
    # -- Web console listener port.
    console: 9001
  service:
    ports:
      # -- In-cluster S3 API Service port.
      s3: 9000
      # -- In-cluster console Service port.
      console: 9001
  persistence:
    # -- Enable RustFS persistence.
    enabled: true
    # -- Existing PVC.
    existingClaim: ""
    # -- Storage class.
    storageClass: ""
    # -- Access modes.
    accessModes:
      - ReadWriteOnce
    # -- PVC size.
    size: 50Gi
  # -- RustFS resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Offline/online schema migration workflow.
migration:
  # -- Run the revision-scoped schema migration Job.
  enabled: true
  # -- Skip migration for isolated frontend/router validation only.
  validationMode: false
  # -- Explicitly allow deploying an older AppVersion.
  allowDowngrade: false
  # -- Previous application version for forced migrations.
  fromVersion: ""
  # -- Force migration when versions match.
  force: false
  gitImage:
    # -- Official Alpine Git image repository.
    repository: docker.io/alpine/git
    # -- Git image tag.
    tag: "2.52.0"
    # -- Manifest digest pin.
    digest: sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
  postgresImage:
    # -- Official OpenReplay PostgreSQL migration image.
    repository: ghcr.io/openreplay/postgres
    # -- Migration image tag.
    tag: "17"
    # -- Manifest digest pin.
    digest: sha256:3b49780c0497898b5cd1afbde98f96a6d41b8bd1e55296b81dad75f4ee806ebb
  clickhouseImage:
    # -- Official ClickHouse migration client image.
    repository: docker.io/clickhouse/clickhouse-server
    # -- Migration image tag.
    tag: 25.9-alpine
    # -- Manifest digest pin.
    digest: sha256:fcd91b9d797edc72f2b8c2128a232078e061839b0596d65a21c507849ffe5d87
  s3Image:
    # -- Official OpenReplay S3 migration image.
    repository: ghcr.io/openreplay/minio
    # -- Migration image tag.
    tag: "2025"
    # -- Manifest digest pin.
    digest: sha256:8cada3c9458a494dde66e91935aed425bd31326ce68411a236c12e0b03fe2733
  # -- Migration Job deadline in seconds.
  activeDeadlineSeconds: 3600
  # -- Migration Job resource requests and limits.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

# -- Internal controller-neutral OpenReplay router.
router:
  # -- Deploy the router.
  enabled: true
  # -- Router replica count.
  replicaCount: 1
  image:
    # -- Official Caddy image repository.
    repository: docker.io/library/caddy
    # -- Router image tag.
    tag: 2.10.2-alpine
    # -- Manifest digest pin.
    digest: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  containerPorts:
    # -- Caddy HTTP listener port.
    http: 8080
  # -- Router resources.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

