# -- Default application component resources.
componentDefaults:
  # -- Component image pull policy.
  imagePullPolicy: IfNotPresent
  # -- Resource requests and limits inherited by every component.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Component pod security context.
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Component container security context.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1001
  # -- Component node selector. amd64 is required upstream.
  nodeSelector:
    kubernetes.io/arch: amd64
  # -- Component tolerations.
  tolerations: []
  # -- Component affinity.
  affinity: {}
  # -- Component topology spread constraints.
  topologySpreadConstraints: []

# -- Public router Service.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Service annotations.
  annotations: {}
  # -- IP family policy.
  ipFamilyPolicy: ""
  # -- IP families.
  ipFamilies: []

# -- Conventional Ingress targeting the internal router.
ingress:
  # -- Create an Ingress.
  enabled: false
  # -- IngressClass name. Empty uses the cluster default.
  ingressClassName: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts.
  hosts: []
  # -- Ingress TLS entries.
  tls: []

# -- Gateway API HTTPRoute targeting the internal router.
gatewayAPI:
  # -- Create HTTPRoute resources.
  enabled: false
  # -- HTTPRoute definitions.
  httpRoutes: []

# -- Service account configuration.
serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- ServiceAccount name override.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}
  # -- Automount Kubernetes API credentials.
  automountServiceAccountToken: false

# -- Pod disruption budget for the router.
pdb:
  # -- Create a PDB when router.replicaCount is greater than one.
  enabled: false
  # -- Minimum available router pods.
  minAvailable: 1
  # -- Maximum unavailable router pods. Empty uses minAvailable.
  maxUnavailable: ""

# -- NetworkPolicy configuration.
networkPolicy:
  # -- Create a NetworkPolicy for application pods.
  enabled: false
  # -- Ingress peers. Empty permits traffic from all namespaces.
  ingressFrom: []
  egress:
    # -- Restrict egress.
    enabled: false
    # -- Permit DNS egress.
    allowDNS: true
    # -- Additional egress peers.
    extraTo: []
    # -- Additional complete egress rules.
    extraEgress: []

# -- Prometheus Operator integration.
monitoring:
  serviceMonitor:
    # -- Create ServiceMonitors for enabled components.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Additional ServiceMonitor labels.
    labels: {}
    # -- Namespace selector.
    namespaceSelector: {}

# -- Extra Kubernetes manifests.
extraManifests: []

# Bundled HelmForge PostgreSQL subchart values.
postgresql:
  enabled: true
  auth:
    database: openreplay
    username: openreplay
    existingSecret: openreplay-credentials
    existingSecretUserPasswordKey: postgres-password
  primary:
    persistence:
      size: 20Gi

# Bundled HelmForge Redis subchart values.
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: openreplay-credentials
    existingSecretPasswordKey: redis-password

# Bundled HelmForge ClickHouse subchart values.
clickhouse:
  enabled: true
  clickhouse:
    database: default
    user: default
    existingSecret: openreplay-credentials
    existingSecretPasswordKey: clickhouse-password
  persistence:
    size: 100Gi
