{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.metricsPort }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openreplay.componentName" (dict "root" $ "component" $name) }}
  labels:
    {{- include "openreplay.labels" $ | nindent 4 }}
    {{- with $.Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "openreplay.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
  {{- with $.Values.monitoring.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
