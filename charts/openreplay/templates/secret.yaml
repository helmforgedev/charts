{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (not .Values.credentials.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- $name := .Values.credentials.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openreplay.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.postgresqlPasswordKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.postgresqlPasswordKey | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- if ne .Values.credentials.postgresSuperuserPasswordKey .Values.credentials.postgresqlPasswordKey }}
  {{ .Values.credentials.postgresSuperuserPasswordKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.postgresSuperuserPasswordKey | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
  {{ .Values.credentials.redisPasswordKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.redisPasswordKey | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{ .Values.credentials.clickhousePasswordKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.clickhousePasswordKey | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{ .Values.credentials.s3AccessKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.s3AccessKeyKey | default (randAlphaNum 20 | b64enc) }}{{ else }}{{ randAlphaNum 20 | b64enc }}{{ end }}
  {{ .Values.credentials.s3SecretKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.s3SecretKeyKey | default (randAlphaNum 40 | b64enc) }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
  {{ .Values.credentials.assistKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.assistKeyKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.assistJwtSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.assistJwtSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.jwtSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.jwtSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.jwtSpotSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.jwtSpotSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.tokenSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.tokenSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.jwtRefreshSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.jwtRefreshSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.jwtSpotRefreshSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.jwtSpotRefreshSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.credentials.jwtMcpSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.credentials.jwtMcpSecretKey | default (randAlphaNum 64 | b64enc) }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}

