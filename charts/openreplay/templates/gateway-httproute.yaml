{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gatewayAPI.enabled }}
{{- $names := dict }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes }}
{{- if not $route.parentRefs }}{{- fail "gatewayAPI.httpRoutes[].parentRefs is required" }}{{- end }}
{{- $name := include "openreplay.httpRouteName" (dict "root" $ "route" $route "index" $index) }}
{{- if hasKey $names $name }}{{- fail (printf "gatewayAPI.httpRoutes render duplicate HTTPRoute name %q" $name) }}{{- end }}
{{- $_ := set $names $name true }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "openreplay.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" $route.path | quote }}
      backendRefs:
        - name: {{ include "openreplay.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}

