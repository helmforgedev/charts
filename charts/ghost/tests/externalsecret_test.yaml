# SPDX-License-Identifier: Apache-2.0
suite: ExternalSecret
templates:
  - externalsecret.yaml
release:
  name: test
  namespace: default
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders database credentials with the canonical items contract
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: ghost-db
            labels:
              team: platform
            annotations:
              example.com/managed: "true"
            spec:
              secretStoreRef:
                name: platform-secrets
                kind: ClusterSecretStore
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
                    property: password
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: ghost-db
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.annotations["example.com/managed"]
          value: "true"
      - equal:
          path: spec.target.name
          value: ghost-db
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: defaults the target name to the rendered ExternalSecret name
    set:
      database.external.existingSecret: test-ghost-db
      externalSecrets:
        enabled: true
        items:
          - name: db
            spec:
              secretStoreRef:
                name: platform-secrets
                kind: ClusterSecretStore
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
    asserts:
      - equal:
          path: metadata.name
          value: test-ghost-db
      - equal:
          path: spec.target.name
          value: test-ghost-db

  - it: preserves an item-specific refresh interval
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        refreshInterval: 1h
        items:
          - fullnameOverride: ghost-db
            spec:
              refreshInterval: 15m
              secretStoreRef:
                name: platform-secrets
              dataFrom:
                - extract:
                    key: ghost/database
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 15m

  - it: renders multiple ExternalSecret items
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: ghost-db
            spec:
              secretStoreRef:
                name: platform-secrets
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
          - name: smtp
            spec:
              secretStoreRef:
                name: platform-secrets
              data:
                - secretKey: token
                  remoteRef:
                    key: ghost/smtp
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: ghost-db
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-ghost-smtp
        documentIndex: 1

  - it: preserves the legacy single ExternalSecret surface
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        secretStoreRef:
          name: platform-secrets
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: password
            remoteRef:
              key: ghost/database
    asserts:
      - equal:
          path: metadata.name
          value: test-ghost-db
      - equal:
          path: spec.target.name
          value: ghost-db
      - equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: requires a SecretStore reference
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: ghost-db
            spec:
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true"

  - it: rejects items that do not target the consumed database Secret
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: another-secret
            spec:
              secretStoreRef:
                name: platform-secrets
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items must include a spec.target.name matching database.external.existingSecret

  - it: requires the configured password key in the database Secret
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        items:
          - fullnameOverride: ghost-db
            spec:
              secretStoreRef:
                name: platform-secrets
              data:
                - secretKey: username
                  remoteRef:
                    key: ghost/database
    asserts:
      - failedTemplate:
          errorMessage: 'the ExternalSecret targeting database.external.existingSecret must provide secretKey "password" in spec.data or use spec.dataFrom'

  - it: rejects deprecated non-v1 apiVersion values
    set:
      database.external.existingSecret: ghost-db
      externalSecrets:
        enabled: true
        apiVersion: external-secrets.io/v1beta1
        items:
          - fullnameOverride: ghost-db
            spec:
              secretStoreRef:
                name: platform-secrets
              data:
                - secretKey: password
                  remoteRef:
                    key: ghost/database
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.apiVersion is deprecated; Ghost renders external-secrets.io/v1 only. Upgrade External Secrets Operator CRDs or remove this value."
