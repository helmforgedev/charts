# SPDX-License-Identifier: Apache-2.0
suite: Backup workload
templates:
  - templates/backup-cronjob.yaml
  - templates/backup-configmap.yaml
  - templates/backup-serviceaccount.yaml
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should keep backup resources disabled by default
    template: templates/backup-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should bound backup scratch storage and disable the API token
    template: templates/backup-cronjob.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: ghost
      backup.s3.accessKey: test
      backup.s3.secretKey: test
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[1].emptyDir.sizeLimit
          value: 2Gi
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should inherit the configured Ghost pod identity for backup volume access
    template: templates/backup-cronjob.yaml
    set:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 3000
        fsGroup: 4000
        seccompProfile:
          type: RuntimeDefault
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: ghost
      backup.s3.accessKey: test
      backup.s3.secretKey: test
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 2000
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsGroup
          value: 3000
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 4000

  - it: should use configured key names for generated inline credentials
    template: templates/secret.yaml
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: ghost
      backup.s3.accessKey: test-access
      backup.s3.secretKey: test-secret
      backup.s3.existingSecretAccessKeyKey: custom-access
      backup.s3.existingSecretSecretKeyKey: custom-secret
    asserts:
      - equal:
          path: stringData["custom-access"]
          value: test-access
      - equal:
          path: stringData["custom-secret"]
          value: test-secret

  - it: should use ambient AWS credentials without static Secret references
    template: templates/backup-cronjob.yaml
    set:
      backup:
        enabled: true
        s3:
          endpoint: https://s3.amazonaws.com
          bucket: ghost
          region: us-east-1
          credentialsFromPodIdentity: true
          accessKey: retained-access-key
          secretKey: retained-secret-key
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: test-ghost-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
          any: true

  - it: should create a dedicated annotated backup ServiceAccount
    template: templates/backup-serviceaccount.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
      backup:
        enabled: true
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ghost-backup
        s3:
          endpoint: https://s3.amazonaws.com
          bucket: ghost
          region: us-east-1
          credentialsFromPodIdentity: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-ghost-backup
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/ghost-backup

  - it: should not create static backup credentials for workload identity
    template: templates/secret.yaml
    set:
      database.external.password: ""
      backup:
        enabled: true
        s3:
          endpoint: https://s3.amazonaws.com
          bucket: ghost
          region: us-east-1
          credentialsFromPodIdentity: true
          accessKey: retained-access-key
          secretKey: retained-secret-key
    asserts:
      - hasDocuments:
          count: 0
