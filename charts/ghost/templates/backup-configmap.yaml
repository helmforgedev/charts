{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ghost.fullname" . }}-backup-scripts
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  {{- include "ghost.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  content-backup.sh: |
    #!/bin/sh
    set -e
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    ARCHIVE="/backup/{{ .Values.backup.archivePrefix }}-${TIMESTAMP}.tar.gz"
    echo "Creating Ghost content backup archive..."
    tar -czf "${ARCHIVE}" -C /var/lib/ghost/content .
    echo "Archive created: ${ARCHIVE}"
  upload-backup.sh: |
    #!/bin/sh
    set -e
    ARCHIVE=$(ls -t /backup/*.gz 2>/dev/null | head -1)
    if [ -z "${ARCHIVE}" ]; then
      echo "No backup archive found"; exit 1
    fi
    {{- if .Values.backup.s3.credentialsFromPodIdentity }}
    export MC_HOST_s3="${S3_ENDPOINT}"
    sts_domain="amazonaws.com"
    case "${AWS_REGION}" in
      cn-*) sts_domain="amazonaws.com.cn" ;;
    esac
    export MC_STS_ENDPOINT_s3="https://sts.${AWS_REGION}.${sts_domain}"
    {{- else }}
    mc alias set s3 "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" --api S3v4
    {{- end }}
    {{- if .Values.backup.s3.createBucketIfNotExists }}
    mc mb --ignore-existing "s3/${S3_BUCKET}"
    {{- end }}
    mc cp "${ARCHIVE}" "s3/${S3_BUCKET}/${S3_PREFIX}/$(basename "${ARCHIVE}")"
    echo "Upload complete: $(basename "${ARCHIVE}")"
{{- end }}
