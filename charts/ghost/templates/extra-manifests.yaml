{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- range .Values.extraManifests }}
{{- $manifest := deepCopy . }}
{{- $metadata := deepCopy (get $manifest "metadata" | default dict) }}
{{- $specific := deepCopy (get $metadata "annotations" | default dict) }}
{{- $annotations := mergeOverwrite (deepCopy ($.Values.commonAnnotations | default dict)) $specific }}
{{- if $annotations }}
{{- $_ := set $metadata "annotations" $annotations }}
{{- end }}
{{- $_ := set $manifest "metadata" $metadata }}
---
{{ toYaml $manifest }}
{{- end }}
