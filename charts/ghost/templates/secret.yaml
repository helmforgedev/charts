{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (not .Values.mysql.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "ghost.fullname" .) }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  {{- include "ghost.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsFromPodIdentity) (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "ghost.fullname" .) }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  {{- include "ghost.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.existingSecretAccessKeyKey }}: {{ .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.existingSecretSecretKeyKey }}: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
