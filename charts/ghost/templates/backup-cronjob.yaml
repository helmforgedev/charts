{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ghost.fullname" . }}-backup
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  {{- include "ghost.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "ghost.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- if .Values.backup.s3.credentialsFromPodIdentity }}
          serviceAccountName: {{ include "ghost.backupServiceAccountName" . }}
          automountServiceAccountToken: {{ .Values.backup.serviceAccount.automountServiceAccountToken }}
          {{- else }}
          serviceAccountName: {{ include "ghost.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: content-backup
              image: {{ .Values.backup.images.backup }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["/bin/sh", "/scripts/content-backup.sh"]
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: content
                  mountPath: /var/lib/ghost/content
                  readOnly: true
                - name: backup-scratch
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: upload
              image: {{ .Values.backup.images.uploader }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["/bin/sh", "/scripts/upload-backup.sh"]
              env:
                - name: MC_CONFIG_DIR
                  value: /mc-config
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | quote }}
                {{- if .Values.backup.s3.credentialsFromPodIdentity }}
                - name: AWS_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- else }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ghost.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretAccessKeyKey }}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ghost.backupSecretName" . }}
                      key: {{ .Values.backup.s3.existingSecretSecretKeyKey }}
                {{- end }}
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                  readOnly: true
                - name: mc-config
                  mountPath: /mc-config
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: content
              persistentVolumeClaim:
                claimName: {{ include "ghost.contentClaimName" . }}
            - name: backup-scratch
              emptyDir:
                sizeLimit: {{ .Values.backup.scratchSizeLimit }}
            - name: mc-config
              emptyDir: {}
            - name: scripts
              configMap:
                name: {{ include "ghost.fullname" . }}-backup-scripts
                defaultMode: 0755
{{- end }}
