# CKAN with external PostgreSQL and Redis. Solr stays bundled.
#
#   kubectl create secret generic ckan-db \
#     --from-literal=password=<write-pass> \
#     --from-literal=datastore-read-password=<read-pass>
#   kubectl create secret generic ckan-redis --from-literal=redis-password=<pass>
#   helm install ckan helmforge/ckan -f external-datastores.yaml

ckan:
  plugins: envvars image_view text_view datatables_view datastore datapusher

postgresql:
  enabled: false
database:
  mode: external
  external:
    host: pg.internal.example.com
    port: 5432
    ckanDatabase: ckan
    datastoreDatabase: datastore
    username: ckan
    existingSecret: ckan-db
    existingSecretPasswordKey: password
    existingSecretDatastoreReadPasswordKey: datastore-read-password
    sslMode: verify-full

redis:
  enabled: false
redisConfig:
  mode: external
  external:
    host: redis.internal.example.com
    port: 6379
    database: 0
    tls: true
    sslCertReqs: required
    existingSecret: ckan-redis
    existingSecretPasswordKey: redis-password

persistence:
  enabled: true
  size: 10Gi
