# SPDX-License-Identifier: Apache-2.0
suite: DataPusher Deployment
templates:
  - templates/datapusher-deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Deployment when enabled
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-ckan-datapusher

  - it: should have datapusher component label
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: datapusher

  - it: should use correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/ckan/ckan-base-datapusher:0.0.21"

  - it: should not render when disabled
    set:
      datapusher.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose port 8800
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8800
            protocol: TCP

  - it: should configure the real listener when the port changes
    set:
      datapusher.port: 8801
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8801
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '--http=\[::\]:8801'

  - it: should use hardened pod defaults
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 92
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
