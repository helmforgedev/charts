# SPDX-License-Identifier: Apache-2.0
suite: Validation
templates:
  - templates/validate.yaml
tests:
  - it: should render no validation manifest by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should require the PostgreSQL subchart in subchart mode
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.enabled must be true when database.mode is subchart"

  - it: should reject the PostgreSQL subchart in external mode
    set:
      database.mode: external
      database.external.host: postgresql.example.com
      database.external.password: secret
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.enabled must be false when database.mode is external"

  - it: should require external PostgreSQL for the datastore plugin
    set:
      ckan.plugins: envvars datastore
    asserts:
      - failedTemplate:
          errorMessage: "the datastore plugin requires database.mode=external and pre-provisioned DataStore roles"

  - it: should require the DataStore read password for inline external credentials
    set:
      ckan.plugins: envvars datastore
      database.mode: external
      database.external.host: postgresql.example.com
      database.external.password: write-secret
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "database.external.datastoreReadPassword or database.external.existingSecret is required when the datastore plugin is enabled"

  - it: should require the Redis subchart in subchart mode
    set:
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "redis.enabled must be true when redisConfig.mode is subchart"

  - it: should reject the Redis subchart in external mode
    set:
      redisConfig.mode: external
      redisConfig.external.host: redis.example.com
      redisConfig.external.password: secret
    asserts:
      - failedTemplate:
          errorMessage: "redis.enabled must be false when redisConfig.mode is external"

  - it: should fail when external database host is missing
    set:
      database.mode: external
      database.external.password: secret
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "database.external.host is required when database.mode is external"

  - it: should fail when external database credentials are missing
    set:
      database.mode: external
      database.external.host: postgresql.example.com
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "database.external.password or database.external.existingSecret is required when database.mode is external"

  - it: should fail when external Redis host is missing
    set:
      redisConfig.mode: external
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "redisConfig.external.host is required when redisConfig.mode is external"

  - it: should fail when external Redis credentials are missing
    set:
      redisConfig.mode: external
      redisConfig.external.host: redis.example.com
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "redisConfig.external.password or redisConfig.external.existingSecret is required when redisConfig.mode is external"

  - it: should fail when external solr url is missing
    set:
      solr.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "solr.externalUrl is required when solr.enabled is false"

  - it: should fail when ingress is enabled without rules
    set:
      ingress.enabled: true
      ingress.hosts: []
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled requires ingress.hosts to contain at least one rule"

  - it: should fail when backup endpoint is missing
    set:
      backup.enabled: true
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.endpoint is required when backup.enabled is true"

  - it: should fail when backup bucket is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.bucket is required when backup.enabled is true"

  - it: should fail when backup access key is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.secretKey: secret
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.accessKey or backup.s3.existingSecret is required when backup.enabled is true"

  - it: should fail when backup secret key is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: http://minio:9000
      backup.s3.bucket: backups
      backup.s3.accessKey: access
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3.secretKey or backup.s3.existingSecret is required when backup.enabled is true"

  - it: should fail when podLabels override selector labels
    set:
      podLabels:
        app.kubernetes.io/component: custom
    asserts:
      - failedTemplate:
          errorMessage: 'podLabels must not override selector label "app.kubernetes.io/component"'

  - it: should fail when datapusher podLabels override selector labels
    set:
      datapusher.podLabels:
        app.kubernetes.io/name: custom
    asserts:
      - failedTemplate:
          errorMessage: 'datapusher.podLabels must not override selector label "app.kubernetes.io/name"'

  - it: should allow datapusher podLabels when datapusher is disabled
    set:
      datapusher.enabled: false
      datapusher.podLabels:
        app.kubernetes.io/name: custom
    asserts:
      - hasDocuments:
          count: 0
