# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should render arbitrary resources
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ckan-extra
          data:
            mode: production
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: ckan-extra
      - equal:
          path: data.mode
          value: production

  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0
