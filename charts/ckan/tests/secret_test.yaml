# SPDX-License-Identifier: Apache-2.0
suite: Secrets
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render CKAN secret with auto-generated values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isNotNull:
          path: data["sysadmin-password"]
      - isNotNull:
          path: data["session-secret"]
      - isNotNull:
          path: data["jwt-secret"]

  - it: should not render when existingSecret is set
    set:
      ckan.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should render external database secret
    set:
      database.mode: external
      database.external.host: pg.example.com
      database.external.password: ext-pass
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: should render external Redis credentials as a Secret
    documentIndex: 1
    set:
      redisConfig.mode: external
      redisConfig.external.host: redis.example.com
      redisConfig.external.password: ext-pass
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-ckan-redis
      - equal:
          path: data["redis-password"]
          value: ZXh0LXBhc3M=

  - it: should encode both external DataStore passwords
    documentIndex: 1
    set:
      ckan.plugins: envvars datastore
      database.mode: external
      database.external.host: pg.example.com
      database.external.password: write-pass
      database.external.datastoreReadPassword: read-pass
      postgresql.enabled: false
    asserts:
      - equal:
          path: data["database-password"]
          value: d3JpdGUtcGFzcw==
      - equal:
          path: data["datastore-read-password"]
          value: cmVhZC1wYXNz

  - it: should encode inline backup credentials
    documentIndex: 1
    set:
      backup.enabled: true
      backup.s3.endpoint: https://s3.example.com
      backup.s3.bucket: backups
      backup.s3.accessKey: access
      backup.s3.secretKey: secret
    asserts:
      - equal:
          path: data["access-key"]
          value: YWNjZXNz
      - equal:
          path: data["secret-key"]
          value: c2VjcmV0
