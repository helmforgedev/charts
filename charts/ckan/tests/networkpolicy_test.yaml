# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: should expose only the CKAN pod publicly
    documentIndex: 0
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: test-ckan-ckan
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: ckan
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 5000
      - equal:
          path: spec.egress[0]
          value: {}

  - it: should restrict DataPusher ingress to CKAN pods
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: datapusher
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: ckan
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8800

  - it: should restrict Solr ingress to CKAN pods
    documentIndex: 2
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: solr
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: ckan
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8983

  - it: should apply a public ingress allowlist only to CKAN
    documentIndex: 0
    set:
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-system

  - it: should render only the CKAN policy when components are external
    set:
      datapusher.enabled: false
      solr.enabled: false
      solr.externalUrl: http://solr.example.com:8983/solr/ckan
    asserts:
      - hasDocuments:
          count: 1

  - it: should not render when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
