# SPDX-License-Identifier: Apache-2.0
suite: Solr StatefulSet
templates:
  - templates/solr-statefulset.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a StatefulSet when enabled
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: test-ckan-solr

  - it: should have solr component label
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: solr

  - it: should use correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/ckan/ckan-solr:2.11-solr9"

  - it: should not render when disabled
    set:
      solr.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have persistence by default
    asserts:
      - isNotNull:
          path: spec.volumeClaimTemplates

  - it: should configure the real Solr listener when the port changes
    set:
      solr.port: 8984
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8984
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOLR_PORT
            value: "8984"

  - it: should use hardened pod defaults
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 8983
