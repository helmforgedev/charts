{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.ckan.existingSecret }}
{{- $secretName := include "ckan.fullname" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.ckan.sysadminPassword }}
  sysadmin-password: {{ .Values.ckan.sysadminPassword | b64enc | quote }}
  {{- else if and $existingSecret (hasKey $existingSecret.data "sysadmin-password") }}
  sysadmin-password: {{ index $existingSecret.data "sysadmin-password" | quote }}
  {{- else }}
  sysadmin-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.ckan.sessionSecret }}
  session-secret: {{ .Values.ckan.sessionSecret | b64enc | quote }}
  {{- else if and $existingSecret (hasKey $existingSecret.data "session-secret") }}
  session-secret: {{ index $existingSecret.data "session-secret" | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 42 | b64enc | quote }}
  {{- end }}
  {{- if .Values.ckan.jwtSecret }}
  jwt-secret: {{ .Values.ckan.jwtSecret | b64enc | quote }}
  {{- else if and $existingSecret (hasKey $existingSecret.data "jwt-secret") }}
  jwt-secret: {{ index $existingSecret.data "jwt-secret" | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 42 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (eq .Values.database.mode "external") (not .Values.database.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database" (include "ckan.fullname" .) }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
type: Opaque
data:
  database-password: {{ .Values.database.external.password | b64enc | quote }}
  {{- if has "datastore" (splitList " " .Values.ckan.plugins) }}
  datastore-read-password: {{ .Values.database.external.datastoreReadPassword | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (eq .Values.redisConfig.mode "external") (not .Values.redisConfig.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redis" (include "ckan.fullname" .) }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.redisConfig.external.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "ckan.fullname" .) }}
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
{{- end }}
