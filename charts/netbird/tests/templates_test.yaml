# SPDX-License-Identifier: Apache-2.0
suite: netbird base templates
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/pvc.yaml
  - templates/secret-config.yaml
  - templates/ingress.yaml
tests:
  - it: renders the official pinned server image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: netbirdio/netbird-server:0.81.3
        template: templates/deployment.yaml
        documentIndex: 0
  - it: renders the official pinned dashboard image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: netbirdio/dashboard:v2.90.10
        template: templates/deployment.yaml
        documentIndex: 1
  - it: wires custom listeners to both workloads
    set:
      server.containerPorts.http: 8080
      server.containerPorts.stun: 3479
      server.containerPorts.metrics: 9191
      server.containerPorts.health: 9091
      dashboard.containerPorts.http: 8088
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 3479
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9191
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].ports[3].containerPort
          value: 9091
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8088
        template: templates/deployment.yaml
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'listen 8088 default_server'
        template: templates/deployment.yaml
        documentIndex: 1
  - it: applies bounded writable storage and resource defaults
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].emptyDir.sizeLimit
          value: 1Gi
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
        template: templates/deployment.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 32Mi
        template: templates/deployment.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[3].emptyDir.sizeLimit
          value: 8Mi
        template: templates/deployment.yaml
        documentIndex: 1
  - it: renders an explicit data-store encryption key into the chart-managed config Secret
    set:
      server.store.encryptionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    asserts:
      - equal:
          path: stringData.data-store-encryption-key
          value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        template: templates/secret-config.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'encryptionKey: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="'
        template: templates/secret-config.yaml
  - it: configures dashboard defaults for the embedded identity provider
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_CLIENT_ID
            value: netbird-dashboard
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_AUDIENCE
            value: netbird-dashboard
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_SUPPORTED_SCOPES
            value: openid profile email groups
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_REDIRECT_URI
            value: /nb-auth
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_SILENT_REDIRECT_URI
            value: /nb-silent-auth
        template: templates/deployment.yaml
        documentIndex: 1
  - it: supports external identity provider dashboard overrides
    set:
      dashboard.auth.clientId: custom-dashboard
      dashboard.auth.audience: custom-audience
      dashboard.auth.supportedScopes: openid profile email
      dashboard.auth.redirectUri: https://vpn.example.com/auth/callback
      dashboard.auth.silentRedirectUri: https://vpn.example.com/auth/silent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_CLIENT_ID
            value: custom-dashboard
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_REDIRECT_URI
            value: https://vpn.example.com/auth/callback
        template: templates/deployment.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_SILENT_REDIRECT_URI
            value: https://vpn.example.com/auth/silent
        template: templates/deployment.yaml
        documentIndex: 1
  - it: renders separate server and dashboard services
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-netbird-server
        template: templates/service.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-netbird-dashboard
        template: templates/service.yaml
        documentIndex: 1
  - it: uses emptyDir when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.volumes[1].emptyDir
        template: templates/deployment.yaml
        documentIndex: 0
  - it: creates a PVC when persistence is chart-managed
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        template: templates/pvc.yaml
