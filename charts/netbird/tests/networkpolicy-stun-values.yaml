# SPDX-License-Identifier: Apache-2.0
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  stunIngressFrom:
    - ipBlock:
        cidr: 203.0.113.0/24
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: peers
      podSelector:
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
              - netbird-peer
