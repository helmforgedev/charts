# SPDX-License-Identifier: Apache-2.0
suite: Helm Test
templates:
  - templates/tests/test-connection.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render the Helm test hook pod
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.name
          value: test-netbird-test-connection
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.containers[0].args[1]
          value: http://test-netbird-dashboard:80/
  - it: should test the server port when the dashboard is disabled
    set:
      dashboard.enabled: false
    asserts:
      - equal:
          path: spec.containers[0].command[0]
          value: nc
      - equal:
          path: spec.containers[0].args
          value:
            - -z
            - -w
            - "10"
            - test-netbird-server
            - "80"
