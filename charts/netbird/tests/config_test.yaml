# SPDX-License-Identifier: Apache-2.0
suite: netbird server config
templates:
  - templates/secret-config.yaml
tests:
  - it: wires custom server container ports into the upstream configuration
    set:
      server.containerPorts.http: 8080
      server.containerPorts.stun: 3479
      server.containerPorts.metrics: 9191
      server.containerPorts.health: 9091
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'listenAddress: ":8080"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'stunPorts:\n\s+- 3479'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'metricsPort: 9191'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'healthcheckAddress: ":9091"'
  - it: renders dashboard redirect URIs from the default public URL
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com/nb-auth"'
        template: templates/secret-config.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com/nb-silent-auth"'
        template: templates/secret-config.yaml
  - it: strips the default https port from dashboard redirect URIs only
    set:
      server.publicUrl: https://netbird.example.com:443
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com/nb-auth"'
        template: templates/secret-config.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com/nb-silent-auth"'
        template: templates/secret-config.yaml
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: ':443/nb-auth'
        template: templates/secret-config.yaml
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: ':443/nb-silent-auth'
        template: templates/secret-config.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'exposedAddress: "https://netbird\.example\.com:443"'
        template: templates/secret-config.yaml
  - it: keeps a non-default http port in dashboard redirect URIs
    set:
      server.publicUrl: http://netbird.example.com:443
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "http://netbird\.example\.com:443/nb-auth"'
        template: templates/secret-config.yaml
  - it: strips the default http port from dashboard redirect URIs
    set:
      server.publicUrl: http://netbird.example.com:80
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "http://netbird\.example\.com/nb-auth"'
        template: templates/secret-config.yaml
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: ':80/nb-auth'
        template: templates/secret-config.yaml
  - it: keeps non-default ports that share a prefix with the default port
    set:
      server.publicUrl: https://netbird.example.com:4433
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com:4433/nb-auth"'
        template: templates/secret-config.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- "https://netbird\.example\.com:4433/nb-silent-auth"'
        template: templates/secret-config.yaml
