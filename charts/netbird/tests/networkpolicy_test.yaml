# SPDX-License-Identifier: Apache-2.0
suite: netbird network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: limits inbound netbird HTTP traffic
    values:
      - networkpolicy-values.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: http
      - notContains:
          path: spec.policyTypes
          content: Egress
      - notContains:
          path: spec.ingress[0].ports
          content:
            protocol: UDP
            port: stun-udp
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-system
  - it: isolates direct STUN peers from HTTP-facing ingress peers
    values:
      - networkpolicy-stun-values.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: traefik
      - equal:
          path: spec.ingress[1].from[0].ipBlock.cidr
          value: 203.0.113.0/24
      - equal:
          path: spec.ingress[1].from[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: peers
      - equal:
          path: spec.ingress[1].from[1].podSelector.matchExpressions[0].operator
          value: In
      - equal:
          path: spec.ingress[1].ports[0].port
          value: stun-udp
  - it: enables egress isolation when extraEgress is configured
    values:
      - networkpolicy-extra-egress-values.yaml
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[1].ports[0].port
          value: 80
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8443
