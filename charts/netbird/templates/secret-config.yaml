{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.server.config.existingSecret }}
{{- $secretName := include "netbird.configSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := (get ($existing | default dict) "data") | default dict -}}
{{- $encryptionKey := .Values.server.store.encryptionKey -}}
{{- if not $encryptionKey -}}
  {{- $encryptionKey = (get $existingData "data-store-encryption-key" | default "" | b64dec) | default (randBytes 32) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
type: Opaque
stringData:
  data-store-encryption-key: {{ $encryptionKey | quote }}
  config.yaml: |
    server:
      listenAddress: {{ printf ":%v" .Values.server.containerPorts.http | quote }}
      exposedAddress: {{ .Values.server.publicUrl | quote }}
      stunPorts:
        - {{ .Values.server.containerPorts.stun }}
      metricsPort: {{ .Values.server.containerPorts.metrics }}
      healthcheckAddress: {{ printf ":%v" .Values.server.containerPorts.health | quote }}
      logLevel: "info"
      logFile: "console"
      authSecret: {{ .Values.server.authSecret | quote }}
      dataDir: {{ printf "%s/" (.Values.persistence.mountPath | trimSuffix "/") | quote }}
      disableAnonymousMetrics: {{ .Values.server.disableAnonymousMetrics }}
      disableGeoliteUpdate: {{ .Values.server.disableGeoliteUpdate }}
      tls:
        certFile: ""
        keyFile: ""
        letsencrypt:
          enabled: false
          dataDir: ""
          domains: []
          email: ""
          awsRoute53: false
      auth:
        issuer: {{ .Values.server.auth.issuer | quote }}
        localAuthDisabled: {{ .Values.server.auth.localAuthDisabled }}
        signKeyRefreshEnabled: {{ .Values.server.auth.signKeyRefreshEnabled }}
        # Browsers serialize origins without the scheme default port, and the
        # embedded identity provider compares redirect URIs literally, so the
        # default port must be stripped here while server.publicUrl stays
        # untouched for exposedAddress.
        dashboardRedirectURIs:
          - {{ printf "%s/nb-auth" (include "netbird.publicUrlRedirectBase" .) | quote }}
          - {{ printf "%s/nb-silent-auth" (include "netbird.publicUrlRedirectBase" .) | quote }}
        cliRedirectURIs:
          - "http://localhost:53000/"
        {{- if or .Values.server.auth.owner.email .Values.server.auth.owner.password }}
        owner:
          email: {{ .Values.server.auth.owner.email | quote }}
          password: {{ .Values.server.auth.owner.password | quote }}
        {{- end }}
      store:
        engine: {{ include "netbird.storeEngine" . | quote }}
        dsn: {{ include "netbird.storeConfigDsn" . | quote }}
        encryptionKey: {{ $encryptionKey | quote }}
{{- with .Values.server.config.extraYaml }}
{{ . | nindent 6 }}
{{- end }}
{{- end }}
