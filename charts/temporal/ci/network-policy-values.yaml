networkPolicy:
  enabled: true
  egress:
    enabled: true
    allowDNS: true
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
        ports:
          - protocol: TCP
            port: 443
postgresql:
  networkPolicy:
    enabled: true
