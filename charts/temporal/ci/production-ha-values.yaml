# SPDX-License-Identifier: Apache-2.0
server:
  components:
    frontend:
      replicaCount: 3
    history:
      replicaCount: 3
    matching:
      replicaCount: 3
    worker:
      replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
web:
  replicaCount: 2
pdb:
  enabled: true
postgresql:
  architecture: replication
  replication:
    readReplicas:
      replicaCount: 2
