# SPDX-License-Identifier: Apache-2.0
credentials:
  existingSecret: temporal-database
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: temporal-database
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: user-password
            remoteRef:
              key: test/password
          - secretKey: postgres-password
            remoteRef:
              key: test/password
