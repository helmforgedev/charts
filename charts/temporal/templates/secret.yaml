{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.credentials.existingSecret }}
{{- $name := include "temporal.databaseSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $encoded := randAlphaNum 32 | b64enc }}
{{- if and $existing (hasKey $existing.data .Values.credentials.passwordKey) }}
{{- $encoded = index $existing.data .Values.credentials.passwordKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.passwordKey }}: {{ $encoded }}
  postgres-password: {{ $encoded }}
  replication-password: {{ $encoded }}
{{- end }}
