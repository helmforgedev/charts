{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gatewayAPI.enabled }}
{{- $names := dict }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes | default list }}
{{- if not $route.parentRefs }}{{ fail "gatewayAPI.httpRoutes[].parentRefs is required" }}{{- end }}
{{- $name := include "temporal.httpRouteName" (dict "root" $ "route" $route "index" $index) }}
{{- if hasKey $names $name }}{{ fail "HTTPRoute names must be unique" }}{{- end }}
{{- $_ := set $names $name true }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "temporal.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if $route.rules }}
    {{- range $rule := $route.rules }}
    {{- $renderedRule := deepCopy $rule }}
    {{- $omitDefaultBackend := $renderedRule.omitDefaultBackend | default false }}
    {{- $_ := unset $renderedRule "omitDefaultBackend" }}
    {{- if $renderedRule.backendRefs }}
    {{- else if $omitDefaultBackend }}
    {{- $_ := unset $renderedRule "backendRefs" }}
    {{- else }}
    {{- $_ := set $renderedRule "backendRefs" (list (dict "name" (include "temporal.componentName" (dict "root" $ "component" "web")) "port" $.Values.webService.port)) }}
    {{- end }}
    {{- toYaml (list $renderedRule) | nindent 4 }}
    {{- end }}
    {{- else }}
    - backendRefs:
        - name: {{ include "temporal.componentName" (dict "root" $ "component" "web") }}
          port: {{ $.Values.webService.port }}
    {{- end }}
{{- end }}
{{- end }}
