{{- if .Values.adminTools.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal.componentName" (dict "root" . "component" "admin-tools") }}
  labels:
    {{- include "temporal.componentLabels" (dict "root" . "component" "admin-tools") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "temporal.componentSelectorLabels" (dict "root" . "component" "admin-tools") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temporal.componentSelectorLabels" (dict "root" . "component" "admin-tools") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "temporal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-tools
          image: "{{ .Values.adminTools.image.repository }}:{{ .Values.adminTools.image.tag }}"
          imagePullPolicy: {{ .Values.adminTools.image.pullPolicy }}
          command: ["sleep", "infinity"]
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ printf "%s:%v" (include "temporal.componentName" (dict "root" . "component" "frontend")) .Values.frontendService.port | quote }}
          resources:
            {{- toYaml .Values.adminTools.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
