{{- if .Values.schema.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "temporal.fullname" . }}-schema-{{ .Release.Revision }}
  labels:
    {{- include "temporal.componentLabels" (dict "root" . "component" "schema") | nindent 4 }}
  {{- if .Values.schema.useHelmHooks }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.schema.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.schema.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "temporal.componentSelectorLabels" (dict "root" . "component" "schema") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "temporal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: "{{ .Values.adminTools.image.repository }}:{{ .Values.adminTools.image.tag }}"
          imagePullPolicy: {{ .Values.adminTools.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              sleep "$INITIAL_DELAY_SECONDS"
              tool() {
                db="$1"
                shift
                temporal-sql-tool --ep "$DB_HOST" --port "$DB_PORT" --user "$DB_USER" --password "$DB_PASSWORD" --plugin "$DB_PLUGIN" --db "$db" "$@"
              }
              attempt=0
              until tool "$DEFAULT_DB" setup-schema -v 0.0; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then exit 1; fi
                sleep 5
              done
              tool "$DEFAULT_DB" update-schema --schema-dir /etc/temporal/schema/postgresql/v12/temporal/versioned
              attempt=0
              until tool "$VISIBILITY_DB" setup-schema -v 0.0; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then exit 1; fi
                sleep 5
              done
              tool "$VISIBILITY_DB" update-schema --schema-dir /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - name: INITIAL_DELAY_SECONDS
              value: {{ .Values.schema.initialDelaySeconds | quote }}
            - name: DB_HOST
              value: {{ include "temporal.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.username | quote }}
            - name: DB_PLUGIN
              value: {{ .Values.database.pluginName | quote }}
            - name: DEFAULT_DB
              value: {{ .Values.database.database | quote }}
            - name: VISIBILITY_DB
              value: {{ .Values.database.visibilityDatabase | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "temporal.databaseSecretName" . }}
                  key: {{ .Values.credentials.passwordKey }}
          resources:
            {{- toYaml .Values.schema.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
