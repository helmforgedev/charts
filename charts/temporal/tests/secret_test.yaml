# SPDX-License-Identifier: Apache-2.0
suite: Temporal database Secret
templates:
  - secret.yaml
tests:
  - it: creates the bundled database Secret
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: data.user-password
      - exists:
          path: data.postgres-password
      - exists:
          path: data.replication-password
  - it: does not replace an existing managed Secret
    set:
      credentials.existingSecret: managed-temporal
    asserts:
      - hasDocuments:
          count: 0
