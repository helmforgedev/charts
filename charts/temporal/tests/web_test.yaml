# SPDX-License-Identifier: Apache-2.0
suite: Temporal Web UI
templates:
  - web-deployment.yaml
tests:
  - it: uses the official UI image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/temporalio/ui:2.56.0
  - it: checks the product health endpoint
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
  - it: runs with a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
  - it: can be disabled
    set:
      web.enabled: false
    asserts:
      - hasDocuments:
          count: 0
