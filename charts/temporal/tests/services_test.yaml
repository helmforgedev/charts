# SPDX-License-Identifier: Apache-2.0
suite: Temporal Services
templates:
  - services.yaml
tests:
  - it: renders public and headless Services
    asserts:
      - hasDocuments:
          count: 6
  - it: marks frontend as an h2c backend
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ports[0].appProtocol
          value: kubernetes.io/h2c
  - it: renders the Web UI service on 8080
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
  - it: emits dual-stack service fields
    values:
      - ../ci/dual-stack-values.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
  - it: keeps metrics Service and container listener ports independent
    set:
      containerPorts.metrics: 19090
      monitoring.servicePort: 19091
    documentIndex: 2
    asserts:
      - equal:
          path: spec.ports[2].port
          value: 19091
      - equal:
          path: spec.ports[2].targetPort
          value: metrics
