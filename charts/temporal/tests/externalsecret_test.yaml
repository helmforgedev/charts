# SPDX-License-Identifier: Apache-2.0
suite: Temporal ExternalSecret
templates:
  - externalsecret.yaml
release:
  name: test
  namespace: default
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults the target name and refresh interval
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: database
          spec:
            secretStoreRef:
              name: platform-secrets
              kind: ClusterSecretStore
            data:
              - secretKey: user-password
                remoteRef:
                  key: temporal/database
    asserts:
      - equal:
          path: metadata.name
          value: test-temporal-database
      - equal:
          path: spec.target.name
          value: test-temporal-database
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: preserves a literal fullname and item refresh interval
    set:
      externalSecrets.enabled: true
      externalSecrets.refreshInterval: 1h
      externalSecrets.items:
        - fullnameOverride: temporal-database
          spec:
            refreshInterval: 5m
            secretStoreRef:
              name: platform-secrets
              kind: ClusterSecretStore
            data:
              - secretKey: user-password
                remoteRef:
                  key: temporal/database
    asserts:
      - equal:
          path: metadata.name
          value: temporal-database
      - equal:
          path: spec.target.name
          value: temporal-database
      - equal:
          path: spec.refreshInterval
          value: 5m

  - it: renders multiple items
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: database
          spec:
            secretStoreRef:
              name: platform-secrets
            data: []
        - name: tls
          spec:
            secretStoreRef:
              name: platform-secrets
            data: []
    asserts:
      - hasDocuments:
          count: 2

  - it: requires a store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: broken
          spec:
            target:
              name: broken
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true
