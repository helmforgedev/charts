# SPDX-License-Identifier: Apache-2.0
# Spread independently scalable Temporal services across failure domains.
server:
  components:
    frontend:
      replicaCount: 3
    history:
      replicaCount: 3
    matching:
      replicaCount: 3
    worker:
      replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
web:
  replicaCount: 2
pdb:
  enabled: true
monitoring:
  serviceMonitor:
    enabled: true
postgresql:
  architecture: replication
