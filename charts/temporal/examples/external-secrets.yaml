# SPDX-License-Identifier: Apache-2.0
# Synchronize the shared database password from a ClusterSecretStore.
credentials:
  existingSecret: temporal-database
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: temporal-database
      spec:
        secretStoreRef:
          name: production-secrets
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: user-password
            remoteRef:
              key: temporal/database
              property: userPassword
          - secretKey: postgres-password
            remoteRef:
              key: temporal/database
              property: postgresPassword
