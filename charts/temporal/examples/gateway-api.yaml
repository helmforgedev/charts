# Expose the Web UI and frontend gRPC endpoint through separate Gateway listeners.
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: ui
      parentRefs:
        - name: platform-gateway
          namespace: gateway-system
          sectionName: https
      hostnames:
        - temporal.example.com
  grpcRoutes:
    - name: frontend
      parentRefs:
        - name: platform-gateway
          namespace: gateway-system
          sectionName: temporal-grpc
      hostnames:
        - api.temporal.example.com
