# Provision a Prometheus datasource and a starter dashboard entirely as code.
admin:
  existingSecret: grafana-admin
provisioning:
  datasources:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboardProviders:
    apiVersion: 1
    providers:
      - name: helmforge
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/helmforge
  dashboards:
    platform-home:
      title: Platform home
      uid: platform-home
      schemaVersion: 41
      version: 1
      panels: []
