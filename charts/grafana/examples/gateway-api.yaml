# Expose Grafana with an existing Gateway API Gateway.
admin:
  existingSecret: grafana-admin
grafana:
  rootUrl: https://grafana.example.com
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: public
          namespace: gateway-system
      hostnames:
        - grafana.example.com
networkPolicy:
  ingress:
    extraFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway-system
