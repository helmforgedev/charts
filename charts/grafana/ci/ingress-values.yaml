admin:
  password: helmforge-grafana-test
grafana:
  rootUrl: https://grafana.example.test
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: grafana.example.test
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: grafana-example-tls
      hosts:
        - grafana.example.test
