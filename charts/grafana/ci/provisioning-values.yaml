# SPDX-License-Identifier: Apache-2.0
admin:
  password: helmforge-grafana-test
provisioning:
  datasources:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboardProviders:
    apiVersion: 1
    providers:
      - name: helmforge
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/helmforge
  dashboards:
    cluster-overview:
      title: Cluster overview
      uid: helmforge-cluster
      schemaVersion: 41
      version: 1
      panels: []
  alerting:
    contact-points:
      apiVersion: 1
      contactPoints: []
plugins:
  preinstall:
    - grafana-clock-panel@2.1.8
