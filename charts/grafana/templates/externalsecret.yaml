{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.items }}
{{- $name := include "grafana.externalSecretName" (dict "root" $ "item" .) }}
{{- $spec := deepCopy (.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}{{- $_ := set $target "name" $name }}{{- $_ := set $spec "target" $target }}{{- end }}
{{- $hasStoreRef := false }}
{{- if dig "secretStoreRef" "name" "" $spec }}{{- $hasStoreRef = true }}{{- end }}
{{- range ($spec.data | default list) }}{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}{{- end }}
{{- range ($spec.dataFrom | default list) }}{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}{{- end }}
{{- if not $hasStoreRef }}{{- fail "externalSecrets.items[].spec requires secretStoreRef.name or an item sourceRef store/generator" }}{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "grafana.labels" $ | nindent 4 }}
    {{- with .labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- include "grafana.renderAnnotations" (dict "root" $ "specific" (.annotations | default dict)) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
