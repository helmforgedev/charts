{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-config
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  grafana.ini: |
    {{- include "grafana.ini" . | nindent 4 }}
{{- if or .Values.provisioning.datasources .Values.provisioning.dashboardProviders .Values.provisioning.alerting }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-provisioning
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  {{- with .Values.provisioning.datasources }}
  datasources.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.provisioning.dashboardProviders }}
  dashboards.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- range $name, $document := .Values.provisioning.alerting }}
  {{ $name }}.yaml: |
    {{- toYaml $document | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboards
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  .keep: ""
  {{- range $name, $dashboard := .Values.provisioning.dashboards }}
  {{ $name }}.json: |
    {{- $dashboard | toJson | nindent 4 }}
  {{- end }}
