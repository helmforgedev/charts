{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "grafana.adminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.admin.password }}
{{- if and (not $password) $existing }}{{- $password = index (default dict $existing.data) .Values.admin.passwordKey | default "" | b64dec }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.admin.userKey }}: {{ .Values.admin.user | quote }}
  {{ .Values.admin.passwordKey }}: {{ $password | default (randAlphaNum 32) | quote }}
{{- end }}
{{- if and (ne .Values.database.type "sqlite3") (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana.databaseSecretName" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ .Values.database.password | quote }}
{{- end }}
