{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- if .Values.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}{{ toYaml . | nindent 4 }}{{- end }}
    {{- with .Values.persistence.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- else }}
  {{- include "grafana.renderAnnotations" (dict "root" . "specific" .Values.persistence.annotations) | nindent 2 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
