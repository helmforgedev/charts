{{- if .Values.networkPolicy.enabled }}
{{- $extraFrom := .Values.networkPolicy.ingress.extraFrom | default list }}
{{- $extraEgress := .Values.networkPolicy.egress.extraEgress | default list }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- include "grafana.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  {{- if or .Values.networkPolicy.ingress.allowSameNamespace (gt (len $extraFrom) 0) }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingress.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
        {{- with $extraFrom }}{{ toYaml . | nindent 8 }}{{- end }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  ingress: []
  {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- if and (ne .Values.database.type "sqlite3") .Values.database.networkPolicyPeers }}
    - to:
        {{- toYaml .Values.database.networkPolicyPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "grafana.databasePort" . }}
    {{- end }}
    {{- with $extraEgress }}{{ toYaml . | nindent 4 }}{{- end }}
    {{- if and (not .Values.networkPolicy.egress.allowDNS) (not .Values.database.networkPolicyPeers) (eq (len $extraEgress) 0) }}[]{{- end }}
  {{- end }}
{{- end }}
