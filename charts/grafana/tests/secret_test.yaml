# SPDX-License-Identifier: Apache-2.0
suite: Grafana credential ownership
templates:
  - templates/secret.yaml
release: {name: test, namespace: observability}
tests:
  - it: creates an administrator Secret by default
    documentIndex: 0
    asserts:
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: test-grafana-admin}
  - it: sets the configured administrator username
    documentIndex: 0
    set: {admin.user: operator, admin.password: stable-password}
    asserts:
      - equal: {path: stringData.admin-user, value: operator}
  - it: uses custom administrator keys
    documentIndex: 0
    set: {admin.userKey: username, admin.passwordKey: password, admin.password: stable-password}
    asserts:
      - equal: {path: stringData.username, value: admin}
      - equal: {path: stringData.password, value: stable-password}
  - it: does not own an external administrator Secret
    set: {admin.existingSecret: grafana-admin}
    asserts:
      - hasDocuments: {count: 0}
  - it: creates a database Secret for inline external credentials
    documentIndex: 1
    set: {database.type: postgres, database.host: postgres, database.password: db-password}
    asserts:
      - equal: {path: metadata.name, value: test-grafana-database}
      - equal: {path: stringData.password, value: db-password}
  - it: does not own an existing database Secret
    set: {database.type: postgres, database.host: postgres, database.existingSecret: grafana-db}
    asserts:
      - hasDocuments: {count: 1}
