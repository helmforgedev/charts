# SPDX-License-Identifier: Apache-2.0
suite: Grafana External Secrets
templates:
  - templates/externalsecret.yaml
release: {name: test, namespace: observability}
tests:
  - it: renders no ExternalSecret by default
    asserts:
      - hasDocuments: {count: 0}
  - it: renders a native ExternalSecret
    capabilities:
      apiVersions: [external-secrets.io/v1/ExternalSecret]
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: admin
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            data:
              - secretKey: admin-password
                remoteRef: {key: grafana/admin, property: password}
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.secretStoreRef.name, value: production}
  - it: defaults the target Secret to the ExternalSecret name
    capabilities:
      apiVersions: [external-secrets.io/v1/ExternalSecret]
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: admin
          spec:
            secretStoreRef: {name: production, kind: SecretStore}
            dataFrom: [{extract: {key: grafana/admin}}]
    asserts:
      - equal: {path: spec.target.name, value: test-grafana-admin}
  - it: supports an exact target name
    capabilities:
      apiVersions: [external-secrets.io/v1/ExternalSecret]
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: admin
          fullnameOverride: grafana-admin
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            target: {name: grafana-admin}
            dataFrom: [{extract: {key: grafana/admin}}]
    asserts:
      - equal: {path: metadata.name, value: grafana-admin}
      - equal: {path: spec.target.name, value: grafana-admin}
  - it: injects the default refresh interval
    capabilities:
      apiVersions: [external-secrets.io/v1/ExternalSecret]
    set:
      externalSecrets.enabled: true
      externalSecrets.refreshInterval: 15m
      externalSecrets.items:
        - name: admin
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            dataFrom: [{extract: {key: grafana/admin}}]
    asserts:
      - equal: {path: spec.refreshInterval, value: 15m}
  - it: rejects an item without a store or generator
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: admin
          spec:
            dataFrom: [{extract: {key: grafana/admin}}]
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec requires secretStoreRef.name or an item sourceRef store/generator
  - it: renders multiple ExternalSecrets
    capabilities:
      apiVersions: [external-secrets.io/v1/ExternalSecret]
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: admin
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            dataFrom: [{extract: {key: grafana/admin}}]
        - name: database
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            dataFrom: [{extract: {key: grafana/database}}]
    asserts:
      - hasDocuments: {count: 2}
