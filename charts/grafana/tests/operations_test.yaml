suite: Grafana operational resources
release:
  name: test
  namespace: observability
tests:
  - it: creates the release ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: applies workload identity annotations
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/grafana"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/grafana"
  - it: creates an ingress-only NetworkPolicy by default
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.policyTypes[0]
          value: Ingress
      - notExists:
          path: spec.egress
  - it: enables DNS egress explicitly
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.egress.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
  - it: renders an empty egress list when no destinations are allowed
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.egress.enabled: true
      networkPolicy.egress.allowDNS: false
    asserts:
      - equal:
          path: spec.egress
          value: []
  - it: permits an external database peer
    template: templates/networkpolicy.yaml
    set:
      database.type: postgres
      database.host: postgres
      database.password: test-password
      database.networkPolicyPeers:
        - podSelector:
            matchLabels:
              app: postgres
      networkPolicy.egress.enabled: true
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432
  - it: creates a PDB for multiple replicas
    template: templates/pdb.yaml
    set:
      replicaCount: 2
      database.type: postgres
      database.host: postgres
      database.password: test-password
      persistence.enabled: false
      pdb.enabled: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
  - it: creates a ServiceMonitor for native metrics
    template: templates/servicemonitor.yaml
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/ServiceMonitor
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].port
          value: http
  - it: renders extra manifests with release templating
    template: templates/extra-manifests.yaml
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
    asserts:
      - equal:
          path: metadata.name
          value: test-extra
