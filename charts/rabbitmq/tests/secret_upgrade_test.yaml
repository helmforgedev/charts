# SPDX-License-Identifier: Apache-2.0
suite: Managed Secret upgrade retention
templates:
  - secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-rabbitmq-auth
        namespace: default
      data:
        rabbitmq-username: cmV0YWluZWQtdXNlcg==
        rabbitmq-password: cmV0YWluZWQtcGFzc3dvcmQ=
        rabbitmq-erlang-cookie: cmV0YWluZWQtZXJsYW5nLWNvb2tpZQ==
tests:
  - it: should retain all managed credentials from the existing Secret
    set:
      auth.username: replacement-user
      auth.password: replacement-password
      auth.erlangCookie: replacement-erlang-cookie
    asserts:
      - equal:
          path: stringData.rabbitmq-username
          value: retained-user
      - equal:
          path: stringData.rabbitmq-password
          value: retained-password
      - equal:
          path: stringData.rabbitmq-erlang-cookie
          value: retained-erlang-cookie
