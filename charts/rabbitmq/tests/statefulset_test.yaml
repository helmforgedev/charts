# SPDX-License-Identifier: Apache-2.0
suite: StatefulSet
templates:
  - statefulset.yaml
  - configmap.yaml
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: should be a StatefulSet
    template: statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet

  - it: should have correct name
    template: statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-rabbitmq

  - it: should use the correct image
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/library/rabbitmq:4.3.6-alpine"

  - it: should have 1 replica in single-node mode
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should apply the default pod hardening
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 100
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 101
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 101
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rabbitmq-runtime-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: rabbitmq-runtime-tmp
            emptyDir: {}
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: cookie-permissions
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'chmod 600 /var/lib/rabbitmq/.erlang.cookie'

  - it: should preserve explicit security overrides
    template: statefulset.yaml
    set:
      automountServiceAccountToken: true
      podSecurityContext:
        runAsUser: 200
        runAsGroup: 202
        fsGroup: 202
        seccompProfile:
          type: Unconfined
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - NET_RAW
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 200
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 202
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 202
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: Unconfined
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: NET_RAW

  - it: should have 3 replicas in cluster mode
    template: statefulset.yaml
    set:
      architecture: cluster
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should expose AMQP port
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: amqp
            containerPort: 5672

  - it: should have probes
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: amqp
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: amqp
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: amqp

  - it: should probe the TLS AMQP listener when non-TLS listeners are disabled
    template: statefulset.yaml
    set:
      tls.enabled: true
      tls.disableNonTLSListeners: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: amqps
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: amqps
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: amqps

  - it: should expose only TLS container ports when non-TLS listeners are disabled
    template: statefulset.yaml
    set:
      tls.enabled: true
      tls.disableNonTLSListeners: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: amqp
            containerPort: 5672
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: management
            containerPort: 15672
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: amqps
            containerPort: 5671
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: management-tls
            containerPort: 15671

  - it: should disable Erlang scheduler busy-wait by default
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
            value: "+sbwt none +sbwtdcpu none +sbwtdio none"

  - it: should allow extraEnv to override chart-managed Erlang arguments
    template: statefulset.yaml
    set:
      extraEnv:
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: "+S 2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
            value: "+S 2"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
            value: "+sbwt none +sbwtdcpu none +sbwtdio none"

  - it: should create VolumeClaimTemplate with default 8Gi
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 8Gi

  - it: should keep an unrelated user-supplied tmp volume separate
    template: statefulset.yaml
    set:
      extraVolumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 128Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rabbitmq-runtime-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: rabbitmq-runtime-tmp
            emptyDir: {}

  - it: should not add a managed tmp volume or mount when the user supplies the mount path
    template: statefulset.yaml
    set:
      extraVolumes:
        - name: custom-tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: custom-tmp
          mountPath: /tmp
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: rabbitmq-runtime-tmp
            emptyDir: {}
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rabbitmq-runtime-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-tmp
            mountPath: /tmp
