# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should render no documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an operator-provided resource
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: chiefonboarding-extra
          data:
            mode: production
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: chiefonboarding-extra
      - equal:
          path: data.mode
          value: production
