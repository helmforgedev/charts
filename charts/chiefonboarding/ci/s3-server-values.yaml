# SPDX-License-Identifier: Apache-2.0
chiefonboarding:
  extraEnv:
    - name: AWS_USE_PRESIGNED_UPLOADS
      value: "False"
    - name: AWS_S3_ENDPOINT_URL
      value: http://fixture-s3:8333
    - name: AWS_DEFAULT_REGION
      value: us-east-1
    - name: AWS_STORAGE_BUCKET_NAME
      value: chiefonboarding.fixtures
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: fixture-s3
          key: access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: fixture-s3
          key: secret-access-key
