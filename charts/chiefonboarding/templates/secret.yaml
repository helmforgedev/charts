{{- if not .Values.chiefonboarding.existingSecret }}
{{- $name := printf "%s-app" (include "chiefonboarding.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chiefonboarding.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ if .Values.chiefonboarding.secretKey }}{{ .Values.chiefonboarding.secretKey | b64enc }}{{ else if and $existing (hasKey $existing.data "secret-key") }}{{ index $existing.data "secret-key" }}{{ else }}{{ randAlphaNum 50 | b64enc }}{{ end }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "chiefonboarding.fullname" .) }}
  labels:
    {{- include "chiefonboarding.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
