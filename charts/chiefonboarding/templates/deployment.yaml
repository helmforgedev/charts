{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chiefonboarding.fullname" . }}
  labels:
    {{- include "chiefonboarding.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "chiefonboarding.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chiefonboarding.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        checksum/config: {{ printf "%s|%s" (toJson $.Values.chiefonboarding) (toJson $.Values.database.external) | sha256sum }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.podAnnotations }}
      annotations:
        checksum/config: {{ printf "%s|%s" (toJson .Values.chiefonboarding) (toJson .Values.database.external) | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chiefonboarding.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Waiting for database at {{ include "chiefonboarding.dbHost" . }}:{{ include "chiefonboarding.dbPort" . }}..."
              until nc -z -w2 {{ include "chiefonboarding.dbHost" . }} {{ include "chiefonboarding.dbPort" . }}; do
                echo "Database not ready, retrying in 2s..."
                sleep 2
              done
              echo "Database is ready."
      containers:
        - name: chiefonboarding
          image: {{ include "chiefonboarding.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/bash, -ec]
          args:
            - |
              cd /app
              uv run python manage.py migrate --noinput
              cp /etc/supervisor/conf.d/supervisord.conf /tmp/chiefonboarding-supervisord.conf
              sed -i "s/0\.0\.0\.0:8000/0.0.0:${CHIEFONBOARDING_PORT}/g" /tmp/chiefonboarding-supervisord.conf
              exec /usr/bin/supervisord -c /tmp/chiefonboarding-supervisord.conf
          ports:
            - name: http
              containerPort: {{ .Values.chiefonboarding.port }}
              protocol: TCP
          env:
            - name: CHIEFONBOARDING_PORT
              value: {{ .Values.chiefonboarding.port | quote }}
            - name: ALLOWED_HOSTS
              value: {{ join "," .Values.chiefonboarding.allowedHosts | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chiefonboarding.dbSecretName" . }}
                  key: {{ include "chiefonboarding.dbSecretPasswordKey" . }}
            - name: DATABASE_URL
              value: {{ include "chiefonboarding.databaseUrl" . | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "chiefonboarding.appSecretName" . }}
                  key: {{ include "chiefonboarding.appSecretKey" . }}
            {{- with .Values.chiefonboarding.baseUrl }}
            - name: BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.chiefonboarding.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "chiefonboarding.probeHost" . | quote }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "chiefonboarding.probeHost" . | quote }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "chiefonboarding.probeHost" . | quote }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
