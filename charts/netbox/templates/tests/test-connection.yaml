apiVersion: v1
kind: Pod
metadata:
  name: {{ include "netbox.suffixedName" (dict "base" (include "netbox.fullname" .) "suffix" "-test") }}
  namespace: {{ include "netbox.namespace" . | quote }}
  labels:
    {{- include "netbox.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: docker.io/curlimages/curl:8.17.0
      args:
        - --fail
        - --show-error
        - --silent
        - --header
        - "Host: localhost"
        - http://{{ include "netbox.fullname" . }}:{{ .Values.service.port }}/login/
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
