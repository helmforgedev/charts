{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbox.secretName" . }}
  namespace: {{ include "netbox.namespace" . | quote }}
  labels:
    {{- include "netbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeyKey }}: {{ include "netbox.stableSecretValue" (dict "root" . "name" (include "netbox.secretName" .) "key" .Values.auth.secretKeyKey "provided" .Values.auth.secretKey "length" 64) | quote }}
  {{ .Values.auth.apiTokenPepperKey }}: {{ include "netbox.stableSecretValue" (dict "root" . "name" (include "netbox.secretName" .) "key" .Values.auth.apiTokenPepperKey "provided" .Values.auth.apiTokenPepper "length" 64) | quote }}
{{- end }}
{{- if and (eq (include "netbox.databaseMode" .) "external") (not .Values.database.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbox.databaseSecretName" . }}
  namespace: {{ include "netbox.namespace" . | quote }}
  labels:
    {{- include "netbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
{{- if and (eq (include "netbox.cacheMode" .) "external") (not .Values.cache.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbox.cacheSecretName" . }}
  namespace: {{ include "netbox.namespace" . | quote }}
  labels:
    {{- include "netbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.cache.external.password | quote }}
{{- end }}
{{- if and .Values.auth.superuser.enabled (not .Values.auth.superuser.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbox.superuserSecretName" . }}
  namespace: {{ include "netbox.namespace" . | quote }}
  labels:
    {{- include "netbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.superuser.passwordKey }}: {{ include "netbox.stableSecretValue" (dict "root" . "name" (include "netbox.superuserSecretName" .) "key" .Values.auth.superuser.passwordKey "provided" .Values.auth.superuser.password "length" 24) | quote }}
  {{- with .Values.auth.superuser.apiToken }}
  {{ $.Values.auth.superuser.apiTokenKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
