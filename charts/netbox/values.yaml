# SPDX-License-Identifier: Apache-2.0

# -- Override the chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""
# -- Override the namespace for namespaced resources.
namespaceOverride: ""
# -- Kubernetes cluster DNS domain.
clusterDomain: cluster.local
# -- Labels added to every resource.
commonLabels: {}

image:
  # -- Official NetBox Docker image repository.
  repository: docker.io/netboxcommunity/netbox
  # -- Immutable NetBox and netbox-docker release combination.
  tag: "v4.6.9-5.0.2"
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Image pull secrets.
imagePullSecrets: []

web:
  # -- Number of NetBox web replicas.
  replicaCount: 1
  # -- Granian worker process count per web pod.
  workers: 3
  # -- Granian request timeout in seconds.
  requestTimeout: 120
  # -- Web pod resources.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

worker:
  # -- Enable NetBox RQ background workers.
  enabled: true
  # -- Number of RQ worker replicas.
  replicaCount: 1
  # -- Worker rollout strategy. Recreate avoids concurrent mounts on ReadWriteOnce media.
  strategy:
    type: Recreate
  # -- Queue names consumed by each worker. Empty consumes all configured queues.
  queues: []
  # -- Worker pod resources.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

housekeeping:
  # -- Run NetBox housekeeping as a nightly CronJob.
  enabled: true
  # -- Cron schedule for expired sessions, changelog retention, and release checks.
  schedule: "0 0 * * *"
  # -- CronJob concurrency policy.
  concurrencyPolicy: Forbid
  # -- Successful job history limit.
  successfulJobsHistoryLimit: 3
  # -- Failed job history limit.
  failedJobsHistoryLimit: 3
  # -- Housekeeping job resources.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

netbox:
  # -- Hostnames accepted by Django.
  allowedHosts:
    - localhost
    - 127.0.0.1
  # -- NetBox time zone.
  timeZone: UTC
  # -- Disable outbound version and remote-data checks.
  isolatedDeployment: false
  # -- Enable native Prometheus metrics at /metrics.
  metricsEnabled: false
  # -- Enable NetBox Copilot. Disabled by default to avoid implicit external AI calls.
  copilotEnabled: false
  # -- Additional environment variables for all NetBox workloads.
  extraEnv: []
  # -- Additional envFrom sources for all NetBox workloads.
  extraEnvFrom: []
  # -- Python configuration snippets mounted under /etc/netbox/config/.
  extraConfiguration: {}

auth:
  # -- Existing Secret holding NetBox application secrets.
  existingSecret: ""
  # -- Secret key for Django SECRET_KEY.
  secretKeyKey: secret-key
  # -- Secret key for API token pepper.
  apiTokenPepperKey: api-token-pepper
  # -- Django SECRET_KEY. Generated and retained when empty.
  secretKey: ""
  # -- API token pepper. Generated and retained when empty.
  apiTokenPepper: ""
  superuser:
    # -- Create an initial superuser through the official image bootstrap.
    enabled: true
    # -- Initial superuser name.
    name: admin
    # -- Initial superuser email.
    email: admin@example.com
    # -- Existing Secret holding the initial superuser password and API token.
    existingSecret: ""
    # -- Secret key for the superuser password.
    passwordKey: password
    # -- Secret key for the optional superuser API token.
    apiTokenKey: api-token
    # -- Initial password. Generated and retained when empty.
    password: ""
    # -- Optional fixed API token. Generated by NetBox when empty.
    apiToken: ""

database:
  # -- Database mode: auto, postgresql, or external.
  mode: auto
  external:
    # -- External PostgreSQL hostname.
    host: ""
    # -- External PostgreSQL port.
    port: 5432
    # -- External database name.
    name: netbox
    # -- External database username.
    username: netbox
    # -- External database password.
    password: ""
    # -- Existing Secret holding the external database password.
    existingSecret: ""
    # -- Password key in the existing Secret.
    existingSecretPasswordKey: password
    # -- PostgreSQL SSL mode.
    sslMode: prefer

postgresql:
  # -- Deploy the HelmForge PostgreSQL subchart.
  enabled: true
  architecture: standalone
  auth:
    database: netbox
    username: netbox
    password: ""
    postgresPassword: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi

cache:
  # -- Cache mode: auto, redis, or external.
  mode: auto
  # -- Redis database used for background tasks.
  tasksDatabase: 0
  # -- Redis database used for cache.
  cacheDatabase: 1
  external:
    # -- External Redis hostname.
    host: ""
    # -- External Redis port.
    port: 6379
    # -- External Redis password.
    password: ""
    # -- Existing Secret holding the external Redis password.
    existingSecret: ""
    # -- Password key in the existing Secret.
    existingSecretPasswordKey: password
    # -- Use TLS for Redis connections.
    ssl: false

redis:
  # -- Deploy the HelmForge Redis subchart.
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 2Gi

persistence:
  # -- Persist user-uploaded NetBox media.
  enabled: true
  # -- Storage class. Empty uses the cluster default.
  storageClass: ""
  # -- Access modes. Use ReadWriteMany before scaling web replicas above one.
  accessModes:
    - ReadWriteOnce
  # -- Media PVC size.
  size: 10Gi
  # -- Existing media PVC.
  existingClaim: ""
  # -- PVC annotations.
  annotations: {}

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Service annotations.
  annotations: {}
  # -- IP family policy. Empty uses the cluster default.
  ipFamilyPolicy: ""
  # -- IP families. Empty uses the cluster default.
  ipFamilies: []

ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class name.
  ingressClassName: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts.
  hosts: []
  # -- Ingress TLS entries.
  tls: []

gatewayAPI:
  # -- Create Gateway API HTTPRoutes.
  enabled: false
  # -- HTTPRoute definitions.
  httpRoutes: []

externalSecrets:
  # -- Render ExternalSecret resources.
  enabled: false
  # -- Default refresh interval.
  refreshInterval: 1h
  # -- Canonical HelmForge ExternalSecret items.
  items: []

metrics:
  serviceMonitor:
    # -- Create a ServiceMonitor for /metrics.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Additional ServiceMonitor labels.
    labels: {}
    # -- Namespace selector.
    namespaceSelector: {}

networkPolicy:
  # -- Create NetworkPolicies for web and worker pods.
  enabled: false
  # -- Allowed ingress peers for the web service.
  ingressFrom: []
  egress:
    # -- Enforce explicit egress.
    enabled: false
    # -- Permit cluster DNS.
    allowDNS: true
    # -- Additional complete egress rules.
    extraEgress: []

podDisruptionBudget:
  # -- Create PodDisruptionBudgets for multi-replica workloads.
  enabled: true
  # -- Maximum unavailable pods.
  maxUnavailable: 1

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- ServiceAccount name.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}
  # -- Automount the Kubernetes API token.
  automountServiceAccountToken: false

# -- Pod security context.
podSecurityContext:
  fsGroup: 0
  fsGroupChangePolicy: OnRootMismatch
# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 999
  seccompProfile:
    type: RuntimeDefault

# -- Startup probe settings.
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
# -- Liveness probe settings.
livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
# -- Readiness probe settings.
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# -- Pod termination grace period.
terminationGracePeriodSeconds: 60
# -- Labels added to pods.
podLabels: {}
# -- Annotations added to pods.
podAnnotations: {}
# -- Pod priority class.
priorityClassName: ""
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Extra init containers.
extraInitContainers: []
# -- Extra sidecar containers.
extraContainers: []
# -- Extra volumes.
extraVolumes: []
# -- Extra volume mounts.
extraVolumeMounts: []
# -- Extra Kubernetes manifests.
extraManifests: []
