# SPDX-License-Identifier: Apache-2.0
suite: netbox observability
templates:
  - servicemonitor.yaml
  - networkpolicy.yaml
tests:
  - it: scrapes native metrics
    template: servicemonitor.yaml
    set:
      netbox:
        metricsEnabled: true
      metrics:
        serviceMonitor:
          enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
  - it: renders database and cache egress
    template: networkpolicy.yaml
    set:
      networkPolicy:
        enabled: true
        egress:
          enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 0.0.0.0/0
      - equal:
          path: spec.ingress[0].from[1].ipBlock.cidr
          value: ::/0
      - equal:
          path: spec.podSelector.matchExpressions[0]
          value:
            key: app.kubernetes.io/component
            operator: In
            values:
              - web
              - worker
              - housekeeping
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080

  - it: keeps NetworkPolicy ingress aligned with a custom listener
    template: networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      containerPorts.http: 8181
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8181
  - it: requires explicit peers for external data services
    template: networkpolicy.yaml
    set:
      postgresql:
        enabled: false
      redis:
        enabled: false
      database:
        mode: external
        external:
          host: postgresql.example.com
          existingSecret: netbox-postgresql
      cache:
        mode: external
        external:
          host: redis.example.com
          existingSecret: netbox-redis
      networkPolicy:
        enabled: true
        egress:
          enabled: true
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
