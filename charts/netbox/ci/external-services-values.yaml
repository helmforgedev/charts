# SPDX-License-Identifier: Apache-2.0
---
postgresql:
  enabled: true
redis:
  enabled: true
netbox:
  extraEnv:
    - name: REDIS_CACHE_USERNAME
      value: default
database:
  mode: external
  external:
    host: netbox-ci-external-services-values-postgresql
    existingSecret: netbox-ci-external-services-values-postgresql-auth
    existingSecretPasswordKey: user-password
cache:
  mode: external
  external:
    host: netbox-ci-external-services-values-redis-client
    existingSecret: netbox-ci-external-services-values-redis-auth
    existingSecretPasswordKey: redis-password
