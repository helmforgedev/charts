---
auth:
  existingSecret: netbox-app-auth
  superuser:
    existingSecret: netbox-superuser
externalSecrets:
  enabled: true
  items:
    - name: app-auth
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: netbox-app-auth
          creationPolicy: Owner
          template:
            data:
              secret-key: "{{ .token }}-{{ .token }}-{{ .token }}"
              api-token-pepper: "{{ .token }}-{{ .token }}-{{ .token }}"
        data:
          - secretKey: token
            remoteRef:
              key: test/token
    - name: superuser
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: netbox-superuser
          creationPolicy: Owner
        data:
          - secretKey: password
            remoteRef:
              key: test/password
