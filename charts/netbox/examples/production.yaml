# SPDX-License-Identifier: Apache-2.0
---
auth:
  existingSecret: netbox-application
  superuser:
    enabled: false
web:
  replicaCount: 2
worker:
  replicaCount: 2
persistence:
  existingClaim: netbox-media-rwx
  accessModes:
    - ReadWriteMany
netbox:
  allowedHosts:
    - netbox.example.com
  metricsEnabled: true
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: netbox.example.com
metrics:
  serviceMonitor:
    enabled: true
networkPolicy:
  enabled: true
