---
postgresql:
  enabled: false
redis:
  enabled: false
database:
  mode: external
  external:
    host: postgresql.database.svc
    existingSecret: netbox-postgresql
    existingSecretPasswordKey: password
cache:
  mode: external
  external:
    host: redis.cache.svc
    existingSecret: netbox-redis
    existingSecretPasswordKey: redis-password
