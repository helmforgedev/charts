# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - configmap.yaml
  - deployment-controller.yaml
  - serviceaccount.yaml
  - certgen-job.yaml
tests:
  - it: should add common annotations to chart-owned resources
    set:
      commonAnnotations:
        example.com/owner: platform
    template: deployment-controller.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: should let service account annotations override common annotations
    set:
      commonAnnotations:
        example.com/owner: platform
      serviceAccount.annotations:
        example.com/owner: identity
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: identity

  - it: should preserve hook annotations while adding common annotations
    set:
      commonAnnotations:
        example.com/owner: platform
    template: certgen-job.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
