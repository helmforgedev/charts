# SPDX-License-Identifier: Apache-2.0
suite: Rate Limiting
templates:
  - ratelimit-policies.yaml
  - configmap.yaml
  - deployment-controller.yaml
  - serviceaccount.yaml
  - service-controller.yaml
tests:
  # Redis subchart is rendered by Helm, not by helm-unittest.
  # Tests here cover configmap URL generation and rate limit policies.

  - it: should include rateLimit redis url in configmap when subchart redis enabled
    set:
      rateLimiting:
        enabled: true
      redis:
        enabled: true
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "rateLimit"
        template: configmap.yaml
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'url: RELEASE-NAME-redis-client\.'
        template: configmap.yaml
      - equal:
          path: metadata.name
          value: envoy-gateway
        template: deployment-controller.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: envoy-gateway
        template: deployment-controller.yaml
      - equal:
          path: metadata.name
          value: envoy-gateway
        template: serviceaccount.yaml
      - contains:
          path: spec.ports
          content:
            name: ratelimit
            port: 18001
            targetPort: 18001
            protocol: TCP
        template: service-controller.yaml
        documentIndex: 1

  - it: should use external redis url when externalRedis host set
    set:
      rateLimiting:
        enabled: true
        externalRedis:
          host: my-redis.infra.svc.cluster.local
          port: 6379
      redis:
        enabled: false
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'url: my-redis\.infra\.svc\.cluster\.local:6379'
        template: configmap.yaml

  - it: should not inject bundled Redis auth for an external Redis host
    set:
      rateLimiting:
        enabled: true
        externalRedis:
          host: my-redis.infra.svc.cluster.local
      redis:
        enabled: true
        auth:
          enabled: true
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'url: my-redis\.infra\.svc\.cluster\.local:6379'
        template: configmap.yaml
      - notMatchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "name: REDIS_AUTH"
        template: configmap.yaml
      - notMatchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "RELEASE-NAME-redis-auth"
        template: configmap.yaml

  - it: should inject external Redis auth from the configured Secret
    set:
      rateLimiting:
        enabled: true
        externalRedis:
          host: my-redis.infra.svc.cluster.local
          auth:
            enabled: true
            secretName: redis-credentials
            secretKey: redis-password
      redis:
        enabled: false
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "name: REDIS_AUTH"
        template: configmap.yaml
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "name: redis-credentials"
        template: configmap.yaml
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "key: redis-password"
        template: configmap.yaml

  - it: should not have rateLimit section in configmap when rate limiting disabled
    set:
      rateLimiting:
        enabled: false
    asserts:
      - notMatchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: "(?m)^rateLimit:$"
        template: configmap.yaml

  - it: should create rate limit policies with api preset
    set:
      rateLimiting:
        enabled: true
        presets:
          api: true
      redis:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: ratelimit-policies.yaml
      - equal:
          path: kind
          value: ConfigMap
        template: ratelimit-policies.yaml
        documentIndex: 0
      - equal:
          path: kind
          value: BackendTrafficPolicy
        template: ratelimit-policies.yaml
        documentIndex: 1
      - equal:
          path: spec.rateLimit.global.rules[0].limit.requests
          value: 100
        template: ratelimit-policies.yaml
        documentIndex: 1
      - equal:
          path: spec.targetRef.kind
          value: Gateway
        template: ratelimit-policies.yaml
        documentIndex: 1

  - it: should create strict rate limit policy
    set:
      rateLimiting:
        enabled: true
        presets:
          strict: true
      redis:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: ratelimit-policies.yaml
      - equal:
          path: spec.rateLimit.global.rules[0].limit.requests
          value: 10
        template: ratelimit-policies.yaml
        documentIndex: 1

  - it: should create both presets
    set:
      rateLimiting:
        enabled: true
        presets:
          api: true
          strict: true
      redis:
        enabled: true
    asserts:
      - hasDocuments:
          count: 3
        template: ratelimit-policies.yaml

  - it: should render all rate limit resources in namespaceOverride
    set:
      namespaceOverride: envoy-system
      rateLimiting:
        enabled: true
        presets:
          api: true
          strict: true
      redis:
        enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: envoy-system
        template: ratelimit-policies.yaml
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: envoy-system
        template: ratelimit-policies.yaml
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: envoy-system
        template: ratelimit-policies.yaml
        documentIndex: 2
