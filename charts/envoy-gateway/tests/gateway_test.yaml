# SPDX-License-Identifier: Apache-2.0
suite: Gateway Resource
templates:
  - gateway.yaml
tests:
  - it: should create Gateway by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Gateway
      - equal:
          path: spec.gatewayClassName
          value: envoy-gateway
      - equal:
          path: spec.listeners[0].name
          value: http
      - equal:
          path: spec.listeners[0].port
          value: 80
      - equal:
          path: spec.listeners[0].protocol
          value: HTTP

  - it: should not create Gateway when disabled
    set:
      gateway:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use custom gateway name
    set:
      gateway:
        name: my-gateway
    asserts:
      - equal:
          path: metadata.name
          value: my-gateway

  - it: should render Gateway in namespaceOverride
    set:
      namespaceOverride: envoy-system
    asserts:
      - equal:
          path: metadata.namespace
          value: envoy-system

  - it: should default to release name when name not set
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: should add HTTPS listener when enabled
    set:
      gateway:
        listeners:
          https:
            enabled: true
            port: 443
            tls:
              mode: Terminate
              certificateRef:
                name: my-tls-secret
    asserts:
      - equal:
          path: spec.listeners[1].name
          value: https
      - equal:
          path: spec.listeners[1].protocol
          value: HTTPS
      - equal:
          path: spec.listeners[1].tls.mode
          value: Terminate

  - it: should use custom GatewayClass name
    set:
      gatewayClass:
        name: my-class
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: my-class

  - it: should allow HTTP routes from all namespaces
    set:
      gateway:
        listeners:
          http:
            allowedRoutes:
              namespaces:
                from: All
    asserts:
      - equal:
          path: spec.listeners[0].allowedRoutes.namespaces.from
          value: All

  - it: should restrict HTTP routes with a namespace selector
    set:
      gateway:
        listeners:
          http:
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    shared-gateway-access: "true"
    asserts:
      - equal:
          path: spec.listeners[0].allowedRoutes.namespaces.selector.matchLabels.shared-gateway-access
          value: "true"

  - it: should configure allowed route kinds on the HTTPS listener
    set:
      gateway:
        listeners:
          https:
            enabled: true
            tls:
              certificateRef:
                name: my-tls-secret
            allowedRoutes:
              kinds:
                - kind: HTTPRoute
                  group: gateway.networking.k8s.io
              namespaces:
                from: Same
    asserts:
      - equal:
          path: spec.listeners[1].allowedRoutes.kinds[0].kind
          value: HTTPRoute
      - equal:
          path: spec.listeners[1].allowedRoutes.namespaces.from
          value: Same

  - it: should omit allowedRoutes when no policy is configured
    asserts:
      - notExists:
          path: spec.listeners[0].allowedRoutes
