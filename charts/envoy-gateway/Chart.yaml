apiVersion: v2
name: envoy-gateway
description: Production-ready Envoy Gateway operator with Gateway API support, cert generation, and advanced traffic policies
type: application
version: 2.0.0
appVersion: "v1.9.0"
kubeVersion: ">=1.33.0-0 <1.37.0-0"
home: https://helmforge.dev/docs/charts/envoy-gateway
sources:
  - https://github.com/helmforgedev/charts
  - https://github.com/envoyproxy/gateway
dependencies:
  - name: crds
    version: 0.0.0
    repository: ""
    condition: crds.enabled
  - name: redis
    version: 2.0.0
    repository: oci://ghcr.io/helmforgedev/helm
    alias: redis
    condition: redis.enabled
keywords:
  - envoy
  - gateway
  - gateway-api
  - ingress
  - api-gateway
  - kubernetes
maintainers:
  - name: helmforgedev
  - name: mberlofa
icon: https://helmforge.dev/icons/charts/envoy-gateway.png
