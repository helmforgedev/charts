{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "envoy-gateway.serviceAccountName" . }}
  namespace: {{ include "envoy-gateway.namespace" . }}
  {{- include "envoy-gateway.renderAnnotations" (dict "root" . "specific" .Values.serviceAccount.annotations) | nindent 2 }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
{{- end }}
