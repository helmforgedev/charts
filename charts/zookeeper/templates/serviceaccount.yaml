{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zookeeper.serviceAccountName" . }}
  namespace: {{ include "zookeeper.namespace" . }}
  labels:
    {{- include "zookeeper.labels" . | nindent 4 }}
  {{- include "zookeeper.renderAnnotations" (dict "root" . "annotations" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
