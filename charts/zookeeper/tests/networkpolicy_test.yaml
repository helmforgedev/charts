# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders quorum, client, metrics, and DNS policy
    set:
      networkPolicy.enabled: true
      metrics.enabled: true
      zookeeper.followerPort: 2889
      networkPolicy.egress.allowSameNamespace: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 2889
      - contains:
          path: spec.egress[2].ports
          content:
            protocol: UDP
            port: 53

  - it: renders extraEgress rules when specified
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.extraEgress:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - protocol: TCP
              port: 9092
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - protocol: TCP
                port: 9092

  - it: renders deprecated extra egress rules when specified
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.extra:
        - to:
            - ipBlock:
                cidr: 192.168.0.0/16
          ports:
            - protocol: TCP
              port: 8080
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.0.0/16
            ports:
              - protocol: TCP
                port: 8080
