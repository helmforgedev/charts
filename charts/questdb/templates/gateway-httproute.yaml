{{- if .Values.gatewayAPI.enabled }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes }}
{{- if $index }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ default (printf "%s-%d" (include "questdb.fullname" $) $index) $route.name }}
  labels:
    {{- include "questdb.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $rule := default (list (dict)) $route.rules }}
    - {{- with $rule.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "questdb.fullname" $ }}
          port: 9000
          weight: 1
    {{- end }}
{{- end }}
{{- end }}
