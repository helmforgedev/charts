{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "questdb.fullname" . }}
  labels:
    {{- include "questdb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "questdb.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: 9000, targetPort: http, protocol: TCP}
    {{- if .Values.service.pgWireEnabled }}
    - {name: pgwire, port: 8812, targetPort: pgwire, protocol: TCP}
    {{- end }}
    {{- if .Values.service.ilpTcpEnabled }}
    - {name: ilp-tcp, port: 9009, targetPort: ilp-tcp, protocol: TCP}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "questdb.fullname" . }}-headless
  labels:
    {{- include "questdb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "questdb.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: 9000, targetPort: http, protocol: TCP}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "questdb.fullname" . }}-metrics
  labels:
    {{- include "questdb.labels" . | nindent 4 }}
  {{- with .Values.metrics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "questdb.selectorLabels" . | nindent 4 }}
  ports:
    - {name: metrics, port: 9003, targetPort: health, protocol: TCP}
{{- end }}
