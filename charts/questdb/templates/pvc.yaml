{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "questdb.fullname" . }}
  labels:
    {{- include "questdb.labels" . | nindent 4 }}
  {{- $pvcAnnotations := deepCopy (.Values.persistence.annotations | default dict) -}}
  {{- if .Values.persistence.retain -}}
  {{- $_ := set $pvcAnnotations "helm.sh/resource-policy" "keep" -}}
  {{- end -}}
  {{- include "questdb.renderAnnotations" (dict "root" . "specific" $pvcAnnotations) | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
