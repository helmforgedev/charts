{{- if not .Values.questdb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "questdb.fullname" . }}
  labels:
    {{- include "questdb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "questdb.fullname" .) }}
  {{- $pgPassword := randAlphaNum 32 }}
  {{- $httpPassword := randAlphaNum 32 }}
  {{- if and $existing (hasKey ($existing.data | default dict) .Values.questdb.pgPasswordKey) }}
  {{- $pgPassword = index $existing.data .Values.questdb.pgPasswordKey | b64dec }}
  {{- end }}
  {{- if and $existing (hasKey ($existing.data | default dict) .Values.questdb.httpPasswordKey) }}
  {{- $httpPassword = index $existing.data .Values.questdb.httpPasswordKey | b64dec }}
  {{- end }}
  {{ .Values.questdb.pgPasswordKey }}: {{ $pgPassword | quote }}
  {{ .Values.questdb.httpPasswordKey }}: {{ $httpPassword | quote }}
{{- end }}
