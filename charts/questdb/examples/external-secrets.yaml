# SPDX-License-Identifier: Apache-2.0
questdb:
  existingSecret: questdb-auth
externalSecrets:
  enabled: true
  items:
    - name: questdb-auth
      spec:
        secretStoreRef: {name: production, kind: ClusterSecretStore}
        target: {name: questdb-auth}
        data:
          - secretKey: pg-password
            remoteRef: {key: questdb/pg-password}
          - secretKey: http-password
            remoteRef: {key: questdb/http-password}
