# SPDX-License-Identifier: Apache-2.0
resources:
  requests: {cpu: "4", memory: 8Gi}
  limits: {cpu: "8", memory: 16Gi}
service:
  ilpTcpEnabled: true
metrics:
  enabled: true
persistence:
  size: 100Gi
networkPolicy:
  metricsFrom:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: monitoring}
