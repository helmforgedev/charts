# SPDX-License-Identifier: Apache-2.0
suite: QuestDB service
templates: [templates/service.yaml]
tests:
  - it: keeps the default service private
    documentIndex: 0
    asserts:
      - equal: {path: spec.type, value: ClusterIP}
      - equal: {path: "spec.ports[0].port", value: 9000}
      - equal: {path: "spec.ports[1].port", value: 8812}
  - it: exposes legacy ILP TCP only when selected
    documentIndex: 0
    set: {service.ilpTcpEnabled: true}
    asserts:
      - equal: {path: "spec.ports[2].port", value: 9009}
