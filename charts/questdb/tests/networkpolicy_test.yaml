# SPDX-License-Identifier: Apache-2.0
suite: QuestDB network policy
templates: [templates/networkpolicy.yaml]
tests:
  - it: restricts protocol ingress and DNS egress
    asserts:
      - isKind: {of: NetworkPolicy}
      - contains: {path: spec.policyTypes, content: Ingress}
      - contains: {path: spec.policyTypes, content: Egress}
      - equal: {path: "spec.ingress[0].ports[0].port", value: 9000}
      - equal: {path: "spec.ingress[1].ports[0].port", value: 8812}
