# SPDX-License-Identifier: Apache-2.0
suite: QuestDB External Secrets
templates: [templates/externalsecret.yaml]
tests:
  - it: renders nothing while disabled
    asserts:
      - hasDocuments: {count: 0}
  - it: renders the canonical item contract
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: questdb-auth
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            data: [{secretKey: pg-password, remoteRef: {key: questdb/password}}]
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.target.name, value: questdb-auth}
      - equal: {path: spec.refreshInterval, value: 1h}
  - it: honors a literal item fullname override
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: operator-owned
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
            data: [{secretKey: pg-password, remoteRef: {key: questdb/password}}]
    asserts:
      - equal: {path: metadata.name, value: operator-owned}
      - equal: {path: spec.target.name, value: operator-owned}
  - it: requires a store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: invalid
          spec:
            data: [{secretKey: pg-password, remoteRef: {key: questdb/password}}]
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true
  - it: renders multiple items
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - name: primary
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
        - name: secondary
          spec:
            secretStoreRef: {name: production, kind: ClusterSecretStore}
    asserts:
      - hasDocuments: {count: 2}
