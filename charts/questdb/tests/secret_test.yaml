# SPDX-License-Identifier: Apache-2.0
suite: QuestDB authentication
templates: [templates/secret.yaml]
tests:
  - it: creates and retains generated protocol passwords
    asserts:
      - isKind: {of: Secret}
      - exists: {path: stringData.pg-password}
      - exists: {path: stringData.http-password}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: omits the generated Secret when an existing Secret is selected
    set: {questdb.existingSecret: operator-secret}
    asserts:
      - hasDocuments: {count: 0}
