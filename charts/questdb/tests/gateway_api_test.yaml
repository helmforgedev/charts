# SPDX-License-Identifier: Apache-2.0
suite: QuestDB Gateway API
templates: [templates/gateway-httproute.yaml]
tests:
  - it: renders a route to the authenticated service
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoutes: [{name: core, parentRefs: [{name: public}], hostnames: [core.example.com]}]
    asserts:
      - isKind: {of: HTTPRoute}
      - equal: {path: "spec.rules[0].backendRefs[0].port", value: 9000}
