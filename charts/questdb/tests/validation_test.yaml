# SPDX-License-Identifier: Apache-2.0
suite: QuestDB validation
templates: [templates/validate.yaml]
tests:
  - it: rejects a ServiceMonitor blocked by the default NetworkPolicy
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: metrics.serviceMonitor.enabled with networkPolicy.enabled requires networkPolicy.metricsFrom for the Prometheus namespace
