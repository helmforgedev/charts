# SPDX-License-Identifier: Apache-2.0
suite: Tomcat port configuration
templates:
  - templates/tomcat-port-configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should configure the generated Tomcat listener from the port environment variable
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-guacamole-tomcat-port
      - matchRegex:
          path: data["800-configure-http-port.sh"]
          pattern: 'GUACAMOLE_HTTP_PORT'
      - matchRegex:
          path: data["800-configure-http-port.sh"]
          pattern: 'server\.xml'
