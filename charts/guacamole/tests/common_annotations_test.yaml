# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/tomcat-port-configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should add common annotations to chart-owned resources
    set:
      postgresql.auth.password: test
      commonAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/deployment.yaml
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/service.yaml
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/tomcat-port-configmap.yaml

  - it: should let resource annotations override common annotations
    template: templates/service.yaml
    set:
      commonAnnotations:
        example.com/owner: platform
      service:
        annotations:
          example.com/owner: networking
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: networking
