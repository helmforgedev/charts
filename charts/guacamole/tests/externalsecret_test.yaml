# SPDX-License-Identifier: Apache-2.0
suite: ExternalSecret Tests
templates:
  - externalsecret.yaml

tests:
  - it: should not render ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ExternalSecret when configured
    set:
      externalSecrets:
        enabled: true
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        items:
          - name: guacamole-db-secret
            refreshInterval: 30m
            data:
              - secretKey: password
                remoteRef:
                  key: secret/guacamole/db
                  property: password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: guacamole-db-secret
      - equal:
          path: spec.refreshInterval
          value: 30m
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
