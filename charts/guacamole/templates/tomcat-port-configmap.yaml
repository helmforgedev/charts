apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guacamole.fullname" . }}-tomcat-port
  labels:
    {{- include "guacamole.labels" . | nindent 4 }}
  {{- include "guacamole.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  800-configure-http-port.sh: |
    {{- include "guacamole.tomcatPortPayload" . | nindent 4 }}
