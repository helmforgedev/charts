apiVersion: v1
kind: Service
metadata:
  name: {{ include "guacamole.fullname" . }}
  labels:
    {{- include "guacamole.labels" . | nindent 4 }}
  {{- include "guacamole.renderAnnotations" (dict "root" . "specific" .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "guacamole.selectorLabels" . | nindent 4 }}
