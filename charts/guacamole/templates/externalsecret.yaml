{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- $seenNames := dict }}
{{- range $index, $item := .Values.externalSecrets.items | default list }}
{{- $targetName := $item.name | default (printf "%s-%d" (include "guacamole.fullname" $) $index) }}
{{- if hasKey $seenNames $targetName }}
  {{- fail (printf "Duplicate ExternalSecret target name '%s' in externalSecrets.items" $targetName) }}
{{- end }}
{{- $_ := set $seenNames $targetName true }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  labels:
    {{- include "guacamole.labels" $ | nindent 4 }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $item.refreshInterval | default $.Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ dig "secretStoreRef" "name" ($.Values.externalSecrets.secretStoreRef.name | default "") $item }}
    kind: {{ dig "secretStoreRef" "kind" ($.Values.externalSecrets.secretStoreRef.kind | default "SecretStore") $item }}
  target:
    name: {{ dig "target" "name" $targetName $item }}
    creationPolicy: {{ $item.creationPolicy | default $.Values.externalSecrets.creationPolicy | default "Owner" }}
    deletionPolicy: {{ $item.deletionPolicy | default $.Values.externalSecrets.deletionPolicy | default "Retain" }}
    {{- with $item.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $item.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
