# SPDX-License-Identifier: Apache-2.0
nextcloud:
  existingSecret: nextcloud-admin
  trustedDomains: [cloud.example.com]
  overwriteCliUrl: https://cloud.example.com
  overwriteProtocol: https

postgresql:
  enabled: false
externalDatabase:
  host: postgres.database.svc.cluster.local
  database: nextcloud
  username: nextcloud
  existingSecret: nextcloud-database

redis:
  enabled: false
externalRedis:
  host: redis.cache.svc.cluster.local
  existingSecret: nextcloud-redis

persistence:
  enabled: true
  size: 10Gi

primaryObjectStore:
  enabled: true
  provider: s3
  endpoint: https://s3.wasabisys.com
  port: 443
  useSsl: true
  region: us-east-1
  bucket: nextcloud-data
  usePathStyle: false
  objectPrefix: "urn:oid:"
  storageClass: STANDARD
  legacyAuth: false
  autocreate: false
  existingSecret: nextcloud-primary-object-store
  existingSecretAccessKeyKey: access-key
  existingSecretSecretKeyKey: secret-key
