# SPDX-License-Identifier: Apache-2.0
# Create these Secrets in your namespace before installation.
nextcloud:
  existingSecret: nextcloud-admin
  trustedDomains: [cloud.example.com]
  trustedProxies: [10.42.0.0/24]
  overwriteCliUrl: https://cloud.example.com
  overwriteProtocol: https
# Use an existing HTTPS Gateway; configure upload limits on its controller.
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: nextcloud-public
      parentRefs:
        - name: public-gateway
          namespace: gateway-system
          sectionName: https
      hostnames: [cloud.example.com]
persistence:
  size: 100Gi
postgresql:
  auth:
    existingSecret: nextcloud-database
redis:
  auth:
    existingSecret: nextcloud-redis
backup:
  enabled: true
  workspaceSize: 120Gi
  s3:
    bucket: company-nextcloud-backups
    prefix: production
    existingSecret: nextcloud-backup-storage
