nextcloud:
  trustedDomains: [cloud.example.com]
  overwriteCliUrl: https://cloud.example.com
  overwriteProtocol: https
  trustedProxies: [10.42.0.0/24]
gatewayAPI:
  enabled: true
  httpRoutes:
    - name: nextcloud-public
      parentRefs:
        - name: public-gateway
          namespace: gateway-system
          sectionName: https
      hostnames: [cloud.example.com]
