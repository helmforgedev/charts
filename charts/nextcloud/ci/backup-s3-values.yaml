# SPDX-License-Identifier: Apache-2.0
imaginary:
  enabled: true
notifyPush:
  enabled: true
backup:
  enabled: true
  suspend: true
  s3:
    allowInsecureHTTP: true
    endpoint: http://nextcloud-s3:8333
    bucket: nextcloud-backups
    existingSecret: nextcloud-s3-credentials
    existingSecretAccessKeyKey: AWS_ACCESS_KEY_ID
    existingSecretSecretKeyKey: AWS_SECRET_ACCESS_KEY
