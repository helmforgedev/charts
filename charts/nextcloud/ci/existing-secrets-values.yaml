nextcloud:
  existingSecret: nextcloud-ci-admin
postgresql:
  # Keep probes out of the official image's temporary initdb server restart.
  startupProbe:
    initialDelaySeconds: 30
  auth:
    existingSecret: nextcloud-ci-database
redis:
  auth:
    existingSecret: nextcloud-ci-redis
