imaginary:
  enabled: true
notifyPush:
  enabled: true
postgresql:
  auth:
    existingSecret: nextcloud-integrations-database
redis:
  auth:
    existingSecret: nextcloud-integrations-redis
networkPolicy:
  enabled: true
  # App Store downloads for the operator-managed Client Push installation test.
  extraEgress:
    - ports: [{port: 443, protocol: TCP}]
