# SPDX-License-Identifier: Apache-2.0
# Public disposable CI credentials; never use in production.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-external-db
spec:
  selector:
    app: nextcloud-external-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-external-db
  labels:
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-external-db
  template:
    metadata:
      labels:
        app: nextcloud-external-db
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-external-db
                  key: password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - '-h'
                - 127.0.0.1
                - '-U'
                - nextcloud
                - '-d'
                - nextcloud
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-external-db
type: Opaque
stringData:
  password: Nextcloud-External-CI-2026!
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-external-redis
stringData:
  password: Nextcloud-Redis-CI-2026!
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-external-redis
spec:
  selector:
    app: nextcloud-external-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-external-redis
  labels:
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-external-redis
  template:
    metadata:
      labels:
        app: nextcloud-external-redis
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.1
          command:
            - sh
            - '-ec'
            - exec redis-server --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-external-redis
                  key: password
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
