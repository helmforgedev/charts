# SPDX-License-Identifier: Apache-2.0
suite: External Secret ownership
templates:
  - templates/externalsecret.yaml
tests:
  - template: templates/externalsecret.yaml
    it: does not render provider resources by default
    asserts:
      - hasDocuments:
          count: 0
  - template: templates/externalsecret.yaml
    it: renders the stable ESO API with an explicit provider
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: admin-eso
          spec:
            secretStoreRef:
              name: store
              kind: ClusterSecretStore
            data:
              - secretKey: admin-password
                remoteRef:
                  key: admin
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: spec.target.name
          value: admin-eso
      - equal:
          path: spec.refreshInterval
          value: 1h
  - template: templates/externalsecret.yaml
    it: rejects an item without a provider
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            data: []
    asserts:
      - failedTemplate:
          errorMessage: >-
            externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is
            required when externalSecrets.enabled=true
  - template: templates/externalsecret.yaml
    it: creates the primary object-store credential target
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - fullnameOverride: nextcloud-primary-object-store
          spec:
            secretStoreRef:
              name: store
              kind: ClusterSecretStore
            data:
              - secretKey: access-key
                remoteRef: {key: nextcloud/access-key}
              - secretKey: secret-key
                remoteRef: {key: nextcloud/secret-key}
    asserts:
      - equal: {path: metadata.name, value: nextcloud-primary-object-store}
      - equal: {path: spec.target.name, value: nextcloud-primary-object-store}
      - equal: {path: 'spec.data[0].secretKey', value: access-key}
      - equal: {path: 'spec.data[1].secretKey', value: secret-key}
