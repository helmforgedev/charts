suite: Unsafe configuration rejection
templates:
  - templates/secret.yaml
tests:
  - template: templates/secret.yaml
    it: requires external database details
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: externalDatabase.host and externalDatabase.existingSecret are required when postgresql.enabled=false
  - template: templates/secret.yaml
    it: requires external Redis details
    set:
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: externalRedis.host and externalRedis.existingSecret are required when redis.enabled=false
  - template: templates/secret.yaml
    it: requires persistent state for backups
    set:
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      persistence.enabled: false
      cron.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: backup and restore require persistence.enabled=true
  - template: templates/secret.yaml
    it: requires persistent state for the Kubernetes CronJob
    set:
      persistence.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: cron.enabled requires persistence.enabled=true so the CronJob can execute the installed application
  - template: templates/secret.yaml
    it: rejects exclusive single-Pod storage when the CronJob is enabled
    set:
      persistence.accessModes: [ReadWriteOncePod]
    asserts:
      - failedTemplate:
          errorMessage: cron.enabled is incompatible with ReadWriteOncePod because the application and CronJob must mount the PVC from separate Pods
  - template: templates/secret.yaml
    it: rejects exclusive single-Pod storage when backup is enabled
    set:
      cron.enabled: false
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      persistence.accessModes: [ReadWriteOncePod]
    asserts:
      - failedTemplate:
          errorMessage: backup.enabled is incompatible with ReadWriteOncePod because the application and backup Job must mount the PVC from separate Pods
  - template: templates/secret.yaml
    it: requires verified access modes for an existing claim used by another Pod
    set:
      persistence.existingClaim: shared-nextcloud
    asserts:
      - failedTemplate:
          errorMessage: persistence.existingClaimAccessModes must declare the existing PVC access modes when cron.enabled or backup.enabled is true
  - template: templates/secret.yaml
    it: rejects an existing exclusive single-Pod claim when backup is enabled
    set:
      cron.enabled: false
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      persistence.existingClaim: shared-nextcloud
      persistence.existingClaimAccessModes: [ReadWriteOncePod]
    asserts:
      - failedTemplate:
          errorMessage: backup.enabled is incompatible with ReadWriteOncePod because the application and backup Job must mount the PVC from separate Pods
  - template: templates/secret.yaml
    it: requires an S3 bucket
    set:
      backup.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: backup.s3.bucket is required
  - template: templates/secret.yaml
    it: requires static S3 credentials unless workload identity is enabled
    set:
      backup.enabled: true
      backup.s3.bucket: test
    asserts:
      - failedTemplate:
          errorMessage: backup.s3.existingSecret is required when backup.s3.credentialsFromPodIdentity=false
  - template: templates/secret.yaml
    it: accepts workload identity without static S3 credentials
    set:
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.credentialsFromPodIdentity: true
    asserts:
      - notFailedTemplate: {}
  - template: templates/secret.yaml
    it: requires a service account name when creation is disabled
    set:
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.credentialsFromPodIdentity: true
      backup.serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: backup.serviceAccount.name is required when backup.serviceAccount.create=false
  - template: templates/secret.yaml
    it: forbids simultaneous restore and backup
    set:
      backup.enabled: true
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      restore.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: backup.enabled and restore.enabled cannot both be true
  - template: templates/secret.yaml
    it: requires a restore backup path
    set:
      backup.enabled: false
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      restore.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: restore.backupPath is required
  - template: templates/secret.yaml
    it: requires retained administrator credentials on restore
    set:
      backup.enabled: false
      backup.s3.bucket: test
      backup.s3.existingSecret: s3
      restore.enabled: true
      restore.backupPath: set/id
    asserts:
      - failedTemplate:
          errorMessage: restore requires the original administrator credentials through nextcloud.existingSecret or nextcloud.adminPassword
  - template: templates/secret.yaml
    it: requires SMTP authentication credentials when a login is set
    set:
      smtp.enabled: true
      smtp.host: smtp.example.com
      smtp.username: sender
    asserts:
      - failedTemplate:
          errorMessage: smtp.existingSecret is required for authenticated SMTP
  - template: templates/secret.yaml
    it: requires a primary object-store endpoint
    set:
      primaryObjectStore.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.endpoint is required when primaryObjectStore.enabled=true
  - template: templates/secret.yaml
    it: requires a primary object-store bucket
    set:
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: https://s3.example.com
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.bucket is required when primaryObjectStore.enabled=true
  - template: templates/secret.yaml
    it: requires static primary object-store credentials unless workload identity is enabled
    set:
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: https://s3.example.com
      primaryObjectStore.bucket: nextcloud-data
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.existingSecret is required when primaryObjectStore.credentialsFromPodIdentity=false
  - template: templates/secret.yaml
    it: rejects conflicting endpoint and TLS settings
    set:
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: http://s3.example.com
      primaryObjectStore.bucket: nextcloud-data
      primaryObjectStore.existingSecret: object-store
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.endpoint uses http:// but primaryObjectStore.useSsl=true
  - template: templates/secret.yaml
    it: requires explicit object-store egress when NetworkPolicy is enabled
    set:
      networkPolicy.enabled: true
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: https://s3.example.com
      primaryObjectStore.bucket: nextcloud-data
      primaryObjectStore.existingSecret: object-store
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.networkPolicyEgress is required when primary object storage and NetworkPolicy are enabled
  - template: templates/secret.yaml
    it: keeps primary data and integrated backups in different buckets
    set:
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: https://s3.example.com
      primaryObjectStore.bucket: nextcloud-data
      primaryObjectStore.existingSecret: object-store
      backup.enabled: true
      backup.s3.bucket: nextcloud-data
      backup.s3.existingSecret: backup-store
    asserts:
      - failedTemplate:
          errorMessage: primaryObjectStore.bucket and backup.s3.bucket must be different
