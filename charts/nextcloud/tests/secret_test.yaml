# SPDX-License-Identifier: Apache-2.0
suite: Administrator Secret lifecycle
templates:
  - templates/secret.yaml
tests:
  - template: templates/secret.yaml
    it: omits generated credentials for an existing Secret
    set:
      nextcloud.existingSecret: admin
    asserts:
      - hasDocuments:
          count: 0
  - template: templates/secret.yaml
    it: lets ESO own the default administrator target
    set:
      externalSecrets.enabled: true
      externalSecrets.items:
        - spec:
            secretStoreRef:
              name: store
            data:
              - secretKey: admin-password
                remoteRef:
                  key: admin
    asserts:
      - hasDocuments:
          count: 0
  - template: templates/secret.yaml
    it: stores an explicitly supplied initial password
    set:
      nextcloud.adminPassword: ci-bootstrap-password
    asserts:
      - equal:
          path: data.admin-password
          value: Y2ktYm9vdHN0cmFwLXBhc3N3b3Jk
