# SPDX-License-Identifier: Apache-2.0
suite: Unchanged primary object storage upgrade
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-nextcloud-primary-object-store-guard
        namespace: default
      data:
        state: ZW5hYmxlZA==
        configuration: 
tests:
  - it: allows an unchanged enabled primary object store without acknowledgement
    set:
      primaryObjectStore.enabled: true
      primaryObjectStore.endpoint: https://s3.wasabisys.com
      primaryObjectStore.bucket: nextcloud-data
      primaryObjectStore.existingSecret: nextcloud-primary-object-store
    asserts:
      - notFailedTemplate: {}
