{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "nextcloud.validate" . -}}
{{- if and (not .Values.nextcloud.existingSecret) (not (include "nextcloud.authManagedByESO" .)) }}
{{- $password := .Values.nextcloud.adminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "nextcloud.secretName" .) }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data .Values.nextcloud.existingSecretPasswordKey | default "" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextcloud.secretName" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nextcloud.existingSecretPasswordKey }}: {{ default (randAlphaNum 32) $password | b64enc | quote }}
{{- end }}
