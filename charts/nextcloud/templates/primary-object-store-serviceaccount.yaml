{{- if and .Values.primaryObjectStore.enabled .Values.primaryObjectStore.credentialsFromPodIdentity .Values.primaryObjectStore.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nextcloud.primaryObjectStoreServiceAccountName" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
  {{- $annotations := include "nextcloud.annotations" (dict "root" . "specific" .Values.primaryObjectStore.serviceAccount.annotations) }}
  {{- with $annotations }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.primaryObjectStore.serviceAccount.automountServiceAccountToken }}
{{- end }}
