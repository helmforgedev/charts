{{- if .Values.restore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nextcloud.restoreName" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
  template:
    {{- include "nextcloud.backupPod" (dict "root" . "restore" true) | nindent 4 }}
{{- end }}
