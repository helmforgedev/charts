apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextcloud.primaryObjectStoreGuardName" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  state: {{ ternary "enabled" "disabled" .Values.primaryObjectStore.enabled | quote }}
  configuration: {{ ternary (include "nextcloud.primaryObjectStoreConfiguration" .) "disabled" .Values.primaryObjectStore.enabled | quote }}
