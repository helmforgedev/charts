apiVersion: v2
name: nextcloud
description: Nextcloud file collaboration with PostgreSQL, Redis and coordinated backups
type: application
version: 1.1.0
appVersion: "35.0.1"
kubeVersion: ">=1.29.0-0"
home: https://helmforge.dev/docs/charts/nextcloud
icon: https://helmforge.dev/icons/charts/nextcloud.png
sources:
  - https://github.com/helmforgedev/charts/tree/main/charts/nextcloud
  - https://github.com/nextcloud/server
  - https://github.com/nextcloud/docker
keywords: [nextcloud, files, collaboration, webdav, kubernetes]
maintainers:
  - name: helmforgedev
  - name: mberlofa
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "upgrade Nextcloud to 35.0.1 (#1280)"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/prerelease: "false"
  helmforge.dev/maturity: stable
  helmforge.dev/signed: gpg+cosign
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
dependencies:
  - name: postgresql
    version: 2.0.5
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 3.0.0
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
