# SPDX-License-Identifier: Apache-2.0
# -- Override the chart name.
nameOverride: ""
# -- Override the release resource name.
fullnameOverride: ""
# -- Extra labels on resources.
commonLabels: {}
# -- Docker Official Image for Nextcloud Apache.
image:
  # -- Official image repository.
  repository: docker.io/library/nextcloud
  # -- Pinned application release.
  tag: "34.0.4-apache"
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Registry authentication Secret references.
imagePullSecrets: []
# -- Nextcloud application configuration.
nextcloud:
  # -- Initial administrator login; changing this does not rename existing users.
  adminUser: admin
  # -- Initial administrator password; generated and retained when empty.
  adminPassword: ""
  # -- Existing Secret containing the initial administrator password.
  existingSecret: ""
  # -- Password key in the administrator Secret.
  existingSecretPasswordKey: admin-password
  # -- Allowed HTTP Host names, reconciled on upgrades.
  trustedDomains: [localhost]
  # -- Explicit reverse proxy IP addresses or CIDRs.
  trustedProxies: []
  # -- Public URL for links generated by background jobs.
  overwriteCliUrl: http://localhost:8080
  # -- Proxy protocol override; empty, http or https.
  overwriteProtocol: ""
  # -- Public host override behind a trusted proxy.
  overwriteHost: ""
  # -- Default phone region for profile validation.
  defaultPhoneRegion: US
  # -- Start hour in UTC for expensive maintenance background tasks.
  maintenanceWindowStart: 1
# -- PHP request sizing.
php:
  # -- Maximum memory per PHP request.
  memoryLimit: 512M
  # -- Maximum upload and POST body size.
  uploadLimit: 512M
# -- Same-Pod background job worker.
cron:
  # -- Enable Nextcloud cron processing.
  enabled: true
  # -- Seconds between invocations; upstream recommends five minutes.
  interval: 300
  # -- Delay the first cron invocation after Pod startup, matching upstream timer guidance.
  initialDelay: 300
  # -- Worker resources.
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
# -- Application resources; allow headroom above PHP memory_limit.
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: "2", memory: 1536Mi}
# -- Initialization resources.
initResources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 500m, memory: 128Mi}
# -- Pod ownership of writable volumes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}
# -- Container isolation.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
# -- Persistent application, configuration, apps and user files.
persistence:
  # -- Enable the complete /var/www/html PVC.
  enabled: true
  # -- Reuse a PVC, including a restored instance.
  existingClaim: ""
  # -- Storage class; empty uses the cluster default.
  storageClass: ""
  # -- Access modes for the single application writer.
  accessModes: [ReadWriteOnce]
  # -- Requested volume size.
  size: 10Gi
# -- Internal HTTP service.
service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Service port mapped to Apache 8080.
  port: 80
  # -- Optional IP family policy.
  ipFamilyPolicy: ""
  # -- Optional IP family order.
  ipFamilies: []
# -- Bundled official HelmForge PostgreSQL.
postgresql:
  # -- Enable the bundled database.
  enabled: true
  # -- Application database identity.
  auth:
    database: nextcloud
    username: nextcloud
# -- External PostgreSQL connection when postgresql.enabled=false.
externalDatabase:
  # -- PostgreSQL DNS name.
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- Existing empty database on first installation.
  database: nextcloud
  # -- Database owner login.
  username: nextcloud
  # -- Secret containing the database password.
  existingSecret: ""
  # -- Database password key.
  existingSecretPasswordKey: password
# -- Bundled official HelmForge Redis for sessions and transactional file locks.
redis:
  # -- Enable bundled standalone Redis.
  enabled: true
  # -- Supported topology.
  architecture: standalone
# -- External Redis when redis.enabled=false.
externalRedis:
  # -- Standalone Redis DNS name.
  host: ""
  # -- Redis port.
  port: 6379
  # -- Secret containing the Redis password.
  existingSecret: ""
  # -- Redis password key.
  existingSecretPasswordKey: password
# -- Pod labels.
podLabels: {}
# -- Pod annotations.
podAnnotations: {}
# -- Node scheduling constraints.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Pod affinity configuration.
affinity: {}
# -- Grace period for draining HTTP requests and active background jobs.
terminationGracePeriodSeconds: 120
# -- Optional Kubernetes ingress.
ingress:
  # -- Render an Ingress.
  enabled: false
  # -- Ingress controller class.
  ingressClassName: ""
  # -- Controller-specific annotations, including request body size limits.
  annotations: {}
  # -- Host/path rules.
  hosts:
    - host: nextcloud.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS Secret references and hosts.
  tls: []
# -- Gateway API routing.
gatewayAPI:
  # -- Render HTTPRoute resources.
  enabled: false
  # -- Complete route definitions; missing backends target Nextcloud.
  httpRoutes: []
# -- External Secrets Operator integration.
externalSecrets:
  # -- Render ExternalSecret resources.
  enabled: false
  # -- Default refresh interval.
  refreshInterval: 1h
  # -- Complete ExternalSecret definitions with provider spec.
  items: []
# -- Outbound email, used for sharing and account recovery.
smtp:
  # -- Enable SMTP configuration.
  enabled: false
  # -- SMTP server hostname.
  host: ""
  # -- SMTP port.
  port: 587
  # -- Transport security: tls for STARTTLS, ssl for implicit TLS, or empty.
  secure: tls
  # -- Sender local part.
  fromAddress: nextcloud
  # -- Sender domain.
  domain: example.com
  # -- Authentication login; empty disables SMTP authentication.
  username: ""
  # -- Existing SMTP credential Secret.
  existingSecret: ""
  # -- SMTP password key.
  existingSecretPasswordKey: password
# -- Application network isolation.
networkPolicy:
  # -- Enable NetworkPolicy.
  enabled: false
  # -- Additional inbound rules; default allows same-namespace clients.
  extraIngress: []
  # -- Additional outbound rules for external databases, SMTP and Internet integrations.
  extraEgress: []
# -- Coordinated SQL and file backup; the app is stopped while the snapshot is taken.
backup:
  # -- Enable scheduled integrated backups.
  enabled: false
  # -- Cron schedule.
  schedule: "0 2 * * *"
  # -- Suspend scheduling, retaining manual job support.
  suspend: false
  # -- Maximum total job duration in seconds.
  activeDeadlineSeconds: 7200
  # -- Maximum time to wait for web and cron termination.
  quiesceTimeout: 180
  # -- Successful job history.
  successfulJobsHistoryLimit: 1
  # -- Failed jobs retained for diagnostics.
  failedJobsHistoryLimit: 3
  # -- Official SQL client; must match the PostgreSQL server major.
  databaseImage: docker.io/library/postgres:18.6-trixie
  # -- Official AWS CLI for S3-compatible object stores.
  s3Image: public.ecr.aws/aws-cli/aws-cli:2.36.43
  # -- Maximum ephemeral staging storage; allow space for the complete archive and dump.
  workspaceSize: 20Gi
  # -- Per-stage resources.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  # -- Destination object store; bucket must already exist.
  s3:
    # -- Optional endpoint URL for S3-compatible storage.
    endpoint: ""
    # -- Existing private bucket.
    bucket: ""
    # -- Backup object prefix, without leading or trailing slash.
    prefix: nextcloud
    # -- AWS signing region.
    region: us-east-1
    # -- Secret containing S3 credentials.
    existingSecret: ""
    # -- Access key ID key.
    existingSecretAccessKeyKey: access-key
    # -- Secret access key key.
    existingSecretSecretKeyKey: secret-key
# -- Restore an integrated backup to a new PVC and empty database.
restore:
  # -- Keep application stopped and create a restore Job. Disable after successful restore.
  enabled: false
  # -- Exact S3 prefix for a completed backup, including its unique backup ID.
  backupPath: ""
