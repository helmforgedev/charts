{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bulwark-mail.fullname" . }}
  labels:
    {{- include "bulwark-mail.labels" . | nindent 4 }}
  {{- $specific := deepCopy (.Values.persistence.annotations | default dict) -}}
  {{- if .Values.persistence.retain }}
  {{- $_ := set $specific "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "bulwark-mail.renderAnnotations" (dict "root" . "specific" $specific) | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
