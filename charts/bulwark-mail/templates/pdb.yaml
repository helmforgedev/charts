{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $replicas := ternary (int .Values.autoscaling.minReplicas) (int .Values.replicaCount) .Values.autoscaling.enabled }}
{{- if and .Values.pdb.enabled .Values.sharedStore.enabled (gt $replicas 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bulwark-mail.fullname" . }}
  labels:
    {{- include "bulwark-mail.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "bulwark-mail.selectorLabels" . | nindent 6 }}
{{- end }}
