# SPDX-License-Identifier: Apache-2.0
suite: bulwark-mail External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a default target and refresh interval
    values:
      - external-secrets-values.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-bulwark-mail
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-bulwark-mail
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.data[0].secretKey
          value: session-secret
  - it: honors a literal fullname and item refresh interval
    values:
      - external-secrets-fullname-values.yaml
    asserts:
      - equal:
          path: metadata.name
          value: bulwark-runtime
      - equal:
          path: spec.target.name
          value: bulwark-runtime
      - equal:
          path: spec.refreshInterval
          value: 15m
