# SPDX-License-Identifier: Apache-2.0
podLabels:
  workload: webmail
nodeSelector:
  kubernetes.io/os: linux
extraEnv:
  - name: LIBRETRANSLATE_URL
    value: https://translate.example.com
extraEnvFrom:
  - configMapRef:
      name: bulwark-extra
extraVolumes:
  - name: custom
    configMap:
      name: bulwark-custom
extraVolumeMounts:
  - name: custom
    mountPath: /etc/bulwark/custom
    readOnly: true
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: bulwark-extra-manifest
    data:
      mode: declarative
