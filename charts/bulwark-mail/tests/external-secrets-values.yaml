# SPDX-License-Identifier: Apache-2.0
secrets:
  existingSecret: RELEASE-NAME-bulwark-mail
  generate: false
externalSecrets:
  enabled: true
  refreshInterval: 1h
  items:
    - spec:
        secretStoreRef:
          name: fake
          kind: ClusterSecretStore
        data:
          - secretKey: session-secret
            remoteRef:
              key: bulwark-mail
              property: session-secret
