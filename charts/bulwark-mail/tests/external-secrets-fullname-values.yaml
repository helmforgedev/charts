# SPDX-License-Identifier: Apache-2.0
secrets:
  existingSecret: bulwark-runtime
  generate: false
externalSecrets:
  enabled: true
  refreshInterval: 1h
  items:
    - fullnameOverride: bulwark-runtime
      spec:
        refreshInterval: 15m
        secretStoreRef:
          name: fake
          kind: ClusterSecretStore
        data:
          - secretKey: session-secret
            remoteRef:
              key: bulwark-mail
              property: session-secret
