suite: bulwark-mail secrets
templates:
  - templates/secret.yaml
  - templates/deployment.yaml
tests:
  - it: creates a generated session Secret by default
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-bulwark-mail
      - exists:
          path: stringData.session-secret
      - notExists:
          path: stringData.admin-password
  - it: skips the generated Secret when an existing Secret is selected
    template: templates/secret.yaml
    set:
      secrets.existingSecret: bulwark-runtime
    asserts:
      - hasDocuments:
          count: 0
  - it: references the configured existing Secret and keys
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: bulwark-runtime
      secrets.keys.sessionSecret: session
      secrets.keys.adminPassword: admin
      secrets.adminPassword: ignored-inline-marker
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: bulwark-runtime
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: session
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: bulwark-runtime
                key: admin
                optional: true
  - it: creates optional credential values when configured inline
    template: templates/secret.yaml
    set:
      secrets.adminPassword: change-this-admin
      secrets.oauthClientSecret: oauth-secret
      secrets.jwtAuthSecret: "01234567890123456789012345678901"
      secrets.stalwartMasterUser: master@example.com
      secrets.stalwartMasterPassword: master-password
    asserts:
      - equal:
          path: stringData.admin-password
          value: change-this-admin
      - equal:
          path: stringData.oauth-client-secret
          value: oauth-secret
      - equal:
          path: stringData.jwt-auth-secret
          value: "01234567890123456789012345678901"
      - equal:
          path: stringData.stalwart-master-user
          value: master@example.com
      - equal:
          path: stringData.stalwart-master-password
          value: master-password
  - it: wires OAuth and JWT master credentials only when enabled
    template: templates/deployment.yaml
    set:
      config.oauth.enabled: true
      config.oauth.clientId: bulwark
      config.oauth.issuerUrl: https://idp.example.com
      config.jwtAuth.enabled: true
      secrets.oauthClientSecret: oauth-secret
      secrets.jwtAuthSecret: "01234567890123456789012345678901"
      secrets.stalwartMasterUser: master@example.com
      secrets.stalwartMasterPassword: master-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-bulwark-mail
                key: oauth-client-secret
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BULWARK_JWT_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-bulwark-mail
                key: jwt-auth-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BULWARK_STALWART_MASTER_USER
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-bulwark-mail
                key: stalwart-master-user
