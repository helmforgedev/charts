# SPDX-License-Identifier: Apache-2.0
# Several replicas sharing a Valkey or Redis store. The Secret holds
# session-secret, admin-password and shared-store-url
# (redis://:password@valkey:6379/0).
replicaCount: 3
sharedStore:
  enabled: true
config:
  mode: declarative
  jmap:
    serverUrl: https://mail.example.com
secrets:
  existingSecret: bulwark-mail-runtime
  generate: false
persistence:
  enabled: false
pdb:
  enabled: true
