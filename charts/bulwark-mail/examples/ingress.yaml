# SPDX-License-Identifier: Apache-2.0
config:
  mode: declarative
  jmap:
    serverUrl: https://mail.example.com
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: webmail.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bulwark-mail-tls
      hosts:
        - webmail.example.com
