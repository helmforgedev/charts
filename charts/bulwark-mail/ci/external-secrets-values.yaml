# SPDX-License-Identifier: Apache-2.0
secrets:
  generate: false
  existingSecret: bulwark-mail-runtime
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: bulwark-mail-runtime
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              session-secret: '{{ .password | sha256sum }}'
        data:
          - secretKey: password
            remoteRef:
              key: test/password
