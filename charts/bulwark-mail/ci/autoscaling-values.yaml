# SPDX-License-Identifier: Apache-2.0
# Autoscaling scenario with Valkey-backed sharedStore and HPA enabled
sharedStore:
  enabled: true
  url: redis://:ci-store-password@valkey:6379/0
config:
  mode: declarative
  jmap:
    serverUrl: https://stalwart.invalid
secrets:
  sessionSecret: "012345678901234567890123456789012345678901234567"
persistence:
  enabled: false
pdb:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
