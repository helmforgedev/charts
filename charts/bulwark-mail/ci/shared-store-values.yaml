# SPDX-License-Identifier: Apache-2.0
# Three replicas sharing one Redis-protocol store, without a data volume.
replicaCount: 3
sharedStore:
  enabled: true
  url: redis://:ci-store-password@valkey:6379/0
config:
  mode: declarative
  jmap:
    serverUrl: https://stalwart.invalid
secrets:
  sessionSecret: "012345678901234567890123456789012345678901234567"
persistence:
  enabled: false
pdb:
  enabled: true
