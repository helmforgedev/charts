{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and (eq .Values.architecture "replication") (gt (int .Values.replication.readReplicas.replicaCount) 0) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mariadb.replicaStatefulSetName" . }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
  {{- include "mariadb.renderAnnotations" (dict "root" .) | nindent 2 }}
spec:
  serviceName: {{ include "mariadb.replicasHeadlessServiceName" . }}
  replicas: {{ .Values.replication.readReplicas.replicaCount }}
  {{- include "mariadb.persistenceRetentionPolicy" (dict "persistence" .Values.replication.readReplicas.persistence) | nindent 2 }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "mariadb.componentLabels" (dict "root" . "role" "replica") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mariadb.componentLabels" (dict "root" . "role" "replica") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "mariadb.configChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "mariadb.podSpecCommon" . | nindent 6 }}
      {{- include "mariadb.affinity" (dict "root" . "instance" .Values.replication.readReplicas) | nindent 6 }}
      {{- include "mariadb.tolerations" (dict "root" . "instance" .Values.replication.readReplicas) | nindent 6 }}
      initContainers:
        {{- include "mariadb.prepareDataSubPathInitContainer" . | nindent 8 }}
        - name: clone-source
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              DATA_DIR="/var/lib/mysql"
              CLONE_MARKER="${DATA_DIR}/.helmforge-cloned"
              BOOTSTRAP_STATE="${DATA_DIR}/.helmforge-bootstrap-state"
              if [ -f "${CLONE_MARKER}" ]; then
                exit 0
              fi
              LOCAL_SERVER_STARTED=false
              LOCAL_ROOT_PASSWORD_REQUIRED=false
              local_mariadb() {
                if [ "${LOCAL_ROOT_PASSWORD_REQUIRED}" = "true" ]; then
                  mariadb --socket=/tmp/mysql.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" "$@"
                else
                  mariadb --socket=/tmp/mysql.sock -uroot "$@"
                fi
              }
              local_admin_shutdown() {
                if [ "${LOCAL_ROOT_PASSWORD_REQUIRED}" = "true" ]; then
                  mariadb-admin --socket=/tmp/mysql.sock -uroot -p"${MARIADB_ROOT_PASSWORD}" shutdown
                else
                  mariadb-admin --socket=/tmp/mysql.sock -uroot shutdown
                fi
              }
              wait_local_socket() {
                until [ -S /tmp/mysql.sock ]; do
                  sleep 2
                done
                while true; do
                  if mariadb --socket=/tmp/mysql.sock -uroot -Nse "SELECT 1" >/dev/null 2>&1; then
                    LOCAL_ROOT_PASSWORD_REQUIRED=false
                    break
                  fi
                  if mariadb --socket=/tmp/mysql.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -Nse "SELECT 1" >/dev/null 2>&1; then
                    LOCAL_ROOT_PASSWORD_REQUIRED=true
                    break
                  fi
                  sleep 2
                done
              }
              cat /config/my.cnf > /etc/mysql/conf.d/zz-chart.cnf
              DATADIR_HAS_CONTENT=false
              if find "${DATA_DIR}" -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit | grep -q .; then
                DATADIR_HAS_CONTENT=true
              fi
              if [ -d "${DATA_DIR}/mysql" ]; then
                mariadbd --datadir="${DATA_DIR}" --socket=/tmp/mysql.sock --pid-file=/tmp/mariadb.pid --skip-networking --read-only=OFF &
                LOCAL_SERVER_STARTED=true

                wait_local_socket

                if mariadb --socket=/tmp/mysql.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -Nse "SELECT 1" >/dev/null 2>&1; then
                  LOCAL_ROOT_PASSWORD_REQUIRED=true
                fi

                status="$(local_mariadb -Nse "SHOW SLAVE STATUS\\G" 2>/dev/null || true)"
                if printf "%s\n" "${status}" | grep -Eq "Master_Host: .+"; then
                  if [ "${BOOTSTRAP_METHOD}" = "volumeSnapshot" ] && [ ! -f "${BOOTSTRAP_STATE}" ]; then
                    local_admin_shutdown
                    echo "The configured VolumeSnapshot contains unmanaged replica metadata; only a snapshot of the writable source is supported." >&2
                    exit 1
                  fi
                  touch "${CLONE_MARKER}"
                  rm -f "${BOOTSTRAP_STATE}"
                  local_admin_shutdown
                  exit 0
                fi
              fi

              if [ -f "${BOOTSTRAP_STATE}" ]; then
                recorded_method="$(cat "${BOOTSTRAP_STATE}")"
                if [ "${recorded_method}" != "${BOOTSTRAP_METHOD}" ]; then
                  if [ "${LOCAL_SERVER_STARTED}" = "true" ]; then
                    local_admin_shutdown
                  fi
                  echo "Replica bootstrap method changed from ${recorded_method} to ${BOOTSTRAP_METHOD} on a partially initialized PVC; refusing to continue." >&2
                  exit 1
                fi
              elif [ "${DATADIR_HAS_CONTENT}" = "true" ] && [ "${BOOTSTRAP_METHOD}" = "logical" ] && [ "${RESUME_UNMARKED_DATADIR}" != "true" ]; then
                if [ "${LOCAL_SERVER_STARTED}" = "true" ]; then
                  local_admin_shutdown
                fi
                echo "Non-empty replica datadir has no HelmForge bootstrap marker or replication metadata; refusing to overwrite it. Set replication.readReplicas.bootstrap.resumeUnmarkedDatadir=true only to resume a trusted legacy partial bootstrap." >&2
                exit 1
              else
                printf '%s\n' "${BOOTSTRAP_METHOD}" > "${BOOTSTRAP_STATE}"
              fi

              if [ "${BOOTSTRAP_METHOD}" = "volumeSnapshot" ] && [ ! -d "${DATA_DIR}/mysql" ]; then
                echo "The replica PVC was not restored from the configured VolumeSnapshot: ${DATA_DIR}/mysql is missing." >&2
                exit 1
              fi

              ordinal="${HOSTNAME##*-}"
              server_id=$(( {{ .Values.replication.readReplicas.serverIdBase }} + ordinal + 1 ))

              cat /config/my.cnf > /etc/mysql/conf.d/zz-chart.cnf
              cat > /etc/mysql/conf.d/zz-role.cnf <<EOF
              [mysqld]
              server_id = ${server_id}
              read_only = ON
              relay_log = mariadb-relay-bin
              log_slave_updates = ON
              skip_slave_start = ON
              slave_parallel_workers = {{ .Values.replication.replicaTuning.parallelWorkers }}
              EOF

              until mariadb-admin ping -h {{ include "mariadb.sourceServiceName" . }} -P {{ .Values.service.port }} -uroot --password="${MARIADB_ROOT_PASSWORD}" {{ include "mariadb.cliTlsArgs" . }} --silent; do
                sleep 5
              done

              until mariadb -h {{ include "mariadb.sourceServiceName" . }} -P {{ .Values.service.port }} -uroot --password="${MARIADB_ROOT_PASSWORD}" {{ include "mariadb.cliTlsArgs" . }} -Nse "SHOW DATABASES LIKE '${MARIADB_DATABASE}'" | grep -qx "${MARIADB_DATABASE}"; do
                sleep 5
              done
              until mariadb -h {{ include "mariadb.sourceServiceName" . }} -P {{ .Values.service.port }} -uroot --password="${MARIADB_ROOT_PASSWORD}" {{ include "mariadb.cliTlsArgs" . }} -Nse "SHOW MASTER STATUS" | grep -q .; do
                sleep 5
              done

              if [ "${BOOTSTRAP_METHOD}" = "logical" ] && [ ! -d "${DATA_DIR}/mysql" ]; then
                mariadb-install-db --datadir="${DATA_DIR}" --auth-root-authentication-method=normal
              fi

              if [ "${LOCAL_SERVER_STARTED}" = "false" ]; then
                mariadbd --datadir="${DATA_DIR}" --socket=/tmp/mysql.sock --pid-file=/tmp/mariadb.pid --skip-networking --read-only=OFF &

                wait_local_socket
              fi

              local_mariadb <<EOSQL
              SET GLOBAL read_only = OFF;
              ALTER USER 'root'@'localhost' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              DROP USER IF EXISTS ''@'localhost';
              DROP USER IF EXISTS ''@'${HOSTNAME}';
              DROP USER IF EXISTS ''@'%';
              DELETE FROM mysql.global_priv WHERE User = '';
              DELETE FROM mysql.proxies_priv WHERE User = '' OR Proxied_user = '';
              DROP USER IF EXISTS 'root'@'${HOSTNAME}';
              CREATE OR REPLACE USER 'root'@'%' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
              CREATE OR REPLACE USER 'root'@'127.0.0.1' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
              FLUSH PRIVILEGES;
              EOSQL
              LOCAL_ROOT_PASSWORD_REQUIRED=true

              GTID_SQL=""
              SOURCE_GTID="${VOLUME_SNAPSHOT_GTID}"

              if [ "${BOOTSTRAP_METHOD}" = "logical" ]; then
                dump_attempt=1
                until mariadb-dump \
                  -h {{ include "mariadb.sourceServiceName" . }} \
                  -P {{ .Values.service.port }} \
                  -uroot \
                  --password="${MARIADB_ROOT_PASSWORD}" \
                  {{ include "mariadb.cliTlsArgs" . }} \
                  --single-transaction \
                  --gtid \
                  --master-data=2 \
                  --all-databases \
                  --triggers \
                  --routines \
                  --events \
                  > /tmp/source.sql; do
                  if [ "${dump_attempt}" -ge 12 ]; then
                    exit 1
                  fi
                  dump_attempt=$((dump_attempt + 1))
                  rm -f /tmp/source.sql
                  sleep 5
                done

                SOURCE_GTID="$(sed -n "s/^-- SET GLOBAL gtid_slave_pos='\([^']*\)'.*/\1/p; s/^SET GLOBAL gtid_slave_pos='\([^']*\)'.*/\1/p" /tmp/source.sql | tail -n 1)"
                local_mariadb < /tmp/source.sql
              fi

              if [ -z "${SOURCE_GTID}" ]; then
                echo "Replica bootstrap did not produce a GTID position; refusing to configure replication." >&2
                exit 1
              fi
              if [ -n "${SOURCE_GTID}" ]; then
                GTID_SQL="SET GLOBAL gtid_slave_pos='${SOURCE_GTID}';"
              fi
              local_admin_shutdown
              mariadbd --datadir="${DATA_DIR}" --socket=/tmp/mysql.sock --pid-file=/tmp/mariadb.pid --skip-networking --read-only=OFF &
              LOCAL_ROOT_PASSWORD_REQUIRED=true
              wait_local_socket

              cat > /tmp/configure-replication.sql <<EOSQL
              SET GLOBAL read_only = OFF;
              ALTER USER 'root'@'localhost' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              DROP USER IF EXISTS ''@'localhost';
              DROP USER IF EXISTS ''@'${HOSTNAME}';
              DROP USER IF EXISTS ''@'%';
              DELETE FROM mysql.global_priv WHERE User = '';
              DELETE FROM mysql.proxies_priv WHERE User = '' OR Proxied_user = '';
              DROP USER IF EXISTS 'root'@'${HOSTNAME}';
              CREATE OR REPLACE USER 'root'@'%' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
              CREATE OR REPLACE USER 'root'@'127.0.0.1' IDENTIFIED BY '${MARIADB_ROOT_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
              CREATE DATABASE IF NOT EXISTS \`${MARIADB_DATABASE}\`;
              CREATE USER IF NOT EXISTS '${MARIADB_USER}'@'%' IDENTIFIED BY '${MARIADB_PASSWORD}';
              ALTER USER '${MARIADB_USER}'@'%' IDENTIFIED BY '${MARIADB_PASSWORD}';
              GRANT ALL PRIVILEGES ON \`${MARIADB_DATABASE}\`.* TO '${MARIADB_USER}'@'%';
              ${GTID_SQL}
              CHANGE MASTER TO
                MASTER_HOST='{{ include "mariadb.sourceServiceName" . }}',
                MASTER_PORT={{ .Values.service.port }},
                MASTER_USER='{{ .Values.auth.replicationUsername }}',
                MASTER_PASSWORD='${REPLICATION_PASSWORD}',
                {{ include "mariadb.replicationTlsClause" . | nindent 16 }}
                MASTER_USE_GTID=slave_pos;
              EOSQL
              configure_attempt=1
              until local_mariadb < /tmp/configure-replication.sql >/tmp/configure-replication.out 2>/tmp/configure-replication.err; do
                if [ "${configure_attempt}" -ge 6 ]; then
                  cat /tmp/configure-replication.err >&2
                  exit 1
                fi
                configure_attempt=$((configure_attempt + 1))
                sleep 3
              done

              touch "${CLONE_MARKER}"
              rm -f "${BOOTSTRAP_STATE}"
              local_admin_shutdown
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariadb.secretName" . }}
                  key: {{ .Values.auth.existingSecretRootPasswordKey }}
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariadb.secretName" . }}
                  key: {{ .Values.auth.existingSecretReplicationPasswordKey }}
            - name: MARIADB_DATABASE
              value: {{ .Values.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariadb.secretName" . }}
                  key: {{ .Values.auth.existingSecretUserPasswordKey }}
            - name: BOOTSTRAP_METHOD
              value: {{ .Values.replication.readReplicas.bootstrap.method | quote }}
            - name: RESUME_UNMARKED_DATADIR
              value: {{ .Values.replication.readReplicas.bootstrap.resumeUnmarkedDatadir | quote }}
            - name: VOLUME_SNAPSHOT_GTID
              value: {{ .Values.replication.readReplicas.bootstrap.volumeSnapshot.gtid | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "mariadb.dataVolumeMount" . | nindent 12 }}
            - name: config
              mountPath: /config
            - name: mariadb-conf
              mountPath: /etc/mysql/conf.d
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
        {{- if .Values.metrics.enabled }}
        {{- include "mariadb.metricsConfigInitContainer" . | nindent 8 }}
        {{- end }}
      containers:
        - name: mariadb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              REPLICATION_READY_MARKER="/tmp/helmforge-replication-started"
              rm -f "${REPLICATION_READY_MARKER}"
              ordinal="${HOSTNAME##*-}"
              server_id=$(( {{ .Values.replication.readReplicas.serverIdBase }} + ordinal + 1 ))
              cat /config/my.cnf > /etc/mysql/conf.d/zz-chart.cnf
              cat > /etc/mysql/conf.d/zz-role.cnf <<EOF
              [mysqld]
              server_id = ${server_id}
              read_only = ON
              relay_log = mariadb-relay-bin
              log_slave_updates = ON
              skip_slave_start = ON
              slave_parallel_workers = {{ .Values.replication.replicaTuning.parallelWorkers }}
              EOF
              docker-entrypoint.sh mariadbd &
              pid="$!"
              shutdown_replica() {
                rm -f "${REPLICATION_READY_MARKER}"
                if mariadb-admin ping --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" --silent >/dev/null 2>&1; then
                  timeout 10 mariadb --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -e "STOP SLAVE;" || true
                  mariadb-admin --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" shutdown || kill -TERM "${pid}"
                else
                  kill -TERM "${pid}"
                fi
                wait "${pid}"
                exit 0
              }
              trap shutdown_replica TERM INT

              until mariadb-admin ping --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" --silent; do
                sleep 2
              done

              until mariadb-admin ping -h {{ include "mariadb.sourceServiceName" . }} -P {{ .Values.service.port }} -uroot --password="${MARIADB_ROOT_PASSWORD}" {{ include "mariadb.cliTlsArgs" . }} --silent; do
                sleep 5
              done

              status="$(mariadb --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -Nse "SHOW SLAVE STATUS\\G" 2>/dev/null || true)"
              if ! printf "%s\n" "${status}" | grep -q "Slave_SQL_Running: Yes"; then
                mariadb --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -e "START SLAVE;"
              fi
              until status="$(mariadb --socket=/run/mysqld/mysqld.sock -uroot --password="${MARIADB_ROOT_PASSWORD}" -e "SHOW SLAVE STATUS\\G")" \
                && printf "%s\n" "${status}" | grep -q "Slave_IO_Running: Yes" \
                && printf "%s\n" "${status}" | grep -q "Slave_SQL_Running: Yes"; do
                sleep 2
              done
              touch "${REPLICATION_READY_MARKER}"
              wait "${pid}"
          ports:
            - name: mariadb
              containerPort: {{ .Values.service.port }}
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mariadb.secretName" . }}
                  key: {{ .Values.auth.existingSecretRootPasswordKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - {{ include "mariadb.replicaProbeCommandString" . | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - {{ include "mariadb.replicaReadinessCommandString" . | quote }}
            initialDelaySeconds: {{ max 60 (int .Values.readinessProbe.initialDelaySeconds) }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - {{ include "mariadb.replicaProbeCommandString" . | quote }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- if .Values.replication.readReplicas.resources }}
            {{- toYaml .Values.replication.readReplicas.resources | nindent 12 }}
            {{- else }}
            {{- include "mariadb.resourcesPreset" (dict "preset" .Values.replication.readReplicas.resourcesPreset) | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "mariadb.dataVolumeMount" . | nindent 12 }}
            - name: config
              mountPath: /config
            - name: mariadb-conf
              mountPath: /etc/mysql/conf.d
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: mysqld-exporter
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.service.metricsPort }}
            - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- if .Values.metrics.resources }}
            {{- toYaml .Values.metrics.resources | nindent 12 }}
            {{- else }}
            {{- include "mariadb.metricsResourcesPreset" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "mariadb.metricsVolumeMounts" . | nindent 12 }}
        {{- end }}
      volumes:
        - name: mariadb-conf
          emptyDir: {}
        {{- if .Values.metrics.enabled }}
        - name: mysqld-exporter-config
          emptyDir: {}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "mariadb.configMapName" . }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "mariadb.tlsSecretName" . }}
        {{- end }}
        {{- if not .Values.replication.readReplicas.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.replication.readReplicas.persistence.enabled }}
  volumeClaimTemplates:
    {{- $replicaClaim := dict "root" . "persistence" .Values.replication.readReplicas.persistence -}}
    {{- if eq .Values.replication.readReplicas.bootstrap.method "volumeSnapshot" -}}
      {{- $_ := set $replicaClaim "dataSource" (dict "apiGroup" "snapshot.storage.k8s.io" "kind" "VolumeSnapshot" "name" .Values.replication.readReplicas.bootstrap.volumeSnapshot.name) -}}
    {{- end -}}
    {{- include "mariadb.volumeClaimTemplate" $replicaClaim | nindent 4 }}
  {{- end }}
{{- end }}
