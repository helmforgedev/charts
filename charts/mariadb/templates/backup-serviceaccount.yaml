{{- if and (include "mariadb.backupEnabled" .) .Values.backup.s3.credentialsFromPodIdentity .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mariadb.backupServiceAccountName" . }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
  {{- $saAnnotations := mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.backup.serviceAccount.annotations | default dict) -}}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
