apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mariadb.configMapName" . }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
  {{- include "mariadb.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  {{- include "mariadb.configMapData" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mariadb.initdbConfigMapName" . }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
  {{- include "mariadb.renderAnnotations" (dict "root" .) | nindent 2 }}
data:
  {{- include "mariadb.initdbConfigMapData" . | nindent 2 }}
