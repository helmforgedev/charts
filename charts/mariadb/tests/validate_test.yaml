# SPDX-License-Identifier: Apache-2.0
suite: validate
templates:
  - templates/validate.yaml
tests:
  - it: should pass validation with default values
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when externalSecrets.enabled is true and auth.existingSecret is empty
    set:
      externalSecrets.enabled: true
      auth.existingSecret: ""
      externalSecrets.secretStoreRef.name: my-store
    asserts:
      - failedTemplate:
          errorMessage: "When externalSecrets.enabled is true, auth.existingSecret must be set to prevent credential drift between the chart-managed Secret and the ExternalSecret."

  - it: should fail when externalSecrets.enabled is true and secretStoreRef.name is empty
    set:
      externalSecrets.enabled: true
      auth.existingSecret: "my-secret"
      externalSecrets.secretStoreRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "When externalSecrets.enabled is true, externalSecrets.secretStoreRef.name must be provided."

  - it: should fail when backup.enabled is true and s3 endpoint is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: ""
      backup.s3.bucket: "my-bucket"
      backup.s3.existingSecret: "my-secret"
    asserts:
      - failedTemplate:
          errorMessage: "When backup.enabled is true, backup.s3.endpoint must be specified."

  - it: should fail when backup.enabled is true and s3 endpoint is malformed
    set:
      backup.enabled: true
      backup.s3.endpoint: "https://"
      backup.s3.bucket: "my-bucket"
      backup.s3.existingSecret: "my-secret"
    asserts:
      - failedTemplate:
          errorMessage: "When backup.enabled is true, backup.s3.endpoint must be a valid URL starting with http:// or https:// with a valid host."

  - it: should fail when backup.enabled is true and s3 bucket is missing
    set:
      backup.enabled: true
      backup.s3.endpoint: "https://s3.example.com"
      backup.s3.bucket: ""
      backup.s3.existingSecret: "my-secret"
    asserts:
      - failedTemplate:
          errorMessage: "When backup.enabled is true, backup.s3.bucket must be specified."

  - it: should fail when backup.enabled is true and credentials are not provided
    set:
      backup.enabled: true
      backup.s3.endpoint: "https://s3.example.com"
      backup.s3.bucket: "my-bucket"
      backup.s3.existingSecret: ""
      backup.s3.accessKey: ""
      backup.s3.secretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "When backup.enabled is true, either backup.s3.existingSecret or both backup.s3.accessKey and backup.s3.secretKey must be provided."

  - it: should fail when tls.enabled is true and tls.existingSecret is empty
    set:
      tls.enabled: true
      tls.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "When tls.enabled is true, tls.existingSecret must be provided containing certificates."

  - it: should pass validation when backup.enabled is true with valid configuration
    set:
      backup.enabled: true
      backup.s3.endpoint: "https://s3.example.com"
      backup.s3.bucket: "my-bucket"
      backup.s3.existingSecret: "my-backup-secret"
    asserts:
      - hasDocuments:
          count: 0
