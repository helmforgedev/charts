apiVersion: v1
kind: Pod
metadata:
  name: {{ include "certimate.fullname" . }}-test-connection
  labels:
    {{- include "certimate.labels" . | nindent 4 }}
  {{- include "certimate.renderAnnotations" (dict "root" . "specific" (dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) | nindent 2 }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.37.0
      command:
        - wget
      args:
        - -qO-
        - http://{{ include "certimate.fullname" . }}:{{ .Values.service.port }}/api/health
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.test.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
