# SPDX-License-Identifier: Apache-2.0
suite: certimate base templates
templates:
  - templates/deployment.yaml
  - templates/ingress.yaml
  - templates/pvc.yaml
  - templates/service.yaml
tests:
  - it: renders the official pinned image
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: certimate/certimate:v0.4.31
      - equal:
          path: spec.strategy.type
          value: Recreate
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/pod-settings"]
          pattern: "^[a-f0-9]{64}$"
  - it: renders the default ClusterIP service
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: renders common labels on a separate line
    template: templates/service.yaml
    values:
      - common-labels-values.yaml
    asserts:
      - equal:
          path: metadata.labels.review
          value: enabled
  - it: renders ingress TLS
    template: templates/ingress.yaml
    values:
      - ingress-values.yaml
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: certimate-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: certimate.example.com
  - it: defaults ingress host paths when omitted
    template: templates/ingress.yaml
    values:
      - ingress-host-only-values.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-certimate
  - it: uses emptyDir when persistence is disabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
      persistence.ephemeral: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: data
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
  - it: creates a PVC when persistence is chart-managed
    template: templates/pvc.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
  - it: renders default production resource requests and limits
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
  - it: provides writable temporary storage with a read-only root filesystem
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
            readOnly: false
      - equal:
          path: spec.template.spec.volumes[1].name
          value: tmp
      - equal:
          path: spec.template.spec.volumes[1].emptyDir
          value: {}
  - it: rejects an extra volume mount that duplicates the reserved tmp path
    template: templates/deployment.yaml
    set:
      extraVolumeMounts:
        - name: custom-tmp
          mountPath: /tmp
    asserts:
      - failedTemplate:
          errorMessage: extraVolumeMounts must not use the reserved mountPath /tmp
  - it: rejects persistence mounted at the reserved tmp path
    template: templates/deployment.yaml
    set:
      persistence.mountPath: /tmp
    asserts:
      - failedTemplate:
          errorMessage: persistence.mountPath must not use the reserved mountPath /tmp
  - it: rejects an extra volume using the reserved tmp name
    template: templates/deployment.yaml
    set:
      extraVolumes:
        - name: tmp
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: extraVolumes must not use the reserved volume name tmp
  - it: bounds temporary storage when configured
    template: templates/deployment.yaml
    set:
      tmpStorage.sizeLimit: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].emptyDir.sizeLimit
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 1Gi
