# SPDX-License-Identifier: Apache-2.0
suite: Managed Secret upgrade retention
templates:
  - templates/secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-flowise-auth
        namespace: default
      data:
        encryption-key: cmV0YWluZWQtZW5jcnlwdGlvbg==
        jwt-auth-token-secret: cmV0YWluZWQtand0LWF1dGg=
        jwt-refresh-token-secret: cmV0YWluZWQtand0LXJlZnJlc2g=
        express-session-secret: cmV0YWluZWQtc2Vzc2lvbg==
        token-hash-secret: cmV0YWluZWQtdG9rZW4taGFzaA==
tests:
  - it: should retain every generated application secret
    asserts:
      - equal:
          path: data["encryption-key"]
          value: cmV0YWluZWQtZW5jcnlwdGlvbg==
      - equal:
          path: data["jwt-auth-token-secret"]
          value: cmV0YWluZWQtand0LWF1dGg=
      - equal:
          path: data["jwt-refresh-token-secret"]
          value: cmV0YWluZWQtand0LXJlZnJlc2g=
      - equal:
          path: data["express-session-secret"]
          value: cmV0YWluZWQtc2Vzc2lvbg==
      - equal:
          path: data["token-hash-secret"]
          value: cmV0YWluZWQtdG9rZW4taGFzaA==

  - it: should prefer explicit application secrets
    set:
      auth.encryptionKey: replacement-encryption
      auth.jwtAuthTokenSecret: replacement-jwt-auth
      auth.jwtRefreshTokenSecret: replacement-jwt-refresh
      auth.expressSessionSecret: replacement-session
      auth.tokenHashSecret: replacement-token-hash
    asserts:
      - equal:
          path: data["encryption-key"]
          value: cmVwbGFjZW1lbnQtZW5jcnlwdGlvbg==
      - equal:
          path: data["jwt-auth-token-secret"]
          value: cmVwbGFjZW1lbnQtand0LWF1dGg=
      - equal:
          path: data["jwt-refresh-token-secret"]
          value: cmVwbGFjZW1lbnQtand0LXJlZnJlc2g=
      - equal:
          path: data["express-session-secret"]
          value: cmVwbGFjZW1lbnQtc2Vzc2lvbg==
      - equal:
          path: data["token-hash-secret"]
          value: cmVwbGFjZW1lbnQtdG9rZW4taGFzaA==
