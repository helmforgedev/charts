suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: creates a dedicated service account without an API token by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-flowise
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: does not create a service account when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
