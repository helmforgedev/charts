suite: Deployment
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
  - templates/_helpers.tpl
tests:
  - it: renders standalone deployment with sqlite and local storage by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/flowiseai/flowise:3.1.3
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_TYPE
            value: sqlite
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STORAGE_TYPE
            value: local
      - contains:
          path: spec.template.spec.containers[0].args
          content: sleep 3; flowise start
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_PATH
            value: /home/node/.flowise/logs

  - it: wires a custom listener port to the process and container
    template: templates/deployment.yaml
    set:
      flowise.containerPort: 3100
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3100
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "3100"

  - it: supports configurable startup delay for the main deployment
    template: templates/deployment.yaml
    set:
      flowise.startupDelaySeconds: 12
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: sleep 12; flowise start

  - it: renders queue mode with redis and postgresql settings on the main deployment
    template: templates/deployment.yaml
    set:
      architecture.mode: queue
      flowise.replicaCount: 2
      persistence.enabled: false
      storage.type: s3
      storage.s3.bucketName: flowise
      storage.s3.accessKeyId: minio
      storage.s3.secretAccessKey: secret123
      postgresql.enabled: true
      redis.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODE
            value: queue
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_TYPE
            value: postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: RELEASE-NAME-redis-client
