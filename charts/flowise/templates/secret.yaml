{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "flowise.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dig "data" (dict) ($existing | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowise.labels" . | nindent 4 }}
  {{- include "flowise.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  encryption-key: {{ if .Values.auth.encryptionKey }}{{ .Values.auth.encryptionKey | b64enc | quote }}{{ else }}{{ get $data "encryption-key" | default (randAlphaNum 64 | b64enc) | quote }}{{ end }}
  jwt-auth-token-secret: {{ if .Values.auth.jwtAuthTokenSecret }}{{ .Values.auth.jwtAuthTokenSecret | b64enc | quote }}{{ else }}{{ get $data "jwt-auth-token-secret" | default (randAlphaNum 64 | b64enc) | quote }}{{ end }}
  jwt-refresh-token-secret: {{ if .Values.auth.jwtRefreshTokenSecret }}{{ .Values.auth.jwtRefreshTokenSecret | b64enc | quote }}{{ else }}{{ get $data "jwt-refresh-token-secret" | default (randAlphaNum 64 | b64enc) | quote }}{{ end }}
  express-session-secret: {{ if .Values.auth.expressSessionSecret }}{{ .Values.auth.expressSessionSecret | b64enc | quote }}{{ else }}{{ get $data "express-session-secret" | default (randAlphaNum 64 | b64enc) | quote }}{{ end }}
  token-hash-secret: {{ if .Values.auth.tokenHashSecret }}{{ .Values.auth.tokenHashSecret | b64enc | quote }}{{ else }}{{ get $data "token-hash-secret" | default (randAlphaNum 64 | b64enc) | quote }}{{ end }}
---
{{- end }}
{{- if and (eq (include "flowise.databaseMode" .) "external") (not .Values.database.external.existingSecret) .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowise.databaseSecretName" . }}
  labels:
    {{- include "flowise.labels" . | nindent 4 }}
  {{- include "flowise.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  database-password: {{ .Values.database.external.password | b64enc | quote }}
---
{{- end }}
{{- if and (eq (include "flowise.redisMode" .) "external") (not .Values.redis.external.existingSecret) .Values.redis.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowise.redisSecretName" . }}
  labels:
    {{- include "flowise.labels" . | nindent 4 }}
  {{- include "flowise.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  redis-password: {{ .Values.redis.external.password | b64enc | quote }}
---
{{- end }}
{{- if and (eq .Values.storage.type "s3") (not .Values.storage.s3.existingSecret) .Values.storage.s3.accessKeyId .Values.storage.s3.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowise.storageSecretName" . }}
  labels:
    {{- include "flowise.labels" . | nindent 4 }}
  {{- include "flowise.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  access-key: {{ .Values.storage.s3.accessKeyId | b64enc | quote }}
  secret-key: {{ .Values.storage.s3.secretAccessKey | b64enc | quote }}
---
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsFromPodIdentity) (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowise.fullname" . }}-backup
  labels:
    {{- include "flowise.labels" . | nindent 4 }}
  {{- include "flowise.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
data:
  access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
{{- end }}
