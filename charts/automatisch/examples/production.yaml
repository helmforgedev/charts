# SPDX-License-Identifier: Apache-2.0
automatisch:
  webAppUrl: https://automatisch.example.com
  containerPorts:
    http: 3000

worker:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: automatisch.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - automatisch.example.com
      secretName: automatisch-tls

networkPolicy:
  enabled: true
