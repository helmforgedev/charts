{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatisch.fullname" . }}-worker
  labels:
    {{- include "automatisch.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "automatisch.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatisch.workerSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "automatisch.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-datastores
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ include "automatisch.dbHost" . }} {{ include "automatisch.dbPort" . }}; do
                echo "Database not ready, retrying in 2s..."
                sleep 2
              done
              until nc -z -w2 {{ include "automatisch.redisHost" . }} {{ include "automatisch.redisPort" . }}; do
                echo "Redis not ready, retrying in 2s..."
                sleep 2
              done
      containers:
        - name: worker
          image: {{ include "automatisch.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WORKER
              value: "true"
            - name: HOST
              value: {{ .Values.automatisch.host | quote }}
            - name: APP_ENV
              value: {{ .Values.automatisch.appEnv | quote }}
            - name: WEB_APP_URL
              value: {{ .Values.automatisch.webAppUrl | quote }}
            - name: POSTGRES_HOST
              value: {{ include "automatisch.dbHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ include "automatisch.dbPort" . | quote }}
            - name: POSTGRES_DATABASE
              value: {{ include "automatisch.dbName" . | quote }}
            - name: POSTGRES_USERNAME
              value: {{ include "automatisch.dbUsername" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "automatisch.dbSecretName" . }}
                  key: {{ include "automatisch.dbSecretPasswordKey" . }}
            - name: REDIS_HOST
              value: {{ include "automatisch.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "automatisch.redisPort" . | quote }}
            {{- if or (and .Values.redis.enabled .Values.redis.auth.enabled) .Values.redis_config.external.existingSecret .Values.redis_config.external.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "automatisch.redisSecretName" . }}
                  key: {{ include "automatisch.redisSecretPasswordKey" . }}
            {{- end }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "automatisch.appSecretName" . }}
                  key: encryption-key
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "automatisch.appSecretName" . }}
                  key: app-secret-key
            - name: WEBHOOK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "automatisch.appSecretName" . }}
                  key: webhook-secret-key
            {{- with .Values.automatisch.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /automatisch/packages/backend/logs
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
