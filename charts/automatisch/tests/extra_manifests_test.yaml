# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should render no resources by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render supplied resources
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-extra
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-extra
