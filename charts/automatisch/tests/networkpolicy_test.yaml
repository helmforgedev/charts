# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: test
  namespace: default
tests:
  - it: should restrict inbound traffic to HTTP by default
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: automatisch
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http
      - equal:
          path: spec.egress[0]
          value: {}

  - it: should not render when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should append custom ingress rules
    set:
      networkPolicy.ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  team: automation
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels.team
          value: automation
