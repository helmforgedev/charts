# SPDX-License-Identifier: Apache-2.0
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a dedicated ServiceAccount without token automount
    set:
      serviceAccount.create: true
      serviceAccount.annotations.example: value
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-automatisch
      - equal:
          path: metadata.annotations.example
          value: value
      - equal:
          path: automountServiceAccountToken
          value: false
