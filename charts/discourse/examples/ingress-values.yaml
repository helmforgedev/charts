# SPDX-License-Identifier: Apache-2.0
discourse:
  hostname: forum.example.com

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: forum.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: forum-tls
      hosts:
        - forum.example.com
