{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "discourse.serviceAccountName" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
  {{- with include "discourse.annotations" (dict "root" . "specific" .Values.serviceAccount.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
