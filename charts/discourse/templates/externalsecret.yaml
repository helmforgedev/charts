{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- $names := dict }}
{{- range $index, $item := .Values.externalSecrets.items | default list }}
{{- $name := include "discourse.externalSecretName" (dict "root" $ "item" $item "index" $index) }}
{{- if hasKey $names $name }}
{{- fail (printf "externalSecrets.items render duplicate ExternalSecret name %q; set name or fullnameOverride to a unique value" $name) }}
{{- end }}
{{- $_ := set $names $name true }}
{{- $spec := deepCopy ($item.spec | default dict) }}
{{- if and $.Values.externalSecrets.refreshInterval (not (hasKey $spec "refreshInterval")) }}
{{- $_ := set $spec "refreshInterval" $.Values.externalSecrets.refreshInterval }}
{{- end }}
{{- $target := deepCopy (get $spec "target" | default dict) }}
{{- if not (get $target "name") }}
{{- $_ := set $target "name" $name }}
{{- $_ := set $spec "target" $target }}
{{- end }}
{{- if and (not $.Values.discourse.existingSecret) (eq (get $target "name") (include "discourse.secretName" $)) }}
{{- fail "externalSecrets.items[] target name equals the chart-managed Secret; set discourse.existingSecret or a different target name/name/fullnameOverride" }}
{{- end }}
{{- $hasStoreRef := false }}
{{- if dig "secretStoreRef" "name" "" $spec }}{{- $hasStoreRef = true }}{{- end }}
{{- range ($spec.data | default list) }}
{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}
{{- end }}
{{- range ($spec.dataFrom | default list) }}
{{- if or (dig "sourceRef" "storeRef" "name" "" .) (dig "sourceRef" "generatorRef" "name" "" .) }}{{- $hasStoreRef = true }}{{- end }}
{{- end }}
{{- if not $hasStoreRef }}
{{- fail "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "discourse.labels" $ | nindent 4 }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
