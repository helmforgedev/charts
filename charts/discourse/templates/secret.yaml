{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.discourse.existingSecret }}
{{- $secretName := include "discourse.secretName" . -}}
{{- $secretKeyBase := .Values.discourse.secretKeyBase -}}
{{- if not $secretKeyBase -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
  {{- if and $existing (hasKey $existing.data "secret-key-base") -}}
    {{- $secretKeyBase = index $existing.data "secret-key-base" | b64dec -}}
  {{- else -}}
    {{- $secretKeyBase = printf "%s%s" (randAlphaNum 64 | sha256sum) (randAlphaNum 64 | sha256sum) -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key-base: {{ $secretKeyBase | quote }}
{{- end }}
{{- if and (eq .Values.database.mode "external") (not .Values.database.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discourse.databaseSecretName" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ required "database.external.password is required without database.external.existingSecret" .Values.database.external.password | quote }}
{{- end }}
{{- if and (not .Values.redis.enabled) .Values.redis.external.password (not .Values.redis.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discourse.redisSecretName" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.redis.external.password | quote }}
{{- end }}
