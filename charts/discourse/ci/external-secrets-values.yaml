# SPDX-License-Identifier: Apache-2.0
discourse:
  extraEnv:
    - name: HELMFORGE_ESO_TOKEN
      valueFrom:
        secretKeyRef:
          name: discourse-eso
          key: token

externalSecrets:
  enabled: true
  items:
    - fullnameOverride: discourse-eso
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          name: discourse-eso
          creationPolicy: Owner
        data:
          - secretKey: token
            remoteRef:
              key: test/token
