# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: discourse
description: Experimental Discourse community platform deployment using the official upstream ESR image
type: application
version: 1.0.1
appVersion: "2026.7.4"
kubeVersion: ">=1.26.0-0"
icon: https://helmforge.dev/icons/charts/discourse.png
home: https://helmforge.dev
keywords:
  - discourse
  - forum
  - community
  - discussion
  - kubernetes
maintainers:
  - name: helmforgedev
  - name: mberlofa
sources:
  - https://github.com/helmforgedev/charts
  - https://github.com/discourse/discourse
  - https://github.com/discourse/discourse_docker
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bump HelmForge subchart dependencies to latest minor/patch (#1961)"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
    - name: Maicon Berlofa
      email: maicon.berloffa@gmail.com
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Official Website
      url: https://www.discourse.org
    - name: Documentation
      url: https://helmforge.dev/docs/charts/discourse
    - name: Source
      url: https://github.com/helmforgedev/charts/tree/main/charts/discourse
    - name: support
      url: https://github.com/helmforgedev/charts/issues
  helmforge.dev/maturity: beta
  helmforge.dev/signed: gpg+cosign
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/helmforge/postgresql
    - url: https://artifacthub.io/packages/helm/helmforge/redis
dependencies:
  - name: postgresql
    version: 2.2.0
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 3.2.0
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
