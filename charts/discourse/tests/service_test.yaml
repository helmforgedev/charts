# SPDX-License-Identifier: Apache-2.0
suite: Discourse service
templates:
  - templates/service.yaml
tests:
  - it: keeps the public service port independent from the upstream listener
    set:
      service.port: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
