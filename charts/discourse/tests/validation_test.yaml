# SPDX-License-Identifier: Apache-2.0
suite: Discourse validation
templates:
  - templates/validate.yaml
tests:
  - it: rejects multiple replicas
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "discourse: replicaCount must remain 1 while the official Kubernetes runtime is experimental"
  - it: rejects a missing immutable image digest
    set:
      image.digest: ""
    asserts:
      - failedTemplate:
          errorMessage: "discourse: image.digest is required because upstream rebuilds version tags"
