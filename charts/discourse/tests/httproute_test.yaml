# SPDX-License-Identifier: Apache-2.0
suite: Discourse Gateway API route
templates:
  - templates/httproute.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders an HTTPRoute with a parent and service port
    set:
      gatewayAPI.enabled: true
      gatewayAPI.parentRefs[0].name: public
      gatewayAPI.hostnames[0]: discourse.example.com
      service.port: 8080
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: public
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
