# SPDX-License-Identifier: Apache-2.0
suite: Discourse disruption budget
templates:
  - templates/poddisruptionbudget.yaml
tests:
  - it: is disabled by default for the singleton runtime
    asserts:
      - hasDocuments:
          count: 0
  - it: permits the singleton to be disrupted when explicitly enabled
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
