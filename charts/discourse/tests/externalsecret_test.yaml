# SPDX-License-Identifier: Apache-2.0
suite: Discourse External Secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: defaults target name and injects refresh interval
    values:
      - fixtures/external-secret-default.yaml
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-discourse-application
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-discourse-application
      - equal:
          path: spec.refreshInterval
          value: 1h
  - it: honors a literal fullname and item refresh interval
    values:
      - fixtures/external-secret-literal.yaml
    asserts:
      - equal:
          path: metadata.name
          value: discourse-credentials
      - equal:
          path: spec.target.name
          value: discourse-credentials
      - equal:
          path: spec.refreshInterval
          value: 5m
  - it: renders multiple items
    values:
      - fixtures/external-secret-multiple.yaml
    asserts:
      - hasDocuments:
          count: 2
  - it: rejects a missing store reference
    set:
      externalSecrets.enabled: true
      externalSecrets.items[0].name: broken
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true"
