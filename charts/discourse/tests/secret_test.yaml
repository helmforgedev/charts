# SPDX-License-Identifier: Apache-2.0
suite: Discourse secrets
templates:
  - templates/secret.yaml
tests:
  - it: creates the application secret by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-discourse-app
      - isNotEmpty:
          path: stringData.secret-key-base
      - matchRegex:
          path: stringData.secret-key-base
          pattern: ^[a-f0-9]{128}$
  - it: omits the application secret when an existing secret is configured
    set:
      discourse.existingSecret: discourse-credentials
    asserts:
      - hasDocuments:
          count: 0
