# SPDX-License-Identifier: Apache-2.0
suite: common annotations test
templates:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: should apply commonAnnotations to deployment, service, configmap, and secret
    set:
      commonAnnotations:
        custom.domain/tier: frontend
        helmforge.dev/test: "true"
    asserts:
      - equal:
          path: metadata.annotations["custom.domain/tier"]
          value: frontend
        template: deployment.yaml
      - equal:
          path: metadata.annotations["helmforge.dev/test"]
          value: "true"
        template: deployment.yaml
      - equal:
          path: metadata.annotations["custom.domain/tier"]
          value: frontend
        template: service.yaml
      - equal:
          path: metadata.annotations["custom.domain/tier"]
          value: frontend
        template: configmap.yaml
      - equal:
          path: metadata.annotations["custom.domain/tier"]
          value: frontend
        template: secret.yaml
