# SPDX-License-Identifier: Apache-2.0
suite: Reactive Resume admission network contract
templates:
  - templates/networkpolicy.yaml
tests:
  - it: allows public traffic and helper control without allowing native enrollment ingress
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value: [{protocol: TCP, port: 3000}]
      - equal:
          path: spec.ingress[1].ports
          value: [{protocol: TCP, port: 3011}]
      - lengthEqual:
          path: spec.ingress
          count: 2
  - it: permits helper probes to both fixed ports so egress cannot manufacture a denial
    documentIndex: 1
    asserts:
      - equal:
          path: spec.egress[0].ports
          value: [{protocol: TCP, port: 3010}, {protocol: TCP, port: 3011}]
      - lengthEqual:
          path: spec.egress
          count: 1
