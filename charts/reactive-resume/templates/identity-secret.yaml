{{- if not .Values.identity.existingSecret }}
{{- $name := include "reactive-resume.identitySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "reactive-resume.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "AUTH_SECRET" "ENCRYPTION_SECRET" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
{{- end }}
