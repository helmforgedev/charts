# SPDX-License-Identifier: Apache-2.0
fullnameOverride: reactive-resume-oauth
server:
  publicUrl: https://resume.example.test
oauth:
  enabled: true
  clientId: resume-fixture
  existingSecret: fixture-oauth-client
  authorizationUrl: https://fixture-oauth:8443/authorize
  tokenUrl: https://fixture-oauth:8443/token
  userInfoUrl: https://fixture-oauth:8443/userinfo
  caSecret: fixture-oauth-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-oauth
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app: fixture-smtp
      ports:
        - protocol: TCP
          port: 2465
smtp:
  enabled: true
  host: fixture-integrations
  port: 2465
  from: HelmForge <noreply@example.test>
  username: fixture-user
  existingSecret: fixture-smtp
  tls:
    caSecret: fixture-integrations-tls
