# SPDX-License-Identifier: Apache-2.0
fullnameOverride: reactive-resume-ingress
server:
  publicUrl: https://resume.example.test
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: resume.example.test
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: resume-tls
      hosts:
        - resume.example.test
