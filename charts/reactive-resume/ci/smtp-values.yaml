# SPDX-License-Identifier: Apache-2.0
fullnameOverride: reactive-resume-smtp
server:
  publicUrl: https://resume.example.test
persistence:
  size: 1Gi
smtp:
  enabled: true
  host: fixture-integrations
  port: 2465
  from: HelmForge <noreply@example.test>
  username: fixture-user
  existingSecret: fixture-smtp
  tls:
    caSecret: fixture-integrations-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-smtp
      ports:
        - protocol: TCP
          port: 2465
postgresql:
  standalone:
    persistence:
      size: 2Gi
