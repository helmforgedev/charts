apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture-oauth-server
data:
  server.mjs: >
    import fs from 'node:fs';import http from 'node:http';import https from 'node:https';import {randomBytes,createHash}
    from 'node:crypto';

    const codes=new Map(),tokens=new Map();let subject='hf-admin';

    const
    json=(res,status,data)=>{res.writeHead(status,{'Content-Type':'application/json'});res.end(JSON.stringify(data));};

    const random=()=>randomBytes(32).toString('base64url');

    http.createServer((req,res)=>{const url=new
    URL(req.url,'http://localhost');if(url.pathname!=='/subject'||!['hf-admin','hf-new','hf-other'].includes(url.searchParams.get('sub')))return
    json(res,400,{});subject=url.searchParams.get('sub');json(res,200,{selected:true});}).listen(8081,'127.0.0.1');

    https.createServer({key:fs.readFileSync('/tls/tls.key'),cert:fs.readFileSync('/tls/tls.crt')},async(req,res)=>{
     const url=new URL(req.url,'https://fixture-oauth:8443');
     if(url.pathname==='/health')return json(res,200,{ready:true});
     if(url.pathname==='/authorize'){
      const p=url.searchParams;
      if(p.get('client_id')!=='resume-fixture'||p.get('redirect_uri')!=='https://resume.example.test/api/auth/callback/custom'||p.get('response_type')!=='code'||p.get('code_challenge_method')!=='S256'||!p.get('code_challenge')||!p.get('state'))return json(res,400,{error:'invalid_request'});
      const code=random();codes.set(code,{subject,redirect:p.get('redirect_uri'),challenge:p.get('code_challenge')});const redirect=new URL(p.get('redirect_uri'));redirect.searchParams.set('code',code);redirect.searchParams.set('state',p.get('state'));res.writeHead(302,{Location:redirect.href});return res.end();
     }
     if(url.pathname==='/token'&&req.method==='POST'){
      const chunks=[];for await(const chunk of req)chunks.push(chunk);const p=new URLSearchParams(Buffer.concat(chunks).toString());
      const expected='Basic '+Buffer.from('resume-fixture:fixture-only-oauth-client-secret').toString('base64');
      if(req.headers.authorization!==expected&&!(p.get('client_id')==='resume-fixture'&&p.get('client_secret')==='fixture-only-oauth-client-secret'))return json(res,401,{error:'invalid_client'});
      const record=codes.get(p.get('code'));codes.delete(p.get('code'));
      if(!record||p.get('grant_type')!=='authorization_code'||p.get('redirect_uri')!==record.redirect||createHash('sha256').update(p.get('code_verifier')??'').digest('base64url')!==record.challenge)return json(res,400,{error:'invalid_grant'});
      const token=random();tokens.set(token,record.subject);return json(res,200,{access_token:token,token_type:'Bearer',expires_in:300});
     }
     if(url.pathname==='/userinfo'){
      const sub=tokens.get(req.headers.authorization?.replace(/^Bearer /,''));if(!sub)return json(res,401,{error:'invalid_token'});
      return json(res,200,{id:sub,sub,name:'Fixture Identity',email:sub==='hf-admin'?'owner@example.test':'new@example.test',emailVerified:true,email_verified:true});
     }
     json(res,404,{});
    }).listen(8443,'0.0.0.0');
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-oauth
spec:
  selector:
    app: fixture-oauth
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-oauth
  labels:
    app: fixture-oauth
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-oauth
  template:
    metadata:
      labels:
        app: fixture-oauth
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: docker.io/library/node:24.21.0-alpine3.23
          command:
            - node
            - /server/server.mjs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 3
          volumeMounts:
            - name: server
              mountPath: /server
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: fixture-oauth-server
        - name: tls
          secret:
            secretName: fixture-oauth-tls
            defaultMode: 288
---
apiVersion: v1
kind: Secret
metadata:
  name: fixture-oauth-client
type: Opaque
stringData:
  client-secret: fixture-only-oauth-client-secret

