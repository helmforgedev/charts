kind: Secret
metadata:
  name: fixture-smtp
  labels:
    app: fixture-smtp
    helmforge.dev/runtime-fixture: 'true'
type: Opaque
stringData:
  password: OwnedSmtpFixture-2026
  auth: fixture-user:OwnedSmtpFixture-2026
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-integrations
  labels:
    app: fixture-smtp
    helmforge.dev/runtime-fixture: 'true'
spec:
  selector:
    app: fixture-smtp
  ports:
    - name: smtp
      port: 2465
      targetPort: 2465
    - name: api
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-smtp
  labels:
    app: fixture-smtp
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-smtp
  template:
    metadata:
      labels:
        app: fixture-smtp
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.31.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MP_DATABASE
              value: /tmp/mailpit.db
            - name: MP_DISABLE_VERSION_CHECK
              value: 'true'
            - name: MP_SMTP_BIND_ADDR
              value: '[::]:2465'
            - name: MP_UI_BIND_ADDR
              value: '[::]:8025'
            - name: MP_SMTP_REQUIRE_TLS
              value: 'true'
            - name: MP_SMTP_TLS_CERT
              value: /tls/tls.crt
            - name: MP_SMTP_TLS_KEY
              value: /tls/tls.key
            - name: MP_SMTP_AUTH
              valueFrom:
                secretKeyRef:
                  name: fixture-smtp
                  key: auth
          ports:
            - name: smtp
              containerPort: 2465
            - name: api
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: smtp
          livenessProbe:
            tcpSocket:
              port: api
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: fixture-integrations-tls
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-smtp
  labels:
    app: fixture-smtp
    helmforge.dev/runtime-fixture: 'true'
spec:
  podSelector:
    matchLabels:
      app: fixture-smtp
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: reactive-resume
      ports:
        - protocol: TCP
          port: 2465
