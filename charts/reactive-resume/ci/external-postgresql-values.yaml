# SPDX-License-Identifier: Apache-2.0
fullnameOverride: reactive-resume-external
postgresql:
  enabled: false
database:
  host: fixture-postgresql
  name: reactive_resume
  username: reactive_resume
  passwordSecret: fixture-postgresql-auth
  passwordKey: user-password
  tls:
    enabled: true
    caSecret: fixture-postgresql-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: fixture-postgresql
      ports:
        - {protocol: TCP, port: 5432}
