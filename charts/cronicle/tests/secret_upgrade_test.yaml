# SPDX-License-Identifier: Apache-2.0
suite: Managed Secret upgrade retention
templates:
  - secret.yaml
release:
  name: test
  namespace: default
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-cronicle
        namespace: default
      data:
        secret_key: cmV0YWluZWQtc2VjcmV0
tests:
  - it: should retain the generated session secret
    asserts:
      - equal:
          path: data.secret_key
          value: cmV0YWluZWQtc2VjcmV0

  - it: should prefer an explicit session secret
    set:
      secret.value: replacement-secret
    asserts:
      - equal:
          path: data.secret_key
          value: cmVwbGFjZW1lbnQtc2VjcmV0
