apiVersion: v1
kind: Service
metadata:
  name: {{ include "cronicle.fullname" . }}
  labels:
    {{- include "cronicle.labels" . | nindent 4 }}
  {{- include "cronicle.renderAnnotations" (dict "root" . "specific" .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.cronicle.discoveryEnabled }}
    - name: discovery
      port: {{ .Values.cronicle.discoveryPort }}
      targetPort: discovery
      protocol: UDP
    {{- end }}
  selector:
    {{- include "cronicle.selectorLabels" . | nindent 4 }}
