{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "cronicle.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingValue := dig "data" "secret_key" "" ($existing | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cronicle.labels" . | nindent 4 }}
  {{- include "cronicle.renderAnnotations" (dict "root" . "specific" (dict "helm.sh/resource-policy" "keep")) | nindent 2 }}
type: Opaque
data:
  {{- if .Values.secret.value }}
  secret_key: {{ .Values.secret.value | b64enc | quote }}
  {{- else if $existingValue }}
  secret_key: {{ $existingValue | quote }}
  {{- else }}
  secret_key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
