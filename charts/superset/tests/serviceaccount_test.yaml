# SPDX-License-Identifier: Apache-2.0
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: test
  namespace: default
tests:
  - it: should create a dedicated ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-superset
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should not create a ServiceAccount when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should honor the configured name and annotations
    set:
      serviceAccount.name: existing-superset
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.name
          value: existing-superset
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
