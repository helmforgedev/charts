# SPDX-License-Identifier: Apache-2.0
suite: Init Job
templates:
  - templates/init-job.yaml
  - templates/secret.yaml
  - templates/configmap.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render a Job
    template: templates/init-job.yaml
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: metadata.name
          pattern: ^test-superset-init-\d+$

  - it: should be a managed Job, not a helm hook
    template: templates/init-job.yaml
    asserts:
      # Runs concurrently with the workloads (which wait on it via a wait-for-init
      # initContainer). As a post-install hook it ran too late and the web/worker/
      # beat pods deadlocked racing Flask-AppBuilder schema init.
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: should not render when disabled
    template: templates/init-job.yaml
    set:
      init.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct admin username
    template: templates/init-job.yaml
    set:
      superset.adminUsername: myadmin
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--username \"myadmin\""

  - it: should install additional Python packages in init
    template: templates/init-job.yaml
    set:
      superset.extraPythonPackages:
        - clickhouse-connect==0.13.0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "uv pip install.*psycopg2-binary redis clickhouse-connect==0\\.13\\.0.*--quiet"

  - it: should skip runtime package installation for an immutable custom image
    template: templates/init-job.yaml
    set:
      superset.installPythonPackages: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "uv pip install"

  - it: should have init containers for dependencies
    template: templates/init-job.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2

  - it: should surface admin creation failures
    template: templates/init-job.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "create-admin(?s:.*)\\|\\| true"

  - it: should harden the init Job without an API token
    template: templates/init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: runtime-tmp
            mountPath: /tmp
