# SPDX-License-Identifier: Apache-2.0
suite: Extra manifests
templates:
  - templates/extra-manifests.yaml
tests:
  - it: should render no documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render operator-provided resources
    set:
      extraManifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: superset-extra
          data:
            owner: platform
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: superset-extra
