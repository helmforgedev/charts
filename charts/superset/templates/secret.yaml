{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if not .Values.superset.existingSecret }}
{{- $secretName := include "superset.fullname" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.superset.adminPassword }}
  admin-password: {{ .Values.superset.adminPassword | b64enc | quote }}
  {{- else if and $existingSecret (hasKey $existingSecret.data "admin-password") }}
  admin-password: {{ index $existingSecret.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.superset.secretKey }}
  secret-key: {{ .Values.superset.secretKey | b64enc | quote }}
  {{- else if and $existingSecret (hasKey $existingSecret.data "secret-key") }}
  secret-key: {{ index $existingSecret.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 42 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (eq .Values.database.mode "external") (not .Values.database.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database" (include "superset.fullname" .) }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
type: Opaque
data:
  database-password: {{ .Values.database.external.password | b64enc | quote }}
{{- end }}
---
{{- if and (eq .Values.redisConfig.mode "external") (not .Values.redisConfig.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redis-ext" (include "superset.fullname" .) }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.redisConfig.external.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup" (include "superset.fullname" .) }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
