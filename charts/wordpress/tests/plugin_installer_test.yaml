# SPDX-License-Identifier: Apache-2.0
suite: Plugin Installer
templates:
  - templates/plugin-installer-job.yaml
release:
  name: test
  namespace: default
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a post-install and post-upgrade hook job
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      serviceAccount.name: existing-wordpress
      imagePullSecrets:
        - name: registry-auth
      plugins.items:
        - slug: classic-editor
          activate: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: test-wordpress-plugins
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-wordpress
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-auth
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "install_plugin \"classic-editor\""

  - it: should install a verified public custom plugin ZIP
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          activate: true
          skipIfInstalled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'install_custom_plugin "company-plugin" "\$HELMFORGE_PLUGIN_URL_0" "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" "true" "true" ""'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMFORGE_PLUGIN_URL_0
            value: https://artifacts.example.com/company-plugin.zip
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMFORGE_PLUGIN_TOKEN_0

  - it: should preserve shell metacharacters in custom plugin URLs
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: 'https://artifacts.example.com/$release/$(printf-injected)/`printf-backtick`.zip'
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMFORGE_PLUGIN_URL_0
            value: 'https://artifacts.example.com/$release/$(printf-injected)/`printf-backtick`.zip'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'install_custom_plugin "company-plugin" "\$HELMFORGE_PLUGIN_URL_0"'

  - it: should reference an authentication token from an existing Secret
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          authentication:
            existingSecret: wordpress-plugin-download
            tokenKey: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMFORGE_PLUGIN_TOKEN_0
            valueFrom:
              secretKeyRef:
                name: wordpress-plugin-download
                key: token
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'install_custom_plugin "company-plugin" .* "HELMFORGE_PLUGIN_TOKEN_0"'

  - it: should require a checksum for every custom plugin
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
    asserts:
      - failedTemplate:
          errorMessage: "plugins.custom[0].sha256 is required and must be a 64-character SHA-256 digest"

  - it: should reject insecure custom plugin URLs by default
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: http://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - failedTemplate:
          errorMessage: "plugins.custom[0].url must use https:// unless allowInsecureHttp=true"

  - it: should reject inline custom plugin credentials
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          authentication:
            token: inline-secret
    asserts:
      - failedTemplate:
          errorMessage: "plugins.custom[0].authentication accepts only existingSecret and tokenKey; inline credentials are forbidden"

  - it: should require a complete existing Secret reference
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          authentication:
            existingSecret: wordpress-plugin-download
    asserts:
      - failedTemplate:
          errorMessage: "plugins.custom[0].authentication requires existingSecret and tokenKey"

  - it: should reject authenticated downloads over explicitly allowed HTTP
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: http://plugin-fixture/plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          allowInsecureHttp: true
          authentication:
            existingSecret: wordpress-plugin-download
            tokenKey: token
    asserts:
      - failedTemplate:
          errorMessage: "plugins.custom[0].authentication requires an https:// URL"

  - it: should render explicit runtime failures for custom archives
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.custom:
        - name: company-plugin
          url: https://artifacts.example.com/company-plugin.zip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "Checksum mismatch for custom plugin"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "Invalid archive layout for custom plugin"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "Activation failed for custom plugin"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "Download failed for custom plugin"

  - it: should add Redis Object Cache plugin and drop-in command
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      objectCache.enabled: true
      objectCache.redis.subchart.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "install_plugin \"redis-cache\""
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "object-cache.php"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WP_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-redis-auth
                key: redis-password

  - it: should install Memcached cache plugin with a custom image
    set:
      image.repository: example.com/custom-wordpress
      plugins.installer.image.repository: example.com/custom-wordpress-cli
      plugins.enabled: true
      plugins.installer.enabled: true
      objectCache.enabled: true
      objectCache.provider: memcached
      objectCache.memcached.subchart.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "PHP extension memcached is required"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "install_plugin \"w3-total-cache\""
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "Creating Memcached object-cache.php drop-in"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "wp total-cache fix_environment"

  - it: should allow explicitly acknowledged Memcached with the official image
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      objectCache.enabled: true
      objectCache.provider: memcached
      objectCache.memcached.subchart.enabled: true
      objectCache.memcached.allowOfficialImageWithoutExtension: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "install_plugin \"w3-total-cache\""

  - it: should use Redis subchart existingSecret in installer job
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      objectCache.enabled: true
      objectCache.redis.subchart.enabled: true
      redis.auth.existingSecret: wordpress-redis-auth
      redis.auth.existingSecretPasswordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WP_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: wordpress-redis-auth
                key: redis-password

  - it: should not set Redis password in installer when subchart auth is disabled
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      objectCache.enabled: true
      objectCache.redis.subchart.enabled: true
      redis.auth.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WP_REDIS_PASSWORD

  - it: should reject non-official plugin sources
    set:
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.items:
        - slug: custom-plugin
          source: https://example.com/custom-plugin.zip
    asserts:
      - failedTemplate:
          errorMessage: "plugins.items[].source is not supported; use official WordPress.org plugin slugs only"

  - it: should require plugins when object cache is enabled
    set:
      objectCache.enabled: true
      objectCache.redis.subchart.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "plugins.enabled must be true when objectCache.enabled is true"

  - it: should require installer when object cache manages plugins or drop-ins
    set:
      plugins.enabled: true
      objectCache.enabled: true
      objectCache.redis.subchart.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "plugins.installer.enabled must be true when objectCache.installPlugin or objectCache.enableDropIn is true"

  - it: should require persistence for installer job writes
    set:
      persistence.enabled: false
      plugins.enabled: true
      plugins.installer.enabled: true
      plugins.items:
        - slug: classic-editor
          activate: true
    asserts:
      - failedTemplate:
          errorMessage: "plugins.installer.enabled requires persistence.enabled=true so installed plugins are written to the WordPress volume"
