# SPDX-License-Identifier: Apache-2.0
suite: Availability
templates:
  - templates/hpa.yaml
  - templates/pdb.yaml
  - templates/wp-cronjob.yaml
release:
  name: test
  namespace: default
tests:
  - it: should render HPA when enabled
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu

  - it: should render PDB when enabled
    template: templates/pdb.yaml
    set:
      pdb.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should render wp-cron CronJob when enabled
    template: templates/wp-cronjob.yaml
    set:
      wpCron.cronJob.enabled: true
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.annotations
      - notExists:
          path: spec.jobTemplate.spec.template.spec.nodeSelector
      - notExists:
          path: spec.jobTemplate.spec.template.spec.affinity
      - notExists:
          path: spec.jobTemplate.spec.template.spec.tolerations

  - it: should configure scheduling only for wp-cron pods
    template: templates/wp-cronjob.yaml
    set:
      wpCron.cronJob.enabled: true
      wpCron.cronJob.nodeSelector:
        kubernetes.io/os: linux
      wpCron.cronJob.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      wpCron.cronJob.tolerations:
        - key: workload
          operator: Equal
          value: batch
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux
      - equal:
          path: spec.jobTemplate.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
          value:
            key: kubernetes.io/os
            operator: In
            values:
              - linux
      - equal:
          path: spec.jobTemplate.spec.template.spec.tolerations[0]
          value:
            key: workload
            operator: Equal
            value: batch
            effect: NoSchedule

  - it: should set wp-cron CronJob pod annotations
    template: templates/wp-cronjob.yaml
    set:
      wpCron.cronJob.enabled: true
      wpCron.cronJob.podAnnotations:
        linkerd.io/inject: disabled
        custom: value
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["linkerd.io/inject"]
          value: disabled
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations.custom
          value: value
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: wp-cron

  - it: should reject non-string wp-cron CronJob pod annotation values
    template: templates/wp-cronjob.yaml
    set:
      wpCron.cronJob.enabled: true
      wpCron.cronJob.podAnnotations:
        vault.hashicorp.com/agent-inject: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/wpCron/cronJob/podAnnotations/.*': got boolean, want string"
