# SPDX-License-Identifier: Apache-2.0
# Install WordPress.org and verified private plugin ZIPs through an idempotent Job

plugins:
  enabled: true
  installer:
    enabled: true
  items:
    - slug: classic-editor
      activate: true
      skipIfInstalled: true
    - slug: contact-form-7
      activate: true
      skipIfInstalled: true
  custom:
    - name: company-plugin
      url: https://artifacts.example.com/company-plugin.zip
      sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      activate: true
      skipIfInstalled: true
      authentication:
        existingSecret: wordpress-plugin-download
        tokenKey: token
