# Run WordPress cron through a Kubernetes CronJob

wordpress:
  disableWpCron: true

wpCron:
  cronJob:
    enabled: true
    schedule: "*/5 * * * *"
    nodeSelector:
      workload-tier: batch
    tolerations:
      - key: workload
        operator: Equal
        value: batch
        effect: NoSchedule
