apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-plugin-fixture
  labels:
    helmforge.dev/runtime-fixture: "true"
data:
  router.php: |
    <?php
    if ($_SERVER['REQUEST_URI'] === '/healthz') {
        http_response_code(200);
        echo "ok\n";
        return;
    }
    if ($_SERVER['REQUEST_URI'] !== '/company-plugin.zip') {
        http_response_code(404);
        return;
    }
    $counter = '/tmp/download-count';
    $count = file_exists($counter) ? (int) file_get_contents($counter) : 0;
    file_put_contents($counter, (string) ($count + 1));
    header('Content-Type: application/zip');
    readfile('/srv/company-plugin.zip');
binaryData:
  company-plugin.zip: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-plugin-fixture
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress-plugin-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-plugin-fixture
        helmforge.dev/runtime-fixture: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: docker.io/library/wordpress:cli-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
          imagePullPolicy: IfNotPresent
          command:
            - php
            - -S
            - 0.0.0.0:8080
            - -t
            - /srv
            - /srv/router.php
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: fixture
              mountPath: /srv
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: wordpress-plugin-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-plugin-fixture
  labels:
    helmforge.dev/runtime-fixture: "true"
spec:
  selector:
    app.kubernetes.io/name: wordpress-plugin-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
