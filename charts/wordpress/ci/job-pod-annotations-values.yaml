# SPDX-License-Identifier: Apache-2.0
# CI: Pod annotations on every Job and CronJob
wordpress:
  siteUrl: https://wordpress.example.com
  siteTitle: HelmForge WordPress
  adminUser: admin
  adminPassword: ci-admin-password
  adminEmail: admin@example.com
  disableWpCron: true

bootstrap:
  enabled: true
  podAnnotations:
    linkerd.io/inject: disabled

plugins:
  enabled: true
  installer:
    enabled: true
    podAnnotations:
      linkerd.io/inject: disabled
  items:
    - slug: classic-editor
      activate: true

wpCron:
  cronJob:
    enabled: true
    podAnnotations:
      linkerd.io/inject: disabled

backup:
  enabled: true
  podAnnotations:
    linkerd.io/inject: disabled
  s3:
    endpoint: https://s3.example.com
    bucket: wordpress-backups
    accessKey: test-key
    secretKey: test-secret

mysql:
  auth:
    password: ci-db-password
    rootPassword: ci-root-password
  primary:
    persistence:
      enabled: false

persistence:
  enabled: true
  size: 1Gi
