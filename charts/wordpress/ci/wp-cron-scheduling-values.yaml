# CI: wp-cron pod scheduling controls
wordpress:
  disableWpCron: true

wpCron:
  cronJob:
    enabled: true
    schedule: "*/1 * * * *"
    nodeSelector:
      kubernetes.io/os: linux
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
    tolerations:
      - key: workload
        operator: Equal
        value: batch
        effect: NoSchedule

mysql:
  primary:
    persistence:
      enabled: false

persistence:
  enabled: false
