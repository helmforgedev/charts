# SPDX-License-Identifier: Apache-2.0
{{- include "wordpress.validatePlugins" . }}
{{- if eq (include "wordpress.pluginsJobEnabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wordpress.fullname" . }}-plugins
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugin-installer
  {{- if .Values.plugins.installer.useHelmHooks }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.plugins.installer.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.plugins.installer.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.plugins.installer.activeDeadlineSeconds }}
  {{- with .Values.plugins.installer.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: plugin-installer
    spec:
      restartPolicy: Never
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "wordpress.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.plugins.installer.preferWordPressPodNode .Values.persistence.enabled }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "wordpress.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: wordpress
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: plugin-installer
          image: "{{ .Values.plugins.installer.image.repository }}:{{ .Values.plugins.installer.image.tag }}"
          imagePullPolicy: {{ .Values.plugins.installer.image.pullPolicy }}
          workingDir: /var/www/html
          {{- with .Values.plugins.installer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -ec
            - |
              wait_for_wordpress_files() {
                for i in $(seq 1 20); do
                  if [ -f /var/www/html/wp-config.php ] && [ -d /var/www/html/wp-content ]; then
                    return 0
                  fi
                  echo "Waiting for WordPress files on the shared volume..."
                  sleep 2
                done
                echo "WordPress files were not initialized in time." >&2
                return 1
              }

              is_installed() {
                wp core is-installed --path=/var/www/html >/dev/null 2>&1
              }

              plugin_dir_exists() {
                [ -n "$1" ] && [ -d "/var/www/html/wp-content/plugins/$1" ]
              }

              download_plugin() {
                slug="$1"
                source="https://downloads.wordpress.org/plugin/${slug}.latest-stable.zip"

                tmp="/tmp/${slug}.zip"
                mkdir -p /var/www/html/wp-content/plugins
                echo "Downloading plugin archive from $source"
                php -r 'copy($argv[1], $argv[2]) || exit(1);' "$source" "$tmp"

                if command -v unzip >/dev/null 2>&1; then
                  unzip -oq "$tmp" -d /var/www/html/wp-content/plugins
                else
                  php -r '$zip = new ZipArchive(); if ($zip->open($argv[1]) !== true) { exit(1); } $zip->extractTo($argv[2]); $zip->close();' "$tmp" /var/www/html/wp-content/plugins
                fi
              }

              install_plugin() {
                slug="$1"
                activate="$2"
                skip_if_installed="$3"

                if [ "$skip_if_installed" = "true" ] && { wp plugin is-installed "$slug" --path=/var/www/html --allow-root >/dev/null 2>&1 || plugin_dir_exists "$slug"; }; then
                  echo "Plugin $slug already installed."
                else
                  if is_installed; then
                    echo "Installing official WordPress.org plugin $slug"
                    wp plugin install "$slug" --path=/var/www/html --allow-root
                  else
                    echo "WordPress is not installed yet; installing plugin files for $slug without activation."
                    download_plugin "$slug"
                  fi
                fi

                if [ "$activate" = "true" ]; then
                  if is_installed; then
                    if wp plugin is-active "$slug" --path=/var/www/html --allow-root >/dev/null 2>&1; then
                      echo "Plugin $slug already active."
                    else
                      echo "Activating plugin $slug"
                      wp plugin activate "$slug" --path=/var/www/html --allow-root
                    fi
                  else
                    echo "WordPress is not installed yet; plugin activation for $slug will be retried on a later upgrade."
                  fi
                fi
              }

              download_custom_plugin() {
                name="$1"
                url="$2"
                expected_sha256="$3"
                token_env="$4"
                archive="$5"

                if [ -n "$token_env" ] && [ -z "$(printenv "$token_env")" ]; then
                  echo "Authentication Secret value is unavailable for custom plugin $name." >&2
                  return 1
                fi

                if ! php -r '
                  $url = $argv[1];
                  $destination = $argv[2];
                  $tokenEnvironment = $argv[3];
                  $headers = ["User-Agent: HelmForge WordPress plugin installer"];
                  if ($tokenEnvironment !== "") {
                    $token = getenv($tokenEnvironment);
                    if ($token === false || $token === "") exit(41);
                    $headers[] = "Authorization: Bearer " . $token;
                  }
                  $context = stream_context_create([
                    "http" => [
                      "method" => "GET",
                      "header" => implode("\r\n", $headers) . "\r\n",
                      "follow_location" => 0,
                      "ignore_errors" => true,
                      "timeout" => 30,
                    ],
                    "ssl" => ["verify_peer" => true, "verify_peer_name" => true],
                  ]);
                  $input = @fopen($url, "rb", false, $context);
                  if ($input === false) exit(42);
                  $status = $http_response_header[0] ?? "";
                  if (!preg_match("~^HTTP/\\S+\\s+2\\d\\d(?:\\s|$)~", $status)) exit(43);
                  $output = @fopen($destination, "wb");
                  if ($output === false) exit(44);
                  $copied = stream_copy_to_stream($input, $output);
                  fclose($input);
                  fclose($output);
                  if ($copied === false) exit(45);
                ' "$url" "$archive" "$token_env"; then
                  echo "Download failed for custom plugin $name." >&2
                  return 1
                fi

                actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
                if [ "$(printf '%s' "$actual_sha256" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$expected_sha256" | tr '[:upper:]' '[:lower:]')" ]; then
                  echo "Checksum mismatch for custom plugin $name." >&2
                  return 1
                fi
              }

              extract_custom_plugin() {
                name="$1"
                archive="$2"
                extract_dir="$3"

                if ! php -r '
                  $expectedDirectory = $argv[2];
                  $destination = $argv[3];
                  $zip = new ZipArchive();
                  if ($zip->open($argv[1]) !== true) exit(51);
                  if ($zip->numFiles < 1) exit(52);
                  for ($index = 0; $index < $zip->numFiles; $index++) {
                    $entry = $zip->getNameIndex($index);
                    if ($entry === false || $entry === "" || str_contains($entry, "\\") || str_starts_with($entry, "/")) exit(53);
                    $segments = explode("/", rtrim($entry, "/"));
                    if (in_array("..", $segments, true) || in_array(".", $segments, true)) exit(54);
                    if ($entry !== $expectedDirectory && $entry !== $expectedDirectory . "/" && !str_starts_with($entry, $expectedDirectory . "/")) exit(55);
                    $attributes = 0;
                    $operationsSystem = 0;
                    if ($zip->getExternalAttributesIndex($index, $operationsSystem, $attributes)) {
                      $fileType = ($attributes >> 16) & 0170000;
                      if ($fileType === 0120000) exit(56);
                    }
                  }
                  if (!$zip->extractTo($destination)) exit(57);
                  $zip->close();
                ' "$archive" "$name" "$extract_dir"; then
                  echo "Invalid archive layout for custom plugin $name." >&2
                  return 1
                fi
                if [ ! -d "$extract_dir/$name" ] || find "$extract_dir/$name" -type l | grep -q . || ! find "$extract_dir/$name" -maxdepth 1 -type f -name '*.php' | grep -q .; then
                  echo "Invalid archive layout for custom plugin $name." >&2
                  return 1
                fi
              }

              install_custom_plugin() {
                name="$1"
                url="$2"
                expected_sha256="$3"
                activate="$4"
                skip_if_installed="$5"
                token_env="$6"

                target_plugin="/var/www/html/wp-content/plugins/$name"
                backup_plugin="/var/www/html/wp-content/plugins/.helmforge-${name}-backup"
                if [ -d "$backup_plugin" ]; then
                  if [ -d "$target_plugin" ]; then
                    rm -rf "$backup_plugin"
                  else
                    echo "Restoring previous custom plugin $name after an interrupted replacement."
                    mv "$backup_plugin" "$target_plugin"
                  fi
                fi

                if [ "$skip_if_installed" = "true" ] && { wp plugin is-installed "$name" --path=/var/www/html --allow-root >/dev/null 2>&1 || plugin_dir_exists "$name"; }; then
                  echo "Custom plugin $name already installed; download skipped."
                else
                  work_dir="$(mktemp -d "/tmp/helmforge-${name}.XXXXXX")"
                  archive="$work_dir/plugin.zip"
                  extract_dir="$work_dir/extracted"
                  mkdir -p "$extract_dir" /var/www/html/wp-content/plugins

                  download_custom_plugin "$name" "$url" "$expected_sha256" "$token_env" "$archive" || {
                    rm -rf "$work_dir"
                    return 1
                  }
                  extract_custom_plugin "$name" "$archive" "$extract_dir" || {
                    rm -rf "$work_dir"
                    return 1
                  }

                  staged_plugin="/var/www/html/wp-content/plugins/.helmforge-${name}-stage"
                  rm -rf "$staged_plugin"
                  cp -a "$extract_dir/$name" "$staged_plugin"
                  if [ -d "$target_plugin" ]; then
                    mv "$target_plugin" "$backup_plugin"
                  fi
                  if ! mv "$staged_plugin" "$target_plugin"; then
                    echo "Custom plugin replacement failed for $name." >&2
                    rm -rf "$target_plugin"
                    if [ -d "$backup_plugin" ]; then
                      echo "Restoring previous custom plugin $name."
                      mv "$backup_plugin" "$target_plugin"
                    fi
                    rm -rf "$work_dir"
                    return 1
                  fi
                  rm -rf "$backup_plugin"
                  rm -rf "$work_dir"
                  echo "Installed verified custom plugin $name."
                fi

                if [ "$activate" = "true" ]; then
                  if is_installed; then
                    if wp plugin is-active "$name" --path=/var/www/html --allow-root >/dev/null 2>&1; then
                      echo "Custom plugin $name already active."
                    elif ! wp plugin activate "$name" --path=/var/www/html --allow-root; then
                      echo "Activation failed for custom plugin $name." >&2
                      return 1
                    fi
                  else
                    echo "WordPress is not installed yet; custom plugin activation for $name will be retried on a later upgrade."
                  fi
                fi
              }

              wait_for_wordpress_files

              {{ range .Values.plugins.items }}
              {{- $activate := true -}}
              {{- if hasKey . "activate" -}}{{- $activate = .activate -}}{{- end -}}
              {{- $skipIfInstalled := true -}}
              {{- if hasKey . "skipIfInstalled" -}}{{- $skipIfInstalled = .skipIfInstalled -}}{{- end -}}
              install_plugin {{ default "" .slug | quote }} {{ $activate | quote }} {{ $skipIfInstalled | quote }}
              {{- end }}
              {{ range $i, $plugin := .Values.plugins.custom }}
              {{- $activate := true -}}
              {{- if hasKey $plugin "activate" -}}{{- $activate = $plugin.activate -}}{{- end -}}
              {{- $skipIfInstalled := true -}}
              {{- if hasKey $plugin "skipIfInstalled" -}}{{- $skipIfInstalled = $plugin.skipIfInstalled -}}{{- end -}}
              {{- $tokenEnvironment := "" -}}
              {{- if $plugin.authentication -}}{{- $tokenEnvironment = printf "HELMFORGE_PLUGIN_TOKEN_%d" $i -}}{{- end -}}
              install_custom_plugin {{ $plugin.name | quote }} "$HELMFORGE_PLUGIN_URL_{{ $i }}" {{ $plugin.sha256 | quote }} {{ $activate | quote }} {{ $skipIfInstalled | quote }} {{ $tokenEnvironment | quote }}
              {{- end }}
              {{- if and .Values.objectCache.enabled .Values.objectCache.installPlugin }}
              {{- if eq (include "wordpress.objectCacheRedisEnabled" .) "true" }}
              install_plugin "redis-cache" "true" "true"
              {{- end }}
              {{- if eq (include "wordpress.objectCacheMemcachedEnabled" .) "true" }}
              if [ {{ .Values.objectCache.memcached.validatePhpExtension | quote }} = "true" ]; then
                if ! php -m | grep -Eiq '^{{ .Values.objectCache.memcached.requiredPhpExtension }}$'; then
                  echo "PHP extension {{ .Values.objectCache.memcached.requiredPhpExtension }} is required for Memcached object cache." >&2
                  exit 1
                fi
              fi
              install_plugin {{ .Values.objectCache.memcached.pluginSlug | quote }} "true" "true"
              {{- end }}
              {{- end }}

              {{- if and (eq (include "wordpress.objectCacheRedisEnabled" .) "true") .Values.objectCache.enableDropIn }}
              if [ -f /var/www/html/wp-content/object-cache.php ]; then
                echo "Redis object-cache.php drop-in already exists."
              elif [ -f /var/www/html/wp-content/plugins/redis-cache/includes/object-cache.php ]; then
                echo "Creating Redis object-cache.php drop-in."
                cp /var/www/html/wp-content/plugins/redis-cache/includes/object-cache.php /var/www/html/wp-content/object-cache.php
              elif is_installed; then
                echo "Enabling Redis Object Cache drop-in through WP-CLI."
                wp redis enable --path=/var/www/html --allow-root || true
              else
                echo "Redis plugin files are missing; cannot create object-cache.php." >&2
                exit 1
              fi
              {{- end }}

              {{- if and (eq (include "wordpress.objectCacheMemcachedEnabled" .) "true") .Values.objectCache.enableDropIn }}
              if [ -f /var/www/html/wp-content/object-cache.php ]; then
                echo "Memcached object-cache.php drop-in already exists."
              else
                memcached_plugin={{ .Values.objectCache.memcached.pluginSlug | quote }}
                memcached_dropin="$(find "/var/www/html/wp-content/plugins/${memcached_plugin}" -path "*/object-cache.php" -type f | head -n 1 || true)"
                if [ -n "$memcached_dropin" ]; then
                  echo "Creating Memcached object-cache.php drop-in."
                  cp "$memcached_dropin" /var/www/html/wp-content/object-cache.php
                elif is_installed; then
                  echo "Enabling Memcached object-cache.php drop-in through WP-CLI."
                  wp total-cache fix_environment --path=/var/www/html --allow-root
                else
                  echo "Memcached plugin files are missing; cannot create object-cache.php." >&2
                  exit 1
                fi
              fi
              {{- end }}
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ printf "%s:%s" (include "wordpress.databaseHost" .) (include "wordpress.databasePort" .) | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ include "wordpress.databaseName" . | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ include "wordpress.databaseUsername" . | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: {{ include "wordpress.databaseSecretKey" . }}
            {{- if eq (include "wordpress.redisPasswordEnabled" .) "true" }}
            - name: WP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.redisSecretName" . }}
                  key: {{ include "wordpress.redisSecretKey" . }}
            {{- end }}
            {{- range $i, $plugin := .Values.plugins.custom }}
            - name: {{ printf "HELMFORGE_PLUGIN_URL_%d" $i }}
              value: {{ $plugin.url | quote }}
            {{- with $plugin.authentication }}
            - name: {{ printf "HELMFORGE_PLUGIN_TOKEN_%d" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: {{ .tokenKey | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.plugins.installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ default (include "wordpress.fullname" .) .Values.persistence.existingClaim }}
{{- end }}
