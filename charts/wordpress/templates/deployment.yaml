# SPDX-License-Identifier: Apache-2.0
{{- include "wordpress.validateBootstrap" . }}
{{- include "wordpress.validatePlugins" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      annotations:
        {{- if .Values.php.ini }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "wordpress.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Waiting for database at ${DB_HOST}:${DB_PORT}..."
              until nc -z -w2 "${DB_HOST}" "${DB_PORT}"; do
                echo "Database not ready, retrying in 2s..."
                sleep 2
              done
              echo "Database is ready."
          env:
            - name: DB_HOST
              value: {{ include "wordpress.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "wordpress.databasePort" . | quote }}
        {{- if and .Values.coreSync.enabled (or (eq .Values.image.repository "docker.io/library/wordpress") .Values.coreSync.allowCustomImage) }}
        - name: sync-wordpress-core
          image: {{ include "wordpress.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              read_version() {
                awk -F"'" '/^\$wp_version = / { print $2; exit }' "$1"
              }
              source_version="$(read_version /usr/src/wordpress/wp-includes/version.php)"
              if [ -z "$source_version" ]; then
                echo "Unable to read the WordPress version from the image." >&2
                exit 1
              fi
              if [ ! -f /var/www/html/wp-includes/version.php ]; then
                if [ ! -f /var/www/html/index.php ]; then
                  echo "WordPress core is not initialized; the main container will seed version ${source_version}."
                  exit 0
                fi
                echo "Persisted core is incomplete; synchronizing version ${source_version}."
                target_version=""
              else
                target_version="$(read_version /var/www/html/wp-includes/version.php)"
              fi
              completion_marker=/var/www/html/.helmforge-core-version
              completed_version="$(cat "$completion_marker" 2>/dev/null || true)"
              if [ "$source_version" = "$target_version" ] && [ "$source_version" = "$completed_version" ]; then
                echo "WordPress core ${target_version} is already synchronized."
                exit 0
              fi
              if [ -n "$target_version" ] && [ "$source_version" != "$target_version" ]; then
                newest_version="$(printf '%s\n%s\n' "$source_version" "$target_version" | sort -V | tail -n 1)"
                if [ "$newest_version" = "$target_version" ]; then
                  echo "Persisted WordPress core ${target_version} is newer than image core ${source_version}; skipping downgrade."
                  exit 0
                fi
              fi
              echo "Synchronizing WordPress core ${target_version} -> ${source_version}."
              stage=/var/www/html/.helmforge-core-sync
              rm -rf "$stage"
              mkdir -p "$stage"
              cp -a /usr/src/wordpress/wp-admin /usr/src/wordpress/wp-includes "$stage/"
              for source_file in /usr/src/wordpress/*; do
                [ -f "$source_file" ] || continue
                [ "$(basename "$source_file")" = "wp-config.php" ] && continue
                cp -a "$source_file" "$stage/"
              done
              staged_version="$(read_version "$stage/wp-includes/version.php")"
              if [ "$staged_version" != "$source_version" ]; then
                echo "Staged WordPress core failed version validation." >&2
                exit 1
              fi
              rm -rf /var/www/html/wp-admin.previous /var/www/html/wp-includes.previous
              [ ! -d /var/www/html/wp-admin ] || mv /var/www/html/wp-admin /var/www/html/wp-admin.previous
              mv "$stage/wp-admin" /var/www/html/wp-admin
              [ ! -d /var/www/html/wp-includes ] || mv /var/www/html/wp-includes /var/www/html/wp-includes.previous
              mv "$stage/wp-includes" /var/www/html/wp-includes
              for staged_file in "$stage"/*; do
                [ -f "$staged_file" ] || continue
                cp -f "$staged_file" /var/www/html/
              done
              printf '%s\n' "$source_version" > "${completion_marker}.tmp"
              mv "${completion_marker}.tmp" "$completion_marker"
              rm -rf "$stage" /var/www/html/wp-admin.previous /var/www/html/wp-includes.previous
              chown -R 33:33 /var/www/html/wp-admin /var/www/html/wp-includes
              for source_file in /usr/src/wordpress/*; do
                [ -f "$source_file" ] || continue
                [ "$(basename "$source_file")" = "wp-config.php" ] && continue
                chown 33:33 "/var/www/html/$(basename "$source_file")"
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
        {{- end }}
        {{- if eq (include "wordpress.apachePortConfigEnabled" .) "true" }}
        - name: configure-apache-port
          image: {{ include "wordpress.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              cp -a /etc/apache2/. /work/apache2/
              sed -ri 's|^Listen 80$|Listen {{ .Values.containerPorts.http }}|' /work/apache2/ports.conf
              sed -ri 's!<VirtualHost \*:80>!<VirtualHost *:{{ .Values.containerPorts.http }}>!' /work/apache2/sites-available/000-default.conf
              grep -Fqx 'Listen {{ .Values.containerPorts.http }}' /work/apache2/ports.conf
              grep -Fq '<VirtualHost *:{{ .Values.containerPorts.http }}>' /work/apache2/sites-available/000-default.conf
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: apache-config
              mountPath: /work/apache2
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: wordpress
          image: {{ include "wordpress.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ printf "%s:%s" (include "wordpress.databaseHost" .) (include "wordpress.databasePort" .) | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ include "wordpress.databaseName" . | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ include "wordpress.databaseUsername" . | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: {{ include "wordpress.databaseSecretKey" . }}
            - name: WORDPRESS_TABLE_PREFIX
              value: {{ .Values.wordpress.tablePrefix | quote }}
            {{- if .Values.wordpress.debug }}
            - name: WORDPRESS_DEBUG
              value: "1"
            {{- end }}
            {{- if eq (include "wordpress.redisPasswordEnabled" .) "true" }}
            - name: WP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.redisSecretName" . }}
                  key: {{ include "wordpress.redisSecretKey" . }}
            {{- end }}
            {{- if include "wordpress.generatedConfigExtra" . }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: {{ include "wordpress.generatedConfigExtra" . | quote }}
            {{- end }}
            - name: WORDPRESS_HTTP_PORT
              value: {{ .Values.containerPorts.http | quote }}
            {{- with .Values.wordpress.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.wordpress.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            {{- if .Values.php.ini }}
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/custom.ini
              subPath: custom.ini
              readOnly: true
            {{- end }}
            {{- if eq (include "wordpress.apachePortConfigEnabled" .) "true" }}
            - name: apache-config
              mountPath: /etc/apache2
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - --scrape_uri=http://localhost:{{ .Values.containerPorts.http }}/server-status?auto
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: wordpress-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "wordpress.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.php.ini }}
        - name: php-config
          configMap:
            name: {{ include "wordpress.configMapName" . }}
            items:
              - key: custom.ini
                path: custom.ini
        {{- end }}
        {{- if eq (include "wordpress.apachePortConfigEnabled" .) "true" }}
        - name: apache-config
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
