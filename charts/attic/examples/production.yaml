# SPDX-License-Identifier: Apache-2.0
# Distributed API with external PostgreSQL and S3-compatible storage.
mode: distributed
replicaCount: 3
config:
  apiEndpoint: https://cache.example.com/
  allowedHosts: [cache.example.com]
database:
  type: postgresql
storage:
  type: s3
  s3:
    region: us-east-1
    bucket: company-attic-cache
auth:
  generate: false
  existingSecret: attic-production
pdb:
  enabled: true
gatewayAPI:
  enabled: true
  httpRoutes:
    - parentRefs:
        - name: public
          namespace: gateway-system
          sectionName: https
      hostnames: [cache.example.com]
