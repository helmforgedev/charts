# SPDX-License-Identifier: Apache-2.0
# Project an operator-managed JWT secret into the name consumed by Attic.
auth:
  generate: false
  existingSecret: attic-credentials
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: attic-credentials
      spec:
        secretStoreRef:
          name: production-secrets
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: token-hs256-secret-base64
            remoteRef:
              key: platform/attic
              property: jwt-hs256
