externalSecrets:
  enabled: true
  items:
    - fullnameOverride: attic-external-fixture
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        target:
          creationPolicy: Owner
        data:
          - secretKey: token
            remoteRef:
              key: test/token
extraEnv:
  - name: ATTIC_FIXTURE_TOKEN
    valueFrom:
      secretKeyRef:
        name: attic-external-fixture
        key: token
