auth:
  generate: false
  existingSecret: attic-credentials
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: attic-credentials
      spec:
        secretStoreRef:
          name: test-store
          kind: ClusterSecretStore
        data:
          - secretKey: token-hs256-secret-base64
            remoteRef:
              key: attic
