# SPDX-License-Identifier: Apache-2.0
mode: distributed
replicaCount: 3
database:
  type: postgresql
storage:
  type: s3
  s3:
    bucket: attic-production
auth:
  generate: false
  existingSecret: attic-production
imagePullSecrets:
  - name: registry-credentials
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: dedicated
    operator: Equal
    value: cache
    effect: NoSchedule
