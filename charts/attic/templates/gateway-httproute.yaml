{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.gatewayAPI.enabled }}
{{- $names := dict }}
{{- range $index, $route := .Values.gatewayAPI.httpRoutes }}
{{- $name := include "attic.httpRouteName" (dict "root" $ "route" $route "index" $index) }}
{{- if hasKey $names $name }}{{ fail (printf "gatewayAPI.httpRoutes render duplicate HTTPRoute name %q" $name) }}{{- end }}
{{- $_ := set $names $name true }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "attic.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "gatewayAPI.httpRoutes[].parentRefs is required" $route.parentRefs) | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if $route.rules }}
    {{- toYaml $route.rules | nindent 4 }}
    {{- else }}
    - backendRefs:
        - name: {{ include "attic.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}
