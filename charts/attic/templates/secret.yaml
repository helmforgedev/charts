{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.auth.generate (empty .Values.auth.existingSecret) }}
{{- $name := include "attic.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secret := .Values.auth.hs256Secret }}
{{- if and (empty $secret) $existing $existing.data (hasKey $existing.data .Values.auth.hs256SecretKey) }}
{{- $secret = (index $existing.data .Values.auth.hs256SecretKey | b64dec) }}
{{- else if empty $secret }}
{{- $secret = (randAlphaNum 64 | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "attic.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.hs256SecretKey }}: {{ $secret | quote }}
{{- end }}
