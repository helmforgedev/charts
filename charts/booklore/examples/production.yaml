# SPDX-License-Identifier: Apache-2.0
# Production-oriented BookLore deployment with TLS, persistent imports, and
# credentials supplied through an existing Secret.
app:
  allowedOrigins: https://library.example.com

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: library.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: booklore-tls
      hosts:
        - library.example.com

persistence:
  data:
    size: 20Gi
  books:
    size: 100Gi
  bookdrop:
    enabled: true
    size: 10Gi

pdb:
  enabled: true

networkPolicy:
  enabled: true
  egress:
    enabled: true
    allowDNS: true

mariadb:
  auth:
    existingSecret: booklore-mariadb
  standalone:
    persistence:
      size: 20Gi
