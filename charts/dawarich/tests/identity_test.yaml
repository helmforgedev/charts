# SPDX-License-Identifier: Apache-2.0
suite: Dawarich retained native identity
templates:
  - templates/identity-secret.yaml
tests:
  - it: retains all four Rails and OTP keys
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - isNotEmpty:
          path: data.SECRET_KEY_BASE
      - isNotEmpty:
          path: data.OTP_ENCRYPTION_PRIMARY_KEY
      - isNotEmpty:
          path: data.OTP_ENCRYPTION_DETERMINISTIC_KEY
      - isNotEmpty:
          path: data.OTP_ENCRYPTION_KEY_DERIVATION_SALT
  - it: leaves externally managed identity untouched
    set:
      identity.existingSecret: operator-identity
    asserts:
      - hasDocuments:
          count: 0
