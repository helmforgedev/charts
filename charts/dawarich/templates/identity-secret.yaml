{{- if not .Values.identity.existingSecret }}
{{- $name := include "dawarich.identitySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "dawarich.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "SECRET_KEY_BASE" "OTP_ENCRYPTION_PRIMARY_KEY" "OTP_ENCRYPTION_DETERMINISTIC_KEY" "OTP_ENCRYPTION_KEY_DERIVATION_SALT" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
{{- end }}
