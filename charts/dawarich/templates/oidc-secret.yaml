{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) .Values.oidc.clientSecret }}
{{- $name := include "dawarich.oidcSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.clientSecretKey }}: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
