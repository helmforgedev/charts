{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.metrics.enabled (not .Values.metrics.auth.existingSecret) }}
{{- $name := include "dawarich.metricsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "dawarich.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.metrics.auth.usernameKey }}: {{ .Values.metrics.auth.username | b64enc | quote }}
  {{ .Values.metrics.auth.passwordKey }}: {{ get $data .Values.metrics.auth.passwordKey | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
