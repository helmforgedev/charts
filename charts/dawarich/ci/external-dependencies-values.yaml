# SPDX-License-Identifier: Apache-2.0
fullnameOverride: dawarich-external
postgresql:
  enabled: false
redis:
  enabled: false
database:
  host: fixture-postgresql
  name: dawarich
  username: dawarich
  passwordSecret: fixture-postgresql-auth
  passwordKey: user-password
  tls:
    enabled: true
    caSecret: fixture-postgresql-tls
cache:
  host: fixture-redis-client
  passwordSecret: fixture-redis-auth
  passwordKey: redis-password
  tls:
    enabled: true
    caSecret: fixture-redis-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: fixture-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: fixture-redis
      ports:
        - protocol: TCP
          port: 6379
persistence:
  size: 2Gi
