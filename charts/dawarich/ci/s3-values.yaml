# SPDX-License-Identifier: Apache-2.0
fullnameOverride: dawarich-s3
persistence:
  size: 2Gi
postgresql:
  standalone:
    persistence:
      size: 3Gi
redis:
  standalone:
    persistence:
      size: 1Gi
storage:
  driver: s3
  s3:
    bucket: dawarich.fixtures
    region: us-east-1
    endpoint: https://fixture-integrations:9443
    existingSecret: fixture-s3
    caSecret: fixture-integrations-tls
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-integrations
      ports:
        - protocol: TCP
          port: 9443
