# SPDX-License-Identifier: Apache-2.0
fullnameOverride: dawarich-metrics
persistence:
  size: 2Gi
postgresql:
  standalone:
    persistence:
      size: 3Gi
redis:
  standalone:
    persistence:
      size: 1Gi
metrics:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app: dawarich-monitor
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
