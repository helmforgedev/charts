# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: dawarich
description: >-
  Private location history with native administrator provisioning, PostGIS, queued GPX imports and retained encryption
  keys.
type: application
version: 1.0.0
appVersion: 1.14.4
kubeVersion: '>=1.26.0-0'
maintainers:
  - name: helmforgedev
  - name: mberlofa
keywords:
  - dawarich
  - location
  - gps
  - postgis
home: https://helmforge.dev/docs/charts/dawarich
sources:
  - https://github.com/helmforgedev/charts/tree/main/charts/dawarich
  - https://github.com/Freika/dawarich
icon: https://helmforge.dev/icons/charts/dawarich.png
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: add production application charts and harden memos (#1183)"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
    - name: Maicon Berlofa
      email: maicon.berloffa@gmail.com
  helmforge.dev/maturity: stable
  helmforge.dev/signed: gpg+cosign
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/links: |
    - name: Official Website
      url: https://dawarich.app
    - name: Documentation
      url: https://helmforge.dev/docs/charts/dawarich
dependencies:
  - name: postgresql
    version: 2.0.5
    repository: https://repo.helmforge.dev
    condition: postgresql.enabled
  - name: redis
    version: 2.0.1
    repository: https://repo.helmforge.dev
    condition: redis.enabled
