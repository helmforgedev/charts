# SPDX-License-Identifier: Apache-2.0
resources:
  requests:
    cpu: 250m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 500m
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
