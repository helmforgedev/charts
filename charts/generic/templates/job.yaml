{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- range .Values.jobs | default list }}
{{- $hooks := .hooks | default dict }}
{{- $requiredAnnotations := dict }}
{{- if $hooks.enabled }}
{{- $_ := set $requiredAnnotations "helm.sh/hook" (join "," ($hooks.events | default (list "pre-install" "pre-upgrade"))) }}
{{- $_ := set $requiredAnnotations "helm.sh/hook-weight" ($hooks.weight | default 0 | toString) }}
{{- $_ := set $requiredAnnotations "helm.sh/hook-delete-policy" ($hooks.deletePolicy | default "before-hook-creation,hook-succeeded") }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "chart.renderAnnotations" (dict "root" $ "specific" .annotations "required" $requiredAnnotations) | nindent 2 }}
spec:
  {{- with .parallelism }}
  parallelism: {{ . }}
  {{- end }}
  {{- with .completions }}
  completions: {{ . }}
  {{- end }}
  {{- with .completionMode }}
  completionMode: {{ . }}
  {{- end }}
  {{- with .manualSelector }}
  manualSelector: {{ . }}
  {{- end }}
  {{- with .podFailurePolicy }}
  podFailurePolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .successPolicy }}
  successPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey . "suspend" }}
  suspend: {{ .suspend }}
  {{- end }}
  backoffLimit: {{ .backoffLimit | default 1 }}
  activeDeadlineSeconds: {{ .activeDeadlineSeconds | default 300 }}
  ttlSecondsAfterFinished: {{ .ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" $ | nindent 8 }}
        job-name: {{ .name }}
        {{- with .podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .podAnnotations }}
      annotations:
        {{- toYaml .podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .restartPolicy | default "Never" }}
      {{- include "chart.podSpec" (dict "root" $ "containers" (.containers | default (list .)) "podSpec" . "skipGlobalProbes" true) | nindent 6 }}
{{- end }}
