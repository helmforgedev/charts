# SPDX-License-Identifier: Apache-2.0
suite: OpenHuman network policy
templates: [templates/networkpolicy.yaml]
tests:
  - it: restricts ingress and allows provider HTTPS
    asserts:
      - isKind: {of: NetworkPolicy}
      - contains: {path: spec.policyTypes, content: Ingress}
      - contains: {path: spec.policyTypes, content: Egress}
      - equal: {path: "spec.ingress[0].ports[0].port", value: 7788}
  - it: allows the configured OpenHuman listener port
    set: {containerPorts.http: 7799}
    asserts:
      - equal: {path: "spec.ingress[0].ports[0].port", value: 7799}
