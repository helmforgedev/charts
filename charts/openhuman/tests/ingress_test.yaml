# SPDX-License-Identifier: Apache-2.0
suite: OpenHuman ingress
templates: [templates/ingress.yaml]
tests:
  - it: renders a TLS ingress
    set:
      ingress.enabled: true
      ingress.ingressClassName: nginx
      ingress.hosts: [{host: core.example.com, paths: [{path: /, pathType: Prefix}]}]
      ingress.tls: [{secretName: core-tls, hosts: [core.example.com]}]
    asserts:
      - equal: {path: spec.ingressClassName, value: nginx}
      - equal: {path: "spec.tls[0].secretName", value: core-tls}
