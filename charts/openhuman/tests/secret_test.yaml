# SPDX-License-Identifier: Apache-2.0
suite: OpenHuman authentication
templates: [templates/secret.yaml]
tests:
  - it: creates and retains a generated token
    asserts:
      - isKind: {of: Secret}
      - exists: {path: stringData.core-token}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: omits the generated Secret when an existing Secret is selected
    set: {auth.existingSecret: operator-secret}
    asserts:
      - hasDocuments: {count: 0}
