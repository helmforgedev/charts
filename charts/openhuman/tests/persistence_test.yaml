# SPDX-License-Identifier: Apache-2.0
suite: OpenHuman persistence
templates: [templates/pvc.yaml]
tests:
  - it: creates retained workspace and projects claims
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep, documentIndex: 0}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep, documentIndex: 1}
  - it: uses existing claims without creating PVCs
    set:
      persistence.existingClaim: workspace
      projectsPersistence.existingClaim: projects
    asserts:
      - hasDocuments: {count: 0}
