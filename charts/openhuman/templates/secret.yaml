{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhuman.fullname" . }}
  labels:
    {{- include "openhuman.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.auth.key }}: {{ randAlphaNum 64 | quote }}
{{- end }}
