{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhuman.fullname" . }}
  labels:
    {{- include "openhuman.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "openhuman.fullname" .) }}
  {{- $token := randAlphaNum 64 }}
  {{- if and $existing (hasKey ($existing.data | default dict) .Values.auth.key) }}
  {{- $token = index $existing.data .Values.auth.key | b64dec }}
  {{- end }}
  {{ .Values.auth.key }}: {{ $token | quote }}
{{- end }}
