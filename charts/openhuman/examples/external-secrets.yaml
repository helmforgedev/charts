# SPDX-License-Identifier: Apache-2.0
auth:
  existingSecret: openhuman-auth
externalSecrets:
  enabled: true
  items:
    - name: openhuman-auth
      spec:
        secretStoreRef: {name: production, kind: ClusterSecretStore}
        target: {name: openhuman-auth}
        data:
          - secretKey: core-token
            remoteRef: {key: openhuman/core-token}
