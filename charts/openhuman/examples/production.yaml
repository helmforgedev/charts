# SPDX-License-Identifier: Apache-2.0
auth:
  existingSecret: openhuman-auth
keyring:
  existingSecret: openhuman-keyring
openhuman:
  allowedOrigins: https://openhuman.example.com
ingress:
  enabled: true
  ingressClassName: nginx
  hosts: [{host: openhuman.example.com, paths: [{path: /, pathType: Prefix}]}]
  tls: [{secretName: openhuman-tls, hosts: [openhuman.example.com]}]
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
