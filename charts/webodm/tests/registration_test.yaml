# SPDX-License-Identifier: Apache-2.0
suite: WebODM processor registration
templates:
  - templates/processor-registration-job.yaml
tests:
  - it: waits for WebODM readiness before processor registration
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: 'http://RELEASE-NAME-webodm:80/'
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: 'manage.py addnode'
