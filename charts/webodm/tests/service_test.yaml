# SPDX-License-Identifier: Apache-2.0
suite: WebODM Service
templates:
  - templates/service.yaml
tests:
  - it: exposes the configured client port through the named application target
    set:
      service.port: 8080
      web.containerPort: 9080
    asserts:
      - isKind: {of: Service}
      - equal: {path: "spec.ports[0].port", value: 8080}
      - equal: {path: "spec.ports[0].targetPort", value: http}

