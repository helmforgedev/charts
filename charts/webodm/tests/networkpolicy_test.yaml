# SPDX-License-Identifier: Apache-2.0
suite: WebODM NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: isolates application workloads by default
    asserts:
      - isKind: {of: NetworkPolicy}
      - contains: {path: spec.policyTypes, content: Ingress}
      - contains: {path: spec.policyTypes, content: Egress}
      - equal: {path: "spec.egress[1].ports[0].port", value: 53}
  - it: can be disabled explicitly
    set: {networkPolicy.enabled: false}
    asserts:
      - hasDocuments: {count: 0}

