# SPDX-License-Identifier: Apache-2.0
suite: WebODM Gateway API route
templates:
  - templates/gateway-httproute.yaml
tests:
  - it: is opt-in
    asserts:
      - hasDocuments: {count: 0}
  - it: routes to the configured application Service port
    set:
      gatewayAPI.enabled: true
      gatewayAPI.parentRefs:
        - name: public
      service.port: 8080
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: "spec.parentRefs[0].name"
          value: public
      - equal:
          path: "spec.rules[0].backendRefs[0].port"
          value: 8080

