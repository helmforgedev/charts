# SPDX-License-Identifier: Apache-2.0
suite: WebODM Helm smoke test
templates:
  - templates/tests/smoke-test.yaml
tests:
  - it: renders a tokenless test pod with an authenticated processor check
    asserts:
      - isKind: {of: Pod}
      - equal: {path: spec.automountServiceAccountToken, value: false}
      - equal: {path: 'metadata.annotations["helm.sh/hook"]', value: test}
      - contains:
          path: spec.containers[0].env
          content:
            name: PROCESSOR_TOKEN
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-webodm-auth, key: processor-token}}

