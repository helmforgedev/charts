# SPDX-License-Identifier: Apache-2.0
suite: WebODM ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a tokenless dedicated ServiceAccount
    asserts:
      - isKind: {of: ServiceAccount}
      - equal: {path: automountServiceAccountToken, value: false}
  - it: supports an existing ServiceAccount
    set: {serviceAccount.create: false, serviceAccount.name: platform-webodm}
    asserts:
      - hasDocuments: {count: 0}

