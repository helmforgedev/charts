# SPDX-License-Identifier: Apache-2.0
suite: WebODM application Secret
templates:
  - templates/secret.yaml
tests:
  - it: renders retained application credentials by default
    asserts:
      - isKind: {of: Secret}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
      - exists: {path: data.secret-key}
      - exists: {path: data.processor-token}
  - it: does not render when an existing Secret is selected
    set: {webodm.existingSecret: webodm-runtime}
    asserts:
      - hasDocuments: {count: 0}

