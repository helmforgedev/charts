# SPDX-License-Identifier: Apache-2.0
suite: WebODM Ingress
templates:
  - templates/ingress.yaml
tests:
  - it: is opt-in
    asserts:
      - hasDocuments: {count: 0}
  - it: routes the configured host to the application Service
    set:
      ingress.enabled: true
      ingress.ingressClassName: nginx
      service.port: 8080
    asserts:
      - isKind: {of: Ingress}
      - equal: {path: spec.ingressClassName, value: nginx}
      - equal: {path: "spec.rules[0].http.paths[0].backend.service.port.number", value: 8080}

