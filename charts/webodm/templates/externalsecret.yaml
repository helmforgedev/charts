{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.externalSecrets.enabled }}
{{- range $index, $item := .Values.externalSecrets.items }}
{{- $name := include "webodm.externalSecretName" (dict "root" $ "item" $item "index" $index) -}}
{{- $spec := deepCopy (default dict $item.spec) -}}
{{- $_ := set $spec "refreshInterval" (default $.Values.externalSecrets.refreshInterval $spec.refreshInterval) -}}
{{- $target := deepCopy (default dict $spec.target) -}}
{{- $_ := set $target "name" (default $name $target.name) -}}
{{- $_ := set $spec "target" $target -}}
{{- $hasSource := false -}}
{{- if and $spec.secretStoreRef $spec.secretStoreRef.name }}{{- $hasSource = true -}}{{- end -}}
{{- range (default list $spec.data) }}
{{- if or (and .sourceRef .sourceRef.storeRef .sourceRef.storeRef.name) (and .sourceRef .sourceRef.generatorRef .sourceRef.generatorRef.name) }}{{- $hasSource = true -}}{{- end -}}
{{- end -}}
{{- range (default list $spec.dataFrom) }}
{{- if or (and .sourceRef .sourceRef.storeRef .sourceRef.storeRef.name) (and .sourceRef .sourceRef.generatorRef .sourceRef.generatorRef.name) }}{{- $hasSource = true -}}{{- end -}}
{{- end -}}
{{- if not $hasSource }}{{- fail "externalSecrets.items[].spec.secretStoreRef.name or item sourceRef.storeRef.name/sourceRef.generatorRef.name is required when externalSecrets.enabled=true" -}}{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webodm.labels" $ | nindent 4 }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
---
{{- end }}
{{- end }}
