{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.processing.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "webodm.fullname" . }}-register-processor
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor-registration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "processor-registration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "webodm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: register
          image: {{ include "webodm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: [/bin/bash, -ec]
          args:
            - |
              until pg_isready -h "$WO_DATABASE_HOST" -p "$WO_DATABASE_PORT" -U "$WO_DATABASE_USER"; do sleep 2; done
              until curl --fail --silent --header "Authorization: Bearer $PROCESSOR_TOKEN" "http://{{ include "webodm.processingServiceName" . }}:{{ .Values.processingService.port }}/info" >/dev/null; do sleep 2; done
              until curl --fail --silent "http://{{ include "webodm.fullname" . }}:{{ .Values.service.port }}/" >/dev/null; do sleep 2; done
              cd /webodm
              exec python manage.py addnode "{{ include "webodm.processingServiceName" . }}" "{{ .Values.processingService.port }}" --label {{ .Values.processing.label | quote }} --token "$PROCESSOR_TOKEN"
          env:
            {{- include "webodm.applicationEnv" . | nindent 12 }}
            - name: PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "webodm.secretName" . }}
                  key: {{ .Values.webodm.existingSecretProcessorTokenKey }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
