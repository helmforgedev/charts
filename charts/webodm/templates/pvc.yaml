{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "webodm.mediaClaimName" . }}
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ if eq .Values.persistence.storageClass "-" }}""{{ else }}{{ .Values.persistence.storageClass | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.processing.enabled .Values.processing.persistence.enabled (not .Values.processing.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "webodm.processingClaimName" . }}
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.processing.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.processing.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.processing.persistence.accessModes | nindent 4 }}
  {{- if .Values.processing.persistence.storageClass }}
  storageClassName: {{ if eq .Values.processing.persistence.storageClass "-" }}""{{ else }}{{ .Values.processing.persistence.storageClass | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.processing.persistence.size }}
{{- end }}
