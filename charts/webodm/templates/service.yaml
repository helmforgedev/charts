apiVersion: v1
kind: Service
metadata:
  name: {{ include "webodm.fullname" . }}
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
  {{- include "webodm.renderAnnotations" (dict "root" . "annotations" .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "web") | nindent 4 }}
