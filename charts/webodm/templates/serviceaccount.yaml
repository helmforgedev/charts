{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webodm.serviceAccountName" . }}
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
  {{- include "webodm.renderAnnotations" (dict "root" . "annotations" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
