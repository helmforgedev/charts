{{- if .Values.processing.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webodm.processingServiceName" . }}
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
  {{- with .Values.processingService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  {{- with .Values.processingService.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.processingService.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.processingService.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "processing") | nindent 4 }}
{{- end }}
