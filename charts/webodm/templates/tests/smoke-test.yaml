apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webodm.fullname" . }}-test
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke-test
      image: {{ include "webodm.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: [/bin/bash, -ec]
      args:
        - |
          curl --fail --silent --show-error "http://{{ include "webodm.fullname" . }}:{{ .Values.service.port }}/" >/dev/null
          {{- if .Values.processing.enabled }}
          curl --fail --silent --show-error --header "Authorization: Bearer $PROCESSOR_TOKEN" "http://{{ include "webodm.processingServiceName" . }}:{{ .Values.processingService.port }}/info" >/dev/null
          {{- end }}
      {{- if .Values.processing.enabled }}
      env:
        - name: PROCESSOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "webodm.secretName" . }}
              key: {{ .Values.webodm.existingSecretProcessorTokenKey }}
      {{- end }}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
