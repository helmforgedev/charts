apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webodm.fullname" . }}-worker
  labels:
    {{- include "webodm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "webodm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "webodm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: [/bin/bash, -ec]
          args:
            - |
              until pg_isready -h "$WO_DATABASE_HOST" -p "$WO_DATABASE_PORT" -U "$WO_DATABASE_USER"; do sleep 2; done
              until (echo >/dev/tcp/"$REDIS_HOST"/"$REDIS_PORT") 2>/dev/null; do sleep 2; done
              until curl --fail --silent "http://{{ include "webodm.fullname" . }}:{{ .Values.service.port }}/" >/dev/null; do sleep 2; done
              exec /webodm/worker.sh start
          env:
            {{- include "webodm.applicationEnv" . | nindent 12 }}
            - name: WO_BROKER_SCALE
              value: {{ .Values.worker.concurrency | quote }}
          {{- with .Values.webodm.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            exec:
              command: [/bin/bash, -ec, "celery -A worker inspect ping --timeout 5"]
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [/bin/bash, -ec, "celery -A worker inspect ping --timeout 5"]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /webodm/app/media
            {{- if .Values.oidc.enabled }}
            - name: oidc-settings
              mountPath: /webodm/webodm/settings_override.py
              subPath: settings_override.py
              readOnly: true
            {{- end }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "webodm.mediaClaimName" . }}
        {{- if .Values.oidc.enabled }}
        - name: oidc-settings
          configMap:
            name: {{ include "webodm.oidcConfigMapName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if not (has "ReadWriteMany" .Values.persistence.accessModes) }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "webodm.componentSelectorLabels" (dict "root" . "component" "web") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
