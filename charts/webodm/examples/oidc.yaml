# SPDX-License-Identifier: Apache-2.0
webodm:
  host: webodm.example.com

oidc:
  enabled: true
  name: Corporate Login
  clientId: webodm
  existingSecret: webodm-oidc
  existingSecretClientSecretKey: client-secret
  authEndpoint: https://idp.example.com/authorize
  tokenEndpoint: https://idp.example.com/token
  userinfoEndpoint: https://idp.example.com/userinfo
  allowedEmails: ["@example.com"]
  updateProfile: true
  customScopes: [groups]
  groupClaims: [groups]
  createGroups: true
