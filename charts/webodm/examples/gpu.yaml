# SPDX-License-Identifier: Apache-2.0
processing:
  gpu:
    enabled: true
    runtimeClassName: nvidia
    nodeSelector:
      accelerator: nvidia
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  resources:
    requests: {cpu: "8", memory: 32Gi, ephemeral-storage: 20Gi}
    limits: {cpu: "32", memory: 128Gi, ephemeral-storage: 100Gi}
