# SPDX-License-Identifier: Apache-2.0
webodm:
  existingSecret: webodm-auth

externalSecrets:
  enabled: true
  items:
    - fullnameOverride: webodm-auth
      spec:
        secretStoreRef: {name: production, kind: ClusterSecretStore}
        target: {creationPolicy: Owner}
        data:
          - secretKey: secret-key
            remoteRef: {key: production/webodm, property: secret-key}
          - secretKey: processor-token
            remoteRef: {key: production/webodm, property: processor-token}
