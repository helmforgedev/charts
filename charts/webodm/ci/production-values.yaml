# SPDX-License-Identifier: Apache-2.0
webodm:
  host: webodm.production.test

web:
  concurrency: 3
  terminationGracePeriodSeconds: 30

worker:
  concurrency: 4
  terminationGracePeriodSeconds: 60

processing:
  parallelQueueProcessing: 2
  terminationGracePeriodSeconds: 60
  persistence:
    retain: false

postgresql:
  standalone:
    persistence:
      enabled: false

redis:
  standalone:
    persistence:
      enabled: false

persistence:
  retain: false

