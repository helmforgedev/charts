# SPDX-License-Identifier: Apache-2.0
web:
  terminationGracePeriodSeconds: 30

worker:
  terminationGracePeriodSeconds: 60

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

processing:
  terminationGracePeriodSeconds: 60
  persistence:
    retain: false

postgresql:
  standalone:
    persistence:
      enabled: false

redis:
  standalone:
    persistence:
      enabled: false

persistence:
  retain: false
