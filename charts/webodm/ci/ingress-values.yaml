# SPDX-License-Identifier: Apache-2.0
webodm:
  host: webodm.example.test

web:
  terminationGracePeriodSeconds: 30

worker:
  terminationGracePeriodSeconds: 60

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: webodm.example.test
      paths:
        - path: /
          pathType: Prefix

processing:
  terminationGracePeriodSeconds: 60
  persistence:
    retain: false

postgresql:
  standalone:
    persistence:
      enabled: false

redis:
  standalone:
    persistence:
      enabled: false

persistence:
  retain: false

