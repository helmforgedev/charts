apiVersion: v2
name: webodm
description: WebODM aerial imagery processing with persistent workers and optional GPU acceleration
type: application
version: 0.1.0
appVersion: "3.3.0"
kubeVersion: ">=1.26.0-0"
home: https://helmforge.dev/docs/charts/webodm
icon: https://helmforge.dev/icons/charts/webodm.png
sources:
  - https://github.com/helmforgedev/charts/tree/main/charts/webodm
  - https://github.com/WebODM/WebODM
  - https://github.com/OpenDroneMap/NodeODM
keywords: [webodm, photogrammetry, drones, geospatial, kubernetes]
maintainers:
  - name: helmforgedev
  - name: mberlofa
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "add production-ready WebODM chart with CPU and GPU processing (#1384)"
  artifacthub.io/maintainers: |
    - name: HelmForge
      email: berlofa@helmforge.dev
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/prerelease: "false"
  helmforge.dev/maturity: beta
  helmforge.dev/signed: gpg+cosign
  helmforge.dev/repository: https://repo.helmforge.dev
  artifacthub.io/signKey: |
    fingerprint: 6748042FBAD8C2E11C65E564170D55148EB88A9D
    url: https://repo.helmforge.dev/pgp-public-key.asc
  artifacthub.io/links: |
    - name: Official Website
      url: https://webodm.org
    - name: Documentation
      url: https://helmforge.dev/docs/charts/webodm
    - name: Source
      url: https://github.com/helmforgedev/charts/tree/main/charts/webodm
    - name: support
      url: https://github.com/helmforgedev/charts/issues
dependencies:
  - name: postgresql
    version: 2.0.5
    repository: oci://ghcr.io/helmforgedev/helm
    condition: postgresql.enabled
  - name: redis
    version: 3.0.1
    repository: oci://ghcr.io/helmforgedev/helm
    condition: redis.enabled
