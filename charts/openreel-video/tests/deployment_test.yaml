# SPDX-License-Identifier: Apache-2.0
suite: Deployment
templates:
  - templates/deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: should use HelmForge OpenReel Video image and hardened pod settings
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/helmforge/openreel-video:v0.5.0
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: web

  - it: should omit replicas when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: should render health probes and writable runtime storage
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 64Mi

  - it: should support disabling probes and the temporary volume
    set:
      probes.liveness.enabled: false
      probes.readiness.enabled: false
      tmpVolume.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes

  - it: should render placement and metadata overrides
    set:
      podAnnotations:
        example.com/checksum: abc123
      podLabels:
        example.com/tier: frontend
      priorityClassName: production
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: media
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/checksum"]
          value: abc123
      - equal:
          path: spec.template.metadata.labels["example.com/tier"]
          value: frontend
      - equal:
          path: spec.template.spec.priorityClassName
          value: production
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
