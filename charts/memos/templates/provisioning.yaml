{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if and .Values.provisioning.manageGeneralSettings (not .Values.provisioning.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memos.fullname" . | trunc 50 | trimSuffix "-" }}-provisioning
  labels:
    {{- include "memos.labels" . | nindent 4 }}
  {{- include "memos.renderAnnotations" (dict "root" .) | nindent 2 }}
type: Opaque
stringData:
  general.json: {{ dict "instanceSettings" (list (dict "name" "instance/settings/GENERAL" "generalSetting" (dict "disallowUserRegistration" .Values.provisioning.disallowUserRegistration "disallowPasswordAuth" false "additionalScript" "" "additionalStyle" "" "customProfile" (dict "title" "" "description" "" "logoUrl" "") "weekStartDayOffset" 0 "disallowChangeUsername" false "disallowChangeNickname" false))) | toJson | quote }}
{{- end }}
