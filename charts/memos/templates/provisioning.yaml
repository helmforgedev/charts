{{- if and .Values.provisioning.manageGeneralSettings (not .Values.provisioning.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memos.fullname" . | trunc 50 | trimSuffix "-" }}-provisioning
  labels:
    {{- include "memos.labels" . | nindent 4 }}
type: Opaque
stringData:
  memos-instance-setting-general.json: {{ dict "key" "GENERAL" "generalSetting" (dict "disallowUserRegistration" .Values.provisioning.disallowUserRegistration "disallowPasswordAuth" false) | toJson | quote }}
{{- end }}
