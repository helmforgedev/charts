{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "memos.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "memos.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "memos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memos.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/provisioning: {{ toJson .Values.provisioning | sha256sum }}
        checksum/database: {{ printf "%s%s" (toJson .Values.database) (.Files.Get "files/database.mjs") | sha256sum }}
        {{- if .Values.bootstrap.enabled }}
        checksum/bootstrap: {{ printf "%s%s" (toJson .Values.bootstrap) (.Files.Get "files/bootstrap.mjs") | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "memos.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or .Values.bootstrap.enabled (include "memos.databaseComponents" .) }}
      initContainers:
        {{- if include "memos.databaseComponents" . }}
        - name: prepare-database
          image: {{ printf "%s:%s" .Values.bootstrap.image.repository .Values.bootstrap.image.tag | quote }}
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          command: [node, /database-script/database.mjs]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          env:
            - {name: MEMOS_DRIVER, value: {{ .Values.database.driver | quote }}}
            - {name: DB_HOST, value: {{ include "memos.databaseHost" . | quote }}}
            - {name: DB_PORT, value: {{ include "memos.databasePort" . | quote }}}
            - {name: DB_USER, value: {{ include "memos.databaseUser" . | quote }}}
            - {name: DB_NAME, value: {{ include "memos.databaseName" . | quote }}}
            - {name: DB_CONNECTION_TIMEOUT, value: {{ .Values.database.connectionTimeout | quote }}}
            - {name: DB_SSL_MODE, value: {{ .Values.database.sslMode | default (ternary "disable" "verify-full" .Values.postgresql.enabled) | quote }}}
            - {name: DB_MYSQL_TLS, value: {{ .Values.database.mysqlTls | default (ternary "false" "true" .Values.mysql.enabled) | quote }}}
            - {name: DB_HAS_CA, value: {{ not (empty .Values.database.caSecret) | quote }}}
          volumeMounts:
            - {name: database-script, mountPath: /database-script, readOnly: true}
            - {name: database-runtime, mountPath: /database-runtime}
            - {name: database-auth, mountPath: /database-auth, readOnly: true}
        {{- end }}
        {{- if .Values.bootstrap.enabled }}
        - name: copy-native-binary
          image: {{ include "memos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/sh, -ceu, "cp /usr/local/memos/memos /bootstrap-bin/memos"]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - {name: bootstrap-bin, mountPath: /bootstrap-bin}
        - name: bootstrap
          image: {{ printf "%s:%s" .Values.bootstrap.image.repository .Values.bootstrap.image.tag | quote }}
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          command: [node, /bootstrap-script/bootstrap.mjs]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          env:
            {{- include "memos.nativeEnvironment" . | nindent 12 }}
            - {name: BOOTSTRAP_USERNAME, value: {{ .Values.bootstrap.username | quote }}}
            - {name: BOOTSTRAP_DISPLAY_NAME, value: {{ .Values.bootstrap.displayName | quote }}}
          {{- with .Values.app.envFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: data, mountPath: {{ .Values.persistence.mountPath }}}
            - {name: bootstrap-bin, mountPath: /bootstrap-bin, readOnly: true}
            - {name: bootstrap-script, mountPath: /bootstrap-script, readOnly: true}
            - {name: bootstrap-auth, mountPath: /bootstrap-auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: provisioning, mountPath: /etc/secrets, readOnly: true}
            {{- if include "memos.databaseComponents" . }}
            - {name: database-runtime, mountPath: /database-runtime, readOnly: true}
            {{- end }}
            {{- if .Values.database.caSecret }}
            - {name: database-ca, mountPath: /database-ca, readOnly: true}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "memos.name" . }}
          image: {{ include "memos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if include "memos.databaseComponents" . }}
          command: [/bin/sh, -ceu]
          args:
            - |
              export MEMOS_DSN="$(cat /database-runtime/dsn)"
              exec /usr/local/memos/memos
          {{- else }}
          {{- with .Values.app.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          env:
            {{- include "memos.nativeEnvironment" . | nindent 12 }}
          {{- with .Values.app.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if include "memos.databaseComponents" . }}
            - {name: database-runtime, mountPath: /database-runtime, readOnly: true}
            {{- end }}
            {{- if .Values.database.caSecret }}
            - {name: database-ca, mountPath: /database-ca, readOnly: true}
            {{- end }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: provisioning
              mountPath: /etc/secrets
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        {{- if include "memos.databaseComponents" . }}
        - {name: database-runtime, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - name: database-script
          configMap:
            name: {{ include "memos.fullname" . | trunc 46 | trimSuffix "-" }}-database-runtime
        - name: database-auth
          secret:
            secretName: {{ include "memos.databasePasswordSecret" . }}
            defaultMode: 288
            items: [{key: {{ include "memos.databasePasswordKey" . }}, path: password}]
        {{- end }}
        {{- if .Values.database.caSecret }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caSecret }}
            defaultMode: 288
            items: [{key: {{ .Values.database.caKey }}, path: ca.crt}]
        {{- end }}
        {{- if .Values.bootstrap.enabled }}
        - {name: bootstrap-bin, emptyDir: {sizeLimit: 256Mi}}
        - name: bootstrap-script
          configMap:
            name: {{ include "memos.fullname" . | trunc 53 | trimSuffix "-" }}-bootstrap
        - name: bootstrap-auth
          secret:
            secretName: {{ include "memos.bootstrapSecretName" . }}
            defaultMode: 288
            items: [{key: {{ .Values.bootstrap.passwordKey }}, path: password}]
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: provisioning
          {{- if or .Values.provisioning.existingSecret .Values.provisioning.manageGeneralSettings }}
          secret:
            secretName: {{ default (printf "%s-provisioning" (include "memos.fullname" . | trunc 50 | trimSuffix "-")) .Values.provisioning.existingSecret | quote }}
            defaultMode: {{ .Values.provisioning.defaultMode }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
