{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.networkPolicy.enabled }}
{{- $extraEgress := .Values.networkPolicy.extraEgress | default list }}
{{- $dnsEgress := .Values.networkPolicy.dnsEgress | default list }}
{{- $httpsEgress := .Values.networkPolicy.httpsEgress | default list }}
{{- $egressEnabled := or .Values.networkPolicy.egressIsolation (gt (len $extraEgress) 0) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memos.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memos.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egressEnabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
  {{- if $egressEnabled }}
  egress:
    {{- if gt (len $dnsEgress) 0 }}
    - to:
        {{- toYaml $dnsEgress | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if gt (len $httpsEgress) 0 }}
    - to:
        {{- toYaml $httpsEgress | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if or .Values.postgresql.enabled .Values.mysql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- if .Values.postgresql.enabled }}
              app.kubernetes.io/name: {{ include "postgresql.name" .Subcharts.postgresql }}
              {{- else }}
              app.kubernetes.io/name: {{ include "mysql.name" .Subcharts.mysql }}
              {{- end }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ include "memos.databasePort" . }}
    {{- else if .Values.database.networkPolicyPeers }}
    - to:
        {{- toYaml .Values.database.networkPolicyPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "memos.databasePort" . }}
    {{- end }}
    {{- with $extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
