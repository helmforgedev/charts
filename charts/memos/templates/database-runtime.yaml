{{- if include "memos.databaseComponents" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "memos.fullname" . | trunc 46 | trimSuffix "-" }}-database-runtime
  labels: {{ include "memos.labels" . | nindent 4 }}
data:
  database.mjs: |
    {{- .Files.Get "files/database.mjs" | nindent 4 }}
{{- end }}
