apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fixture-mysql
  labels:
    helm.sh/chart: mysql-2.0.3
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: fixture-mysql
    app.kubernetes.io/version: 9.7.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: helmforge
    helmforge.dev/runtime-fixture: 'true'
spec:
  serviceName: fixture-mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: fixture-mysql
      app.kubernetes.io/component: mysql
      app.kubernetes.io/part-of: mysql
      app.kubernetes.io/role: standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: fixture-mysql
        app.kubernetes.io/component: mysql
        app.kubernetes.io/part-of: mysql
        app.kubernetes.io/role: standalone
        helmforge.dev/runtime-fixture: 'true'
      annotations:
        checksum/config: 440c3e63edb648ee6c09e40de55d746542fd4957f493af893eb46af844eaf4e5
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: tls-volume-permissions
          image: docker.io/library/mysql:9.7.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - '-ec'
            - |
              cp "/tls-secret/ca.crt" "/tls-workdir/ca.crt"
              cp "/tls-secret/tls.crt" "/tls-workdir/tls.crt"
              cp "/tls-secret/tls.key" "/tls-workdir/tls.key"
              chmod 0644 "/tls-workdir/ca.crt" "/tls-workdir/tls.crt"
              chmod 0600 "/tls-workdir/tls.key"
              chown 999:999 /tls-workdir/*
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tls
              mountPath: /tls-secret
              readOnly: true
            - name: tls-workdir
              mountPath: /tls-workdir
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: mysql
          image: docker.io/library/mysql:9.7.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - '-ec'
            - |
              cp /config/my.cnf /etc/mysql/conf.d/zz-chart.cnf
              cat > /etc/mysql/conf.d/zz-role.cnf <<EOF
              [mysqld]
              server_id = 1
              read_only = OFF
              super_read_only = OFF
              EOF
              exec docker-entrypoint.sh mysqld
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-mysql-auth
                  key: mysql-root-password
            - name: MYSQL_ROOT_HOST
              value: '%'
            - name: MYSQL_DATABASE
              value: memos
            - name: MYSQL_USER
              value: memos
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-mysql-auth
                  key: mysql-user-password
            - name: REPLICATION_USERNAME
              value: ''
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-mysql-auth
                  key: mysql-replication-password
          livenessProbe:
            exec:
              command:
                - sh
                - '-ec'
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -P 3306 -uroot
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - '-ec'
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -P 3306 -uroot
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - sh
                - '-ec'
                - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -P 3306 -uroot
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /config
            - name: mysql-conf
              mountPath: /etc/mysql/conf.d
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: tls-workdir
              mountPath: /tls
              readOnly: true
      volumes:
        - name: mysql-conf
          emptyDir: {}
        - name: config
          configMap:
            name: fixture-mysql-config
        - name: initdb
          projected:
            defaultMode: 493
            sources:
              - configMap:
                  name: fixture-mysql-initdb
        - name: tls
          secret:
            secretName: fixture-mysql-tls
        - name: tls-workdir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mysql
          app.kubernetes.io/instance: fixture-mysql
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
