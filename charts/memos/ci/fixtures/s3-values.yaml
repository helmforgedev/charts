apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture-integrations
data:
  proxy.mjs: >-
    import fs from 'node:fs';import https from 'node:https';import http from 'node:http';

    const tls={key:fs.readFileSync('/tls/tls.key'),cert:fs.readFileSync('/tls/tls.crt')};

    for(const
    [port,host,targetPort]of[[8443,'fixture-libsql',8080],[9443,'fixture-s3',8333]])https.createServer(tls,(req,res)=>{const
    upstream=http.request({hostname:host,port:targetPort,path:req.url,method:req.method,headers:req.headers},response=>{res.writeHead(response.statusCode,response.headers);response.pipe(res);});upstream.on('error',()=>{res.writeHead(502);res.end();});req.pipe(upstream);}).listen(port,'0.0.0.0');
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-integrations
spec:
  selector:
    app: fixture-integrations
  ports:
    - name: sql
      port: 8443
      targetPort: 8443
    - name: s3
      port: 9443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-integrations
  labels:
    app: fixture-integrations
    helmforge.dev/runtime-fixture: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-integrations
  template:
    metadata:
      labels:
        app: fixture-integrations
        helmforge.dev/runtime-fixture: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/library/node:24.21.0-alpine3.23
          command:
            - node
            - /server/proxy.mjs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 3
          volumeMounts:
            - name: server
              mountPath: /server
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: fixture-integrations
        - name: tls
          secret:
            secretName: fixture-integrations-tls
            defaultMode: 288
---
apiVersion: v1
kind: Secret
metadata:
  name: fixture-provisioning
type: Opaque
stringData:
  memos-instance-setting-general.json: '{"key":"GENERAL","generalSetting":{"disallowUserRegistration":true,"disallowPasswordAuth":false}}'
  memos-instance-setting-storage.json: >-
    {"key":"STORAGE","storageSetting":{"storageType":"S3","filepathTemplate":"assets/{timestamp}_{uuid}_{filename}","uploadSizeLimitMb":"30","s3Config":{"accessKeyId":"fixture-papra","accessKeySecret":"fixture-only-s3-password-2026","endpoint":"https://fixture-integrations:9443","region":"us-east-1","bucket":"papra","usePathStyle":true,"insecureSkipTlsVerify":false}}}
