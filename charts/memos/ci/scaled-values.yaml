# SPDX-License-Identifier: Apache-2.0
fullnameOverride: memos-scaled
persistence:
  size: 1Gi
  existingClaim: fixture-shared-data
database:
  driver: postgres
  host: fixture-postgresql
  passwordSecret: fixture-postgresql-auth
  passwordKey: user-password
  caSecret: fixture-postgresql-tls
  networkPolicyPeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: fixture-postgresql

replicaCount: 2
pdb:
  enabled: true
  minAvailable: 1
