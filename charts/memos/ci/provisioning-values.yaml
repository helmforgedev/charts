fullnameOverride: memos-provisioning

provisioning:
  existingSecret: memos-provisioning

memos:
  instanceUrl: http://memos.local

extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: memos-provisioning
    type: Opaque
    stringData:
      access.json: |
        {
          "instanceSettings": [
            {
              "name": "instance/settings/ACCESS",
              "accessSetting": {
                "accessMode": "INSTANCE_ACCESS_MODE_PRIVATE"
              }
            }
          ]
        }
      general.json: |
        {
          "instanceSettings": [
            {
              "name": "instance/settings/GENERAL",
              "generalSetting": {
                "disallowUserRegistration": false,
                "disallowPasswordAuth": false,
                "additionalScript": "",
                "additionalStyle": "",
                "customProfile": {
                  "title": "",
                  "description": "",
                  "logoUrl": ""
                },
                "weekStartDayOffset": 1,
                "disallowChangeUsername": false,
                "disallowChangeNickname": false
              }
            }
          ]
        }
