# SPDX-License-Identifier: Apache-2.0
fullnameOverride: memos-provisioning

provisioning:
  existingSecret: memos-provisioning

memos:
  instanceUrl: http://memos.local

extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: memos-provisioning
    type: Opaque
    stringData:
      memos-instance-setting-access.json: |
        {
          "key": "ACCESS",
          "accessSetting": {
            "accessMode": "INSTANCE_ACCESS_MODE_PRIVATE"
          }
        }
      memos-instance-setting-general.json: |
        {
          "key": "GENERAL",
          "generalSetting": {
            "disallowUserRegistration": false,
            "disallowPasswordAuth": false,
            "additionalScript": "",
            "additionalStyle": "",
            "customProfile": {
              "title": "",
              "description": "",
              "logoUrl": ""
            },
            "weekStartDayOffset": 1,
            "disallowChangeUsername": false,
            "disallowChangeNickname": false
          }
        }
