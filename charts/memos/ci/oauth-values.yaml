# SPDX-License-Identifier: Apache-2.0
fullnameOverride: memos-oauth
persistence:
  size: 1Gi
provisioning:
  existingSecret: fixture-provisioning
app:
  env:
    - name: SSL_CERT_FILE
      value: /oauth-ca/ca.crt
extraVolumes:
  - name: oauth-ca
    secret:
      secretName: fixture-oauth-tls
      items:
        - key: ca.crt
          path: ca.crt
extraVolumeMounts:
  - name: oauth-ca
    mountPath: /oauth-ca
    readOnly: true
networkPolicy:
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app: fixture-oauth
      ports:
        - protocol: TCP
          port: 8443
