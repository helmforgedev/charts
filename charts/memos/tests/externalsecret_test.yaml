# SPDX-License-Identifier: Apache-2.0
suite: memos external secret target ownership
templates:
  - templates/externalsecret.yaml
tests:
  - it: creates canonical v1 resources with the expected target and interval
    values:
      - ../ci/external-secrets-values.yaml
    asserts:
      - equal: {path: apiVersion, value: external-secrets.io/v1}
      - equal: {path: spec.target.name, value: memos-eso-bootstrap}
      - equal: {path: spec.refreshInterval, value: 1h}
