# SPDX-License-Identifier: Apache-2.0
suite: memos network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: limits inbound Memos HTTP traffic
    values:
      - networkpolicy-values.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: http
      - notContains:
          path: spec.policyTypes
          content: Egress
      - notExists:
          path: spec.egress
  - it: isolates by default and permits only DNS egress
    set:
      networkPolicy:
        enabled: true
        egressIsolation: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.ingress[0].from[0]
          value: {podSelector: {}}
  - it: renders custom baseline HTTPS egress peers
    set:
      networkPolicy:
        enabled: true
        egressIsolation: true
        httpsEgress:
          - ipBlock:
              cidr: 203.0.113.0/24
    asserts:
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 203.0.113.0/24
      - notContains:
          path: spec.egress[1].to
          content:
            ipBlock:
              cidr: 0.0.0.0/0
  - it: appends explicit external database egress after DNS
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - protocol: TCP
                port: 5432
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432
