architecture: standalone

auth:
  enabled: true
  password: ci-redis-password

containerPorts:
  redis: 6380
  metrics: 9122

service:
  ports:
    redis: 6379
    metrics: 9121

standalone:
  persistence:
    enabled: false

metrics:
  enabled: true

networkPolicy:
  enabled: true
  metrics:
    enabled: true
