# SPDX-License-Identifier: Apache-2.0
architecture: cluster

auth:
  enabled: true
  password: ci-redis-password

cluster:
  nodes: 6
  replicasPerMaster: 1
  persistence:
    enabled: true
    size: 2Gi
  initJob:
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: "1"
        memory: 2Gi

pdb:
  enabled: true
