# SPDX-License-Identifier: Apache-2.0
suite: Cluster Domain
templates:
  - configmap.yaml
  - replication-replica-statefulset.yaml
  - sentinel-statefulset.yaml
  - cluster-statefulset.yaml
  - cluster-init-job.yaml
release:
  name: test
  namespace: custom-ns
tests:
  - it: should use custom cluster domain in sentinel configuration
    template: configmap.yaml
    set:
      architecture: sentinel
      clusterDomain: corp.internal
    asserts:
      - matchRegex:
          path: data["sentinel.conf"]
          pattern: "sentinel monitor mymaster test-redis-node-0\\.test-redis-headless\\.custom-ns\\.svc\\.corp\\.internal 6379 2"
      - matchRegex:
          path: data["sentinel.conf"]
          pattern: "sentinel resolve-hostnames yes"
      - notMatchRegex:
          path: data["sentinel.conf"]
          pattern: "svc\\.cluster\\.local"

  - it: should use custom cluster domain in replication replica args
    template: replication-replica-statefulset.yaml
    set:
      architecture: replication
      clusterDomain: corp.internal
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "--replicaof test-redis-primary-0\\.test-redis-headless\\.custom-ns\\.svc\\.corp\\.internal 6379"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "svc\\.cluster\\.local"

  - it: should discover the custom seed FQDN before starting sentinel
    template: configmap.yaml
    set:
      architecture: sentinel
      clusterDomain: corp.internal
    asserts:
      - matchRegex:
          path: data["sentinel-entrypoint.sh"]
          pattern: 'SEED_MASTER="test-redis-node-0\.test-redis-headless\.custom-ns\.svc\.corp\.internal"'

  - it: should use custom cluster domain in cluster announce hostname
    template: cluster-statefulset.yaml
    set:
      architecture: cluster
      clusterDomain: corp.internal
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "$(POD_NAME).test-redis-headless.custom-ns.svc.corp.internal"

  - it: should use custom cluster domain in cluster init job
    template: cluster-init-job.yaml
    set:
      architecture: cluster
      clusterDomain: corp.internal
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "test-redis-cluster-\\$\\{i\\}\\.test-redis-headless\\.custom-ns\\.svc\\.corp\\.internal"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "svc\\.cluster\\.local"

  - it: should omit init job resources by default
    template: cluster-init-job.yaml
    set:
      architecture: cluster
      clusterDomain: corp.internal
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: should configure resources for the init job
    template: cluster-init-job.yaml
    set:
      architecture: cluster
      clusterDomain: corp.internal
      cluster.initJob.resources.requests.cpu: 100m
      cluster.initJob.resources.requests.memory: 128Mi
      cluster.initJob.resources.limits.cpu: 500m
      cluster.initJob.resources.limits.memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
