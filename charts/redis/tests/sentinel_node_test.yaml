# SPDX-License-Identifier: Apache-2.0
suite: Sentinel Role-Neutral Nodes
templates:
  - configmap.yaml
  - replication-primary-statefulset.yaml
  - replication-replica-statefulset.yaml
  - sentinel-node-statefulset.yaml
  - sentinel-statefulset.yaml
  - service.yaml
release:
  name: test
  namespace: redis-ns
tests:
  - it: should render one role-neutral data-node StatefulSet in sentinel mode
    template: sentinel-node-statefulset.yaml
    set:
      architecture: sentinel
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: test-redis-node
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/role"]
          value: node

  - it: should not render the fixed primary StatefulSet in sentinel mode
    template: replication-primary-statefulset.yaml
    set:
      architecture: sentinel
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render the fixed replica StatefulSet in sentinel mode
    template: replication-replica-statefulset.yaml
    set:
      architecture: sentinel
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure symmetric authentication and stable hostnames
    template: configmap.yaml
    set:
      architecture: sentinel
      auth.enabled: true
    asserts:
      - matchRegex:
          path: data["sentinel.conf"]
          pattern: "sentinel announce-hostnames yes"
      - matchRegex:
          path: data["node-entrypoint.sh"]
          pattern: "masterauth"
      - matchRegex:
          path: data["node-entrypoint.sh"]
          pattern: "replica-announce-ip \\$SELF_FQDN"
      - matchRegex:
          path: data["node-entrypoint.sh"]
          pattern: "sentinel get-master-addr-by-name"

  - it: should configure mutual TLS and TLS-aware Sentinel probes
    set:
      architecture: sentinel
      tls.enabled: true
      tls.existingSecret: redis-tls
    asserts:
      - matchRegex:
          path: data["sentinel.conf"]
          pattern: "tls-auth-clients yes"
        template: configmap.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "--tls.*--cert.*--key"
        template: sentinel-statefulset.yaml

  - it: should persist Sentinel data nodes by default
    template: sentinel-node-statefulset.yaml
    set:
      architecture: sentinel
    asserts:
      - exists:
          path: spec.volumeClaimTemplates[0]

  - it: should include startup and graceful failover safeguards
    set:
      architecture: sentinel
    asserts:
      - matchRegex:
          path: data["node-entrypoint.sh"]
          pattern: "Anti-wipe guard"
        template: configmap.yaml
      - matchRegex:
          path: data["node-entrypoint.sh"]
          pattern: "Submit once"
        template: configmap.yaml
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "Submit exactly one request"
        template: configmap.yaml
      - exists:
          path: spec.template.spec.containers[0].lifecycle.preStop
        template: sentinel-node-statefulset.yaml

  - it: should keep replicas unready until their replication link is up
    template: sentinel-node-statefulset.yaml
    set:
      architecture: sentinel
      auth.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "ping \\| grep -qx PONG"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "REDISCLI_AUTH=\"\\$REDIS_PASSWORD\" redis-cli\\s+-p 6379 info replication"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "grep -qx 'master_link_status:up'"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "grep -qx 'master_sync_in_progress:0'"
      - notMatchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "master_link_status"
      - notMatchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: "master_link_status"

  - it: should only fail over to a replica that has caught up
    template: configmap.yaml
    set:
      architecture: sentinel
      sentinel.gracefulFailover.replicaSyncTimeoutSeconds: 420
      sentinel.gracefulFailover.maxAttempts: 10
      terminationGracePeriodSeconds: 600
    asserts:
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "state != \"online\""
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "deadline=\\$\\(\\( \\$\\(date \\+%s\\) \\+ 420 \\)\\)"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "OK\\) break ;;"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "INPROG\\*\\)"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "client pause 605000 write"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "all_in_sync \"\\$target\""
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "vcli -h \"\\$c\" -p \"\\$REDIS_PORT\" info replication"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "link == \"up\" && syncing == \"0\""
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "offset \\+ 0 < target \\+ 0"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "\\[ \"\\$pause_reply\" = \"OK\" \\] \\|\\| give_up"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "shutting down with writes paused\"\\n\\s*exit 0"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "SENTINEL_PEERS=\"test-redis-sentinel-0\\.test-redis-sentinel-headless\\.redis-ns\\.svc\\.cluster\\.local test-redis-sentinel-1\\."
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "sentinel_cli -h \"\\$s\" sentinel replicas"
      - matchRegex:
          path: data["node-prestop.sh"]
          pattern: "flags !~ /\\(s_down\\|o_down\\|disconnected\\)/"
      - notMatchRegex:
          path: data["node-prestop.sh"]
          pattern: "connected_slaves"

  - it: should expose Sentinel without a primary Service in sentinel mode
    template: service.yaml
    set:
      architecture: sentinel
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: test-redis-sentinel
        documentIndex: 2
