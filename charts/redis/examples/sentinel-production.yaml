# SPDX-License-Identifier: Apache-2.0
architecture: sentinel

auth:
  enabled: true
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

node:
  replicaCount: 3
  persistence:
    enabled: true
    size: 20Gi

sentinel:
  replicaCount: 3
  masterSet: mymaster
  quorum: 2
  gracefulFailover:
    enabled: true
  startupFailoverGuard:
    enabled: true

pdb:
  enabled: true

metrics:
  enabled: true
