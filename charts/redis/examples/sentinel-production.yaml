# SPDX-License-Identifier: Apache-2.0
architecture: sentinel

auth:
  enabled: true
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

node:
  replicaCount: 3
  persistence:
    enabled: true
    size: 20Gi

sentinel:
  replicaCount: 3
  masterSet: mymaster
  quorum: 2
  gracefulFailover:
    enabled: true
  startupFailoverGuard:
    enabled: true
  waitForMaster:
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: "1"
        memory: 2Gi

pdb:
  enabled: true

metrics:
  enabled: true
