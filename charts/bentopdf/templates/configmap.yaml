{{- include "bentopdf.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bentopdf.fullname" . }}
  labels: {{ include "bentopdf.labels" . | nindent 4 }}
data:
  config.json: {{ toJson .Values.config | quote }}
  nginx.conf: |
    {{- tpl (.Files.Get "files/nginx.conf") . | nindent 4 }}
