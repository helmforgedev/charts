# SPDX-License-Identifier: Apache-2.0
fullnameOverride: bytestash
auth:
  existingSecret: fixture-auth
bootstrap:
  existingSecret: fixture-admin
externalSecrets:
  enabled: true
  items:
    - fullnameOverride: fixture-auth
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: jwt-secret
            remoteRef:
              key: test/password
    - fullnameOverride: fixture-admin
      spec:
        secretStoreRef:
          name: helmforge-fake-store
          kind: ClusterSecretStore
        data:
          - secretKey: password
            remoteRef:
              key: test/password
