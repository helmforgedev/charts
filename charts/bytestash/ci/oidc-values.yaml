# SPDX-License-Identifier: Apache-2.0
# Disposable issuer fixture; never use in production.
fullnameOverride: bytestash-oidc
oidc:
  enabled: true
  issuerURL: https://127.0.0.1:19000
  clientID: bytestash-ci
  clientSecret: fixture-only-oidc-secret
  caConfigMap: bytestash-fixture-ca
extraVolumes:
  - name: fixture-tls
    secret:
      secretName: bytestash-fixture-tls
extraContainers:
  - name: oidc-fixture
    image: docker.io/library/node:24.21.0-alpine3.23
    command:
      - node
      - '-e'
      - >
        // SPDX-License-Identifier: Apache-2.0

        // Disposable validation fixture. Never deploy as an identity provider.

        const http = require('node:https');

        const crypto = require('node:crypto');

        const issuer = 'https://127.0.0.1:19000';

        const clientID = 'bytestash-ci';

        const clientSecret = 'fixture-only-oidc-secret';

        const {publicKey, privateKey} = crypto.generateKeyPairSync('rsa', {modulusLength: 2048});

        const jwk = {...publicKey.export({format: 'jwk'}), kid: 'fixture', alg: 'RS256', use: 'sig'};

        const codes = new Map();

        const json = (res, status, body) => {res.writeHead(status, {'Content-Type': 'application/json'});
        res.end(JSON.stringify(body));};

        const server =
        http.createServer({key:require('fs').readFileSync('/tls/key.pem'),cert:require('fs').readFileSync('/tls/cert.pem')},
        async (req, res) => {
          try {
            const url = new URL(req.url, issuer);
            if (url.pathname === '/.well-known/openid-configuration') return json(res, 200, {
              issuer, authorization_endpoint: issuer + '/authorize', token_endpoint: issuer + '/token', jwks_uri: issuer + '/jwks',
              response_types_supported: ['code'], subject_types_supported: ['public'], id_token_signing_alg_values_supported: ['RS256'],
              token_endpoint_auth_methods_supported: ['client_secret_basic', 'client_secret_post'], code_challenge_methods_supported: ['S256'],
            });
            if (url.pathname === '/jwks') return json(res, 200, {keys: [jwk]});
            if (url.pathname === '/health') return json(res, 200, {ready: true});
            if (url.pathname === '/authorize') {
              const q = url.searchParams;
              const redirect = new URL(q.get('redirect_uri'));
              if (q.get('client_id') !== clientID || !q.get('nonce') || redirect.origin !== 'http://127.0.0.1:5000' || redirect.pathname !== '/api/auth/oidc/callback') return json(res, 400, {error: 'invalid_request'});
              if(q.get('fixture_identity')==='denied') return json(res,403,{error:'access_denied'});
              const code = crypto.randomBytes(24).toString('hex');
              codes.set(code, {nonce: q.get('nonce'), challenge: q.get('code_challenge'), redirect: redirect.href, created: Date.now(), email: q.get('fixture_identity') === 'denied' ? 'denied@example.test' : 'allowed@example.test'});
              redirect.searchParams.set('state', q.get('state')); redirect.searchParams.set('code', code);
              res.writeHead(302, {Location: redirect.href}); return res.end();
            }
            if (url.pathname === '/token' && req.method === 'POST') {
              let body = ''; for await (const part of req) body += part;
              const q = new URLSearchParams(body);
              const basic = req.headers.authorization?.startsWith('Basic ') ? Buffer.from(req.headers.authorization.slice(6), 'base64').toString().split(':') : [];
              if ((basic[0] || q.get('client_id')) !== clientID || (basic[1] || q.get('client_secret')) !== clientSecret) return json(res, 401, {error: 'invalid_client'});
              const saved = codes.get(q.get('code')); codes.delete(q.get('code'));
              if (!saved || Date.now() - saved.created > 60000 || q.get('grant_type') !== 'authorization_code' || q.get('redirect_uri') !== saved.redirect || (saved.challenge && crypto.createHash('sha256').update(q.get('code_verifier') || '').digest('base64url') !== saved.challenge)) return json(res, 400, {error: 'invalid_grant'});
              const now = Math.floor(Date.now() / 1000);
              const claims = {iss: issuer, aud: clientID, sub: 'fixture-user', preferred_username:'oidcfixture', iat: now, exp: now + 300, nonce: saved.nonce, email: saved.email, email_verified: true};
              const input = Buffer.from(JSON.stringify({alg: 'RS256', typ: 'JWT', kid: 'fixture'})).toString('base64url') + '.' + Buffer.from(JSON.stringify(claims)).toString('base64url');
              const id_token = input + '.' + crypto.sign('RSA-SHA256', Buffer.from(input), privateKey).toString('base64url');
              return json(res, 200, {access_token: crypto.randomBytes(24).toString('hex'), token_type: 'Bearer', expires_in: 300, id_token});
            }
            return json(res, 404, {error: 'not_found'});
          } catch { return json(res, 500, {error: 'fixture_error'}); }
        });

        server.listen(19000, '0.0.0.0');
    env:
      - name: NODE_EXTRA_CA_CERTS
        value: /tls/cert.pem
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
    ports:
      - name: fixture
        containerPort: 19000
    readinessProbe:
      httpGet:
        scheme: HTTPS
        path: /health
        port: fixture
      periodSeconds: 2
    volumeMounts:
      - name: fixture-tls
        mountPath: /tls
        readOnly: true
