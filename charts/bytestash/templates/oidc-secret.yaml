{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bytestash.oidcSecretName" . }}
  labels:
    {{- include "bytestash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.oidc.clientSecretKey }}: {{ .Values.oidc.clientSecret | b64enc | quote }}
{{- end }}
