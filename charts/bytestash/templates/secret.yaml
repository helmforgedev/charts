{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- include "bytestash.validate" . }}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "bytestash.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $jwt := .Values.auth.jwtSecret | default (get $data .Values.auth.jwtSecretKey | default "" | b64dec) | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "bytestash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.jwtSecretKey }}: {{ $jwt | b64enc | quote }}
{{- end }}
{{- if and .Values.bootstrap.enabled (not .Values.bootstrap.existingSecret) }}
{{- $name := include "bytestash.bootstrapSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $password := .Values.bootstrap.password | default (get $data .Values.bootstrap.passwordKey | default "" | b64dec) | default (randAlphaNum 32) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "bytestash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.bootstrap.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
