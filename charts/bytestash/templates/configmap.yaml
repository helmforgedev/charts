apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bytestash.fullname" . }}-scripts
  labels: {{ include "bytestash.labels" . | nindent 4 }}
data:
  backup.mjs: |
    {{- .Files.Get "files/backup.mjs" | nindent 4 }}
  bootstrap.mjs: |
    {{- .Files.Get "files/bootstrap.mjs" | nindent 4 }}
