# -- Select the cluster-scoped CRD bundles installed on first install.
crds:
  gatewayAPI:
    # -- Install the 10 Gateway API v1.6.1 Experimental CRDs.
    enabled: true
  envoyGateway:
    # -- Install the 8 Envoy Gateway v1.9.0 extension CRDs.
    enabled: true

# -- Configure the Gateway API safe-upgrade policy lifecycle.
safeUpgradePolicy:
  # -- Policy management mode: managed, external, or disabled.
  management: managed

# -- Additional labels for the Helm-managed policy and binding.
commonLabels: {}
