# SPDX-License-Identifier: Apache-2.0
suite: Common annotations
templates:
  - safe-upgrade-policy.yaml
tests:
  - it: applies common annotations to the policy and binding
    set:
      commonAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        documentIndex: 0
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        documentIndex: 1

  - it: preserves lifecycle annotations over common annotations
    set:
      commonAnnotations:
        helm.sh/resource-policy: delete
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 1
