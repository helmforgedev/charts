    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to add or change?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this needed? What problem does it solve?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - nice-to-have
        - important
        - critical

  - type: dropdown
    id: contribute
    attributes:
      label: Willing to Contribute?
      options:
        - "yes"
        - need guidance
        - "no"
