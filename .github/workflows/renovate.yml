# SPDX-License-Identifier: Apache-2.0
name: Renovate

# Self-hosted Renovate pilot (config: renovate.json). Opens dependency PRs on a
# controlled, representative subset of charts, gated behind the Dependency
# Dashboard. Manual merge only. The existing Upstream Watch and subchart-deps
# automation stay active until coverage/behaviour reach parity.
#
# Requires repo/org secret RENOVATE_TOKEN: a PAT (or GitHub App token) with
# `repo` + `workflow` scope, owned by a maintainer. This workflow must live on
# the default branch for the scheduled run to fire.

on:
  schedule:
    # Daily 02:00 UTC. renovate.json limits actual PR creation to "before 6am on
    # monday" (Europe/Vilnius); the frequent run keeps the Dependency Dashboard fresh.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - debug
          - info
          - warn

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Pin the Renovate engine to the current latest release.
          RENOVATE_VERSION: 44.164.6
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_CONFIG_FILE: renovate.json
