# SPDX-License-Identifier: Apache-2.0
name: Security Scan

on:
  pull_request:
    paths:
      - 'charts/**/templates/**'
      - 'charts/**/crds/**'
      - 'charts/**/values.yaml'
      - 'charts/**/Chart.yaml'
      - 'charts/**/Chart.lock'

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  detect:
    name: Detect changed charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: changed
        run: |
          CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- charts/ \
            | cut -d'/' -f2 | sort -u \
            | while read -r dir; do
                [ -d "charts/$dir/templates" ] && echo "$dir"
              done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "charts=$CHANGED_DIRS" >> "$GITHUB_OUTPUT"
          echo "Charts to scan: $CHANGED_DIRS"

  kubescape:
    name: Kubescape - ${{ matrix.chart }}
    needs: detect
    if: needs.detect.outputs.charts != '[]' && needs.detect.outputs.charts != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Helm dependencies
        env:
          CHART: ${{ matrix.chart }}
        run: |
          [[ "$CHART" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo "::error::Invalid chart name"
            exit 1
          }
          helm dependency build "charts/$CHART"

      - name: Install Kubescape
        run: |
          KUBESCAPE_VERSION="4.0.9"
          curl -fsSL \
            -o /tmp/kubescape.tar.gz \
            "https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}/kubescape_${KUBESCAPE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kubescape.tar.gz -C /tmp kubescape
          install -m 0755 /tmp/kubescape /usr/local/bin/kubescape
          kubescape version

      - name: Run security scan
        id: scan
        env:
          CHART: ${{ matrix.chart }}
        run: |
          [[ "$CHART" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo "::error::Invalid chart name"
            exit 1
          }

          REPORT="/tmp/${CHART}-scan.json"
          RENDERED="/tmp/${CHART}-rendered.yaml"

          helm template kubescape "charts/$CHART" --include-crds > "$RENDERED"
          KINDS=$(awk '/^kind:[[:space:]]/ { print $2 }' "$RENDERED" | sort -u)
          KINDS_CSV=$(printf '%s\n' "$KINDS" | paste -sd, -)

          echo "chart=$CHART" >> "$GITHUB_OUTPUT"
          echo "kinds=$KINDS_CSV" >> "$GITHUB_OUTPUT"

          if ! printf '%s\n' "$KINDS" | grep -Eq \
            '^(Pod|Deployment|StatefulSet|DaemonSet|Job|CronJob|ReplicaSet|ReplicationController)$'; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "score=N/A" >> "$GITHUB_OUTPUT"
            echo "score_int=100" >> "$GITHUB_OUTPUT"
            echo "Kubescape is not applicable to $CHART; rendered kinds: $KINDS_CSV"
            exit 0
          fi

          echo "applicable=true" >> "$GITHUB_OUTPUT"

          kubescape scan framework "MITRE,NSA,SOC2" "$RENDERED" \
            --format json -o "$REPORT" || true

          SCORE=$(jq '.summaryDetails.complianceScore // 0' "$REPORT" 2>/dev/null || echo "0")
          # Use floor truncation (not round) so 49.6 doesn't pass a 50-minimum gate
          SCORE_INT=$(echo "$SCORE" | awk '{print int($1)}')

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "score_int=$SCORE_INT" >> "$GITHUB_OUTPUT"
          echo "Security score for $CHART: $SCORE"

      - name: Post scan results
        if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@v9
        env:
          CHART: ${{ matrix.chart }}
          APPLICABLE: ${{ steps.scan.outputs.applicable }}
          SCORE: ${{ steps.scan.outputs.score }}
          SCORE_INT: ${{ steps.scan.outputs.score_int }}
          KINDS: ${{ steps.scan.outputs.kinds }}
        with:
          script: |
            const chart = process.env.CHART;
            const applicable = process.env.APPLICABLE === 'true';
            const score = process.env.SCORE;
            const scoreInt = parseInt(process.env.SCORE_INT, 10);
            const kinds = process.env.KINDS;

            const body = applicable ? `### Security Scan: \`${chart}\`

            | Framework | Score |
            |---|---|
            | MITRE + NSA + SOC2 | **${score}%** |

            ${scoreInt < 50 ? '> Score below 50%; review security posture before merge.' : '> Security posture acceptable.'}` : `### Security Scan: \`${chart}\`

            | Framework | Result |
            |---|---|
            | MITRE + NSA + SOC2 | **N/A** |

            > No Kubescape-scannable workload is rendered. Inventory: ${kinds}.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            const existing = comments.find(c => c.body.includes(`Security Scan: \`${chart}\``));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }

      - name: Fail if score too low
        if: steps.scan.outputs.applicable == 'true' && steps.scan.outputs.score_int < 50
        env:
          CHART: ${{ matrix.chart }}
          SCORE: ${{ steps.scan.outputs.score }}
        run: |
          echo "::error::Security score for $CHART is $SCORE% (minimum: 50%)"
          exit 1
